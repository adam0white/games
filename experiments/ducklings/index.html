<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#9ccf7a">
<title>Follow Me</title>
<style>
  html, body { margin: 0; height: 100%; background: #9ccf7a; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  body { font: 17px/1.4 ui-rounded, 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif; color: #24464a; }
  canvas#c { display: block; width: 100vw; height: 100dvh; }
  #safe { position: fixed; top: 0; left: 0; width: 0; height: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); visibility: hidden; pointer-events: none; }
  .screen { position: fixed; inset: 0; display: none; place-items: center; text-align: center; background: #e9f6efe0; overflow-y: auto; touch-action: pan-y; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; }
  #menu.screen { background: linear-gradient(#fff4d6f5, #d8f1e7f5 55%, #bfe6dff5); }
  .screen.on { display: grid; }
  .screen > div { max-width: 22em; width: calc(100% - 32px); padding: 12px 0; box-sizing: border-box; }
  h1 { font-size: 2.7em; line-height: 1; margin: .1em 0 .1em; color: #2f6b5e; letter-spacing: .01em; text-shadow: 0 3px 0 #fff; }
  h2 { font-size: 2em; margin: .1em 0 .2em; color: #2f6b5e; }
  p { margin: .45em 0; }
  .sub { color: #4f7a6f; margin-top: 0; }
  button { font: inherit; font-weight: bold; color: #2f6b5e; background: #ffffffcc; border: 2px solid #7fbfa8; border-radius: 999px; padding: .5em 1.1em; margin: .25em; min-height: 48px; min-width: 9em; touch-action: manipulation; cursor: pointer; }
  button.main { background: #ffb43a; color: #4a2a06; border-color: #f29a1a; font-size: 1.25em; min-width: 8.5em; box-shadow: 0 4px 0 #d9801a; }
  button.main:active { transform: translateY(3px); box-shadow: 0 1px 0 #d9801a; }
  button.small { min-width: 48px; padding: .3em .6em; }
  button:disabled { opacity: .4; }
  .stars { font-size: 1.5em; letter-spacing: .1em; color: #c9d8d0; }
  .stars b { color: #ffb41f; text-shadow: 0 2px 0 #c97a00; }
  #endStars { font-size: 3em; line-height: 1.1; min-height: 1.2em; }
  #endStars span { display: inline-block; color: #c9d8d0; transform: scale(.4); opacity: 0; transition: transform .35s cubic-bezier(.3,1.8,.5,1), opacity .2s; }
  #endStars span.in { transform: scale(1); opacity: 1; }
  #endStars span.got { color: #ffb41f; text-shadow: 0 3px 0 #c97a00; }
  #names { font-size: .92em; color: #3d6a60; }
  #names i { font-style: normal; display: inline-block; background: #fff6c8; border: 1.5px solid #f0cf5a; border-radius: 1em; padding: .05em .55em; margin: .15em; }
  #names i.gone { background: #e7eeea; border-color: #c1d1c8; color: #7a948b; }
  .score { font-size: 1.3em; font-weight: bold; color: #2f6b5e; }
  #pause { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right)); width: 48px; height: 48px; min-width: 0; min-height: 0; margin: 0; padding: 0; border-radius: 50%; display: none; place-items: center; background: #ffffffb3; border: 2px solid #7fbfa8; touch-action: none; }
  #pause::before { content: ''; width: 4px; height: 16px; border: solid #2f6b5e; border-width: 0 5px; }
  #quack { position: fixed; left: calc(14px + env(safe-area-inset-left)); bottom: calc(14px + env(safe-area-inset-bottom)); width: 72px; height: 72px; min-width: 0; min-height: 0; padding: 0; margin: 0; border-radius: 50%; display: none; font-size: 14px; line-height: 1; color: #4a2a06; border: 3px solid #f29a1a;
    background: conic-gradient(#ffb43a calc(var(--ready, 1) * 360deg), #f3e2c2 0); box-shadow: 0 3px 0 #d9801a; touch-action: none; }
  #quack.wait { color: #9a7a50; box-shadow: none; }
  #quack svg { display: block; margin: 0 auto 2px; }
  #say { position: fixed; left: 0; right: 0; top: 70%; text-align: center; font-size: 26px; font-weight: bold; color: #fff; text-shadow: 0 2px 0 #2f6b5e, 0 0 12px #2f6b5e88; pointer-events: none; opacity: 0; transition: opacity .25s, transform .25s; transform: scale(.9); padding: 0 1em; }
  #say.on { opacity: 1; transform: scale(1); }
  .lab-notice { color: #4f7a6f; }
  .row { display: flex; align-items: center; justify-content: center; gap: 4px; }
  #album { font-size: .95em; color: #4f7a6f; }
  #menuArt { width: 220px; height: 110px; display: block; margin: 0 auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<button id="pause" aria-label="Pause"></button>
<button id="quack" aria-label="Quack: the ducklings hurry up"><svg width="34" height="22" viewBox="0 0 34 22"><circle cx="10" cy="11" r="8" fill="#7a4a1c"/><path d="M16 8 L27 10 L16 14 Z" fill="#4a2a06"/><circle cx="8" cy="9" r="1.6" fill="#fff"/><path d="M28 4 q4 7 0 14 M31 1 q6 10 0 20" stroke="#4a2a06" stroke-width="2" fill="none" stroke-linecap="round"/></svg>Quack</button>
<div id="say"></div>

<div id="menu" class="screen on"><div>
  <canvas id="menuArt" width="440" height="220"></canvas>
  <h1>Follow Me</h1>
  <p class="sub">Lead the ducklings home.</p>
  <div class="row"><button id="less" class="small" aria-label="Earlier stage">&lsaquo;</button><button id="play" class="main">Play</button><button id="more" class="small" aria-label="Later stage">&rsaquo;</button></div>
  <p class="stars" id="menuStars"></p>
  <p><button id="endless">Endless pond</button></p>
  <p id="album"></p>
  <p><button id="sound">Sound: on</button></p>
</div></div>

<div id="paused" class="screen"><div>
  <h2>Paused</h2>
  <p id="pausedLine"></p>
  <p><button id="resume" class="main">Go on</button></p>
  <p><button id="pauseMenu">Menu</button></p>
  <p><button id="sound2">Sound: on</button></p>
  <div id="labSwitch"></div>
</div></div>

<div id="end" class="screen"><div>
  <h2 id="endTitle"></h2>
  <div id="endStars"><span>★</span><span>★</span><span>★</span></div>
  <p id="endLine"></p>
  <p id="names"></p>
  <p class="score" id="endScore"></p>
  <p><button id="next" class="main">Next</button></p>
  <p><button id="again">Play again</button><button id="endMenu">Menu</button></p>
</div></div>

<script type="module">
import { create, step, stars, timeLeft, progress, pathAt, view, DT, SPEED, STAGES, LAST_STAGE, ENDLESS_AFTER, NEST_R, TRAITS, QUACK_COOL, HEARTS, LINE_MAX } from './sim.js?v=1';
import * as art from './art.js?v=1';
import * as save from '../kit/save.js';
import { sound } from '../kit/audio.js';
import { onLeave, isPauseKey } from '../kit/pause.js';
import { screens } from '../kit/screens.js';
import { lab } from '../kit/lab.js';

const $ = id => document.getElementById(id);
const query = new URLSearchParams(location.search);
const SEED = query.has('seed') ? Number(query.get('seed')) >>> 0 : undefined;
const FAST = Math.max(1, Math.min(8, Number(query.get('fast')) || 1)); // ticks per tick, for checks only
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------------------------------------------------------------- save: one JSON blob
const KEY = 'ducklings-save';
const data = { v: 1, sound: true, opened: 1, stars: {}, best: {}, endless: 0, home: 0, album: {}, taught: false, ...save.readJson(KEY, {}) };
const store = () => save.writeJson(KEY, data);
let stage = Math.max(1, Math.min(LAST_STAGE, Number(query.get('level')) || data.opened || 1));
if (query.has('level')) data.opened = Math.max(data.opened, stage);

// ---------------------------------------------------------------- sound, all made here
let water = null;
const snd = sound({ on: () => data.sound, setup: ac => {
  // a soft lapping of water under everything
  const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  let v = 0; for (let i = 0; i < len; i++) { v = v * 0.97 + (Math.random() * 2 - 1) * 0.03; d[i] = v; }
  const n = ac.createBufferSource(); n.buffer = buf; n.loop = true;
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 700;
  water = ac.createGain(); water.gain.value = 0; n.connect(f).connect(water).connect(ac.destination); n.start();
} });
const tone = (...a) => { if (snd.ctx) snd.tone(...a); };
const noise = (...a) => { if (snd.ctx) snd.noise(...a); };
const later = (ms, fn) => setTimeout(fn, ms);
const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
const note = i => 880 * 2 ** (PENTA[Math.min(i, PENTA.length - 1)] / 12);
const peep = (f = 2200, v = 0.05) => tone(f, 0.09, v, 'sine', f * 0.35);
const sfx = {
  join(n) { for (let i = 0; i < n; i++) later(i * 55, () => peep(note(i) * 2, 0.045)); later(n * 55, () => tone(note(n) , 0.35, 0.07, 'triangle')); },
  scatter() { [2600, 2300, 2000, 2400].forEach((f, i) => later(i * 70, () => tone(f, 0.08, 0.06, 'sine', -600))); noise(0.15, 0.08, 2600); },
  gone() { tone(700, 0.5, 0.06, 'triangle', -300); later(200, () => tone(520, 0.6, 0.05, 'triangle', -200)); },
  hit() { tone(110, 0.35, 0.22, 'square', -50); noise(0.2, 0.2, 500); },
  quack() { tone(330, 0.16, 0.12, 'sawtooth', -120); later(130, () => tone(300, 0.2, 0.11, 'sawtooth', -110)); },
  bell() { tone(2637, 0.25, 0.06, 'triangle'); later(160, () => tone(2637, 0.35, 0.06, 'triangle')); },
  bubbles() { for (let i = 0; i < 4; i++) later(i * 90, () => tone(500 + i * 140, 0.06, 0.04, 'sine', 300)); },
  heron() { tone(180, 0.3, 0.08, 'sawtooth', -60); later(240, () => tone(160, 0.35, 0.07, 'sawtooth', -50)); },
  gust() { noise(0.9, 0.09, 900); },
  arrive(k) { tone(523.25 * 2 ** (PENTA[Math.min(k - 1, 10)] / 12), 0.45, 0.09, 'triangle'); peep(2400, 0.04); },
  home() { [523.25, 659.25, 783.99].forEach((f, i) => later(i * 110, () => tone(f, 0.6, 0.08, 'triangle'))); },
  win() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => later(i * 140, () => tone(f, 0.9, 0.08, 'triangle'))); },
  fail() { [392, 349.23, 293.66].forEach((f, i) => later(i * 200, () => tone(f, 0.7, 0.08, 'triangle'))); },
  touch() { tone(660, 0.05, 0.03, 'sine', 200); },
  star(i) { tone(1046.5 * 2 ** (i * 4 / 12), 0.4, 0.08, 'triangle'); },
  check() { [784, 988, 1175].forEach((f, i) => later(i * 80, () => tone(f, 0.3, 0.06, 'triangle'))); },
};

// ---------------------------------------------------------------- canvas and camera
const canvas = $('c'), g = canvas.getContext('2d');
let W = 0, H = 0, dpr = 1, u = 1, left = 0, anchor = 0, inset = { top: 0, bottom: 0 };
function resize() {
  dpr = Math.min(2, devicePixelRatio || 1);
  W = canvas.width = Math.round(innerWidth * dpr); H = canvas.height = Math.round(innerHeight * dpr);
  u = Math.min(W, H * 0.62); left = (W - u) / 2; anchor = H * 0.4;
  const cs = getComputedStyle($('safe')); inset = { top: parseFloat(cs.paddingTop) || 0, bottom: parseFloat(cs.paddingBottom) || 0 };
}
addEventListener('resize', resize); resize();
const sx = x => left + x * u;
const sy = y => anchor - (y - cam) * u;
const wx = px => (px - left) / u;
const wy = py => cam + (anchor - py) / u;
const OFFSET = 70; // CSS px: she heads for a point this far above the finger, so the finger never covers her

// ---------------------------------------------------------------- game state
let s = create({ stage, seed: SEED }), mode = 'stage', playing = false, paused = false, screen = 'menu';
let cam = s.mom.y, camShown = cam, acc = 0, last = performance.now(), shake = 0, flash = 0;
let prevMom = { x: s.mom.x, y: s.mom.y }, momA = 0, quackShow = 0, hurtT = 0, homeGlow = 0;
let finger = null, keys = new Set(), wantQuack = false, waitTouch = false, trailT = 0, trailShows = 0, turnLog = [];
let parts = [], ripples = [], disp = new Map(), heads = new Map(), hops = new Map(), runners = [], nestDucks = [], recCount = 0, sayTimer = 0, peepT = 0, endTimer = 0;
const rec = lab('ducklings');
const cards = screens(['menu', 'paused', 'end']);

function show(name) {
  screen = name; cards(name);
  const play = name === 'play';
  $('pause').style.display = play ? 'grid' : 'none'; $('quack').style.display = play ? 'block' : 'none';
  if (name === 'menu') menu();
}
function say(text, ms = 1400) { const el = $('say'); el.textContent = text; el.classList.add('on'); clearTimeout(sayTimer); sayTimer = setTimeout(() => el.classList.remove('on'), ms); }
const starText = n => '<b>★</b>'.repeat(n) + '★'.repeat(3 - n);

function menu() {
  $('play').textContent = `Play stage ${stage}`;
  $('less').disabled = stage <= 1; $('more').disabled = stage >= Math.min(LAST_STAGE, data.opened);
  $('menuStars').innerHTML = starText(data.stars[stage] || 0) + (data.best[stage] ? ` <small>best ${data.best[stage]}</small>` : '');
  const open = data.opened > ENDLESS_AFTER;
  $('endless').disabled = !open;
  $('endless').textContent = open ? (data.endless ? `Endless pond · best ${data.endless}` : 'Endless pond') : `Endless pond (finish stage ${ENDLESS_AFTER})`;
  $('album').textContent = data.home ? `Ducklings brought home: ${data.home}` : '';
  soundLabels(); drawMenuArt();
}
function soundLabels() { for (const id of ['sound', 'sound2']) $(id).textContent = `Sound: ${data.sound ? 'on' : 'off'}`; }
for (const id of ['sound', 'sound2']) $(id).addEventListener('click', () => {
  data.sound = !data.sound; store(); soundLabels();
  if (data.sound) { snd.unlock(); if (!paused) snd.release(); sfx.touch(); } else snd.hold();
});

function begin(endless = false) {
  snd.unlock(); snd.release();
  mode = endless ? 'endless' : 'stage';
  s = create(endless ? { endless: true, seed: SEED ?? ((Math.random() * 2 ** 31) | 0) } : { stage, seed: SEED });
  cam = camShown = s.mom.y + 0.2 * H / u; acc = 0; last = performance.now(); prevMom = { x: s.mom.x, y: s.mom.y }; momA = 0;
  parts = []; ripples = []; disp = new Map(); heads = new Map(); hops = new Map(); runners = []; nestDucks = []; turnLog = [];
  finger = null; keys.clear(); wantQuack = false; trailT = 0; trailShows = 0; shake = 0; flash = 0; recCount = 0; endTimer = 0; homeGlow = 0;
  waitTouch = !endless && stage === 1 && !data.taught;
  playing = true; paused = false; show('play');
  say(endless ? 'Endless pond' : waitTouch ? '' : `Stage ${stage}`, 1300);
  rec.start({ stage: s.stage, mode });
}
const note2 = (type, d) => { if (recCount < 150) { recCount++; rec.event(type, d); } };

function finish() {
  playing = false;
  const won = s.over === 'nest', got = stars(s), n = s.arrived.length;
  rec.end(won ? 'nest' : 'lost-all', { stage: s.stage, arrived: n, collected: s.joins, stars: got, score: s.score, why: s.why, mode });
  data.home += n; for (const f of s.arrived) data.album[f.name] = (data.album[f.name] || 0) + 1;
  let title, line, scoreLine, best;
  if (s.endless) {
    best = Math.max(data.endless, s.score); const fresh = s.score > data.endless; data.endless = best;
    title = s.why === 'hearts' ? 'Mama needs a rest' : 'The sun went down';
    line = `${Math.floor(s.best)} m up the pond with ${s.line.length} duckling${s.line.length === 1 ? '' : 's'}.`;
    scoreLine = `${s.score} points${fresh && s.score > 0 ? ' · new best!' : ` · best ${best}`}`;
  } else {
    const key = s.stage; best = Math.max(data.best[key] || 0, s.score); const fresh = won && s.score > (data.best[key] || 0);
    if (won) { data.best[key] = best; data.stars[key] = Math.max(data.stars[key] || 0, got); }
    if (won && got > 0 && s.stage < LAST_STAGE) data.opened = Math.max(data.opened, s.stage + 1);
    if (won && s.stage === LAST_STAGE) data.opened = Math.max(data.opened, LAST_STAGE);
    title = won ? (n === s.total ? 'Everyone home!' : 'Home!') : s.why === 'hearts' ? 'Mama needs a rest' : 'The sun went down';
    line = won ? `${n} of ${s.total} ducklings home.` : `Try again. Watch the path behind her.`;
    scoreLine = won ? `${s.score} points${fresh ? ' · new best!' : ` · best ${best}`}` : '';
  }
  data.taught = true; store();
  $('endTitle').textContent = title; $('endLine').textContent = line; $('endScore').textContent = scoreLine;
  // the ducklings by name: who came home, who hid in the reeds
  const names = $('names'); names.textContent = '';
  for (const f of s.arrived) { const i = document.createElement('i'); i.textContent = `${f.name}, ${TRAITS[f.trait].word}`; names.append(i); }
  for (const f of s.gone) { const i = document.createElement('i'); i.className = 'gone'; i.textContent = `${f.name} hid in the reeds`; names.append(i); }
  const spans = [...$('endStars').children];
  $('endStars').style.display = s.endless ? 'none' : '';
  spans.forEach(sp => { sp.className = ''; });
  const nextOk = !s.endless && won && got > 0 && s.stage < LAST_STAGE;
  $('next').style.display = nextOk ? '' : 'none'; $('next').textContent = `Stage ${s.stage + 1}`;
  $('again').className = nextOk ? '' : 'main';
  (won ? sfx.win : sfx.fail)();
  endTimer = setTimeout(() => {
    if (playing) return;
    show('end');
    spans.forEach((sp, i) => later(250 + i * 300, () => { sp.classList.add('in'); if (i < got) { sp.classList.add('got'); sfx.star(i); } }));
  }, won ? 900 : 1100);
}

// ---------------------------------------------------------------- input
// Hold or drag anywhere: she swims for a point a little above the finger. A second finger quacks.
// The target is worked out again every tick from where the finger is on the screen, so a still finger
// keeps her swimming while the pond scrolls.
function screenTarget() {
  if (!finger) return null;
  return { x: wx(finger.x * dpr), y: wy((finger.y - OFFSET) * dpr) };
}
canvas.addEventListener('pointerdown', e => {
  if (!playing) return;
  if (paused) { resume(); return; }
  if (finger && e.pointerId !== finger.id) { wantQuack = true; return; } // a second finger
  const now = performance.now();
  if (finger === null && lastTap && now - lastTap.t < 300 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 40) wantQuack = true; // double tap
  lastTap = { t: now, x: e.clientX, y: e.clientY };
  finger = { id: e.pointerId, x: e.clientX, y: e.clientY, t: now };
  try { canvas.setPointerCapture(e.pointerId); } catch {}
  if (waitTouch) { waitTouch = false; say('', 1); }
  sfx.touch(); touchRing = { x: e.clientX, y: e.clientY, t: now };
});
let lastTap = null, touchRing = null;
canvas.addEventListener('pointermove', e => { if (finger && e.pointerId === finger.id) { finger.x = e.clientX; finger.y = e.clientY; } });
for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) canvas.addEventListener(type, e => { if (finger && e.pointerId === finger.id) finger = null; });
$('quack').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (playing && !paused) wantQuack = true; });
$('pause').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); pause(); });
addEventListener('keydown', e => {
  if (isPauseKey(e)) { if (playing) paused ? resume() : pause(); return; }
  if (!playing) return;
  if (paused) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); resume(); } return; }
  if (e.key === ' ' || e.key === 'q' || e.key === 'Q') { e.preventDefault(); wantQuack = true; }
  if (e.key.startsWith('Arrow')) { e.preventDefault(); keys.add(e.key); if (waitTouch) waitTouch = false; }
});
addEventListener('keyup', e => keys.delete(e.key));
function keyTarget() {
  const dx = (keys.has('ArrowRight') ? 1 : 0) - (keys.has('ArrowLeft') ? 1 : 0), dy = (keys.has('ArrowUp') ? 1 : 0) - (keys.has('ArrowDown') ? 1 : 0);
  if (!dx && !dy) return null;
  const d = Math.hypot(dx, dy); return { x: s.mom.x + dx / d * 0.25, y: s.mom.y + dy / d * 0.25 };
}

// ---------------------------------------------------------------- pause
function pause() {
  if (!playing || paused) return;
  paused = true; finger = null; keys.clear();
  $('pausedLine').textContent = s.endless ? `Score ${s.score}.` : `Stage ${s.stage}. ${s.line.length} following, ${s.arrived.length} home.`;
  show('paused'); snd.hold();
}
function resume() {
  if (!paused) return;
  paused = false; acc = 0; last = performance.now(); show('play'); snd.release();
}
onLeave(pause);
$('resume').addEventListener('click', resume);
$('pauseMenu').addEventListener('click', () => {
  if (playing) { rec.end('left', { stage: s.stage, arrived: s.arrived.length, collected: s.joins, stars: 0, score: s.score, mode }); playing = false; paused = false; snd.release(); }
  show('menu');
});
$('play').addEventListener('click', () => begin(false));
$('endless').addEventListener('click', () => begin(true));
$('less').addEventListener('click', () => { stage = Math.max(1, stage - 1); s = create({ stage, seed: SEED }); menu(); });
$('more').addEventListener('click', () => { stage = Math.min(data.opened, LAST_STAGE, stage + 1); s = create({ stage, seed: SEED }); menu(); });
$('again').addEventListener('click', () => begin(mode === 'endless'));
$('next').addEventListener('click', () => { stage = Math.min(LAST_STAGE, s.stage + 1); begin(false); });
$('endMenu').addEventListener('click', () => { if (s.stage) stage = Math.min(data.opened, LAST_STAGE, s.over === 'nest' && stars(s) && s.stage < LAST_STAGE ? s.stage + 1 : s.stage); show('menu'); });
rec.notice($('menu').firstElementChild);
rec.toggle($('labSwitch'));

// ---------------------------------------------------------------- one tick
function tick() {
  prevMom = { x: s.mom.x, y: s.mom.y };
  const target = screenTarget() ?? keyTarget();
  step(s, target, wantQuack); wantQuack = false;
  for (const e of s.events) {
    if (e.type === 'join') {
      sfx.join(s.line.length); say(s.line.length > 1 ? `×${s.line.length}` : 'Got one!', 900);

  if (quackShow > 0) { // a speech bubble
    const bx = sx(m.x) + 0.06 * u, by = sy(m.y) - 0.08 * u;
    g.fillStyle = '#fffdf3'; g.beginPath(); g.roundRect(bx - 0.06 * u, by - 0.03 * u, 0.13 * u, 0.055 * u, 0.025 * u); g.fill();
    g.fillStyle = '#c96a10'; g.font = `bold ${Math.round(0.035 * u)}px system-ui, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('Quack!', bx + 0.005 * u, by - 0.002 * u);
  }
}

function drawGuide(now) {
  // where she is heading: a soft ring above the finger, and a ring under the finger
  if (finger) {
    const tx = finger.x * dpr, ty = (finger.y - OFFSET) * dpr;
    g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 2 * dpr; g.setLineDash([5 * dpr, 5 * dpr]);
    g.beginPath(); g.moveTo(finger.x * dpr, finger.y * dpr - 26 * dpr); g.lineTo(tx, ty + 10 * dpr); g.stroke(); g.setLineDash([]);
    g.fillStyle = 'rgba(255,255,255,.35)'; g.beginPath(); g.arc(tx, ty, 9 * dpr, 0, 7); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.9)'; g.beginPath(); g.arc(tx, ty, 9 * dpr, 0, 7); g.stroke();
  }
  if (touchRing) {
    const k = (now - touchRing.t) / 400;
    if (k < 1) { g.strokeStyle = `rgba(255,255,255,${0.8 * (1 - k)})`; g.lineWidth = 3 * dpr; g.beginPath(); g.arc(touchRing.x * dpr, touchRing.y * dpr, (20 + 30 * k) * dpr, 0, 7); g.stroke(); }
  }
  if (waitTouch) {
    // the ghost finger: hold here, below and ahead of her
    const gx = sx(0.5), gy = sy(s.mom.y + 0.42) + OFFSET * dpr;
    const ty = gy - OFFSET * dpr;
    g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 3 * dpr; g.setLineDash([6 * dpr, 7 * dpr]); g.lineDashOffset = -now / 40;
    g.beginPath(); g.moveTo(sx(s.mom.x), sy(s.mom.y) - 0.06 * u); g.lineTo(gx, ty + 0.02 * u); g.stroke(); g.setLineDash([]);
    g.fillStyle = 'rgba(255,255,255,.5)'; g.beginPath(); g.arc(gx, ty, 10 * dpr, 0, 7); g.fill();
    art.ghostFinger(g, gx, gy, u, now / 1000);
    label('Hold here', gx, gy + 0.11 * u);
  }
}
function label(text, x, y) {
  g.font = `bold ${Math.round(20 * dpr)}px ui-rounded, system-ui, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
  const w = g.measureText(text).width + 24 * dpr;
  g.fillStyle = 'rgba(47,107,94,.85)'; g.beginPath(); g.roundRect(x - w / 2, y - 18 * dpr, w, 36 * dpr, 18 * dpr); g.fill();
  g.fillStyle = '#fff'; g.fillText(text, x, y + dpr);
}

function drawHud(now) {
  const top = (inset.top + 12) * dpr, pad = 14 * dpr, r = 9 * dpr;
  // hearts
  for (let i = 0; i < HEARTS; i++) {
    const x = pad + r + i * 2.4 * r, y = top + 14 * dpr, full = i < s.hearts;
    g.fillStyle = full ? '#ff5a6e' : 'rgba(255,255,255,.55)'; g.strokeStyle = full ? '#c2304a' : 'rgba(47,107,94,.4)'; g.lineWidth = 2 * dpr;
    g.beginPath(); g.moveTo(x, y + r * 0.9); g.bezierCurveTo(x - r * 1.6, y - r * 0.2, x - r * 0.6, y - r * 1.3, x, y - r * 0.4); g.bezierCurveTo(x + r * 0.6, y - r * 1.3, x + r * 1.6, y - r * 0.2, x, y + r * 0.9); g.fill(); g.stroke();
  }
  // the line: a duckling and a count; the count is the score multiplier
  const cx = W / 2, cy = top + 14 * dpr;
  g.fillStyle = 'rgba(255,255,255,.75)'; g.beginPath(); g.roundRect(cx - 52 * dpr, cy - 18 * dpr, 104 * dpr, 36 * dpr, 18 * dpr); g.fill();
  art.duckling(g, cx - 28 * dpr, cy + 2 * dpr, 0, 26 * dpr / 0.06, now / 1000, 0, { moving: 0.3 });
  g.fillStyle = '#2f6b5e'; g.font = `bold ${Math.round(20 * dpr)}px ui-rounded, system-ui, sans-serif`; g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillText(`×${s.line.length}`, cx - 10 * dpr, cy + 1 * dpr);
  // the sun: time left, as a bar that runs down
  const left0 = timeLeft(s), frac = s.endless ? Math.min(1, left0 / 40) : left0 / s.time;
  const bw = Math.min(W - 2 * pad - 70 * dpr, 300 * dpr), bx = (W - bw) / 2, by = cy + 26 * dpr;
  g.fillStyle = 'rgba(255,255,255,.5)'; g.beginPath(); g.roundRect(bx, by, bw, 8 * dpr, 4 * dpr); g.fill();
  const low = left0 < 12 && !s.home;
  g.fillStyle = low ? (Math.floor(now / 250) % 2 ? '#ff7a3a' : '#ffb43a') : '#ffc94a'; g.beginPath(); g.roundRect(bx, by, Math.max(8 * dpr, bw * frac), 8 * dpr, 4 * dpr); g.fill();
  g.fillStyle = '#ffde5a'; g.strokeStyle = '#f29a1a'; g.lineWidth = 2 * dpr; g.beginPath(); g.arc(bx + bw * frac, by + 4 * dpr, 8 * dpr, 0, 7); g.fill(); g.stroke();
  // progress up the pond (stage) or the score (endless), under the bar
  g.fillStyle = '#2f6b5e'; g.font = `bold ${Math.round(14 * dpr)}px ui-rounded, system-ui, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'top';
  const txt = s.endless ? `${s.score}` : `${s.arrived.length ? s.arrived.length + ' home · ' : ''}${s.score}`;
  g.lineWidth = 3 * dpr; g.strokeStyle = 'rgba(255,255,255,.8)'; g.strokeText(txt, W / 2, by + 13 * dpr); g.fillText(txt, W / 2, by + 13 * dpr);
  if (low && left0 > 0) label('Hurry!', W / 2, by + 50 * dpr);
  // stage 1 only: a word for what the trail means while it shows
  if (trailT > 0 && s.stage <= 2 && trailShows <= 2) label('They follow your path', W / 2, H - (inset.bottom + 120) * dpr);
}

function drawParts(dt) {
  for (const p of parts) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; p.life -= dt; p.r += dt * 6;
    const a = Math.max(0, Math.min(1, p.life));
    if (p.kind === 'feather') { g.fillStyle = `rgba(255,236,150,${a})`; g.beginPath(); g.ellipse(sx(p.x), sy(p.y), 0.012 * u, 0.005 * u, p.r, 0, 7); g.fill(); }
    else if (p.kind === 'drop') { g.fillStyle = `rgba(255,255,255,${a})`; g.beginPath(); g.arc(sx(p.x), sy(p.y), 0.006 * u, 0, 7); g.fill(); }
    else { g.fillStyle = `rgba(255,230,120,${a})`; g.beginPath(); g.arc(sx(p.x), sy(p.y), 0.008 * u * a, 0, 7); g.fill(); }
  }
  parts = parts.filter(p => p.life > 0);
  if (ripples.length > 120) ripples.splice(0, ripples.length - 120);
}

function updateCamera(dt) {
  // keep her between 30% and 60% down the screen; pull back to show a long tail, but never lose her off the top
  const hu = H / u, m = s.mom;
  let want = Math.min(Math.max(cam, m.y - 0.04 * hu), m.y + 0.22 * hu);
  if (s.line.length) { const tail = pathAt(s, s.line[s.line.length - 1].delay); want = Math.max(m.y - 0.15 * hu, Math.min(want, tail.y + 0.53 * hu)); }
  if (s.nest) want = Math.min(want, s.nest.y - 0.15 * hu);
  camShown += (want - camShown) * Math.min(1, dt * 6);
  cam = camShown;
}

function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000 || 0); last = now;
  let alpha = 1;
  if (playing && !paused) {
    if (!waitTouch) { acc += dt * FAST; while (acc >= DT && playing) { tick(); acc -= DT; } alpha = Math.min(1, acc / DT); }
    trailT = Math.max(0, trailT - dt); quackShow = Math.max(0, quackShow - dt); hurtT = Math.max(0, hurtT - dt); homeGlow = Math.max(0, homeGlow - dt * 0.3);
    peepT -= dt;
    if (peepT <= 0) { peepT = 2.2 + Math.random() * 1.5; if (s.lost.some(l => Math.abs(l.y - s.mom.y) < 1)) peep(2600 + Math.random() * 500, 0.025); }
    const q = $('quack'); const ready = 1 - s.quackCool / QUACK_COOL; q.style.setProperty('--ready', ready.toFixed(3)); q.classList.toggle('wait', ready < 1);
    if (water) water.gain.value = 0.18;
  } else if (water) water.gain.value = 0;
  if (playing && !paused || screen === 'play') updateCamera(dt);
  shake = Math.max(0, shake - dt * 2.5); flash = Math.max(0, flash - dt * 2);
  const k = still ? 0 : shake * 10 * dpr;
  g.setTransform(1, 0, 0, 1, (Math.random() - 0.5) * k, (Math.random() - 0.5) * k);
  drawPond(now); drawHazards(now); drawNest(now); drawLost(now); drawLine(now, alpha); drawMother(now, alpha); drawParts(paused ? 0 : dt);
  g.setTransform(1, 0, 0, 1, 0, 0);
  if (flash > 0) { g.fillStyle = `rgba(255,90,80,${flash * 0.4})`; g.fillRect(0, 0, W, H); }
  if (screen === 'play') { drawGuide(now); drawHud(now); }
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- the menu picture: a mother and her line in a curve
function drawMenuArt() {
  const c = $('menuArt'), q = c.getContext('2d'), now = performance.now() / 1000;
  q.clearRect(0, 0, c.width, c.height);
  q.fillStyle = '#8fd0cc'; q.beginPath(); q.ellipse(220, 115, 210, 95, 0, 0, 7); q.fill();
  q.strokeStyle = 'rgba(255,255,255,.35)'; q.lineWidth = 8; q.beginPath(); q.moveTo(330, 60); q.bezierCurveTo(260, 30, 120, 40, 90, 120); q.stroke();
  const pts = [[330, 60], [280, 44], [225, 42], [172, 54], [130, 76], [102, 106], [92, 140]];
  for (let i = pts.length - 1; i >= 1; i--) { const [x, y] = pts[i], [px, py] = pts[i - 1]; art.duckling(q, x, y, Math.atan2(px - x, -(py - y)), 560, now, i, { trait: ['eager', 'sleepy', 'brave', 'curious', 'tiny', 'loud'][i - 1] }); }
  art.mother(q, 330, 60, Math.atan2(40, 10), 560, now, 1, false, false);
  art.lilyPad(q, 70, 60, 22, 1, true); art.lilyPad(q, 370, 160, 18, 3, false);
}

// ---------------------------------------------------------------- hooks for checks
window.ducklingsState = () => ({
  screen, mode, stage: s.stage, playing, paused, waiting: waitTouch, t: s.t, over: s.over, why: s.why, score: s.score, hearts: s.hearts,
  line: s.line.length, lost: s.lost.length, arrived: s.arrived.length, total: s.total, stars: stars(s), home: s.home, quackCool: s.quackCool,
  mom: { x: s.mom.x, y: s.mom.y, sx: sx(s.mom.x) / dpr, sy: sy(s.mom.y) / dpr },
  nest: s.nest ? { sx: sx(s.nest.x) / dpr, sy: sy(s.nest.y) / dpr } : null,
  waitingDucks: s.lost.map(l => ({ sx: sx(l.x) / dpr, sy: sy(l.y) / dpr, y: l.y })),
  opened: data.opened, sound: data.sound, taught: data.taught,
});

show('menu');
requestAnimationFrame(frame);
</script>
<script src="/notes/button.js" defer></script>
