<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f4e6cd"><link rel="icon" href="data:,"><title>Good Match</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}body{background:#f4e6cd;color:#293e3a;font:17px/1.35 'Trebuchet MS',system-ui,sans-serif}canvas{display:block;width:100%;height:100dvh}button{font:700 17px/1.2 inherit;font-family:inherit;font-size:17px;font-weight:700;min-height:48px;min-width:48px;border:0;border-radius:18px;padding:12px 22px;background:#e6e9df;color:#293e3a;cursor:pointer;box-shadow:0 4px 0 #233c3520;touch-action:manipulation}button:active{transform:translateY(3px);box-shadow:0 1px 0 #233c3520}button.primary{background:#315f50;color:#fff7e8;min-width:210px;font-size:22px;padding:17px 28px}button:focus-visible{outline:3px solid #d18155;outline-offset:4px}.screen{position:fixed;inset:0;display:none;place-items:center;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));background:#203c334a;overflow-y:auto;touch-action:pan-y}.screen.on{display:grid}.card{width:min(100%,390px);padding:28px 24px 22px;border-radius:32px;background:#fff7e8;text-align:center;box-shadow:0 16px 60px #25443838;border:1px solid #fff9ee}h1{font-family:Georgia,serif;font-size:51px;letter-spacing:-2px;font-weight:normal;line-height:1;margin:0 0 12px}h2{font-family:Georgia,serif;font-weight:normal;font-size:36px;margin:0 0 14px}p{margin:12px 0}#menu{background:transparent}#menu .card{background:#fff7e8f5}#hero{height:160px;width:100%;margin:0 0 12px}.eyebrow{letter-spacing:3px;text-transform:uppercase;font-size:14px;color:#80745f;margin:0 0 16px}.subtitle{font-size:17px;color:#647064;margin:0 0 22px}.lab-notice{font-size:14px!important;line-height:1.35!important;text-align:left;margin-top:20px!important;color:#637064}.lab-toggle{font-size:14px;text-align:left;min-height:48px!important}.lab-toggle input{min-height:24px;min-width:24px}#pause{position:fixed;right:max(12px,calc((100vw - 600px)/2 + 12px));top:calc(10px + env(safe-area-inset-top));padding:0;width:48px;height:48px;border-radius:50%;display:none;background:#fff7e8}#pause::before{content:'';display:inline-block;width:14px;height:17px;border-left:5px solid;border-right:5px solid}#probe{position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.row button{flex:1}.secondary{background:transparent;box-shadow:none;color:#5d6e63}#endArt{height:110px;font-size:64px;line-height:110px;letter-spacing:5px;color:#d89640}#stats{color:#637064;font-size:16px}#levelGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0}#levelGrid button{padding:5px 0;border-radius:12px;font-size:16px;min-width:0;height:57px}#levelGrid small{display:block;font-size:14px;color:#a76e28}#levelGrid button:disabled{opacity:.4;cursor:default}#palette button{font-size:14px;padding:10px}#status{font-size:16px;color:#637064}#menu .primary{margin-top:2px}#daily{display:block;margin:10px auto 0;font-size:16px}.card>button{margin-bottom:8px}@media(max-height:710px){#hero{height:115px;margin-bottom:5px}.card{padding:20px}h1{font-size:46px}.subtitle{margin-bottom:12px}.lab-notice{margin-top:14px!important}.eyebrow{margin-bottom:10px}.screen{padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:calc(10px + env(safe-area-inset-bottom))}}
</style></head><body>
<canvas id="game" aria-label="Drag helpers to doors. Tap a helper for a try-out." tabindex="0"></canvas><div id="probe"></div>
<button id="pause" aria-label="Pause"></button>
<div class="screen on" id="menu"><div class="card"><canvas id="hero" aria-hidden="true"></canvas><h1>Good Match</h1><p class="subtitle">Find the right hands for every home.</p><button class="primary" id="play">Play</button><button class="secondary" id="daily">Today’s street</button><div id="notice"></div></div></div>
<div class="screen" id="paused"><div class="card"><h2>A moment?</h2><button class="primary" id="resume">Keep going</button><div class="row"><button id="restart">Restart</button><button id="toMenu">Menu</button></div><p><button id="sound">Sound: on</button></p><div class="row" id="palette"><button data-palette="peach">Peach street</button><button data-palette="night">Evening street</button></div><div id="recording"></div></div></div>
<div class="screen" id="end"><div class="card"><p class="eyebrow" id="endDay">Day 1</p><div id="endArt" aria-label="Stars"></div><h2 id="endTitle">Good matches!</h2><p id="result"></p><p id="stats"></p><button class="primary" id="next">Next street</button><div class="row"><button id="again">Try again</button><button id="endMenu">Menu</button></div><p><button id="levels" class="secondary">Your streets</button></p></div></div>
<div class="screen" id="streets"><div class="card"><h2>Your streets</h2><p id="status"></p><div id="levelGrid"></div><button id="back">Back</button></div></div>
<script type="module" src="./main.js"></script><script src="/notes/button.js" defer></script></body></html>
