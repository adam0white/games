<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#08121b">
<title>Lantern: First Person</title>
<style>
:root{color-scheme:dark;--gold:#ffd59a;--ink:#08121b;--cream:#fff0d7;--line:#ffd59a50}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}body{font:16px/1.5 Georgia,'Times New Roman',serif;color:var(--cream)}#c{display:block;width:100vw;height:100dvh;touch-action:none}button,a,input{font:inherit}button,a{touch-action:manipulation}button{min-height:48px;min-width:48px;border:1px solid var(--line);border-radius:30px;padding:10px 22px;background:#ffffff08;color:var(--cream);cursor:pointer}button:active{transform:scale(.96);background:#ffd59a30}button.main{background:var(--gold);border-color:var(--gold);color:#38240f;font-size:20px;min-width:190px;box-shadow:0 7px 32px #ffb34a22}button:disabled{opacity:.4}a{color:var(--gold)}.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));background:#061019b8;overflow-y:auto;touch-action:pan-y}.screen.on{display:flex}.card{width:min(100%,390px);text-align:center;padding:28px 22px;border:1px solid #ffd59a27;border-radius:24px;background:linear-gradient(155deg,#172a35e8,#09121be8);box-shadow:0 20px 80px #0005}h1{font-weight:400;font-size:clamp(42px,10vw,60px);line-height:1.05;letter-spacing:.055em;margin:0;color:var(--gold);text-shadow:0 0 30px #ffbd6d30}h1 span{display:block;font:14px/2 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.26em;margin-top:8px;color:#dfd3be}h2{font-weight:400;font-size:38px;line-height:1.1;margin:0 0 16px;color:var(--gold)}p{margin:14px 0}.sub{font:14px/1.5 system-ui,sans-serif;color:#becbd0}.views{display:flex;justify-content:center;margin:22px auto 0;border:1px solid var(--line);border-radius:24px;width:max-content;max-width:100%;overflow:hidden}.views a{display:flex;align-items:center;justify-content:center;min-height:48px;min-width:58px;padding:8px 13px;font:14px system-ui,sans-serif;text-decoration:none}.views a[aria-current]{background:#ffd59a21;color:#fff0d7}.quiet{font:14px system-ui,sans-serif;background:none;border:0;padding:10px 14px}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}#hud{position:fixed;top:calc(16px + env(safe-area-inset-top));left:calc(20px + env(safe-area-inset-left));right:calc(80px + env(safe-area-inset-right));pointer-events:none;display:none;font:14px/1.5 system-ui,sans-serif;text-shadow:0 2px 8px #000}#stats{display:flex;flex-wrap:wrap;gap:8px;align-items:center}#progress{height:3px;background:#ffffff25;margin:10px 0;width:min(240px,100%);border-radius:5px}#progress i{height:100%;display:block;background:var(--gold);box-shadow:0 0 10px #ffcb7b}#wick{width:54px;height:6px;background:#ffffff20;display:inline-block;border-radius:3px}#wick i{display:block;height:100%;background:var(--gold);border-radius:3px}#pause{position:fixed;top:calc(13px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));display:none;padding:0;width:48px;height:48px;background:#08121b88;font:22px system-ui,sans-serif}#steer{display:none;position:fixed;inset:auto 24px calc(26px + env(safe-area-inset-bottom));pointer-events:none;justify-content:space-between;font:32px/1 system-ui,sans-serif;color:#ffe6bca0}#steer span{width:58px;height:58px;display:grid;place-items:center;border:1px solid #ffe6bc30;border-radius:50%;transition:background .1s,transform .1s}#steer span.on{background:#ffd59a35;transform:scale(1.15)}#warn{display:none;position:fixed;top:calc(100px + env(safe-area-inset-top));left:10%;right:10%;text-align:center;font:16px system-ui,sans-serif;color:#ffcf97;pointer-events:none}#ripples{position:fixed;inset:0;pointer-events:none;overflow:hidden}.ripple{position:absolute;width:48px;height:48px;border:2px solid #ffd59aa0;border-radius:50%;animation:ripple .55s ease-out forwards}@keyframes ripple{to{transform:scale(2.4);opacity:0}}#score{font-size:48px;color:var(--gold);line-height:1.1}#shareName{min-height:48px;border-radius:12px;border:1px solid var(--line);padding:10px;width:100%;color:var(--cream);background:#050e16;font-size:16px;user-select:text}#rows{font:16px/1.6 system-ui,sans-serif;text-align:left;padding-left:24px;max-height:190px;overflow:auto}#nogl a{display:inline-flex;align-items:center;min-height:48px;padding:8px}#nogl .card{max-width:390px}.celebrate{animation:celebrate 1s ease-out}@keyframes celebrate{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}@media(max-height:690px){.card{padding:20px 18px}p{margin:10px 0}.views{margin-top:14px}h1{font-size:44px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="c" aria-label="River. Tap the left half to steer left, the right half to steer right."></canvas>
<div id="hud"><div id="stats"><span id="night">Night 1</span><span id="pct">0%</span><span>✦ <b id="embers">0</b></span><span id="hearts" aria-label="Hearts">♥ 1</span><span id="wick" aria-label="Lantern light"><i></i></span></div><div id="progress"><i></i></div></div>
<button id="pause" aria-label="Pause">Ⅱ</button><div id="steer" aria-hidden="true"><span id="left">‹</span><span id="right">›</span></div><div id="warn">Find an ember</div><div id="ripples"></div>
<div id="menu" class="screen on"><div class="card"><h1>Lantern<span>First person</span></h1><p class="sub">A new river each day.</p><p><button id="play" class="main">Play</button></p><div id="bestLine" class="sub"></div><nav class="views" aria-label="View"><a href="/lantern/">2D</a><a href="/lab/lantern-3d/">3D</a><a href="/lab/lantern-fp/" aria-current="page">First person</a></nav><p><button id="toBoard" class="quiet">Shared board</button></p></div></div>
<div id="paused" class="screen"><div class="card"><h2>Paused</h2><p><button id="resume" class="main">Keep going</button></p><div class="actions"><button id="quit">Menu</button><button id="sound">Sound: on</button></div></div></div>
<div id="end" class="screen"><div class="card"><h2 id="endTitle">Dawn</h2><div id="score"></div><p id="endLine" class="sub"></p><p><button id="again" class="main">Play again</button></p><button id="endMenu">Menu</button><button id="endBoard" class="quiet">Shared board</button></div></div>
<div id="board" class="screen"><div class="card"><h2>Shared board</h2><p id="boardStatus" class="sub">Best distance on this device.</p><ol id="rows"></ol><label class="sub" for="shareName">Name to share</label><input id="shareName" maxlength="16" autocomplete="off" placeholder="Your name"><p class="sub">Share sends your typed name and best distance, with a random ID.</p><button id="share">Share</button><p><button id="boardBack">Back</button></p></div></div>
<div id="nogl" class="screen"><div class="card"><h2>3D unavailable</h2><p>This page needs WebGL2.</p><p><a href="/lantern/">Play Lantern in 2D</a></p></div></div>
<script type="module" src="./main.js"></script><script src="/notes/button.js" defer></script>
</body></html>
