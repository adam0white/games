<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<title>Lab experiments</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #0b0d14; color: #efe8da; font: 17px/1.5 Georgia, 'Times New Roman', serif; }
  main { max-width: 34em; margin: 0 auto; padding: 1.4em 1em 3em; }
  h1 { font-weight: normal; letter-spacing: .08em; color: #ffd9a0; margin: 0 0 .2em; }
  p { opacity: .85; margin: .4em 0; }
  a.card { display: block; margin: 1em 0; padding: .9em 1em; border: 1.5px solid #ffd9a055; border-radius: 14px; color: inherit; text-decoration: none; background: #ffffff0a; }
  a.card b { display: block; font-weight: normal; font-size: 1.25em; color: #ffd9a0; }
  a.card small { opacity: .7; }
</style>
</head>
<body>
<main>
  <h1>Lab experiments</h1>
  <p>Wild takes on Lantern and Ant Promotion. Each one tests one idea. The main games are not changed by anything here.</p>
  <div id="list"></div>
  <p><a href="/lantern/" style="color:#ffd9a0">Lantern</a> · <a href="/ant-promotion/" style="color:#ffd9a0">Ant Promotion</a></p>
</main>
<script type="module">
// One entry per experiment: [directory, title, what it tests, which game it comes from]
const LIST = [
  ['ant-evolve', 'Ant Promotion: The Meadow Evolves', 'Every animal carries traits. The ones that chase you well, or escape you, have the children. The meadow slowly learns how you play, and tells you what it learned.', 'Ant Promotion'],
  ['lantern-echo', 'Lantern Echo', 'The lantern is out. A ping every second lights what is ahead for a moment, and each thing answers with a sound from its side. Headphones help.', 'Lantern'],
  ['lantern-ripples', 'Lantern Ripples', 'The water is simulated: the wake, every pickup, the rain and every hit send ripples across the river.', 'Lantern'],
  ['lantern-fp', 'Lantern: First Person', 'The river seen from the bow. Tap left or right to steer.', 'Lantern'],
  ['lantern-race', 'Lantern: Race', 'Race up to eight boats on the same river, in an open room or with a code for friends.', 'Lantern'],
  ['ant-swarm', 'Ant Promotion: The Swarm', 'You are the colony\'s scent. Paint a trail and hundreds of ants follow it.', 'Ant Promotion'],
  ['ant-quests', 'Ant Promotion: Meadow Folk', 'Four neighbours ask for favours and remember you. Their words can come from a language model.', 'Ant Promotion'],
  ['lantern-song', 'Lantern Song', 'The river has music, made as you play: a new tune each night that fills out towards dawn, with a heartbeat when danger is near. Sound on.', 'Lantern'],
  ['lantern-3d', 'Lantern 3D', 'The same river and rules, drawn in real-time 3D with the lantern as a real light on the water. Moving into Lantern as a view you can switch to.', 'Lantern'],
  ['ant-wilds', 'Ant Promotion: Wilds', 'Animals hunt each other. Watch the chases and eat the leftovers. Now in Ant Promotion as the Wild rules.', 'Ant Promotion'],
  ['ant-nemesis', 'Ant Promotion: Nemesis', 'The animal that kills you becomes a named rival. It talks, remembers you and grows until you can eat it. Now in Ant Promotion.', 'Ant Promotion'],
  ['ant-nest', 'Ant Promotion: The Nest', 'Draw where to dig. The ants decide when. Keep the queen dry when the rain comes.', 'Ant Promotion and The Warren'],
];
const box = document.getElementById('list');
if (!LIST.length) box.innerHTML = '<p>The first experiments are being built.</p>';
for (const [dir, title, what, from] of LIST) {
  const a = document.createElement('a'); a.className = 'card'; a.href = `./${dir}/`;
  const b = document.createElement('b'); b.textContent = title;
  const p = document.createElement('span'); p.textContent = what;
  const s = document.createElement('small'); s.textContent = ` From ${from}.`;
  a.append(b, p, s); box.append(a);
}
</script>
</body>
</html>
