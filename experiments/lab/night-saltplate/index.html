<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ece5d3">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <title>Saltplate · Resonance studies</title>
</head>
<body>
  <main id="work">
    <header>
      <div class="mast">
        <div class="eyebrow"><span class="fork" aria-hidden="true"></span> Resonance studies</div>
        <button id="pause" aria-label="Pause" title="Pause"><span aria-hidden="true">Ⅱ</span></button>
      </div>
      <h1>Salt<i>plate</i></h1>
      <p class="instruction">Tune the plate until the salt fills the engraving.</p>
    </header>
    <figure>
      <figcaption><span class="mono" id="number"></span><strong id="level-name"></strong></figcaption>
      <canvas id="plate" width="400" height="400" aria-label="Salt grains on a vibrating plate with an engraved target pattern"></canvas>
    </figure>
    <div class="controls" id="controls">
      <div class="readouts">
        <div><label for="tuner" class="mono">Frequency</label><span class="reading"><output id="frequency" for="tuner">110</output><small> Hz</small></span></div>
        <div class="match"><span class="mono">Impression</span><div class="meter"><span id="match-bar"></span></div></div>
      </div>
      <div class="instrument">
        <div class="scale" aria-hidden="true"><div class="graduations"></div><span id="notch"></span></div>
        <input id="tuner" type="range" min="0" max="1000" step="1" value="0" aria-label="Tune the vibrating plate">
        <div class="legends"><span>110</span><span>220</span><span>330</span><span>440 Hz</span></div>
      </div>
    </div>
    <section id="result" class="result" aria-labelledby="result-title">
      <div class="mono"><span class="seal" aria-hidden="true">✓</span><span id="result-label"></span></div>
      <h2 id="result-title"></h2>
      <div class="actions"><button id="next" class="primary">Next plate →</button><button id="replay">Reprint</button></div>
    </section>
  </main>
  <section id="paused" class="overlay" role="dialog" aria-modal="true" aria-labelledby="pause-title">
    <div class="card"><span class="mono" id="pause-plate"></span><h2 id="pause-title">Plate at rest</h2>
      <button id="resume" class="primary">Resume</button>
      <div class="actions"><button id="look">Finish · Blue</button><button id="sound">Sound on</button></div>
      <button id="restart">Reset plate</button>
    </div>
  </section>
  <script type="module" src="./main.js"></script>
  <script defer src="/notes/button.js"></script>
</body>
</html>
