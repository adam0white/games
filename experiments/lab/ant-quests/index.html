<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#203e35">
<link rel="icon" href="data:,">
<title>Ant Promotion: Meadow Folk</title>
<style>
:root{color-scheme:light;--ink:#243f34;--cream:#fff9e8;--coral:#d46e52;--gold:#edc66c}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;touch-action:none;background:#203e35;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{font:16px/1.4 'Trebuchet MS',system-ui,sans-serif;color:var(--ink)}#c{display:block;width:100%;height:100dvh;touch-action:none}button{font:inherit;font-weight:700;min-width:48px;min-height:48px;border:0;border-radius:18px;padding:12px 20px;cursor:pointer;touch-action:manipulation;color:var(--ink);background:#efead5;box-shadow:0 4px 0 #172d2720;transition:transform .12s}button:active{transform:translateY(3px) scale(.98)}button.main{display:block;width:100%;background:var(--coral);color:white;font-size:22px;box-shadow:0 5px 0 #a64a37;padding:16px}
.screen{position:fixed;inset:0;display:none;place-items:center;background:#18362a88;padding:calc(16px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));touch-action:pan-y;overflow:auto}.screen.on{display:grid}.card{width:min(100%,350px);padding:25px;background:var(--cream);border-radius:30px;box-shadow:0 12px 50px #10271c55;text-align:center;position:relative}.eyebrow{font-size:14px;letter-spacing:3px;font-weight:bold;color:#747e57;margin:0 0 10px}h1{font-size:46px;letter-spacing:-2px;line-height:.95;margin:0;color:var(--ink)}h2{font-size:32px;line-height:1.1;margin:8px 0 16px}p{margin:12px 0}#hero,#endArt{width:100%;height:150px;display:block}#menu .card{padding-top:28px}#menu .tagline{font-size:16px;margin:5px 0 22px}.row{display:flex;justify-content:center;gap:10px;margin-top:18px}.row button{flex:1;padding:10px}.sub{font-size:14px;color:#65775a}#bestline{margin:5px 0 22px}
#hud{position:fixed;top:calc(10px + env(safe-area-inset-top));left:max(14px,calc((100vw - 480px)/2 + 14px));right:max(14px,calc((100vw - 480px)/2 + 14px));display:none;pointer-events:none;color:var(--cream)}.toprow{display:flex;justify-content:space-between;align-items:center;gap:8px}.score{font-size:20px;font-weight:bold}.clock{font-size:17px;font-variant-numeric:tabular-nums}.hudbuttons{display:flex;gap:8px;pointer-events:auto}.hudbuttons button{padding:0;width:48px;height:48px;border-radius:50%;background:#fff9e8;color:#294537;font-size:20px}#suntrack{margin-top:9px;height:5px;border-radius:5px;background:#ffffff29;overflow:hidden}#sunfill{height:100%;background:var(--gold);transform-origin:left}#bubble{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 28px),440px);background:var(--cream);border-radius:22px;padding:13px 16px;min-height:92px;box-shadow:0 6px 25px #1d34282a;display:none;pointer-events:none;border-left:5px solid var(--coral)}#bubble::before{content:'';position:absolute;left:30px;top:-10px;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:12px solid var(--cream)}#speaker{font-size:14px;font-weight:bold;color:#8e4a37;display:flex;justify-content:space-between;gap:6px}#name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#progress{flex:none}#line{font-size:17px;line-height:1.3;margin:4px 0 0;overflow-wrap:anywhere}#questtrack{height:4px;border-radius:4px;margin-top:9px;background:#e3e4c5;overflow:hidden}#questfill{height:100%;background:#8eaa6e;width:0}#toast{position:fixed;top:calc(90px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:max-content;max-width:90%;padding:9px 18px;border-radius:24px;background:var(--cream);font-weight:bold;pointer-events:none;opacity:0;transition:opacity .15s;text-align:center}#toast.on{opacity:1}#entries{text-align:left;max-height:45dvh;overflow:auto;touch-action:pan-y}.entry{padding:13px 0;border-bottom:1px solid #d9ddc5}.entry b{display:block;font-size:14px;color:#a45541;margin-bottom:4px}.entry p{margin:0;font-size:16px;overflow-wrap:anywhere}#endScore{font-size:26px;font-weight:bold;color:#ba5d46}.stars{color:#d46e52;letter-spacing:5px;font-size:26px}#probe{position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
@media(max-height:700px){.card{padding:20px}#hero,#endArt{height:110px}h1{font-size:40px}.row{margin-top:12px}#bestline{margin-top:5px}#bubble{bottom:calc(10px + env(safe-area-inset-bottom));min-height:84px;padding:10px 14px}#name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#progress{flex:none}#line{font-size:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="c" aria-label="Meadow. Drag anywhere to move your ant."></canvas><div id="probe"></div>
<div id="hud"><div class="toprow"><span class="score" id="hearts">♥ 0 / 12</span><span class="clock" id="clock">3:00</span><div class="hudbuttons"><button id="book" aria-label="Meadow secrets">▤</button><button id="pause" aria-label="Pause">Ⅱ</button></div></div><div id="suntrack"><div id="sunfill"></div></div></div>
<div id="bubble"><div id="speaker"><span id="name">Beetle</span><span id="progress"></span></div><p id="line"></p><div id="questtrack"><div id="questfill"></div></div></div><div id="toast"></div>
<div id="menu" class="screen on"><div class="card"><p class="eyebrow">ANT PROMOTION</p><h1>Meadow<br>Folk</h1><canvas id="hero" width="600" height="300"></canvas><p class="tagline" id="bestline">Four friends before nightfall.</p><button id="play" class="main">Play</button></div></div>
<div id="paused" class="screen"><div class="card"><p class="eyebrow">THE MEADOW CAN WAIT</p><h2>Rest a moment.</h2><button id="resume" class="main">Resume</button><div class="row"><button id="restart">Restart</button><button id="toMenu">Menu</button></div><div class="row"><button id="sound">Sound: on</button><button id="secrets">Secrets</button></div></div></div>
<div id="bookCard" class="screen"><div class="card"><p class="eyebrow">COLLECTED WORDS</p><h2>Meadow secrets</h2><div id="entries"></div><p><button id="closeBook" class="main">Back</button></p></div></div>
<div id="end" class="screen"><div class="card"><p class="eyebrow">ANT PROMOTION</p><h2 id="endTitle">The meadow remembers.</h2><canvas id="endArt" width="600" height="300"></canvas><div id="endScore"></div><p id="endLine"></p><p id="endBest" class="sub"></p><button id="again" class="main">Play again</button><div class="row"><button id="endBook">Secrets</button><button id="endMenu">Menu</button></div></div></div>
<script type="module" src="./main.js"></script><script src="/notes/button.js" defer></script>
</body></html>
