<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<title>Lab experiments</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #0b0d14; color: #efe8da; font: 17px/1.5 Georgia, 'Times New Roman', serif; }
  main { max-width: 34em; margin: 0 auto; padding: 1.4em 1em 3em; }
  h1 { font-weight: normal; letter-spacing: .08em; color: #ffd9a0; margin: 0 0 .2em; }
  p { opacity: .85; margin: .4em 0; }
  a.card { display: block; margin: 1em 0; padding: .9em 1em; border: 1.5px solid #ffd9a055; border-radius: 14px; color: inherit; text-decoration: none; background: #ffffff0a; }
  a.card b { display: block; font-weight: normal; font-size: 1.25em; color: #ffd9a0; }
  a.card small { opacity: .7; }
</style>
</head>
<body>
<main>
  <h1>Lab experiments</h1>
  <p>Wild takes on Lantern and Ant Promotion. Each one tests one idea. The main games are not changed by anything here.</p>
  <div id="list"></div>
  <p><a href="/lantern/" style="color:#ffd9a0">Lantern</a> · <a href="/ant-promotion/" style="color:#ffd9a0">Ant Promotion</a></p>
</main>
<script type="module">
// One entry per experiment: [directory, title, what it tests, which game it comes from]
const LIST = [
  ['ant-hide', 'Ant Hide', 'Rocks block what hunters can see and tall grass hides you. Their sight is drawn with real shadows, so you can see where it is safe. Break their line of sight to lose them.', 'Ant Promotion'],
  ['ant-evolve', 'Ant Promotion: The Meadow Evolves', 'Every animal carries traits. The ones that chase you well, or escape you, have the children. The meadow slowly learns how you play, and tells you what it learned.', 'Ant Promotion'],
  ['lantern-echo', 'Lantern Echo', 'The lantern is out. A ping every second lights what is ahead for a moment, and each thing answers with a sound from its side. Headphones help.', 'Lantern'],
  ['lantern-ripples', 'Lantern Ripples', 'The water is simulated: the wake, every pickup, the rain and every hit send ripples across the river.', 'Lantern'],
  ['lantern-fp', 'Lantern: First Person', 'The river seen from the bow. Tap left or right to steer.', 'Lantern'],
  ['lantern-race', 'Lantern: Race', 'Race up to eight boats on the same river, in an open room or with a code for friends.', 'Lantern'],
  ['ant-swarm', 'Ant Promotion: The Swarm', 'You are the colony\'s scent. Paint a trail and hundreds of ants follow it.', 'Ant Promotion'],
  ['ant-quests', 'Ant Promotion: Meadow Folk', 'Four neighbours ask for favours and remember you. Their words can come from a language model.', 'Ant Promotion'],
  ['lantern-spark', 'Lantern: Spark', 'No lantern. Strike a spark and the river shows itself for a moment; steer by stars, fireflies and sound.', 'Lantern'],
  ['ant-creatures', 'Ant Promotion: Living Animals', 'Every animal walks on real legs, with a spine, a tail and eyes that follow you. Includes a zoo to poke them.', 'Ant Promotion'],
  ['ant-draft', 'Ant Draft (build A)', 'Eight waves. After each one, pick one of three promotion cards; they stack. Hold your thumb where the soldiers should gather.', 'Ant Promotion'],
  ['ant-draft-b', 'Ant Draft (build B)', 'The same idea built by a second builder: defend the whole bottom edge, draft a card after every wave.', 'Ant Promotion'],
  ['boat-b', 'Paper Boat (build B)', 'A second build of Paper Boat: bend the gutter stream with swipes and pebbles; the boat is never steered.', 'New'],
  ['wild2-face-shift', 'Face Shift', 'Stretch a rubber face until it matches the portrait, then take the photo.', 'New'],
  ['wild-pour', 'Pour', 'A jug of juice made of real drops. Slide to tip it, or tip the phone itself, and fill the glass to the line.', 'New'],
  ['night-bells', 'Night Bells', 'Three bells swing at their own pace. Tap each one at the top of its swing to keep it ringing and light the village.', 'New'],
  ['night-lamp-keeper', 'Lamp Keeper', 'Draw a path from lamp to lamp so the neighbours can find their way home before the wind blows the lights out.', 'New'],
  ['night-channels', 'Channels', 'Water is the game. Dig channels with your thumb so the spring runs downhill and the seedbeds flower.', 'New'],
  ['night-flock', 'Night Flock', 'You are the sheepdog. Bring the whole flock through the gate before dark, and go back for the stray.', 'New'],
  ['night-podwire', 'Podwire', 'Pull a string and let go. The wave runs along it and splits the seed pods on the far side.', 'New'],
  ['lantern-rhythm', 'Lantern Rhythm', 'The river is the music. Rocks sit on the beat and play as drums; every ember you take plays the next note of the tune, so a clean run sounds like a song. Sound on.', 'Lantern'],
  ['lantern-duet', 'Lantern Duet', 'Two boats, one thumb each, joined by a rope of light. Spread the rope to sweep up embers; bring both boats to one side of a rock before it snags. Three nights.', 'Lantern'],
  ['lantern-voice', 'Lantern Voice', 'Steer the boat by humming: low goes left, high goes right. It asks for the microphone; the sound stays on your phone. Headphones help.', 'Lantern'],
  ['night-kite', 'Night Kite', 'Fly a kite in real wind. Your thumb is the hand on the line: thread the bird rings, lift lanterns to the rooftops, ride out the squall.', 'New'],
  ['night-loaves', 'Night Loaves', 'A bakery before dawn. Knead soft dough, let it rise, bake it golden and hand it to the neighbours.', 'New'],
  ['night-splitlight', 'Splitlight', 'Tap to send white light through glass. It splits into colours; turn the glass so each colour finds its receiver.', 'New'],
  ['lantern-tide', 'Lantern Tide', 'The river has currents you can read. Fast water saves the flame but hides the rocks; eddies behind rocks relight the wick.', 'Lantern'],
  ['night-flock-2', 'Night Flock II', 'The deeper version: drag to run, hold to lie down, flick for an outrun. Twenty evenings across three farms, with bridges, bog, mist and wind.', 'New'],
  ['night-vine', 'Night Vine', 'A vine grows towards the light. Move the lamp to lead it to the window, prune with a flick, and do not shade the flowers.', 'New'],
  ['night-rubbing', 'Carbon Cabinet', 'Rub graphite across a fossil plate. The direction of each stroke decides which edges show.', 'New'],
  ['lantern-song', 'Lantern Song', 'The river has music, made as you play: a new tune each night that fills out towards dawn, with a heartbeat when danger is near. Sound on.', 'Lantern'],
  ['lantern-3d', 'Lantern 3D', 'The same river and rules, drawn in real-time 3D with the lantern as a real light on the water. Moving into Lantern as a view you can switch to.', 'Lantern'],
  ['ant-wilds', 'Ant Promotion: Wilds', 'Animals hunt each other. Watch the chases and eat the leftovers. Now in Ant Promotion as the Wild rules.', 'Ant Promotion'],
  ['ant-nemesis', 'Ant Promotion: Nemesis', 'The animal that kills you becomes a named rival. It talks, remembers you and grows until you can eat it. Now in Ant Promotion.', 'Ant Promotion'],
  ['ant-nest', 'Ant Promotion: The Nest', 'Draw where to dig. The ants decide when. Keep the queen dry when the rain comes.', 'Ant Promotion and The Warren'],
  ['pitch', 'Paper Pitch', 'Paper soccer, the old pencil game. Draw the ball\'s path one line at a time; bounce off old ink to go again. A bot, a daily one-turn puzzle, or two on one phone.', 'New'],
  ['ring', 'Firefly Ring', 'Drag a glowing thread around fireflies and close the ring. One colour scores the square of the catch; a mixed ring scatters them. Eight levels to dawn, and a daily meadow.', 'New'],
  ['pisti', 'Pişti', 'The Turkish card game. Match the top card or play a jack to take the pile; take a one-card pile for a pişti. Today\'s deal is the same pack for everyone, so the result compares play, not luck.', 'New'],
  ['thankful', 'Thankful Garden', 'Three thanks a day. Each one grows as a flower in a garden that fills.', 'the lab'],
];
const box = document.getElementById('list');
if (!LIST.length) box.innerHTML = '<p>The first experiments are being built.</p>';
for (const [dir, title, what, from] of LIST) {
  const a = document.createElement('a'); a.className = 'card'; a.href = `./${dir}/`;
  const b = document.createElement('b'); b.textContent = title;
  const p = document.createElement('span'); p.textContent = what;
  const s = document.createElement('small'); s.textContent = ` From ${from}.`;
  a.append(b, p, s); box.append(a);
}
</script>
</body>
</html>
