<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#211a33">
<title>Thumb Duel</title>
<style>
  html, body { margin: 0; height: 100%; background: #211a33; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { font: 17px/1.35 ui-rounded, 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif; color: #1b1328; }
  canvas#c { display: block; width: 100vw; height: 100dvh; touch-action: none; }
  #probe { position: fixed; top: 0; left: 0; width: 0; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); visibility: hidden; pointer-events: none; }
  .hint-side { position: fixed; inset: 0; pointer-events: none; }
  #hint-top { transform: rotate(180deg); }
  .hint-side .kit-hint { bottom: calc(var(--kit-hint-bottom, 120px) + max(env(safe-area-inset-top), env(safe-area-inset-bottom))); }
  .screen { position: fixed; inset: 0; display: none; place-items: center; text-align: center; background: #160f24aa; overflow-y: auto; touch-action: pan-y; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; }
  .screen.on { display: grid; }
  .card { max-width: 21em; width: calc(100% - 32px); box-sizing: border-box; padding: 18px 18px 14px; margin: 12px 0; background: #fff4dc; border: 3px solid #1b1328; border-radius: 24px; box-shadow: 0 8px 0 #1b132866, 0 18px 40px #0007; }
  h1 { font-size: 2.6em; line-height: 1; margin: .1em 0 .2em; color: #ff8a5c; -webkit-text-stroke: 1.5px #1b1328; text-shadow: 0 3px 0 #1b1328; }
  h1 span { color: #58d0c4; display: inline-block; transform: rotate(180deg); }
  h2 { font-size: 1.8em; margin: 0 0 .2em; color: #ff8a5c; -webkit-text-stroke: 1px #1b1328; text-shadow: 0 2px 0 #1b1328; }
  p { margin: .4em 0; }
  .sub { font-size: .95em; opacity: .85; }
  button { font: inherit; font-weight: bold; color: #1b1328; background: #f7e6c4; border: 2.5px solid #1b1328; border-radius: 16px; padding: .45em 1em; margin: .25em; min-height: 48px; min-width: 7em; touch-action: manipulation; cursor: pointer; box-shadow: 0 4px 0 #1b1328; }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #1b1328; }
  button.main { background: #ff8a5c; color: #fff; font-size: 1.4em; min-width: 8.5em; text-shadow: 0 2px 0 #1b132855; }
  button.cool { background: #58d0c4; }
  button:disabled { opacity: .4; }
  button.small { min-width: 0; font-size: .9em; }
  .levels { display: grid; gap: 8px; margin: .5em 0; }
  .levels button { display: flex; justify-content: space-between; align-items: center; width: 100%; margin: 0; }
  .stars { letter-spacing: .1em; color: #c9932a; font-size: 1.05em; }
  .stars .off { color: #1b132833; }
  #pause { position: fixed; right: calc(6px + env(safe-area-inset-right)); top: 50%; transform: translateY(-50%); width: 48px; height: 48px; min-width: 0; min-height: 0; margin: 0; padding: 0; border-radius: 50%; display: none; place-items: center; box-shadow: 0 3px 0 #1b1328; background: #fff4dc; z-index: 2; }
  #pause:active { transform: translateY(calc(-50% + 2px)); }
  #pause::before { content: ''; width: 4px; height: 16px; border: solid #1b1328; border-width: 0 5px; }
  /* The match end: one half for each player, the top one turned to face the far side. */
  #end { background: #160f2477; display: none; grid-template-rows: 1fr 1fr; place-items: stretch; padding: 0; }
  #end.on { display: grid; }
  .half { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: max(env(safe-area-inset-top), env(safe-area-inset-bottom), 10px) 16px 34px; box-sizing: border-box; }
  .half.top { transform: rotate(180deg); }
  .half h2 { margin: 0; font-size: 2.1em; }
  .half.c1 h2 { color: #58d0c4; }
  .half .line { font-weight: bold; color: #fff4dc; text-shadow: 0 2px 4px #000a; min-height: 1.4em; margin: 0; }
  .half button.ready { background: #fff4dc; color: #2a8f86; }
  .half.c0 button.re { background: #ff8a5c; color: #fff; }
  .half.c1 button.re { background: #58d0c4; color: #1b1328; }
  .half.c0 button.re.ready, .half.c1 button.re.ready { background: #fff4dc; color: #1b1328; }
  .half.ghost > * { visibility: hidden; }
  @media (max-height: 460px) {
    .screen:not(#end) { align-items: safe center; }
    #end { grid-template-rows: repeat(2, minmax(0, 1fr)); }
    #end .half { padding: max(6px, env(safe-area-inset-top), env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left), env(safe-area-inset-right)); }
    #end .half.bottom { display: grid; grid-template-columns: repeat(2, max-content); place-content: center; justify-items: center; }
    #end .half.bottom :is(h2, .line) { grid-column: 1 / -1; }
  }
  .lab-notice { font-size: 14px !important; }
  .lab-toggle { font-size: 14px !important; }
  .desk { display: none; font-size: .9em; }
  @media (pointer: fine) { .desk { display: block; } #tagline { display: none; } }
  #deskLine[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint-side" id="hint-bottom"><span></span></div>
<div class="hint-side" id="hint-top"><span></span></div>
<div id="probe"></div>
<button id="pause" aria-label="Pause"></button>

<div id="menu" class="screen on"><div class="card">
  <h1>Thumb <span>Duel</span></h1>
  <p id="tagline" class="sub">Two thumbs. One phone.</p>
  <p id="deskLine" class="desk sub">Mouse works. Space is your thumb.</p>
  <p id="streakLine" class="sub" hidden></p>
  <p><button id="play" class="main">Play</button></p>
  <p><button id="toSolo" class="cool">Play the bot</button></p>
  <p><button id="sound1" class="small">Sound: on</button></p>
</div></div>

<div id="solo" class="screen"><div class="card">
  <h2>Play the bot</h2>
  <div class="levels">
    <button data-level="easy"><span>Easy</span><span class="stars"></span></button>
    <button data-level="medium"><span>Medium</span><span class="stars"></span></button>
    <button data-level="hard"><span>Hard</span><span class="stars"></span></button>
  </div>
  <p class="sub">Beat one to open the next.</p>
  <p><button class="back">Back</button></p>
</div></div>

<div id="paused" class="screen"><div class="card">
  <h2>Paused</h2>
  <p class="desk sub">Mouse works. Space is your thumb.</p>
  <p><button id="resume" class="main">Keep going</button></p>
  <p><button id="quit">Menu</button><button id="sound2" class="small">Sound: on</button></p>
</div></div>

<div id="end" class="screen">
  <div class="half top c1" id="half1"><h2 id="endT1">You win!</h2><p class="line" id="endL1"></p><button class="re" id="re1">Rematch</button></div>
  <div class="half bottom c0" id="half0"><h2 id="endT0">You win!</h2><p class="line" id="endL0"></p><button class="re" id="re0">Rematch</button><button id="endMenu" class="small">Menu</button></div>
</div>

<script type="module" src="./main.js"></script>
<script src="/notes/button.js" defer></script>
</body>
</html>
