name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Every game and every phone check, every night. The run on main after a merge checks neither (scripts/affected.mjs).
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
concurrency:
  # The nightly and by-hand runs get their own group, so a merge does not cancel them and they do not cancel a push run.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'every-game' || 'change' }}
  # A new commit on a pull request cancels that pull request's older run. A run on main is never cancelled:
  # Deploy starts only after a successful main run, so cancelling on every merge left nothing deployed when
  # merges arrived faster than a run finishes. A main run in progress finishes; of the runs waiting behind it
  # GitHub keeps only the newest, which is the one Deploy needs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  # One job for everything quick: which games changed, the root tests, the standalone Workers and the whole build.
  # These were four jobs. Each job waits for its own runner, and on a busy night that wait was most of a run:
  # 2 minutes of work took 20 minutes or more. Together they take about a minute and a half on one runner.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      games: ${{ steps.affected.outputs.games }}
      count: ${{ steps.affected.outputs.count }}
      total: ${{ steps.affected.outputs.total }}
      phone: ${{ steps.affected.outputs.phone }}
      phoneOnly: ${{ steps.affected.outputs.phoneOnly }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          run_install: false
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - id: affected
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then BASE=$(git hash-object -t tree /dev/null); fi
          node scripts/affected.mjs "$BASE"
      - name: Root tests
        run: npm test
      # The phone check's own code is otherwise only run when a phone check is picked: a syntax error fails here.
      - name: Phone check parses
        run: for f in experiments/kit/check/*.mjs; do node --check "$f"; done
      # Cinderhill's sim (experiments/cinderhill/test), only when Cinderhill changed. A pull request or merge skips the seven
      # tests over 15 s (the day 1 to 3 bot sweep alone took 114 s, 2026-11-26); nightly and by hand run all of them.
      - name: Cinderhill sim
        if: steps.affected.outputs.cinderhill == 'true'
        env:
          SKIP: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'careful bot wins days|replay reaches every hash|hash Node computes for the long run|page host runs a colony game|S4 pass line|long game rolls over|one order changed diverges' || '' }}
        run: node --test ${SKIP:+--test-skip-pattern="$SKIP"} experiments/cinderhill/test/
      - run: pnpm install --frozen-lockfile
      - name: Standalone Workers
        if: steps.affected.outputs.workers == 'true'
        run: |
          pnpm --filter games-wai-daily run check
          node --test workers/crumbwar/test/
          # Cinderhill hill room: protocol tests in Node, then a restart test in workerd (wrangler dev). About 30 s.
          node --test workers/cinderhill/test/
      - run: node scripts/build.mjs
      - name: Bundle the Worker and validate the exact upload without credentials
        env:
          CF_SEND_TELEMETRY: 'false'
        run: pnpm run deploy:check
  games:
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.changes.outputs.games) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          run_install: false
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        if: matrix.game == 'neighbours'
        with:
          python-version: '3.12.13'
      - run: python -m pip install -r games/neighbours/neighbours/native-gm-requirements.txt
        if: matrix.game == 'neighbours'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/prepare-game.mjs "$GAME"
        env:
          GAME: ${{ matrix.game }}
      - run: node scripts/check-game.mjs "$GAME"
        env:
          GAME: ${{ matrix.game }}
          NEIGHBOURS_PROOF_DIR: ${{ runner.temp }}/neighbours-proof
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && matrix.game == 'neighbours'
        with:
          name: neighbours-public-six-native
          path: ${{ runner.temp }}/neighbours-proof/
          retention-days: 7
  neighbours-browser:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.games), 'neighbours')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      NEIGHBOURS_NO_SCREENSHOTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          run_install: false
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.13'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/prepare-game.mjs neighbours
      - run: pnpm --filter alder-quay-neighbours exec playwright test --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: neighbours-browser-failure-${{ matrix.shard }}
          path: |
            games/neighbours/neighbours/playwright-report/
            games/neighbours/neighbours/test-results/
          retention-days: 7
  lefthand-browser:
    needs: changes
    if: contains(needs.changes.outputs.games, '"lefthand"')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            browser: chromium
            projects: --project=chromium-phone --project=chromium-desktop
          - os: macos-latest
            browser: webkit
            projects: --project=webkit-phone --project=webkit-desktop
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          run_install: false
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./games/lefthand build
      - run: pnpm --filter ./games/lefthand exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm --filter ./games/lefthand exec playwright test ${{ matrix.projects }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: lefthand-browser-failure-${{ matrix.os }}-${{ matrix.browser }}
          path: games/lefthand/test-results/
          retention-days: 3
  # The experiments' phone check (experiments/kit/check/phone.mjs) on Chromium and WebKit. It needs only `changes`,
  # so an experiment-only PR does not wait on game suites. Playwright is not a repository dependency: it is installed
  # at the exact version the check passes with locally into a temp directory that PLAYWRIGHT points at. The check
  # answers the lab endpoint itself and never sends to it.
  phone:
    needs: changes
    if: needs.changes.outputs.phone == 'true'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-24.04
    # Playwright's own image already holds the browsers and their system packages. Installing WebKit's packages
    # on a bare runner took almost 13 minutes of a 14 minute job; the check itself takes about one.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 30
    env:
      PLAYWRIGHT_VERSION: 1.64.1
      HOME: /root
      # A pull request runs each picked experiment's own check only; its help checks and extras run nightly.
      PHONE_QUICK: ${{ github.event_name == 'pull_request' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: npm install --prefix "$PLAYWRIGHT" --no-save --no-package-lock --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
        env:
          PLAYWRIGHT: ${{ runner.temp }}/playwright
      # Both browsers gate: WebKit passed on Linux on 2026-11-23 (13 of 13).
      # Only the experiments the change touched; all of them when shared code changed, nightly and by hand.
      - run: node experiments/kit/check/phone.mjs "$ONLY" "$BROWSER"
        env:
          ONLY: ${{ needs.changes.outputs.phoneOnly }}
          PLAYWRIGHT: ${{ runner.temp }}/playwright
          BROWSER: ${{ matrix.browser }}
  ci:
    if: always()
    needs: [changes, games, neighbours-browser, lefthand-browser, phone]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: |
          node scripts/aggregate.mjs
          node -e "if (process.env.NEIGHBOURS_BROWSER !== (process.env.NEIGHBOURS_AFFECTED === 'true' ? 'success' : 'skipped')) throw Error('Neighbours browser gate did not pass')"
        env:
          # The root tests, the Workers and the build are steps of the changes job.
          TOOLS: ${{ needs.changes.result }}
          CHANGES: ${{ needs.changes.result }}
          WORKERS: ${{ needs.changes.result }}
          GAMES: ${{ needs.games.result }}
          BUILD: ${{ needs.changes.result }}
          COUNT: ${{ needs.changes.outputs.count }}
          TOTAL: ${{ needs.changes.outputs.total }}
          NEIGHBOURS_AFFECTED: ${{ contains(fromJSON(needs.changes.outputs.games), 'neighbours') }}
          NEIGHBOURS_BROWSER: ${{ needs.neighbours-browser.result }}
          LEFTHAND_REQUIRED: ${{ contains(needs.changes.outputs.games, '"lefthand"') }}
          LEFTHAND_BROWSER: ${{ needs.lefthand-browser.result }}
          PHONE_REQUIRED: ${{ needs.changes.outputs.phone == 'true' }}
          PHONE_CHECK: ${{ needs.phone.result }}
