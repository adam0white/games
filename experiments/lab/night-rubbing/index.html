<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#183731"><link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css"><title>Carbon Cabinet</title></head>
<body>
<main id="cabinet">
  <header><div class="heading"><div class="eyebrow"><span class="mark" aria-hidden="true">≋</span> Fossil rubbings</div><h1>Carbon <i>Cabinet</i></h1></div>
    <button id="pause" aria-label="Pause rubbing"><span aria-hidden="true">Ⅱ</span></button></header>
  <div class="sheet-space"><div class="paper" id="paper">
    <div class="plate-label"><span id="figure"></span><span id="taxon"></span></div>
    <canvas id="field" width="240" height="280" tabindex="0" aria-label="Rub the paper back and forth to reveal the fossil. Arrow keys also rub the paper."></canvas>
    <div class="tool" id="tool" aria-hidden="true"><span>6B</span></div>
    <div class="paper-foot"><div class="rule" aria-hidden="true"></div><i id="medium"></i></div>
  </div></div>
  <div class="status-row"><div id="status" role="status">Taking an impression</div>
    <span id="percent"></span><div id="result" class="result"><button id="next">Next plate <b aria-hidden="true">→</b></button></div></div>
  <div class="meter" aria-hidden="true"><div id="fill"></div></div>
  <nav id="collection" aria-label="Specimen drawer"></nav>
</main>
<section id="paused" class="veil" role="dialog" aria-modal="true" aria-labelledby="pause-title"><div class="card">
  <div class="eyebrow">Carbon Cabinet</div><h2 id="pause-title">Rubbing paused</h2>
  <p>Sweep the side of the pencil across the raised fossil. Pale ridges still need charcoal.</p>
  <button class="primary" id="resume">Resume rubbing</button>
  <div class="pair"><button id="sound"></button><button id="ink"></button></div>
  <button id="restart">Start this plate again</button>
</div></section>
<script type="module" src="./main.js"></script><script src="/notes/button.js" defer></script>
</body></html>
