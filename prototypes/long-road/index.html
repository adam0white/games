<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#263e4a">
<title>The Long Road</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#192d38}body{display:grid;place-items:center}canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}canvas:focus-visible{outline:2px solid #f4ce83;outline-offset:-4px}
</style>
</head>
<body>
<canvas id="road" tabindex="0" aria-label="The Long Road. Guide five travellers and their cart through twelve stops before winter. Touch a traveller to choose a task, or press 1 through 5 to select a traveller. Press M to mend, S to scout, C to carry, W to watch, or F to forage. Press P to change pace, R to change rations, and the left or right arrow to choose a route at a stop. Press Escape to close the task menu. Press Enter or Space to restart after the journey."></canvas>
<script type="module" src="./view.mjs"></script>
</body>
</html>
