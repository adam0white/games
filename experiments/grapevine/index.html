<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#241a46" id="theme">
<title>Grapevine</title>
<style>
  html, body { margin: 0; height: 100%; background: #241a46; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { font: 17px/1.4 ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #fff4dc; }
  canvas#c { display: block; width: 100vw; height: 100dvh; touch-action: none; }
  .screen { position: fixed; inset: 0; display: none; place-items: center; text-align: center; pointer-events: none; }
  .screen.on { display: grid; }
  .screen > div { box-sizing: border-box; max-width: 22em; width: calc(100% - 24px); max-height: 100dvh; overflow-y: auto; touch-action: pan-y;
    padding: calc(12px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom)); pointer-events: auto; }
  .veil { background: #1a1233cc; }
  #menu.veil { background: linear-gradient(#1a1233ee, #1a123388 45%, #1a1233ee); }
  h1 { font-size: 2.7em; line-height: 1; margin: .1em 0 .1em; color: #ffd98a; letter-spacing: .02em; text-shadow: 0 3px 0 #7a3b5e, 0 0 24px #ff9a5a88; }
  h2 { font-size: 2em; line-height: 1.1; margin: 0 0 .25em; color: #ffd98a; text-shadow: 0 3px 0 #7a3b5e; }
  p { margin: .35em 0; }
  .sub { opacity: .85; margin-bottom: .6em; }
  button { font: inherit; font-weight: 600; color: #fff4dc; background: #ffffff14; border: 2px solid #ffd98a88; border-radius: 999px; padding: .45em 1.2em; margin: .25em; min-width: 8em; min-height: 46px; touch-action: manipulation; cursor: pointer; }
  button.main { background: #ffb347; color: #3a1a10; border-color: #ffb347; font-size: 1.25em; min-width: 9em; box-shadow: 0 4px 0 #b8642a; }
  button.main:active { transform: translateY(2px); box-shadow: 0 2px 0 #b8642a; }
  button:disabled { opacity: .4; }
  #grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: .5em 0; }
  #grid button { min-width: 0; min-height: 0; height: 46px; margin: 0; padding: 0; border-radius: 12px; font-size: 15px; line-height: 1; display: grid; place-items: center; border-width: 2px; }
  #grid button small { display: block; font-size: 9px; letter-spacing: -1px; color: #ffd24a; margin-top: 2px; height: 10px; }
  #grid button.locked { border-style: dashed; color: #fff4dc66; background: transparent; }
  #grid button.next { border-color: #ffb347; background: #ffb34733; box-shadow: 0 0 10px #ffb34788; }
  #daily small { color: #ffd24a; }
  .stars { font-size: 46px; line-height: 1; letter-spacing: 4px; margin: .1em 0 .2em; }
  .stars span { display: inline-block; color: #ffffff22; transform: scale(.4); transition: transform .35s cubic-bezier(.3,1.8,.5,1), color .2s; }
  .stars span.on { color: #ffd24a; text-shadow: 0 0 14px #ffb347; transform: scale(1); }
  .stars span.off { transform: scale(.85); }
  #strip { display: block; width: 100%; height: 104px; margin: .3em 0; }
  #pause { position: fixed; top: calc(8px + env(safe-area-inset-top)); right: calc(8px + env(safe-area-inset-right)); width: 46px; height: 46px; min-width: 0; min-height: 0; margin: 0; padding: 0;
    border: 2px solid #ffd98a66; border-radius: 50%; background: #1a1233e6; display: none; place-items: center; touch-action: none; }
  #pause::before { content: ''; width: 4px; height: 16px; border: solid #ffd98a; border-width: 0 5px; }
  #hint { position: fixed; left: calc(60px + env(safe-area-inset-left)); top: calc(9px + env(safe-area-inset-top)); display: none; width: 46px; height: 46px; min-width: 0; min-height: 0; margin: 0; padding: 0;
    font-size: 24px; line-height: 1; background: #ffd24a; border: 2px solid #2b1830; border-radius: 50%; box-shadow: 0 3px 0 #b8862a; animation: nudge 1.2s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: scale(1.08); } }
  .lab-notice { max-width: 26em; margin-left: auto !important; margin-right: auto !important; }
  @media (prefers-reduced-motion: reduce) { #hint { animation: none; } }
  #tabs { display: flex; gap: 6px; margin: .4em 0 0; }
  #tabs button { flex: 1; min-width: 0; min-height: 46px; margin: 0; padding: .2em .3em; border-radius: 14px; font-size: 15px; line-height: 1.15; }
  #tabs button small { display: block; font-size: 11px; font-weight: 600; color: #ffd24a; }
  #tabs button.on { background: #ffb34733; border-color: #ffb347; }
  #tabs button.locked { border-style: dashed; color: #fff4dc66; }
  #grid.five { grid-template-columns: repeat(5, 1fr); }
  #payoff { display: none; font-weight: 700; color: #ffd98a; }
  #share { min-width: 9em; }
  @media (max-height: 600px) { h1 { font-size: 2.1em; } #grid button { height: 40px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="pause" aria-label="Pause"></button>
<button id="hint" aria-label="Hint">💡</button>
<div id="menu" class="screen veil on"><div>
  <h1>Grapevine</h1>
  <p class="sub">Pass the news along. Everyone changes it a little.</p>
  <p><button id="play" class="main">Play</button></p>
  <p><button id="daily">Daily village <small></small></button></p>
  <div id="tabs"></div>
  <div id="grid"></div>
  <p><button id="sound">Sound: on</button></p>
</div></div>
<div id="paused" class="screen veil"><div>
  <h2>Paused</h2>
  <p><button id="resume" class="main">Resume</button></p>
  <p><button id="restart">Start over</button><button id="toMenu">Menu</button></p>
  <p><button id="sound2">Sound: on</button></p>
</div></div>
<div id="done" class="screen veil"><div>
  <h2 id="doneTitle">Heard it!</h2>
  <div class="stars" id="stars"><span>★</span><span>★</span><span>★</span></div>
  <p id="doneLine"></p>
  <p id="payoff"></p>
  <canvas id="strip" aria-label="What they heard"></canvas>
  <p><button id="share">Share this</button></p>
  <p><button id="next" class="main">Next</button></p>
  <p><button id="again">Again</button><button id="doneMenu">Menu</button></p>
</div></div>
<script type="module">
import { LEVELS, CHAPTERS } from './levels.js';
import { walk, refuse, solve, hint as hintRoute, stars as starsFor, same, daily, dailySeed, ONEWAY, isGate, gateOpen, lane, tierFor, fromKey, SHAPES, COLOURS } from './sim.js';
import { token, villager, badge, bubble, hand, backdrop, lanterns, barrier, look, emblem, WIDE, BOARD_HALF, COLOUR, INK, CREAM, roundRect } from './art.js';
import { readJson, writeJson } from '../kit/save.js';
import { sound } from '../kit/audio.js';
import { onLeave, isPauseKey } from '../kit/pause.js';
import { screens } from '../kit/screens.js';
import { lab } from '../kit/lab.js';
import { hint as firstHint } from '../kit/hint.js';

const $ = id => document.getElementById(id);
const query = new URLSearchParams(location.search);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------------------------------------------------------------- save (one JSON blob)
const KEY = 'grapevine-save';
// Fields added later (dailyHops: fewest hops per date, dailyTier: which daily village a date showed, bestStreak) default
// here, so an old save loads as it was.
const save = { v: 1, sound: true, best: {}, opened: 1, daily: {}, dailyHops: {}, dailyTier: {}, bestStreak: 0, ...readJson(KEY, {}) };
const store = () => writeJson(KEY, save);
const dateKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = () => dateKey(new Date());
// Days in a row with a solved daily village, ending today (or yesterday, while today is still open).
function streak() {
  const d = new Date(); let n = 0;
  if (!save.daily[dateKey(d)]) d.setDate(d.getDate() - 1);
  while (save.daily[dateKey(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
const urlLevel = Math.floor(Number(query.get('level')));
const urlSeed = query.has('seed') ? Number(query.get('seed')) >>> 0 : null;
const urlTier = query.has('tier') ? Math.max(0, Math.min(3, Math.floor(Number(query.get('tier'))) || 0)) : null;

// ---------------------------------------------------------------- chapters
// Each chapter is a time of year in the same village (art.js LOOKS). The daily village wears the look of the newest
// villager it uses.
const CHAPTER_NAMES = ['Evening', 'Winter', 'Autumn'];
const chapterOf = i => Math.max(1, CHAPTERS.findIndex(([a, b]) => i + 1 >= a && i + 1 <= b) + 1); // of a 0-based level
const DAILY_LOOK = [1, 2, 2, 3]; // by daily tier
// What a chapter's first levels bring in: drawn with a pulsing ring until the player touches the board.
const INTRO = { 31: 'lane', 36: 'bell', 46: 'keeper' };

// ---------------------------------------------------------------- sound
const snd = sound({ on: () => save.sound });
const tone = (f, d, v, type = 'triangle', slide = 0) => { if (snd.ctx) snd.tone(f, d, v, type, slide); };
const SCALE = [392, 440, 523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5, 1567.98, 1760, 2093, 2349.3, 2637];
const voice = kind => { // each kind of villager says something as they pass it on
  if (!snd.ctx) return;
  if (kind === 'more') tone(330, 0.22, 0.05, 'square', 330);
  else if (kind === 'less') tone(140, 0.25, 0.06, 'sawtooth', -50);
  else if (kind === 'parrot') { tone(1400, 0.07, 0.05, 'square', 500); setTimeout(() => tone(1500, 0.07, 0.05, 'square', 500), 80); }
  else if (kind === 'paint') snd.noise(0.12, 0.12, 2500);
  else if (kind === 'swap') tone(500, 0.2, 0.05, 'sine', -250);
  else if (kind === 'carve') snd.noise(0.05, 0.2, 4000);
  else if (kind === 'flip') tone(600, 0.15, 0.05, 'square', -300);
  else if (kind === 'bell') { tone(1318.5, 0.6, 0.05, 'sine'); setTimeout(() => tone(1046.5, 0.7, 0.05, 'sine'), 180); }
  else if (kind === 'keeper') { tone(260, 0.12, 0.05, 'triangle', 120); setTimeout(() => tone(390, 0.14, 0.05, 'triangle', -120), 110); }
};

// ---------------------------------------------------------------- lab recording
const rec = lab('grapevine');
rec.notice($('menu').firstElementChild);
rec.toggle($('paused').firstElementChild);

// ---------------------------------------------------------------- canvas and layout
const canvas = $('c'), g = canvas.getContext('2d');
let W = 0, H = 0, dpr = 1, safe = { t: 0, b: 0, l: 0, r: 0 };
const probe = document.createElement('div');
probe.style.cssText = 'position:fixed;top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);left:env(safe-area-inset-left);right:env(safe-area-inset-right);pointer-events:none;visibility:hidden';
document.body.append(probe);
let back = null, chapter = 1; // the village backdrop, drawn once per size and chapter
function resize() {
  dpr = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  const cs = getComputedStyle(probe);
  safe = { t: parseFloat(cs.top) || 0, b: parseFloat(cs.bottom) || 0, l: parseFloat(cs.left) || 0, r: parseFloat(cs.right) || 0 };
  paintBack();
  layout();
}
function paintBack() {
  if (!W) return;
  back = document.createElement('canvas'); back.width = canvas.width; back.height = canvas.height;
  const bg = back.getContext('2d'); bg.scale(dpr, dpr); backdrop(bg, W, H, safe.t + 60, chapter);
  const theme = look(chapter).theme;
  $('theme').content = theme; document.documentElement.style.background = document.body.style.background = theme;
}
function setChapter(c) { if (c !== chapter) { chapter = c; paintBack(); } }
addEventListener('resize', resize);

// The board: villagers' screen positions from the level's 0..1 coordinates.
let level = null, pos = [], R = 24;
function layout() {
  if (!level) return;
  let left = safe.l + 18, right = W - safe.r - 18;
  if (W >= WIDE) { left = Math.max(left, W / 2 - BOARD_HALF); right = Math.min(right, W / 2 + BOARD_HALF); } // phone-wide board, street on the sides
  const top = safe.t + 150, bottom = H - safe.b - 58;
  const rows = new Set(level.nodes.map(n => Math.round(n.y * 8))).size;
  const rowGap = (bottom - top) / Math.max(1, rows - 1), colGap = (right - left) / 3;
  R = Math.max(15, Math.min(30, colGap * 0.22, rowGap * 0.25));
  pos = level.nodes.map(n => ({ x: left + n.x * (right - left), y: top + n.y * (bottom - top) }));
  ghostAt = pos.map((p, v) => ghostSpot(v));
}
// Where a villager's "after me" token sits: of four spots beside the head, the one furthest from paths,
// other villagers, their badges and the screen edge. Ties keep the first spot (up and to the right).
let ghostAt = [];
function ghostSpot(v) {
  const p = pos[v];
  const spots = [[1.3, -1.15], [-1.3, -1.15], [1.55, 0.15], [-1.55, 0.15]].map(([a, b]) => ({ x: p.x + a * R, y: p.y + b * R }));
  const segDist = (q, A, B) => {
    const dx = B.x - A.x, dy = B.y - A.y, k = Math.max(0, Math.min(1, ((q.x - A.x) * dx + (q.y - A.y) * dy) / (dx * dx + dy * dy || 1)));
    return Math.hypot(q.x - A.x - k * dx, q.y - A.y - k * dy);
  };
  let best = spots[0], bestScore = -Infinity;
  spots.forEach((q, i) => {
    let d = Math.min(q.x - safe.l, W - safe.r - q.x, q.y - safe.t - 90) + R * 0.5;
    d = Math.min(d, Math.hypot(q.x - p.x, q.y - p.y) - R); // clear of the villager's own head
    for (const [a, b] of level.edges) d = Math.min(d, segDist(q, pos[a], pos[b]));
    pos.forEach((o, u) => {
      if (u === v) return;
      d = Math.min(d, Math.hypot(q.x - o.x, q.y - o.y) - R, Math.hypot(q.x - o.x, q.y - o.y - R * 1.42) - R * 0.9);
    });
    const score = d - i * R * 0.05;
    if (score > bestScore) { bestScore = score; best = q; }
  });
  return { x: best.x - p.x, y: best.y - p.y };
}

// ---------------------------------------------------------------- game state
const DT = 1 / 60, HOP = 18; // ticks per hop of the message
let screen = 'menu', paused = false, t = 0, acc = 0, last = performance.now();
let mode = 'level', index = 0, dailyKey = null; // index: 0-based level
let route = [], trail = null, sends = 0, fails = 0, hints = 0, hintAt = 0, touched = false, startT = 0;
let sending = null, result = null, wrong = null, lastStars = 0;
let react = [], refuseT = [], happyT = 0, puzzledT = 0, particles = [], shake = 0, ripples = [], grow = 0, gone = [];
let endTimer = -1, stripT = 0, sentRoute = null;
let keepers = [], gateT = [], laneFlash = null, introT = 0, bannerT = 0, payoff = 0, tier = 0;
const next = () => Math.min(LEVELS.length, Math.max(1, save.opened));
// The bell parity and the keepers' news right now: after the villager the message is leaving, while it travels.
const nowPhase = () => sending ? sending.phases[sending.i] : trail.state.phase;
const nowMemo = () => sending ? sending.memos[sending.i] : trail.state.memo;
// The daily village a date shows depends on how far the player has come, so it is pinned the first time it opens.
// A date already played before tiers existed stays on the first tier.
function dailyTier(key) {
  if (urlTier !== null) return urlTier;
  if (save.dailyTier[key] === undefined) { save.dailyTier[key] = save.daily[key] ? 0 : tierFor(save.opened); store(); }
  return save.dailyTier[key];
}

function begin(i, how = 'level') {
  snd.unlock();
  mode = how;
  if (how === 'daily') {
    dailyKey = today();
    const d = new Date(), seed = urlSeed ?? dailySeed(d.getFullYear(), d.getMonth() + 1, d.getDate());
    tier = dailyTier(dailyKey);
    const lv = daily(seed, LEVELS[20], tier);
    level = { ...lv, name: 'Daily village' };
    setChapter(DAILY_LOOK[lv.tier ?? tier] ?? 1);
  } else { index = i; level = LEVELS[i]; setChapter(chapterOf(i)); }
  keepers = level.nodes.map((n, v) => (n.kind === 'keeper' ? v : -1)).filter(v => v >= 0);
  gateT = level.edges.map(([, , type]) => (isGate(type) && gateOpen(type, 0) ? 1 : 0));
  laneFlash = null; payoff = 0;
  introT = mode === 'level' && INTRO[i + 1] ? 1 : 0;
  bannerT = mode === 'level' && CHAPTERS.some(([a]) => a === i + 1) && i > 0 ? 1 : 0;
  route = [level.from]; trail = walk(level, route);
  sends = 0; fails = 0; hints = 0; hintAt = 0; touched = false; startT = t;
  sending = null; result = null; wrong = null; endTimer = -1; sentRoute = null;
  react = level.nodes.map(() => 0); refuseT = level.nodes.map(() => 0); gone = level.nodes.map(() => 0);
  happyT = 0; puzzledT = 0; particles = []; ripples = []; grow = 1;
  $('hint').style.display = 'none';
  layout(); paused = false; snd.release(); show('play');
  rec.start({ level: how === 'daily' ? `daily-${dailyKey}` : i + 1 });
}

// ---------------------------------------------------------------- route editing (shared by tap and drag)
function setRoute(r) { route = r; trail = walk(level, route); if (result === 'wrong') result = null; }
function extend(v) {
  const why = refuse(level, trail.state, v);
  if (why) { refused(v, why); return false; }
  setRoute([...route, v]); grow = 0;
  const node = level.nodes[v];
  tone(SCALE[Math.min(SCALE.length - 1, route.length - 2)], 0.14, 0.07, 'triangle');
  react[v] = Math.max(react[v], 0.5);
  if (node.once) gone[v] = 0;
  return true;
}
function backtrack() {
  if (route.length < 2) return;
  setRoute(route.slice(0, -1)); grow = 1;
  tone(SCALE[Math.max(0, route.length - 2)] / 2, 0.1, 0.05, 'sine');
}
let lastRefused = -1;
function refused(v, why) {
  if (lastRefused === v) return;
  lastRefused = v;
  if (why === 'far' || why === 'done' || why === 'long' || why === 'teller') {
    // not next to the end of the route: point at where the route can go on
    refuseT[route[route.length - 1]] = 1;
    tone(220, 0.08, 0.05, 'sine');
  } else if (why === 'oneway' || why === 'shut') {
    // a lane that runs the other way, or a shut gate: the path itself flashes
    laneFlash = { a: route[route.length - 1], b: v, t: 1, why };
    tone(why === 'shut' ? 180 : 200, 0.14, 0.06, 'square', -30);
    if (!reduced) shake = Math.max(shake, 2);
  } else {
    refuseT[v] = 1; // a timid villager refusing red news, a sleepy one who went home, a U-turn
    tone(150, 0.16, 0.07, 'square', -40);
    if (!reduced) shake = Math.max(shake, 3);
  }
}

// ---------------------------------------------------------------- input: one finger, drag or tap
let finger = null; // { id, x, y, reached }
const nodeAt = (x, y, reach) => {
  let best = -1, bd = Infinity;
  pos.forEach((p, i) => { const d = Math.hypot(p.x - x, p.y - y); if (d < reach && d < bd) { bd = d; best = i; } });
  return best;
};
function enter(v) {
  if (v < 0) return;
  const end = route[route.length - 1];
  if (v === end) return;
  if (route.length >= 2 && v === route[route.length - 2]) { backtrack(); lastRefused = -1; return; }
  if (extend(v)) { lastRefused = -1; if (v === level.to && finger) finger.reached = true; }
}
canvas.addEventListener('pointerdown', e => {
  if (screen !== 'play' || paused) return;
  e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch {}
  const x = e.clientX, y = e.clientY;
  ripples.push({ x, y, t: 0 });
  touched = true;
  finger = { id: e.pointerId, x, y, reached: false };
  if (sending || result === 'won') return;
  lastRefused = -1;
  const v = nodeAt(x, y, R * 1.6);
  if (v < 0) { tone(660, 0.04, 0.03, 'sine'); return; }
  if (v === level.from) { if (route.length > 1) tone(300, 0.1, 0.05, 'sine'); setRoute([level.from]); react[v] = 0.6; return; }
  const at = route.lastIndexOf(v);
  // A villager already on the route: if the route can go on to them (a loop back), it does; otherwise the route is cut there.
  if (at >= 0 && at < route.length - 1 && !refuse(level, trail.state, v)) { enter(v); return; }
  if (at >= 0 && at < route.length - 1) { setRoute(route.slice(0, at + 1)); tone(SCALE[Math.max(0, at - 1)] / 2, 0.1, 0.05, 'sine'); return; }
  if (at === route.length - 1) { react[v] = 0.4; tone(SCALE[Math.min(SCALE.length - 1, at)], 0.06, 0.04); return; }
  enter(v);
});
canvas.addEventListener('pointermove', e => {
  if (!finger || e.pointerId !== finger.id || screen !== 'play' || paused || sending || result === 'won') return;
  // sample the finger's path so a quick drag cannot skip over a villager
  const x = e.clientX, y = e.clientY, steps = Math.max(1, Math.ceil(Math.hypot(x - finger.x, y - finger.y) / 6));
  for (let i = 1; i <= steps; i++) {
    const px = finger.x + (x - finger.x) * i / steps, py = finger.y + (y - finger.y) * i / steps;
    const v = nodeAt(px, py, R * 1.05);
    if (v >= 0) enter(v); else lastRefused = -1;
  }
  finger.x = x; finger.y = y;
});
const lift = e => {
  if (!finger || e.pointerId !== finger.id) return;
  const reached = finger.reached; finger = null;
  if (screen === 'play' && !paused && !sending && reached && route[route.length - 1] === level.to) send();
};
canvas.addEventListener('pointerup', lift);
canvas.addEventListener('pointercancel', e => { finger = null; });

// ---------------------------------------------------------------- sending the message
function send() {
  sends++;
  sentRoute = [...route];
  sending = { route: sentRoute, msgs: trail.msgs, changes: trail.changes, phases: trail.phases, memos: trail.memos, i: 0, p: 0, ok: trail.correct, shown: trail.msgs[0], squash: 0 };
  wrong = null; puzzledT = 0;
  rec.event('send', { route: sentRoute, ok: trail.correct });
  tone(SCALE[0], 0.2, 0.08, 'triangle');
}
function arrive(s) {
  const v = s.route[s.i], node = level.nodes[v], p = pos[v];
  s.shown = s.msgs[s.i]; s.squash = 1;
  react[v] = 1;
  if (v !== level.to) {
    tone(SCALE[Math.min(SCALE.length - 1, s.i + 1)], 0.3, 0.08, 'triangle');
    voice(node.kind === 'parrot' ? kindOfChange(s.changes[s.i]) || 'parrot' : node.kind);

    g.beginPath(); g.moveTo(pos[tutorialRoute[0]].x, pos[tutorialRoute[0]].y);

    const side = x > W * 0.62 ? -1 : 1;

}
function menuScene(time) {

  const base = H - safe.b - Math.min(room / 2, r * 2.4);
  const at = i => ({ x: W * (0.12 + 0.76 * i / (kinds.length - 1)), y: base + (i % 2 ? -r * 0.6 : r * 0.4) });
  kinds.forEach((k, i) => {

// ---------------------------------------------------------------- the end card and its comic strip
const strip = $('strip'), sg = strip.getContext('2d');

const NUM = ['one', 'two', 'three'];

// What each villager says as they pass the news on, from what they did to it.
function says(k, msgs, changes) {

  if (v === level.to) return 'Heard it!';
  if (node.kind === 'bell') return 'Ding dong!';

// Cells for a route of n villagers in w px: one row, or two when one row would squash them.
function stripCells(n, w) {

}
const ROW_H = 100;
function showEnd() {

  }

  $('next').disabled = mode === 'daily' || last;

    + `${words(run.msgs[0])[0].toUpperCase()}${words(run.msgs[0]).slice(1)} became ${words(run.msgs[run.msgs.length - 1])} in ${hops} hops.`;

// "What they heard": each villager on the route, saying the news as they passed it on, in a speech bubble.
function stripScene(ctx, w, shown, time, top = 0) {
  const { msgs, changes } = walk(level, sentRoute);
  const n = sentRoute.length, { cell, per } = stripCells(n, w);
  const r = Math.min(14, cell * 0.2);
  for (let k = 0; k < shown; k++) {
    const row = Math.floor(k / per), col = k % per, inRow = Math.min(per, n - row * per);
    const x = (w - cell * inRow) / 2 + cell * (col + 0.5), y0 = top + row * ROW_H;
    const age = Math.min(1, (time * 60 - k * 9) / 9), pop = 1 + 0.3 * Math.sin(Math.max(0, age) * Math.PI);
    if (age <= 0) continue;
    const v = sentRoute[k], end = k === n - 1;
    ctx.save(); ctx.globalAlpha = age;
    ctx.beginPath(); roundRect(ctx, x - cell / 2 + 2, y0 + 2, cell - 4, ROW_H - 4, 10); ctx.fillStyle = end ? 'rgba(255,210,74,.22)' : 'rgba(255,244,220,.08)'; ctx.fill();
    const vy = y0 + ROW_H - r * 2.6;
    villager(ctx, level.nodes[v], x, vy, r, { t: time, react: age < 1 ? 1 - age : 0, happy: end ? 0.7 : 0, look: col % 2 ? -0.6 : 0.6 });
    // the speech bubble, tail down to the mouth
    const bw = Math.min(cell - 8, r * 3.2), bh = r * 2.3, by = y0 + 6 + bh / 2;
    bubble(ctx, x, by, bw, bh, x + (col % 2 ? -r * 0.4 : r * 0.4), vy - r * 0.9);
    token(ctx, msgs[k], x, by, r * 0.95 * pop, { sx: pop, sy: 2 - pop, plate: false });
    ctx.font = `700 ${cell < 62 ? 9.5 : 10.5}px ui-rounded, system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = end ? '#ffd98a' : 'rgba(255,244,220,.9)';

function drawStrip() {

// ---------------------------------------------------------------- menu, pause and cards
const cards = screens(['menu', 'paused', 'done']);

let tab = 0; // the chapter (0-based) whose levels the menu shows
function menu() {
  level = null; finger = null;
  const n = Number.isFinite(urlLevel) && urlLevel >= 1 ? Math.min(LEVELS.length, urlLevel) : next();
  $('play').textContent = save.opened > LEVELS.length && !urlLevel ? 'Play again' : `Play ${n}`;
  $('play').dataset.level = n;
  const ds = save.daily[today()] || 0, run = streak();
  $('daily').querySelector('small').textContent = (ds ? '★'.repeat(ds) + '☆'.repeat(3 - ds) : 'new') + (run > 1 ? ` · ${run} days` : '');

const openTo = i => i + 1 <= save.opened || i + 1 === urlLevel; // can the player start 0-based level i?
const nope = b => { tone(150, 0.1, 0.05, 'square'); b.animate?.([{ transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'none' }], 200); };
function levelGrid() {

  const tabs = $('tabs'); tabs.textContent = '';

    const btn = document.createElement('button'), open = openTo(a - 1);

    btn.setAttribute('aria-pressed', c === tab ? 'true' : 'false');

const soundLabel = () => { $('sound').textContent = $('sound2').textContent = `Sound: ${save.sound ? 'on' : 'off'}`; };
const toggleSound = () => { save.sound = !save.sound; store(); soundLabel(); if (save.sound) { snd.unlock(); snd.release(); tone(660, 0.1, 0.06); } else snd.hold(); };

}

}

addEventListener('keydown', e => {

// A first-time player who does not touch for 3 s in play sees a finger drag through a row of dots (experiments/kit/hint.js).
// While it shows, the level's own ghost hand waits. The kit centres the copy across the screen; hintBottom picks the
// height where it covers least of the board: villagers with their hats and badges, the teller's news, the listener's
// bubble and the top bar.
function hintBottom() {
  const fallback = Math.round((innerHeight + 24) / 4);
  if (!level || !pos.length) return fallback;
  const boxes = pos.map(p => [p.x - R * 1.2, p.y - R * 1.7, p.x + R * 1.2, p.y + R * 1.9]); // hat to badge
  const tp = pos[level.from], o = ghostAt[level.from] ?? { x: R * 1.3, y: -R * 1.15 };
  boxes.push([tp.x + o.x - R * 0.9, tp.y + o.y - R * 0.9, tp.x + o.x + R * 0.9, tp.y + o.y + R * 0.9]);

  // above for reduced motion.
  const copy = y => reduced ? [[W / 2 - 84, y - 52, W / 2 + 84, y + 70], [W / 2 - 128, y - 66, W / 2 + 128, y - 34]] : [[W / 2 - 82, y - 50, W / 2 + 84, y + 68]];
  // Overlap area, in px squared, with a villager counted four times as much as with the rest: on a crowded board there

  const area = (A, B) => Math.max(0, Math.min(A[2], B[2]) - Math.max(A[0], B[0])) * Math.max(0, Math.min(A[3], B[3]) - Math.max(A[1], B[1]));

    const score = -cover - Math.abs(y - base) * 0.5;
