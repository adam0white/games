<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<title>Lab experiments</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #0b0d14; color: #efe8da; font: 17px/1.5 Georgia, 'Times New Roman', serif; }
  main { max-width: 34em; margin: 0 auto; padding: 1.4em 1em 3em; }
  h1 { font-weight: normal; letter-spacing: .08em; color: #ffd9a0; margin: 0 0 .2em; }
  h2 { font-weight: normal; letter-spacing: .06em; color: #ffd9a0; font-size: 1.05em; margin: 2em 0 .2em; opacity: .9; }
  p { opacity: .85; margin: .4em 0; }
  a.card { display: block; margin: 1em 0; padding: .9em 1em; border: 1.5px solid #ffd9a055; border-radius: 14px; color: inherit; text-decoration: none; background: #ffffff0a; }
  a.card:focus-visible, a.card:hover { border-color: #ffd9a0aa; }
  a.card b { display: block; font-weight: normal; font-size: 1.25em; color: #ffd9a0; }
  a.card small { opacity: .7; }
  a.card.top { border-color: #ffd9a0aa; }
</style>
</head>
<body>
<main>
  <h1>Lab experiments</h1>
  <p>Every game we are working on. Archived games are not listed.</p>
  <h2>Main games</h2>
  <div id="main"></div>
  <h2>More</h2>
  <a class="card top" id="small"><b>Small games</b><span>Twelve short games, three picked for tonight.</span></a>
  <a class="card top" id="experiments"><b>Experiments</b><span id="experimentsLine"></span></a>
  <a class="card top" id="story"><b>Story games</b><span>The Two Voices, The Stairwell and the rest, listed on the Human Framework site.</span></a>
</main>
<script type="module">
// The lab page: the main games as direct links, then one card each for the small games (/small/), the other
// experiments (/experiments/) and the story games (the public list on the Human Framework site, which reads the
// listed games in human-framework apps/site/src/games.ts). The lists are in experiments/experiments/catalog.js.
import { MAIN, EXPERIMENTS, TRIALS, SMALL_HOME, EXPERIMENTS_HOME, STORY_HOME } from '../experiments/catalog.js';
const box = document.getElementById('main');
for (const [href, title, line] of MAIN) {
  const a = document.createElement('a'); a.className = 'card'; a.href = href;
  const b = document.createElement('b'); b.textContent = title;
  const s = document.createElement('span'); s.textContent = line;
  a.append(b, s); box.append(a);
}
document.getElementById('small').href = SMALL_HOME;
document.getElementById('experiments').href = EXPERIMENTS_HOME;
document.getElementById('story').href = STORY_HOME;
document.getElementById('experimentsLine').textContent = `${EXPERIMENTS.length} games on their own and ${TRIALS.length} trials for the main games, each waiting for a play and a decision.`;
</script>
</body>
</html>
