<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2f5a2a">
<title>Ant Promotion: Living Animals</title>
<style>
  html, body { margin: 0; height: 100%; background: #24451f; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { font: 16px/1.4 ui-rounded, 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif; color: #fff8e6; }
  canvas#c { display: block; position: fixed; inset: 0; width: 100vw; height: 100dvh; }
  .screen { position: fixed; inset: 0; display: none; place-items: center; text-align: center; background: #14280fd9; overflow-y: auto; touch-action: pan-y;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; }
  .screen.on { display: grid; }
  .screen > div { max-width: 24em; width: calc(100% - 1.6em); padding: .8em; box-sizing: border-box; }
  #menu { background: radial-gradient(ellipse at 50% 40%, #3f7a34e6, #14280ff2); }
  h1 { font-size: 2.2em; line-height: 1.1; margin: 0 0 .2em; color: #ffe08a; text-shadow: 0 3px 0 #5a3a0c; }
  h1 small { display: block; font-size: .62em; color: #fff8e6; text-shadow: 0 2px 0 #2a4a20; }
  h2 { font-size: 1.5em; margin: 0 0 .3em; color: #ffe08a; }
  p { margin: .4em 0; }
  button { font: inherit; color: #fff8e6; background: #ffffff1c; border: 2px solid #ffe08a99; border-radius: 16px; padding: .55em 1.1em; margin: .3em; min-height: 48px; min-width: 9em; touch-action: manipulation; cursor: pointer; }
  button.main { background: #ffb42a; color: #33200a; border-color: #ffb42a; font-size: 1.3em; font-weight: bold; min-width: 10em; min-height: 60px; }
  button.small { min-width: 0; }
  button:active { transform: scale(.97); }
  .opts { display: flex; gap: 8px; justify-content: center; }
  .opt { flex: 1 1 0; min-width: 0; margin: 0; padding: .5em .2em; display: flex; flex-direction: column; align-items: center; line-height: 1.25; }
  .opt canvas { width: 84px; height: 84px; }
  .opt b { font-size: 1.05em; color: #ffe08a; }
  .opt small { font-size: 14px; opacity: .92; }
  .line { font-size: 15px; opacity: .92; }
  #hero { width: 220px; height: 130px; display: block; margin: .2em auto .4em; }
  #hud { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: calc(10px + env(safe-area-inset-left)); right: calc(70px + env(safe-area-inset-right)); display: none; pointer-events: none; text-shadow: 0 1px 4px #000; }
  #bar { height: 16px; border-radius: 9px; background: #00000066; border: 2px solid #fff8e6aa; overflow: hidden; }
  #fill { height: 100%; width: 0; background: linear-gradient(#ffe23a, #ffb42a); transition: width .15s; }
  #who { font-size: 17px; font-weight: bold; margin-top: 3px; }
  #lives { color: #ff7a6a; letter-spacing: 2px; }
  #pause { position: fixed; top: calc(6px + env(safe-area-inset-top)); right: calc(8px + env(safe-area-inset-right)); width: 52px; height: 52px; min-width: 0; min-height: 0; margin: 0; padding: 0; border-radius: 50%; display: none; font-weight: bold; background: #0006; }
  #say { position: fixed; left: 0; right: 0; top: 22%; text-align: center; font-size: 22px; font-weight: bold; pointer-events: none; opacity: 0; transition: opacity .3s; text-shadow: 0 2px 6px #000; padding: 0 1em; }
  #say.on { opacity: 1; }
  #zoo { position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden; touch-action: pan-y; display: none; -webkit-overflow-scrolling: touch; }
  #zooBar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 6px; padding: calc(6px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) 6px calc(8px + env(safe-area-inset-left)); background: #14280fe6; box-shadow: 0 2px 8px #0006; }
  #zooBar b { flex: 1; text-align: center; font-size: 18px; color: #ffe08a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #zooBar button { margin: 0; min-width: 0; padding: .4em .8em; }
  #pens { position: relative; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div id="bar"><div id="fill"></div></div><div id="who"></div></div>
<button id="pause" aria-label="Pause">II</button>
<div id="say"></div>

<div id="zoo"><div id="zooBar"><button id="zooBack">Back</button><b>Zoo</b><button id="zooSize"></button></div><div id="pens"></div></div>

<div id="menu" class="screen on"><div>
  <h1><small>Ant Promotion</small>Living Animals</h1>
  <canvas id="hero" width="440" height="260"></canvas>
  <p><button id="play" class="main">Play</button></p>
  <p class="line" id="menuLine"></p>
  <p><button id="toZoo">Zoo</button><button id="sound" class="small"></button></p>
</div></div>

<div id="evolve" class="screen"><div>
  <h2>Promotion!</h2>
  <p id="evolveSay"></p>
  <div class="opts" id="opts"></div>
</div></div>

<div id="dead" class="screen"><div>
  <h2 id="deadSay"></h2>
  <p id="deadMore"></p>
  <p><button id="goOn" class="main"></button></p>
  <p><button class="toMenu small">Menu</button></p>
</div></div>

<div id="over" class="screen"><div>
  <h2>Run over</h2>
  <p id="overSay"></p>
  <p id="overBest"></p>
  <p><button id="again" class="main">Play again</button></p>
  <p><button class="toMenu small">Menu</button></p>
</div></div>

<div id="paused" class="screen"><div>
  <h2>Paused</h2>
  <p><button id="resume" class="main">Keep playing</button></p>
  <p><button class="toMenu">Menu</button></p>
</div></div>

<div id="win" class="screen"><div>
  <h2>Top of the food chain!</h2>
  <p id="winSay"></p>
  <p><button id="winNew" class="main">Play again</button></p>
  <p><button class="toMenu small">Menu</button></p>
</div></div>

<script type="module">
import { FORMS, ANT, WORLD, TOP, sightOf, create, step, choose, revive, me, level, needFor, article, SPAWN_WEIGHTS, powerOf, paceAgainst, catchable } from './sim.js';
import { update, poke } from './rig.js';
import { creature, speciesFor, drawCreature } from './creature.js';
import { readJson, writeJson } from '../../kit/save.js';
import { sound } from '../../kit/audio.js';
import { onLeave, isPauseKey } from '../../kit/pause.js';
import { noZoom } from '../../kit/zoom.js';
import { screens } from '../../kit/screens.js';
import { stick } from '../../kit/stick.js';
import { hint } from '../../kit/hint.js';

noZoom();
const $ = id => document.getElementById(id), cv = $('c'), g = cv.getContext('2d');
const KEY = 'ant-creatures:v1', query = new URLSearchParams(location.search), DT = 1 / 60, LIVES = 3;
const played = readJson(KEY) !== null;
const save = Object.assign({ sound: true, best: 0, big: true, day: '', dayBest: 0 }, readJson(KEY, {}));
const store = () => writeJson(KEY, save);
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const daySeed = day => { let h = 2166136261; for (const ch of day) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return (h >>> 0) % 1e9 || 1; }; // today's meadow: everyone gets the same one
const FONT = size => `bold ${size}px ui-rounded, 'Arial Rounded MT Bold', system-ui, sans-serif`;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

let s = null, mode = 'menu', W = 0, H = 0, dpr = 1, zoom = 1, last = 0, acc = 0, shake = 0, sayTimer = 0, flash = 0, dying = 0, lives = LIVES, top = 1, runStart = 0;
const floats = [], bits = [], keys = new Set(), rigs = new Map(); let me_ = null; // me_: the player's rig

// ---------- sound: every action has one
const snd = sound({ on: () => save.sound, floor: 0.001 });
const blip = (freq, dur = 0.08, type = 'sine', vol = 0.12, slide = 0) => snd.tone(freq, dur, vol, type, slide);
const crunch = (dur, vol, hz) => snd.noise(dur, vol, hz);
const tap = () => { snd.unlock(); blip(620, 0.06, 'triangle', 0.08, 120); };
function burst(x, y, colours, n, speed, size, list = bits) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, v = speed * (0.35 + Math.random() * 0.65);
    list.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: size * (0.5 + Math.random() * 0.7), c: colours[i % colours.length], age: 0, life: 0.45 + Math.random() * 0.35 });
  }
}

// ---------- screens
const cards = screens(['menu', 'evolve', 'dead', 'over', 'paused', 'win']);
function show(name) {
  mode = name; cards(name);
  const play = name === 'play';
  $('hud').style.display = s && ['play', 'dying', 'evolve', 'dead', 'paused'].includes(name) ? 'block' : 'none';
  $('pause').style.display = play ? 'block' : 'none';
  $('zoo').style.display = name === 'zoo' ? 'block' : 'none';
  if (name === 'menu') menu();
  if (name !== 'play') { sayTimer = 0; $('say').classList.remove('on'); }
  if (name === 'paused') snd.hold?.(); else snd.release?.();
  pad.drop(); keys.clear(); last = 0;
}
function menu() {
  const day = today(); if (save.day !== day) { save.day = day; save.dayBest = 0; }
  $('menuLine').textContent = save.best ? `Today's meadow · best level ${save.dayBest || '-'} · ever ${save.best}` : 'Eat smaller animals. Grow.';
  $('sound').textContent = save.sound ? 'Sound: on' : 'Sound: off';
}
function start() {
  const day = today(); if (save.day !== day) { save.day = day; save.dayBest = 0; }
  s = create(Number(query.get('seed')) || daySeed(day), [ANT], 0, SPAWN_WEIGHTS, true); // Wild rules, the main game's default
  rigs.clear(); me_ = null; floats.length = 0; bits.length = 0; flash = 0; lives = LIVES; top = 1; runStart = performance.now(); acc = 0;
  store(); hud(); show('play'); blip(440, 0.12, 'triangle', 0.1, 220);
  say('Eat the little bugs with green numbers');
}
function hud() {
  const F = me(s), need = needFor(level(s));
  $('fill').style.width = Math.min(100, s.player.xp / need * 100) + '%';
  $('who').innerHTML = `Level ${level(s)} · ${F.name} <span id="lives">${'♥'.repeat(lives)}</span>`;
}
function say(text) { $('say').textContent = text; $('say').classList.add('on'); sayTimer = 2.6; }
function reached(L) { top = Math.max(top, L); if (L > save.best) save.best = L; if (L > save.dayBest) save.dayBest = L; store(); }

// a still portrait of a form: a rig walked a few steps so its legs settle, drawn to fit the canvas
function extent(F) { // body length and width, in r, legs included: for fitting a portrait or a pen
  const { spec } = speciesFor(F), leg = Math.max(0, ...spec.legs.map(L => L.len * (L.out ?? 0.6) + 0.3)), wide = Math.max(...spec.pts);
  return [span(F) + (spec.legs.length ? leg * 0.6 : 0), 2 * Math.max(wide, leg + wide * 0.5)];
}
function span(F) { const { spec } = speciesFor(F); return spec.gaps.reduce((a, b) => a + b, 0) + spec.pts[0] + spec.pts.at(-1) + Math.max(0, ...spec.chains.map(C => C.n * C.seg * (C.back ? 0.7 : 0.3))); }
function portrait(canvas, F, t = 0) {
  const x = canvas.getContext('2d'); x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, canvas.width, canvas.height);
  const c = creature(F, 0, 0, -0.35); for (let i = 0; i < 40; i++) update(c, Math.cos(-0.35) * F.r * 0.02 * i, Math.sin(-0.35) * F.r * 0.02 * i, -0.35, DT);
  const [len, wid] = extent(F), k = Math.min(canvas.width * 0.72 / (len * F.r), canvas.height * 0.62 / (wid * F.r));
  x.translate(canvas.width / 2, canvas.height * 0.55); x.scale(k, k); x.translate(-c.x, -c.y);
  drawCreature(x, c, { px: 1 / k });
}
function offer() {
  blip(520, 0.25, 'triangle', 0.14, 400); setTimeout(() => blip(780, 0.3, 'triangle', 0.12, 400), 120);
  burst(s.player.x, s.player.y, ['#ffe23a', '#ffb42a', '#ffffff', '#8dff8a'], 40, 220, 5);
  $('evolveSay').textContent = `You were ${article(me(s).name)}. Pick what you become.`;
  const box = $('opts'); box.textContent = '';
  s.choosing.forEach((F, i) => {
    const b = document.createElement('button'); b.className = 'opt';
    const pic = document.createElement('canvas'); pic.width = pic.height = 168; portrait(pic, F);
    const pace = { slow: 'Slow', medium: 'Medium', fast: 'Fast' }[F.pace];
    b.append(pic, Object.assign(document.createElement('b'), { textContent: F.name }), Object.assign(document.createElement('small'), { textContent: `Power ${F.power}` }), Object.assign(document.createElement('small'), { textContent: pace }));
    b.onclick = () => { if (!s.choosing) return; choose(s, i); reached(level(s)); blip(520, 0.3, 'triangle', 0.14, 500); me_ = null; hud(); show('play'); say(`You are ${article(F.name)} now`); };
    box.append(b);
  });
  show('evolve');
}
function died() {
  const d = s.dead, prev = s.player.stack.length > 1 ? FORMS[s.player.stack.at(-2)] : FORMS[ANT];
  if (lives <= 0) { // the end card
    const secs = Math.round((performance.now() - runStart) / 1000);
    $('overSay').textContent = `Eaten by ${article(d.to)}. You reached level ${top} in ${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}.`;
    $('overBest').textContent = `Today's best: level ${save.dayBest} · ever: ${save.best}`;
    blip(330, 0.5, 'triangle', 0.12, -120); show('over'); return;
  }
  $('deadSay').textContent = `Eaten by ${article(d.to)}`;
  $('deadMore').textContent = `${lives} ${lives === 1 ? 'life' : 'lives'} left. ` + (d.level > 1 ? `You drop to level ${d.level - 1}.` : 'An ant cannot drop lower.');
  $('goOn').textContent = d.level > 1 ? `Go on as ${article(prev.name)}` : 'Go on as an Ant';
  show('dead');
}
function goOn() { revive(s, false); me_ = null; hud(); show('play'); blip(500, 0.12, 'triangle', 0.1, 200); say(`You are ${article(me(s).name)}`); }

$('play').onclick = () => { tap(); start(); };
$('again').onclick = () => { tap(); start(); }; $('winNew').onclick = () => { tap(); start(); };
$('toZoo').onclick = () => { tap(); openZoo(); };
$('sound').onclick = () => { save.sound = !save.sound; store(); menu(); tap(); };
for (const b of document.querySelectorAll('.toMenu')) b.onclick = () => { tap(); s = null; rigs.clear(); show('menu'); };
$('goOn').onclick = () => { tap(); goOn(); };
$('pause').onclick = () => { tap(); show('paused'); }; $('resume').onclick = () => { tap(); show('play'); };

// ---------- input: the kit's floating stick, with the main game's numbers
const pad = stick(cv, { when: () => mode === 'play', reach: 55, leash: 70, dead: 0.15 });
hint(cv, { kind: 'stick', key: 'ant-creatures:hint', when: () => mode === 'play', played });
addEventListener('keydown', e => {
  if (isPauseKey(e)) { if (mode === 'play') show('paused'); else if (mode === 'paused') show('play'); else if (mode === 'zoo' && e.key === 'Escape') show('menu'); return; }
  keys.add(e.key.toLowerCase()); if (e.key.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());
onLeave(() => { if (mode === 'play') show('paused'); });
addEventListener('contextmenu', e => e.preventDefault());
function input() {
  let { x, y } = pad.vector();
  if (keys.has('arrowleft') || keys.has('a')) x -= 1; if (keys.has('arrowright') || keys.has('d')) x += 1;
  if (keys.has('arrowup') || keys.has('w')) y -= 1; if (keys.has('arrowdown') || keys.has('s')) y += 1;
  return { x, y };
}

// ---------- the rigs: one per animal, stepped at the sim's own 1/60 s
const sight = m => { const M = FORMS[m.f], [far, half] = sightOf(M); return [M.range * far, half]; };
function stepRigs() {
  const p = s.player, F = me(s), seen = new Set();
  for (const m of s.mobs) {
    seen.add(m.id); let c = rigs.get(m.id);
    if (!c || c.F.id !== m.f) rigs.set(m.id, c = creature(FORMS[m.f], m.x, m.y, m.a));
    const look = m.chase && !m.chase.gone ? m.chase : m.fear && !m.fear.gone ? m.fear : m.alert ? p : null; // eyes on what it hunts or flees
    update(c, m.x, m.y, m.a, DT, look);
  }
  for (const id of rigs.keys()) if (!seen.has(id)) rigs.delete(id);
  if (!me_ || me_.F.id !== F.id) me_ = creature(FORMS[F.id], p.x, p.y, p.a);
  let look = null, bd = Infinity; // the player's eyes: the nearest danger that has seen it, else the nearest meal
  for (const m of s.mobs) { const d = Math.hypot(m.x - p.x, m.y - p.y), strong = powerOf(m) > F.power; if (d < 400 && (strong ? m.alert : true) && d * (strong ? 0.5 : 1) < bd) { bd = d * (strong ? 0.5 : 1); look = m; } }
  update(me_, p.x, p.y, p.a, DT, look);
}

// ---------- drawing the meadow (as the main game draws it)
function resize() { dpr = Math.min(3, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); layoutZoo(); }
addEventListener('resize', resize);
const hash = (x, y) => { let h = x * 374761393 + y * 668265263 | 0; h = (h ^ h >>> 13) * 1274126177 | 0; return ((h ^ h >>> 16) >>> 0) / 4294967296; };
function ground(cx, cy) {
  g.fillStyle = '#24451f'; g.fillRect(-W, -H, W * 3, H * 3);
  const x0 = cx - W / 2 / zoom, y0 = cy - H / 2 / zoom, x1 = cx + W / 2 / zoom, y1 = cy + H / 2 / zoom;
  g.save(); g.scale(zoom, zoom); g.translate(-x0, -y0);
  g.fillStyle = '#6fa558'; g.fillRect(0, 0, WORLD, WORLD);
  const cell = 90;
  for (let gx = Math.max(0, Math.floor(x0 / cell)); gx <= Math.min(WORLD / cell - 1, Math.floor(x1 / cell)); gx++) for (let gy = Math.max(0, Math.floor(y0 / cell)); gy <= Math.min(WORLD / cell - 1, Math.floor(y1 / cell)); gy++) {
    const a = hash(gx, gy), b = hash(gy + 77, gx + 13), x = (gx + 0.15 + a * 0.7) * cell, y = (gy + 0.15 + b * 0.7) * cell;
    if ((gx + gy) % 2 === 0) { g.fillStyle = '#69a053'; g.fillRect(gx * cell, gy * cell, cell, cell); }
    if (a < 0.45) { g.strokeStyle = '#4f8a40'; g.lineWidth = 2; g.lineCap = 'round'; g.beginPath(); for (const k of [-5, 0, 5]) { g.moveTo(x + k, y); g.lineTo(x + k * 1.6, y - 9 - b * 5); } g.stroke(); }
    else if (a < 0.6) { g.fillStyle = '#a8a89a'; g.beginPath(); g.ellipse(x, y, 7 + b * 6, 5 + b * 4, a * 6, 0, 7); g.fill(); }
    else if (a < 0.72) { g.fillStyle = b < 0.5 ? '#f2e23a' : '#f2a6c6'; for (let k = 0; k < 5; k++) { g.beginPath(); g.arc(x + Math.cos(k * 1.257) * 4, y + Math.sin(k * 1.257) * 4, 2.6, 0, 7); g.fill(); } g.fillStyle = '#fff8e6'; g.beginPath(); g.arc(x, y, 2, 0, 7); g.fill(); }
  }
  g.strokeStyle = '#3a2a1a'; g.lineWidth = 8; g.strokeRect(-4, -4, WORLD + 8, WORLD + 8);
}
function label(x, y, text, colour, size, extra) {
  g.font = FONT(size); g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  g.lineWidth = Math.max(3, size / 4.5); g.strokeStyle = '#0b1408cc'; g.lineJoin = 'round'; g.strokeText(text, x, y); g.fillStyle = colour; g.fillText(text, x, y);
  if (extra) { const w = g.measureText(text).width / 2; g.textAlign = 'left'; g.strokeText(extra, x + w + 2, y); g.fillStyle = '#ff7a3a'; g.fillText(extra, x + w + 2, y); }
}
function drawBits(list) {
  for (const b of list) {
    const k = b.age / b.life; g.globalAlpha = Math.max(0, 1 - k);
    if (b.ring) { g.strokeStyle = b.c; g.lineWidth = 3 * (1 - k) + 1; g.beginPath(); g.arc(b.x, b.y, b.r * (1 + k * 1.6), 0, 6.283); g.stroke(); }
    else { g.fillStyle = b.c; g.beginPath(); g.arc(b.x, b.y, b.r * (1 - k * 0.5), 0, 6.283); g.fill(); }
  }
  g.globalAlpha = 1;
}
function ageBits(list, dt) {
  for (const b of list) { b.age += dt; if (!b.ring) { b.x += b.vx * dt; b.y += b.vy * dt; b.vx *= 1 - 3 * dt; b.vy *= 1 - 3 * dt; } }
  for (let i = list.length - 1; i >= 0; i--) if (list[i].age > list[i].life) list.splice(i, 1);
}
let drawn = 0;
function drawPlay(now) {
  const p = s.player, F = me(s);
  zoom = Math.sqrt(W * H) / (480 + 14 * level(s)); const px = 1 / zoom;
  const sx = shake > 0 ? (Math.random() - 0.5) * shake * 14 : 0, sy = shake > 0 ? (Math.random() - 0.5) * shake * 10 : 0;
  ground(p.x, p.y); g.translate(sx, sy);
  const vw = W / zoom / 2 + 120, vh = H / zoom / 2 + 120, edge = [];
  for (const m of s.mobs) { // sight wedges first, so bodies sit on top
    const pw = powerOf(m); if (Math.abs(m.x - p.x) > vw + 200 || Math.abs(m.y - p.y) > vh + 200 || pw === F.power) continue;
    const strong = pw > F.power, [range, cone] = sight(m), R = range * F.stealth + F.r;
    g.beginPath(); g.moveTo(m.x, m.y); g.arc(m.x, m.y, R, m.a - cone, m.a + cone); g.closePath();
    g.fillStyle = m.alert ? (strong ? '#ff3a2a40' : '#ffe23a38') : (strong ? '#ffffff2c' : '#ffffff12'); g.fill();
  }
  g.strokeStyle = '#ff3a2acc'; g.lineWidth = 2; g.setLineDash([7, 7]); g.lineDashOffset = -now / 40; // who is chasing whom
  for (const m of s.mobs) if (m.chase && !m.chase.gone && Math.abs(m.x - p.x) < vw && Math.abs(m.y - p.y) < vh) { g.beginPath(); g.moveTo(m.x, m.y); g.lineTo(m.chase.x, m.chase.y); g.stroke(); }
  g.setLineDash([]);
  drawn = 0;
  const vis = s.mobs.filter(m => Math.abs(m.x - p.x) < vw && Math.abs(m.y - p.y) < vh).sort((a, b) => a.y - b.y);
  for (const m of vis) {
    const c = rigs.get(m.id); if (!c) continue;
    if (powerOf(m) > F.power && m.alert && (Math.abs(m.x - p.x) > W / zoom / 2 || Math.abs(m.y - p.y) > H / zoom / 2)) edge.push(m);
    drawCreature(g, c, { px }); drawn++;
  }
  for (const m of s.mobs) if (powerOf(m) > F.power && m.alert && !vis.includes(m)) edge.push(m);
  drawBits(bits);
  if (!s.dead && me_) {
    g.save(); g.translate(p.x, p.y);
    if (p.safe > 0) { g.strokeStyle = `rgba(160,220,255,${0.4 + 0.3 * Math.sin(now / 90)})`; g.lineWidth = 3; g.beginPath(); g.arc(0, 0, F.r * 1.9, 0, 7); g.stroke(); }
    g.strokeStyle = '#fff8e6'; g.lineWidth = Math.max(2.5, 2.5 * px); g.setLineDash([5, 5]); g.beginPath(); g.arc(0, 0, F.r * 1.7, now / 900, now / 900 + 6.283); g.stroke(); g.setLineDash([]);
    g.restore(); drawCreature(g, me_, { px }); drawn++;
  }
  const size = 15 / zoom; // numbers: 15 px on the screen
  for (const m of vis) {
    const M = FORMS[m.f], pw = powerOf(m), c = rigs.get(m.id), y = m.y - M.r * (M.kind === 'bird' ? 1.5 : 1.25) - 4 - (c ? c.z * 0.55 : 0);
    label(m.x, y, String(pw), pw < F.power ? '#8dff8a' : pw > F.power ? '#ff7a6a' : '#fff8e6', size, paceAgainst(m, F) > F.speed ? '»' : '');
    if (m.alert && pw !== F.power) label(m.x, y - size * 0.95, '!', '#ffe23a', size * 1.25);
  }
  if (!s.dead) label(p.x, p.y - F.r * (F.kind === 'bird' ? 1.5 : 1.25) - 6 - (me_ ? me_.z * 0.55 : 0), String(F.power), '#ffffff', size * 1.1);
  for (const f of floats) { g.globalAlpha = Math.max(0, 1 - f.age); label(f.x, f.y - f.age * 30, f.text, f.c || '#ffe23a', size * (f.big || 1)); g.globalAlpha = 1; }

    const a = Math.atan2(m.y - p.y, m.x - p.x), k = Math.min((W / 2 - 24) / Math.abs(Math.cos(a) || 1e-6), (H / 2 - 24) / Math.abs(Math.sin(a) || 1e-6));
    g.save(); g.translate(W / 2 + Math.cos(a) * k, H / 2 + Math.sin(a) * k); g.rotate(a); g.fillStyle = '#ff3a2a'; g.strokeStyle = '#fff'; g.lineWidth = 2; g.beginPath(); g.moveTo(14, 0); g.lineTo(-10, -11); g.lineTo(-10, 11); g.closePath(); g.fill(); g.stroke(); g.restore();
  }
  if (flash > 0) { g.fillStyle = `rgba(200,20,10,${0.45 * flash})`; g.fillRect(0, 0, W, H); }
  const joy = pad.touch; if (joy && mode === 'play') {
    g.globalAlpha = 0.35; g.strokeStyle = '#fff'; g.lineWidth = 3; g.beginPath(); g.arc(joy.ox, joy.oy, 55, 0, 7); g.stroke();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(joy.x, joy.y, 22, 0, 7); g.fill(); g.globalAlpha = 1;
  }
}

// ---------- the menu's live animal: a different one every few seconds
const hero = { c: null, t: 0, i: 0, list: [3, 20, 26, 38, 44, 49, 52, 9, 31] };
function drawHero(dt) {
  const cvh = $('hero'), x = cvh.getContext('2d'); hero.t += dt;
  if (!hero.c || hero.t > 6) { hero.t = 0; hero.i = (hero.i + 1) % hero.list.length; const F = FORMS[hero.list[hero.i] % FORMS.length]; hero.F = F; hero.c = creature(F, 0, 0, 0); hero.k = Math.min(cvh.width * 0.36 / extent(F)[0], cvh.height * 0.5 / extent(F)[1]) / F.r; }
  const F = hero.F, c = hero.c, R = 0.42 * cvh.width / 2 / hero.k, w = F.speed * 0.45 / R;
  for (let n = 0; n < Math.round(dt * 60); n++) { const a = (hero.t * w) + n * w * DT; update(c, Math.cos(a) * R, Math.sin(a) * R * 0.45, a + Math.PI / 2 - 0.2 * Math.cos(a), DT); }
  x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, cvh.width, cvh.height);
  x.translate(cvh.width / 2, cvh.height / 2); x.scale(hero.k, hero.k);
  drawCreature(x, c, { px: 1 / hero.k });
}

// ---------- Zoo: a pen for every species. Scroll; tap or drag in a pen to lead its animal; tap the animal to poke it.
const pens = FORMS.map(F => ({ F, c: null, x: 0, y: 0, a: Math.random() * 6.28, tx: 0, ty: 0, wait: 0, follow: null, acc: 0 }));
const zoo = $('zoo'), zbits = []; let zl = { cols: 2, w: 150, h: 180, top: 64 };
function layoutZoo() {
  const left = 8, room = W - 16; zl.cols = Math.max(2, Math.floor(room / 190)); zl.w = (room - (zl.cols - 1) * 8) / zl.cols; zl.h = Math.round(clamp(zl.w * 1.05, 150, 260)); zl.left = left;
  zl.top = $('zooBar').offsetHeight || 64;
  $('pens').style.height = (Math.ceil(pens.length / zl.cols) * (zl.h + 8) + 16) + 'px';
}
function penBox(i) { const col = i % zl.cols, row = Math.floor(i / zl.cols); return { x: zl.left + col * (zl.w + 8), y: zl.top + 8 + row * (zl.h + 8) - zoo.scrollTop, w: zl.w, h: zl.h - 26 }; }
function penScale(pen) { const F = pen.F, [len, wid] = extent(F); return save.big ? Math.min(pen.w * 0.55 / (len * F.r), (zl.h - 26) * 0.5 / (wid * F.r), 7) : Math.sqrt(W * H) / (480 + 14 * Math.max(1, F.level)); }
function openZoo() { $('zooSize').textContent = save.big ? 'Game size' : 'Close up'; show('zoo'); layoutZoo(); }
$('zooBack').onclick = () => { tap(); show('menu'); };
$('zooSize').onclick = () => { tap(); save.big = !save.big; store(); $('zooSize').textContent = save.big ? 'Game size' : 'Close up'; for (const p of pens) p.c = null; };
let zooDown = null;
function penAt(cx, cy) { for (let i = 0; i < pens.length; i++) { const b = penBox(i); if (cx >= b.x && cx <= b.x + b.w && cy >= b.y + 26 && cy <= b.y + 26 + b.h) return i; } return -1; }
function toPen(i, cx, cy) { const b = penBox(i), k = pens[i].k || 1; return { x: (cx - b.x - b.w / 2) / k, y: (cy - b.y - 26 - b.h / 2) / k }; }
zoo.addEventListener('pointerdown', e => {
  const i = penAt(e.clientX, e.clientY); if (i < 0) return; snd.unlock();
  const pen = pens[i], q = toPen(i, e.clientX, e.clientY); zooDown = { id: e.pointerId, i };
  if (pen.c && Math.hypot(q.x - pen.x, q.y - pen.y) < pen.F.r * 1.6 + 14 / (pen.k || 1)) { // a poke
    poke(pen.c); blip(300 + 900 / (pen.F.r + 3) * 8, 0.12, 'square', 0.08, -200); crunch(0.05, 0.08, 2400);
    const b = penBox(i); burst(e.clientX, e.clientY, [pen.F.c, '#ffe23a', '#ffffff'], 10, 160, 4, zbits); pen.poked = (pen.poked || 0) + 1; pen.wait = 0.6; pen.follow = null; zooDown = null;
  } else { pen.follow = q; blip(880, 0.05, 'sine', 0.05); }
});
zoo.addEventListener('pointermove', e => { if (zooDown && zooDown.id === e.pointerId) { const q = toPen(zooDown.i, e.clientX, e.clientY); pens[zooDown.i].follow = q; } });
const zooUp = e => { if (zooDown && zooDown.id === e.pointerId) { const pen = pens[zooDown.i]; pen.tx = pen.follow?.x ?? pen.x; pen.ty = pen.follow?.y ?? pen.y; pen.follow = null; pen.wait = 2; zooDown = null; } };
zoo.addEventListener('pointerup', zooUp); zoo.addEventListener('pointercancel', zooUp);
function zooFrame(dt) {
  g.fillStyle = '#24451f'; g.fillRect(0, 0, W, H);
  let shown = 0;
  for (let i = 0; i < pens.length; i++) {
    const b = penBox(i); if (b.y + zl.h < 0 || b.y > H) continue;
    const pen = pens[i], F = pen.F; pen.w = b.w; const k = pen.k = penScale(pen);
    if (!pen.c) { pen.x = 0; pen.y = 0; pen.c = creature(F, 0, 0, pen.a); pen.tx = 0; pen.ty = 0; }
    const [len, wid] = extent(F), m = Math.max(len, wid) * F.r * 0.5 + 6 / k, bx = Math.max(0, b.w / 2 / k - m), by = Math.max(0, b.h / 2 / k - m); // the whole animal stays in its pen
    pen.acc += dt; while (pen.acc >= DT) { // walk at the sim's step
      pen.acc -= DT; const t = pen.follow || (pen.wait > 0 ? null : { x: pen.tx, y: pen.ty });
      if (pen.wait > 0) pen.wait -= DT;
      if (!pen.follow && pen.wait <= 0 && Math.hypot(pen.tx - pen.x, pen.ty - pen.y) < F.r) { pen.tx = (Math.random() * 2 - 1) * bx * 0.8; pen.ty = (Math.random() * 2 - 1) * by * 0.8; pen.wait = Math.random() < 0.4 ? 0.5 + Math.random() * 1.5 : 0; }
      if (t) {
        pen.goal = { x: clamp(t.x, -bx, bx), y: clamp(t.y, -by, by) }; const dx = pen.goal.x - pen.x, dy = pen.goal.y - pen.y, d = Math.hypot(dx, dy);
        if (d > F.r * 0.4) {
          const want = Math.atan2(dy, dx), turn = ((want - pen.a + Math.PI * 3) % (Math.PI * 2)) - Math.PI; pen.a += clamp(turn, -5 * DT, 5 * DT);
          const v = Math.min(d / 0.3, F.speed * (pen.follow ? 0.7 : 0.35)) * (Math.abs(turn) > 1.5 ? 0.3 : 1);
          pen.x = clamp(pen.x + Math.cos(pen.a) * v * DT, -bx, bx); pen.y = clamp(pen.y + Math.sin(pen.a) * v * DT, -by, by);
        }
      }
      update(pen.c, pen.x, pen.y, pen.a, DT, pen.follow);
    }
    // the pen
    g.save(); g.beginPath(); g.roundRect(b.x, b.y, b.w, zl.h, 14); g.fillStyle = '#5d9748'; g.fill(); g.lineWidth = 4; g.strokeStyle = '#7a5530'; g.stroke(); g.clip();
    for (let k2 = 0; k2 < 9; k2++) { const hx = hash(i, k2), hy = hash(k2 + 31, i); g.strokeStyle = '#4f8a40'; g.lineWidth = 2; g.lineCap = 'round'; g.beginPath(); const gx = b.x + 10 + hx * (b.w - 20), gy = b.y + 34 + hy * (zl.h - 44); for (const q of [-4, 0, 4]) { g.moveTo(gx + q, gy); g.lineTo(gx + q * 1.5, gy - 8); } g.stroke(); }
    g.fillStyle = '#14280fb3'; g.fillRect(b.x, b.y, b.w, 26);
    g.font = FONT(15); g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillStyle = '#ffe08a'; g.fillText(F.name, b.x + 10, b.y + 14);
    g.textAlign = 'right'; g.fillStyle = '#fff8e6'; g.font = FONT(14); g.fillText(String(F.power), b.x + b.w - 10, b.y + 14);
    g.translate(b.x + b.w / 2, b.y + 26 + b.h / 2); g.scale(k, k);
    if (pen.follow) { g.strokeStyle = '#ffffff99'; g.lineWidth = 2 / k; g.beginPath(); g.arc(clamp(pen.follow.x, -bx, bx), clamp(pen.follow.y, -by, by), 10 / k, 0, 7); g.stroke(); }
    drawCreature(g, pen.c, { px: 1 / k }); shown++;
    g.restore();
  }
  ageBits(zbits, dt); drawBits(zbits);
  return shown;
}

// ---------- ?sheet: every species at close-up and at its size in play, for judging the look
function drawSheet() {
  const cols = Math.max(4, Math.floor(W / 150)), cw = W / cols, ch = 200;
  g.fillStyle = '#5d9748'; g.fillRect(0, 0, W, H);
  FORMS.forEach((F, i) => {
    const x0 = (i % cols) * cw, y0 = Math.floor(i / cols) * ch, c = creature(F, 0, 0, -0.3);
    for (let n = 0; n < 50; n++) update(c, Math.cos(-0.3) * F.r * 0.03 * n, Math.sin(-0.3) * F.r * 0.03 * n, -0.3, DT);
    g.strokeStyle = '#3d6a30'; g.strokeRect(x0, y0, cw, ch);
    g.font = FONT(14); g.fillStyle = '#fff8e6'; g.textAlign = 'center'; g.fillText(F.name, x0 + cw / 2, y0 + 16);
    for (const [k, cy] of [[Math.min(cw * 0.5 / (extent(F)[0] * F.r), 100 / (extent(F)[1] * F.r), 7), y0 + 75], [Math.sqrt(390 * 844) / (480 + 14 * Math.max(1, F.level)), y0 + 160]]) {
      g.save(); g.translate(x0 + cw / 2, cy); g.scale(k, k); g.translate(-c.x, -c.y); drawCreature(g, c, { px: 1 / k }); g.restore();
    }
  });
}

// ---------- ?bench=N: N animals walking on the meadow, drawn by the play path, timed for check.mjs
const benchN = Number(query.get('bench')) || 0, bench = { n: benchN, gaps: [], cpu: [], drawn: 0, list: [] };
function benchFrame(now, dt) {
  if (!bench.list.length) for (let i = 0; i < benchN; i++) { const F = FORMS[(i * 7 + 3) % FORMS.length]; bench.list.push({ F, c: creature(F, WORLD / 2, WORLD / 2, 0), R: 40 + (i % 8) * 28, w: (0.5 + (i % 5) * 0.15) * (i % 2 ? 1 : -1), ph: i * 0.9, acc: 0 }); }
  zoom = Math.sqrt(W * H) / (480 + 14 * 8);
  const t = now / 1000;
  for (const b of bench.list) { b.acc += dt; while (b.acc >= DT) { b.acc -= DT; b.t = (b.t || 0) + DT; const a = b.ph + b.t * b.w; update(b.c, WORLD / 2 + Math.cos(a) * b.R * 1.4, WORLD / 2 + Math.sin(a) * b.R, a + Math.sign(b.w) * Math.PI / 2, DT); } }
  ground(WORLD / 2, WORLD / 2);
  let n = 0; for (const b of [...bench.list].sort((a, b) => a.c.y - b.c.y)) { drawCreature(g, b.c, { px: 1 / zoom }); n++; }
  for (const b of bench.list) label(b.c.x, b.c.y - b.F.r * 1.3 - 4, String(b.F.power), '#8dff8a', 15 / zoom);
  g.restore(); bench.drawn = n;
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = last ? Math.min(0.1, (now - last) / 1000) : 0, gap = last ? now - last : 0; last = now;
  const t0 = performance.now();
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (mode === 'bench') { benchFrame(now, dt); if (gap) { bench.gaps.push(gap); bench.cpu.push(performance.now() - t0); } return; }
  if (mode === 'sheet') return;
  if (mode === 'zoo') { zooFrame(dt); return; }
  if (mode === 'menu') { g.fillStyle = '#3f6a34'; g.fillRect(0, 0, W, H); drawHero(dt); return; }
  if (mode === 'play' && s) {
    acc += dt; const inp = input();
    while (acc >= DT && mode === 'play') {
      acc -= DT; step(s, inp); stepRigs();
      for (const e of s.events) {
        if (e.t === 'eat') {
          const M = FORMS.find(f => f.name === e.name); if (me_) poke(me_);
          floats.push({ x: e.x, y: e.y, text: '+' + e.gain, age: 0 }); burst(e.x, e.y, [M.c, M.d, M.e, '#ffffff'], 16, 110 + M.r * 6, Math.max(3.5, M.r * 0.32));
          bits.push({ ring: 1, x: e.x, y: e.y, r: Math.max(8, M.r), c: '#ffe23a', age: 0, life: 0.35 });
          crunch(0.1, 0.22, 1400 + Math.random() * 900); blip(300 + e.gain * 90, 0.09, 'square', 0.06, 200); hud();
        }
        if (e.t === 'mobeat') { // the eater squashes on its bite
          let best = null, bd = Infinity; for (const m of s.mobs) { if (FORMS[m.f].name !== e.by) continue; const d = Math.hypot(m.x - e.x, m.y - e.y); if (d < bd) { bd = d; best = m; } }
          if (best && rigs.get(best.id)) poke(rigs.get(best.id));
          if (Math.abs(e.x - s.player.x) < W / zoom && Math.abs(e.y - s.player.y) < H / zoom) { const M = FORMS.find(f => f.name === e.name); burst(e.x, e.y, [M.c, M.d, '#ffffff'], 10, 90 + M.r * 5, Math.max(3, M.r * 0.28)); floats.push({ x: e.x, y: e.y, text: `${e.by} ate ${article(e.name)}`, age: 0 }); crunch(0.08, 0.1, 900); }
        }
        if (e.t === 'tired') { floats.push({ x: e.x, y: e.y - 20, text: 'phew...', age: 0, c: '#cfe8ff', big: 1.1 }); blip(520, 0.25, 'sine', 0.08, 780); }
        if (e.t === 'pounce') { floats.push({ x: e.x, y: e.y - 18, text: 'Pounce!', age: 0, c: '#ff8a3a', big: 1.3 }); burst(e.x, e.y, ['#e8d8a8', '#c8b070'], 8, 120, 4); blip(240, 0.18, 'sawtooth', 0.1, 420); }
        if (e.t === 'notice') blip(e.strong ? 180 : 700, 0.12, e.strong ? 'sawtooth' : 'sine', 0.06);
        if (e.t === 'hunt') { say(`${article(e.name).replace(/^a/, 'A')} is hunting you`); blip(140, 0.5, 'sawtooth', 0.1, 120); }
        if (e.t === 'hide') { say(`Your thick hide took the bite`); shake = 0.4; flash = 0.6; crunch(0.18, 0.28, 500); if (me_) poke(me_); bits.push({ ring: 1, x: e.x, y: e.y, r: me(s).r * 1.6, c: '#9ad8ff', age: 0, life: 0.6 }); hud(); }
        if (e.t === 'full') offer();
        if (e.t === 'die') {
          const F = me(s), p = s.player; lives--;
          const k = s.mobs.find(m => m.id === e.killer); if (k && rigs.get(k.id)) poke(rigs.get(k.id));
          shake = 0.6; flash = 1; burst(p.x, p.y, [F.c, F.d, '#c0271f', '#ff5a3a'], 30, 140 + F.r * 7, F.r * 0.36);
          bits.push({ ring: 1, x: p.x, y: p.y, r: F.r * 1.4, c: '#ff3a2a', age: 0, life: 0.5 });
          crunch(0.22, 0.3, 700); blip(220, 0.6, 'sawtooth', 0.14, -170);
          dying = performance.now() + 900; mode = 'dying'; $('pause').style.display = 'none'; pad.drop(); keys.clear(); hud();
        }
        if (e.t === 'win') {
          reached(TOP); hud(); $('winSay').textContent = `You climbed all ${TOP} levels and became ${article(me(s).name)}.`;
          for (let k = 0; k < 4; k++) setTimeout(() => blip(523 * 2 ** (k / 4), 0.3, 'triangle', 0.13, 200), k * 140);
          burst(s.player.x, s.player.y, ['#ffe23a', '#ff7a6a', '#8dff8a', '#7ac8ff', '#ffffff'], 90, 380, 6); shake = 0.3;
          setTimeout(() => show('win'), 1200);
        }
      }
    }
    for (const f of floats) f.age += dt * (f.big ? 0.6 : 1.3);
    while (floats.length && floats[0].age > 1) floats.shift();
  } else acc = 0;
  if (s && (mode === 'play' || mode === 'dying' || mode === 'evolve' || mode === 'win')) { ageBits(bits, dt); if (flash > 0) flash = Math.max(0, flash - dt * 1.6); }
  if (mode === 'dying' && now >= dying) { flash = 0; died(); }
  if (shake > 0) shake -= dt;
  if (sayTimer > 0 && (sayTimer -= dt) <= 0) $('say').classList.remove('on');
  if (s) drawPlay(now); else { g.fillStyle = '#3f6a34'; g.fillRect(0, 0, W, H); }
}
window.__ant = { get s() { return s; }, get mode() { return mode; }, get input() { return input(); }, get zoom() { return zoom; }, get rigs() { return rigs; }, get meRig() { return me_; }, get drawn() { return drawn; }, get lives() { return lives; },
  get save() { return save; }, pens, penBox, zl, bench, FORMS, me, level, powerOf, catchable, needFor };
resize();
if (benchN) { mode = 'bench'; cards(null); }
else if (query.has('sheet')) { mode = 'sheet'; cards(null); drawSheet(); }
else show('menu');
requestAnimationFrame(frame);
</script>
