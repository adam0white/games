<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#020306">
<title>Lantern Echo</title>
<style>
  html, body { margin: 0; height: 100%; background: #020306; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { font: 16px/1.5 Georgia, 'Times New Roman', serif; color: #f3e6cf; }
  canvas { display: block; width: 100vw; height: 100dvh; }
  a { color: #ffd9a0; }
  .screen { position: fixed; inset: 0; display: none; place-items: center; text-align: center; pointer-events: none; }
  .screen.on { display: grid; }
  .screen > div { max-width: 21em; width: calc(100% - 2em); padding: 1em; pointer-events: auto; }
  #card > div { pointer-events: none; } #card button, #card a { pointer-events: auto; }
  .veil { background: #020306c0; }
  h1 { font-weight: normal; font-size: 2.4em; letter-spacing: .12em; margin: 0 0 .2em; color: #bfe3ff; text-shadow: 0 0 28px #6fb6ff66; }
  p { margin: .4em 0; opacity: .88; }
  button { font: inherit; color: #ffe6bd; background: #ffffff10; border: 1.5px solid #ffd9a088; border-radius: 999px; padding: .55em 1.2em; margin: .3em; min-width: 9em; min-height: 46px; touch-action: manipulation; }
  button.main { background: #ffb45a; color: #2a1606; border-color: #ffb45a; font-size: 1.2em; min-width: 9.5em; }
  button.line { background: none; border: 0; min-width: 0; min-height: 44px; padding: .3em .6em; text-decoration: underline; color: #ffd9a0; }
  .dot { display: inline-block; width: .7em; height: .7em; border-radius: 50%; background: radial-gradient(#fff2c8, #ff9a3c); box-shadow: 0 0 10px #ff9a3c; margin-right: .35em; vertical-align: baseline; }
  #hud { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: calc(12px + env(safe-area-inset-left)); display: none; text-align: left; pointer-events: none; text-shadow: 0 1px 6px #000; }
  #hearts { font: 26px/1 sans-serif; color: #ff4d5e; letter-spacing: 2px; }
  #embers { font-size: 26px; line-height: 1.3; color: #ffd9a0; }
  #flame { width: 84px; height: 6px; border-radius: 3px; background: #ffffff18; margin-top: 4px; overflow: hidden; }
  #flame i { display: block; height: 100%; width: 50%; background: linear-gradient(90deg, #ff7a2a, #ffd27a); }
  #big { position: fixed; top: calc(6px + env(safe-area-inset-top)); left: 0; right: 0; display: none; text-align: center; font-size: 40px; line-height: 1.1; color: #fff3dc; pointer-events: none; text-shadow: 0 1px 8px #000; font-variant-numeric: tabular-nums; }
  #warn, #say { position: fixed; left: 0; right: 0; text-align: center; pointer-events: none; opacity: 0; transition: opacity .3s; text-shadow: 0 1px 8px #000; padding: 0 1em; }
  #warn { top: 20%; font-size: 26px; line-height: 1.2; font-weight: bold; color: #ff4a4a; }
  #warn.on { opacity: 1; animation: pulse .9s infinite alternate; }
  @keyframes pulse { to { opacity: .7; } }
  #say { top: 31%; font-size: 22px; color: #ffe6bd; }
  #pause { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right)); width: 44px; height: 44px; min-width: 0; min-height: 0; margin: 0; padding: 0; border: 0; border-radius: 50%; background: #ffffff14; display: none; place-items: center; touch-action: none; }
  #pause::before { content: ''; width: 4px; height: 16px; border: solid #ffd9a0aa; border-width: 0 5px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div id="hearts"></div><div id="embers"><span class="dot"></span><span id="count">0</span></div><div id="flame"><i id="fill"></i></div></div>
<div id="big"></div>
<div id="warn">The last coals are fading</div>
<div id="say"></div>
<button id="pause" aria-label="Pause"></button>
<div id="menu" class="screen veil on"><div>
  <h1>Lantern Echo</h1>
  <p>An experiment: the lantern has gone out, so you steer by echo. A ping rings out across the dark water every second and shows, for a moment, the rocks and embers it touches.</p>
  <p id="which"></p>
  <p><button id="play" class="main">Play</button></p>
  <p><button id="sound" class="line"></button></p>
  <p><a href="/lantern/">Back to Lantern</a></p>
</div></div>
<div id="card" class="screen"><div><h1 id="title"></h1><p id="line"></p><p id="sub"></p><p><button id="go" class="main">Play again</button></p><p><a href="/lantern/">Back to Lantern</a></p></div></div>
<script type="module">
import { create, step, centre, half, fall, fog, wind, rain, dazzle, boat, progress, DT, GOAL, NIGHTS, BOAT } from '../../lantern/sim.js';
import { hull, TINT } from '../../lantern/looks.js';
import { createEcho, update, ping, shine, rings, threat } from './echo.js';
import { sound } from '../../kit/audio.js';
import { onLeave, isPauseKey } from '../../kit/pause.js';
import { screens } from '../../kit/screens.js';
import { drag } from '../../kit/drag.js';
import { hint } from '../../kit/hint.js';
import { read, write } from '../../kit/save.js';

const $ = id => document.getElementById(id);
const query = new URLSearchParams(location.search);
const gain = Number(query.get('gain')) || 1.3; // boat travel per finger travel, as on the main page
let stage = Math.min(NIGHTS, Math.max(1, Math.floor(Number(query.get('night')) || 1)));
const ahead = n => n === 1 ? 'Slide your thumb to steer. Tap with a second finger, or press space, to ping at once. Embers keep the last coals alive.' : `Night ${n}. This experiment is tuned for night 1.`;

const canvas = $('c'), g = canvas.getContext('2d');
let W = 0, H = 0, unit = 1, left = 0, dpr = 1;
function resize() {
  dpr = Math.min(2, devicePixelRatio || 1);
  W = canvas.width = Math.round(innerWidth * dpr); H = canvas.height = Math.round(innerHeight * dpr);
  unit = Math.min(W, H * 0.62); left = (W - unit) / 2; // the river is one unit wide, framed as on the main page
}
addEventListener('resize', resize); resize();
const sx = x => left + x * unit, sy = y => H * 0.74 - (y - s.y) * unit;

let s = create(1, stage), echo = createEcho(), playing = false, paused = false, target = 0.5, acc = 0, last = 0, shake = 0, flash = 0, ended = -1e9, screen = 'menu', nearFall = false, sayTimer = 0, shown = '', weather = '', tickWait = 0;
let soundOn = read('lantern-echo:sound', '1') !== '0';
window.lanternState = () => ({ x: s.x, y: s.y, t: s.t, over: s.over, playing, paused, stage, hearts: s.hearts, light: s.light, taken: s.taken, target, screen, unit: unit / dpr, pings: echo.count, lit: echo.lit.size, rings: echo.pings.length, sound: soundOn });
window.lanternSim = () => s; // the browser checks use this to reach late stretches quickly
window.lanternEcho = () => echo;

const cards = screens(['menu', 'card']);
function show(name) {
  screen = name;
  cards(name);
  const play = name === 'play';
  $('hud').style.display = $('big').style.display = play ? 'block' : 'none'; pauseButton.style.display = play ? 'grid' : 'none';
  if (!play) $('warn').classList.remove('on');
  if (name === 'menu') { $('play').textContent = `Play night ${stage}`; $('which').textContent = ahead(stage); }
}
function say(text, ms = 2200) { const el = $('say'); el.textContent = text; el.style.opacity = 1; clearTimeout(sayTimer); sayTimer = setTimeout(() => { el.style.opacity = 0; }, ms); }
function soundLine() { $('sound').textContent = soundOn ? 'Sound on. Headphones help: echoes come from left or right.' : 'Sound off. The pings still show the way.'; }
$('sound').addEventListener('click', () => { soundOn = !soundOn; write('lantern-echo:sound', soundOn ? '1' : '0'); if (soundOn) snd.unlock(); soundLine(); });
soundLine();

// Sound: all made in code, started by the Play tap. The river and a low drone loop; every other sound is a short note.
let water, waterGain, drone, droneGain, streak = 0;
const snd = sound({ on: () => soundOn, setup: ac => {
  const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const n = ac.createBufferSource(); n.buffer = buf; n.loop = true;
  water = ac.createBiquadFilter(); water.type = 'bandpass'; water.frequency.value = 500; water.Q.value = 0.6;
  waterGain = ac.createGain(); waterGain.gain.value = 0.03; n.connect(water).connect(waterGain).connect(ac.destination); n.start();
  drone = ac.createOscillator(); drone.type = 'sine'; drone.frequency.value = 55;
  droneGain = ac.createGain(); droneGain.gain.value = 0; drone.connect(droneGain).connect(ac.destination); drone.start();
} });
const tone = (freq, dur, vol, type = 'sine') => { if (snd.ctx && soundOn) snd.tone(freq, dur, vol, type); };
// A note placed left or right: pan from -1 (left) to 1 (right), starting `delay` seconds from now.
function note(freq, dur, vol, type = 'sine', pan = 0, delay = 0, slide = 0) {
  const ac = snd.ctx; if (!ac || !soundOn || ac.state !== 'running') return;
  try {
    const t = ac.currentTime + delay, o = ac.createOscillator(), v = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    v.gain.setValueAtTime(0.0001, t); v.gain.exponentialRampToValueAtTime(vol, t + 0.008); v.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let out = o.connect(v);
    if (ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, pan)); out = out.connect(p); } // without a panner the note plays in the middle
    out.connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
  } catch {}
}
const panOf = dx => dx / 0.3; // a thing a third of the river to one side is fully in that ear
const scale = [392, 440, 523.25, 587.33, 659.25, 783.99, 880, 1046.5];

// The sound of a thing a ring has reached. The echo comes back later the further away it is.
function echoSound(h) {
  const pan = panOf(h.dx), delay = h.dist * 0.08, fade = Math.max(0.35, 1 - h.dist / 2.6);
  if (h.kind === 'rock') { note(150, 0.16, 0.09 * fade, 'triangle', pan, delay, -40); note(75, 0.12, 0.05 * fade, 'sine', pan, delay); }
  else if (h.kind === 'ember') { note(1318.5, 0.45, 0.05 * fade, 'sine', pan, delay); note(2637, 0.25, 0.015 * fade, 'sine', pan, delay); }
  else if (h.kind === 'wisp') { note(1318.5 * 1.035, 0.45, 0.04 * fade, 'sine', pan, delay); note(1318.5 * 0.985, 0.45, 0.03 * fade, 'sine', pan, delay); } // two notes a little apart: it beats, a false ember
  else { note(880, 0.09, 0.05 * fade, 'triangle', pan, delay); note(1320, 0.12, 0.05 * fade, 'triangle', pan, delay + 0.08); } // an ability: two quick notes
}

// What every sim event sounds like and says. A check reads this list against the events in sim.js.
const EVENTS = {
  ember: () => { tone(scale[Math.min(streak++, scale.length - 1)], 0.5, 0.12, 'triangle'); flash = 1; say('An ember: warmth for a moment', 1000); },
  graze: () => { tone(1320, 0.12, 0.05); say('Close!', 700); },
  shield: () => { tone(880, 0.5, 0.1); setTimeout(() => tone(1320, 0.7, 0.08), 110); say('A force field pushes rocks away', 1600); },
  break: () => { tone(240, 0.35, 0.25, 'square'); tone(1760, 0.25, 0.06); shake = 0.6; target = s.x; steer.rebase(); say('The shield took the blow', 1400); },
  push: () => { tone(500, 0.15, 0.06, 'triangle'); say('The field pushes a rock aside', 1000); },
  fieldEnd: () => { tone(660, 0.3, 0.05, 'sine'); say('The force field is gone', 1200); },
  boost: () => { [392, 523.25, 783.99, 1046.5].forEach((f, i) => setTimeout(() => tone(f, 0.3, 0.09, 'sawtooth'), i * 60)); say('Boost! Nothing can stop you', 1600); },
  slow: () => { tone(440, 0.9, 0.1); setTimeout(() => tone(330, 1.1, 0.1), 160); say('Slow water. Dawn keeps coming', 1800); },
  small: () => { tone(1046.5, 0.25, 0.1, 'triangle'); setTimeout(() => tone(1568, 0.4, 0.08, 'triangle'), 90); say('A smaller boat', 1500); },
  big: () => { tone(196, 0.5, 0.2, 'square'); setTimeout(() => tone(147, 0.7, 0.2, 'square'), 120); shake = 0.4; say('Bad luck: a bigger boat!', 1700); },
  magnet: () => { tone(660, 0.3, 0.1, 'triangle'); setTimeout(() => tone(990, 0.5, 0.1, 'triangle'), 90); say('Magnet: embers come to you', 1700); },
  flare: () => { [523.25, 783.99, 1046.5, 1568].forEach((f, i) => setTimeout(() => tone(f, 0.7, 0.08), i * 70)); say('Flare: the coals hold', 1600); },
  wisp: () => { tone(150, 0.5, 0.2, 'sawtooth'); say('A false ember!', 1400); streak = 0; },
  heart: () => { tone(523.25, 0.4, 0.1, 'triangle'); setTimeout(() => tone(783.99, 0.6, 0.1, 'triangle'), 120); say('A heart: one more life', 1500); },
  hurt: () => { tone(180, 0.4, 0.3, 'square'); shake = 0.8; target = s.x; steer.rebase(); say('You lost a heart', 1500); }, // steering restarts from where the boat now is
  hit: () => { tone(70, 0.5, 0.35, 'sawtooth'); shake = 1; say('Crash!', 1200); },
  out: () => { tone(110, 1.2, 0.2); say('The last coal went out', 1600); },
  dawn: () => { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => setTimeout(() => tone(f, 1.6, 0.1, 'triangle'), i * 180)); say('Dawn!', 2000); },
};
window.lanternEvents = Object.keys(EVENTS);
window.lanternEvent = name => EVENTS[name](); // the browser check runs each one once

function begin() {
  snd.unlock();
  s = create((Math.random() * 2 ** 31) | 0, stage); echo = createEcho(); target = s.x; playing = true; paused = false; acc = 0; streak = 0; nearFall = false; weather = ''; flash = 0; tickWait = 0; steer.reset();
  shown = ''; show('play'); hud();
  say(`Night ${stage}`, 1600);
}
function finish() {
  playing = false; ended = performance.now(); steer.drop();
  $('hud').style.display = $('big').style.display = pauseButton.style.display = 'none'; $('warn').classList.remove('on');
  const won = s.over === 'dawn', why = { dark: 'The last coal went out.', bank: 'You ran onto the bank.', ice: 'You struck the ice.', log: 'You struck a log.', pool: 'The whirlpool took you.', geyser: 'The geyser threw you over.', isle: 'You struck an island.' }[s.over] ?? 'You struck a rock.';
  const pct = Math.floor(progress(s) * 100);
  $('title').textContent = won ? 'Dawn' : s.over === 'dark' ? 'Dark' : `Night ${stage}`;
  if (won && stage >= NIGHTS) { $('line').textContent = 'You steered by ear through every night.'; $('go').textContent = `Play night ${stage} again`; }
  else if (won) { $('line').textContent = `You found your way through night ${stage} in the dark. ${ahead(stage + 1)}`; stage++; $('go').textContent = `Play night ${stage}`; }
  else { $('line').textContent = `${why} ${pct}% of the way to dawn.`; $('go').textContent = 'Play again'; }
  $('sub').textContent = `${s.taken} embers, ${echo.count} pings this run.`;
  setTimeout(() => { if (!playing && screen === 'play') show('card'); }, won ? 2600 : 700);
}
function hud() {
  const big = `${Math.floor(progress(s) * 100)}%`, low = playing && !paused && s.light < 0.28, now = `${s.hearts}|${s.taken}|${big}|${low}|${Math.round(s.light * 40)}`;
  if (now === shown) return; shown = now; // touch the page only when a number changes
  $('hearts').textContent = '♥'.repeat(Math.max(0, s.hearts)); $('count').textContent = s.taken; $('big').textContent = big;
  $('fill').style.width = `${Math.round(s.light * 100)}%`;
  $('warn').classList.toggle('on', low);
}
function pingNow() { if (playing && !paused && ping(echo, s)) pingSound(); }
function pingSound() { note(700, 0.22, 0.05, 'sine', 0, 0, -250); }

// A second finger, while one is already down, pings instead of steering. These listeners are added before the
// kit's steering, so they can keep that touch from reaching it: the first finger keeps steering undisturbed.
const fingers = new Set(), extra = new Set();
canvas.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse') return;
  if (fingers.size && playing && !paused) { extra.add(e.pointerId); e.stopImmediatePropagation(); pingNow(); return; }
  fingers.add(e.pointerId);
});
canvas.addEventListener('pointermove', e => { if (extra.has(e.pointerId)) e.stopImmediatePropagation(); });
for (const type of ['pointerup', 'pointercancel']) canvas.addEventListener(type, e => { fingers.delete(e.pointerId); if (extra.delete(e.pointerId)) e.stopImmediatePropagation(); });

// Steering, the same as the main page. A finger steers by how far it has moved since it touched down, never by where
// it is. A mouse steers by position: the point across the river under the pointer.
const pauseButton = $('pause');
function aim(x) { const c = centre(s, s.y), h = half(s, s.y) + 0.02; target = Math.max(c - h, Math.min(c + h, x)); }
const steer = drag(canvas, { playing: () => playing, paused: () => paused, resume: () => resume(), from: () => s.x, travel: dx => dx * dpr / unit * gain, aim, mouse: e => aim((e.clientX * dpr - left) / unit), settle: 12 });
hint(canvas, { kind: 'drag', key: 'lantern-echo:hint', delay: 1500, bottom: 56, when: () => playing && !paused && screen === 'play' }); // this page keeps no save of play, so only the hint's own key remembers the player

$('play').addEventListener('click', begin);
$('go').addEventListener('click', () => { if (paused) resume(); else if (performance.now() - ended > 600) begin(); });

// Pause: the button, P or Escape, and whenever the page loses the screen.
function pause() {
  if (!playing || paused) return; paused = true; steer.drop(); keys.clear(); fingers.clear(); extra.clear();
  $('title').textContent = 'Paused'; $('line').textContent = `Night ${stage}, ${Math.floor(progress(s) * 100)}% of the way to dawn.`; $('sub').textContent = 'Touch the river to go on.'; $('go').textContent = 'Go on';
  show('card'); snd.hold();
}
function resume() {
  if (!paused) return; paused = false; acc = 0; last = performance.now(); target = s.x;
  show('play'); snd.release();
}
pauseButton.addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); pause(); });
onLeave(pause);
const keys = new Set();
addEventListener('keydown', e => {
  if (isPauseKey(e)) { paused ? resume() : pause(); return; }
  if (paused) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); resume(); } return; }
  if (e.key === ' ') { e.preventDefault(); if (!e.repeat) pingNow(); return; }
  keys.add(e.key);
});
addEventListener('keyup', e => keys.delete(e.key));

function tick() {
  if (keys.has('ArrowLeft') || keys.has('a')) target = s.x - 0.1;
  if (keys.has('ArrowRight') || keys.has('d')) target = s.x + 0.1;
  const before = echo.count;
  step(s, target); update(echo, s);
  if (echo.count > before) pingSound();
  for (const h of echo.heard) echoSound(h);
  for (const e of s.events) EVENTS[e]?.();
  // The parking sensor: a rock on the boat's line within 1.2 s ticks, faster and higher as it nears, from its side.
  const near = playing ? threat(s, 1.2) : null;
  tickWait -= DT;
  if (near && tickWait <= 0) { const k = near.time / 1.2; note(700 + 700 * (1 - k), 0.035, 0.035, 'square', panOf(near.dx)); tickWait = 0.07 + 0.33 * k; }
  const soon = fall(s, s.y + 1.3) > 0 || fall(s, s.y + 0.6) > 0;
  if (soon && !nearFall) { say('Waterfall!', 1800); tone(196, 0.9, 0.12, 'sawtooth'); }
  nearFall = soon;
  const sky = (fog(s, s.y) ? 'f' : '') + (wind(s, s.y) ? 'w' : '') + (rain(s, s.y) ? 'r' : '') + (dazzle(s) < 0 ? 'l' : '');
  if (sky !== weather) {
    if (sky.includes('w') && !weather.includes('w')) say(wind(s, s.y) < 0 ? 'Wind from the right' : 'Wind from the left', 1800);
    if (sky.includes('r') && !weather.includes('r')) say('Rain', 1500);
    if (sky.includes('l') && !weather.includes('l')) { tone(60, 1.4, 0.3, 'sawtooth'); tone(45, 2, 0.25, 'square'); }
    weather = sky;
  }
  hud();
  if (s.over) finish();
}

// Drawing. Almost black: the banks as faint lines, the rings, whatever a ring has lit, the boat.
function draw(now) {
  const dawn = Math.max(0, (progress(s) - 0.86) / 0.14), day = s.over === 'dawn' ? Math.min(1, (now - ended) / 2500) : 0;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = `rgb(${2 + 30 * day + 6 * dawn},${3 + 40 * day + 6 * dawn},${6 + 60 * day + 12 * dawn})`; g.fillRect(0, 0, W, H);
  if (shake) g.translate((Math.random() - 0.5) * shake * 10 * dpr, (Math.random() - 0.5) * shake * 10 * dpr);
  const top = s.y + 0.74 * H / unit + 0.1, bot = s.y - 0.3 * H / unit - 0.1;
  // The banks.
  g.strokeStyle = `rgba(150,175,205,${0.28 + 0.3 * day})`; g.lineWidth = 1.5 * dpr;
  for (const side of [-1, 1]) { g.beginPath(); for (let y = bot; y <= top; y += 0.04) { const x = sx(centre(s, y) + side * half(s, y)); y === bot ? g.moveTo(x, sy(y)) : g.lineTo(x, sy(y)); } g.stroke(); }
  // The rings, fading as they go.
  g.lineWidth = 1.5 * dpr;
  for (const r of rings(echo)) { g.strokeStyle = `rgba(170,210,240,${0.4 * (1 - r.k)})`; g.beginPath(); g.arc(sx(r.x), sy(r.y), Math.max(0, r.r * unit), 0, 7); g.stroke(); }
  // An ember just taken lights the water round the boat for a moment.
  const bx = sx(s.x), by = sy(s.y);
  if (flash > 0) { const fr = 0.3 * unit, q = g.createRadialGradient(bx, by, 0, bx, by, fr); q.addColorStop(0, `rgba(255,170,80,${0.35 * flash})`); q.addColorStop(1, 'rgba(255,170,80,0)'); g.fillStyle = q; g.fillRect(bx - fr, by - fr, 2 * fr, 2 * fr); }
  // Lit things, where they are now. At dawn everything shows.
  const things = [...s.rocks, ...s.embers.filter(o => !o.got), ...s.powers.filter(o => !o.got)];
  for (const o of things) {
    const a = Math.max(shine(echo, o), day);
    if (a <= 0.01 || o.y < bot || o.y > top) continue;
    const x = sx(o.x), y = sy(o.y);
    if ('rad' in o) {
      const R = o.rad * unit;
      g.strokeStyle = `rgba(175,215,255,${a})`; g.lineWidth = 2 * dpr; g.fillStyle = `rgba(120,160,200,${0.12 * a})`;
      if (!o.on) g.setLineDash([4 * dpr, 4 * dpr]);
      g.beginPath();
      if (o.len) { const L = o.len * unit; g.moveTo(x - L, y - R); g.lineTo(x + L, y - R); g.arc(x + L, y, R, -Math.PI / 2, Math.PI / 2); g.lineTo(x - L, y + R); g.arc(x - L, y, R, Math.PI / 2, Math.PI * 1.5); }
      else g.arc(x, y, R, 0, 7);
      g.fill(); g.stroke(); g.setLineDash([]);
    } else {
      const col = o.kind === 'ember' ? '255,160,70' : o.kind === 'wisp' ? '200,220,120' : TINT[o.kind] ?? '255,255,255', er = 0.05 * unit;
      const q = g.createRadialGradient(x, y, 0, x, y, er); q.addColorStop(0, `rgba(255,245,220,${a})`); q.addColorStop(0.25, `rgba(${col},${0.9 * a})`); q.addColorStop(1, `rgba(${col},0)`);
      g.fillStyle = q; g.fillRect(x - er, y - er, 2 * er, 2 * er);
      if (o.kind === 'heart') { g.fillStyle = `rgba(255,77,94,${a})`; g.font = `${0.04 * unit}px sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('♥', x, y); }
    }
  }
  // The force field.
  if (s.field) { g.strokeStyle = 'rgba(120,190,255,.5)'; g.lineWidth = 3 * dpr; g.beginPath(); g.arc(bx, by, 0.062 * unit, 0, 7); g.stroke(); }
  // The boat, with a coal in the dead lantern that glows as brightly as the light that is left.
  g.save(); g.translate(bx, by); g.rotate(Math.max(-0.25, Math.min(0.25, (target - s.x) * 2))); const k = boat(s) / BOAT * 1.2; g.scale(k, k);
  hull(g, 'oak', unit, '#6b5a48', now / 1000);
  const cr = 0.022 * unit, cq = g.createRadialGradient(0, 0, 0, 0, 0, cr); cq.addColorStop(0, `rgba(255,180,90,${0.25 + 0.75 * s.light})`); cq.addColorStop(1, 'rgba(255,120,40,0)');
  g.fillStyle = cq; g.fillRect(-cr, -cr, 2 * cr, 2 * cr);
  g.restore();
}

function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000 || 0); last = now;
  if (playing && !paused) { acc += dt; while (acc >= DT && playing) { tick(); acc -= DT; } }
  shake = Math.max(0, shake - dt * 3); flash = Math.max(0, flash - dt * 1.2);
  if (snd.ctx) { const on = soundOn ? 1 : 0; water.frequency.value = 400 + 500 * Math.min(1.4, s.y / GOAL); waterGain.gain.value = on * (0.03 + (playing ? 0.12 * Math.max(fall(s, s.y), fall(s, s.y + 0.8)) : 0)); droneGain.gain.value = on * (playing ? 0.04 * (1 - s.light) : 0); }
  draw(now);
  requestAnimationFrame(frame);
}
show('menu');
requestAnimationFrame(frame);
</script>
