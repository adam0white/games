name: Deploy
on:
  workflow_dispatch:
    inputs:
      deployer:
        description: cf is the default. wrangler is the rollback path.
        type: choice
        options: [cf, wrangler]
        default: cf
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: games-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          run_install: false
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: Require owner-provided deployment secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Add the CLOUDFLARE_API_TOKEN repository Actions secret. See README.md.'
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - name: Build, deploy exact green main, and verify every live release
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GAMES_DEPLOY_BUNDLE_DIR: ${{ runner.temp }}/games-uploaded-bundle
          GAMES_DEPLOYER: ${{ inputs.deployer || 'cf' }}
        run: pnpm deploy
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: games-static-${{ github.event.workflow_run.head_sha || github.sha }}
          path: ${{ runner.temp }}/games-uploaded-bundle/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
