<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#272036">
<title data-i18n="title"></title>
<style>
  :root { color-scheme: dark; background: #272036; color: #fff1ce; font: 600 15px/1.25 system-ui, sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; touch-action: none; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
  #stage { position: fixed; inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #layout { position: absolute; width: 360px; height: 640px; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(var(--scale, 1)); pointer-events: none; }
  [hidden] { display: none !important; }
  .screen { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; }
  .screen.on { display: flex; }
  .screen.on :is(button, a, label) { pointer-events: auto; }
  h1, h2 { font-family: Georgia, serif; margin: 0; font-weight: 700; }
  #menu { align-items: end; }
  h1 { position: absolute; top: 30px; width: 100%; font-size: 84px; line-height: .88; letter-spacing: -.09em; padding-right: .09em; text-shadow: 0 3px #8b4e61, 0 6px #21182c; color: #ffe9bb; }
  h2 { font-size: 42px; letter-spacing: -.055em; }
  .panel { width: 310px; padding: 20px; border: 1px solid #cc9a7ca6; border-radius: 22px; background: #37293e; box-shadow: 0 7px #231c2d, 0 16px 38px #2019277c, inset 0 0 0 4px #ffffff07; }
  #menu .panel { margin-bottom: 21px; padding: 12px 12px 11px; }
  #menu .lab-notice { color: #f4d8bb; opacity: 1 !important; }
  .row { display: flex; gap: 8px; justify-content: center; }
  .row + .row { margin-top: 8px; }
  button { color: #fff1ce; font: inherit; min-height: 44px; border: 1px solid #936679; border-radius: 11px; padding: 7px 13px; background: #513950; box-shadow: 0 2px #291f31; cursor: pointer; touch-action: manipulation; }
  button:hover { background: #66495e; }
  button:active { transform: translateY(1px); box-shadow: none; }
  button:focus-visible { outline: 3px solid #ffe6a9; outline-offset: 3px; }
  .row button { flex: 1; }
  button.primary { background: #f6c17b; border-color: #ffdda1; color: #39253a; }
  .language { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-width: max(62px, calc(44px / var(--scale, 1))); min-height: max(44px, calc(44px / var(--scale, 1))); padding-inline: 8px; }
  #menuLanguage { position: absolute; inset: 13px 12px auto auto; }
  #paused h2 { font-size: 35px; line-height: 1.05; }
  #paused .language { flex: 0 0 68px; }
  #play { font-size: 19px; min-height: 51px; width: 100%; margin-bottom: 8px; }
  #progress { font-size: .82em; padding-left: 7px; }
  #pause { position: absolute; top: 13px; left: 12px; width: 44px; padding: 0; pointer-events: auto; border-radius: 15px; color: #ffe5b3; }
  #paused, #done, #cases, #sharing, #calendar { background: #211a2bab; border-radius: 18px; }
  #paused .row { margin-top: 12px; }
  .lab-toggle { margin: 10px 0 0; color: #ecd8c7; font-size: 12px; }
  .lab-toggle input { accent-color: #f7be69; }
  #resultArt { width: 266px; height: auto; display: block; margin: 0 auto 10px; }
  #share { width: 100%; margin: 9px 0 0; }
  #shareArt { width: 240px; height: 168px; display: block; margin: 0 auto 10px; }
  #caseGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0 15px; }
  #chapterTabs { display: flex; gap: 5px; margin: 12px 0 0; }
  #chapterTabs button { flex: 1; padding: 0; min-width: 0; }
  #calendarGrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 13px 0; }
  #calendarGrid div { background: #473249; min-height: 38px; border: 1px solid #72546a; border-radius: 6px; font: 700 12px Georgia, serif; padding: 4px 0; }
  #calendarGrid span { display: block; color: #ffd18b; height: 12px; }
  #calendarGrid [aria-current="date"] { border-color: #ffe3ad; }
  #calendarGrid .marked { background: #654b51; }
  #calendar h2 { font-size: 30px; }
  #calendarDates { display: block; margin: 4px 0; font: 700 13px Georgia, serif; color: #eed6bc; }
  #calendarHeading { margin-top: 4px; font: 700 17px Georgia, serif; color: #f9d6a1; }
  #hardDaily { line-height: 1.15; }
  #learn { width: 100%; margin-bottom: 8px; }
  #coach { position: absolute; left: 16px; right: 16px; top: 113px; min-height: 52px; display: flex; align-items: center; gap: 8px; padding: 2px 8px 2px 12px; border: 2px solid #f6c17b; border-radius: 13px; background: #2c2337f2; font-size: 14.5px; line-height: 1.17; pointer-events: none; }
  #learn.fresh { border: 2px solid #f6c17b; color: #ffdda1; }
  #coachText { flex: 1; margin: 0; }
  /* cases 1 to 7 show the guide line in words too (tester t1, note #268); later cases keep it for screen readers only */
  #playGuide.shown { position: absolute; left: 16px; right: 16px; top: 113px; width: auto; height: auto; overflow: visible; clip-path: none; white-space: normal; margin: 0; padding: 7px 12px; border: 2px solid #f6c17b; border-radius: 13px; background: #2c2337e6; font-size: 14.5px; line-height: 1.17; pointer-events: none; }
  #coachCount { color: #f6c17b; font-size: 11px; }
  #coachOk { pointer-events: auto; padding: 6px 12px; }
  #hardDaily small { display: block; margin-top: 2px; font-size: 12px; }
  #shareStatus { margin: 0; color: #f5d9b5; }
  #shareStatus svg { display: block; margin: 0 auto 12px; }
  /* The Daily, Cases and sound row keeps one line in both languages at 360 px,
     so toggling sound never changes the menu's height. */
  #menu .row.tight { gap: 6px; }
  #menu .row.tight button, #pauseSound { white-space: nowrap; padding-inline: 5px; }
  #menu .row.tight button { flex: 1 1 auto; }
  #menu .lab-notice a { display: block; min-height: 44px; width: max-content; min-width: 44px; margin: auto; align-content: center; }
  #menu .panel { padding-bottom: 0; }
  #hardDaily:disabled { color: #ebd1cf; background: #433044; cursor: default; }
  #skipReveal { position: absolute; bottom: 24px; left: 50%; translate: -50%; pointer-events: auto; min-width: 70px; font-size: 22px; }
  #caseGrid button { padding: 0; min-height: 44px; font-size: 14px; }
  #caseGrid button span { display: block; font-size: 8px; color: #f7be69; min-height: 10px; }
  #caseGrid button.primary span { color: #7b3d24; }
  #goal, #caseStars { margin: 0 0 10px; font: 700 15px Georgia, serif; color: #f9d6a1; }
  #goal span { display: block; margin-bottom: 3px; color: #fff1ce; font-size: 17px; }
  #caseStars { margin: 6px 0 0; }
  #caseGrid button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<main id="stage">
  <canvas id="c" data-i18n-aria="replay" aria-keyshortcuts="ArrowLeft ArrowRight"></canvas>
  <div id="layout">
    <p id="playGuide" class="sr-only" role="status"></p>
    <button id="pause" data-i18n-aria="pause" hidden><svg width="19" height="20" viewBox="0 0 19 20" aria-hidden="true"><path d="M6 4v12m7-12v12" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg></button>
    <div id="coach" hidden><p id="coachText" role="status"></p><button id="coachOk" class="primary" data-i18n="learnOk"></button><span id="coachCount"></span></div>
    <section id="menu" class="screen">
      <h1 data-i18n="title"></h1>
      <button id="menuLanguage" class="language" data-i18n-aria="switchLanguage"><svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="10" cy="10" r="8"/><ellipse cx="10" cy="10" rx="3.5" ry="8"/><path d="M2 10h16"/></svg><span data-i18n="languageCode"></span></button>
      <div class="panel">
        <button id="play" class="primary"><span data-i18n="play"></span> <span id="progress"></span></button>
        <button id="learn" data-i18n="howTo"></button>
        <div class="row tight">
          <button id="daily"><span data-i18n="daily"></span> <span id="streak"></span></button>
          <button id="pickCase" data-i18n="cases"></button>
          <button id="menuSound"></button>
        </div>
        <div class="row">
          <button id="hardDaily"></button>
          <button id="openCalendar" data-i18n="calendar" data-i18n-aria="streakCalendar"></button>
        </div>
      </div>
    </section>
    <button id="skipReveal" data-i18n-aria="skipReveal" hidden><span aria-hidden="true">»</span></button>
    <section id="cases" class="screen">
      <div class="panel">
        <h2 data-i18n="cases"></h2>
        <p id="caseStars"></p>
        <div id="chapterTabs" role="group" data-i18n-aria="chapters"></div>
        <div id="caseGrid"></div>
        <button id="caseMenu" data-i18n="menu"></button>
      </div>
    </section>
    <section id="paused" class="screen">
      <div class="panel">
        <h2 data-i18n="paused"></h2>
        <div class="row"><button id="resume" class="primary" data-i18n="resume"></button><button id="toMenu" data-i18n="menu"></button></div>
        <div class="row">
          <button id="pauseSound"></button>
          <button id="pauseLanguage" class="language" data-i18n-aria="switchLanguage"><svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="10" cy="10" r="8"/><ellipse cx="10" cy="10" rx="3.5" ry="8"/><path d="M2 10h16"/></svg><span data-i18n="languageCode"></span></button>
        </div>
      </div>
    </section>
    <section id="done" class="screen" aria-labelledby="result">
      <div class="panel">
        <h2 id="result" class="sr-only"></h2>
        <canvas id="resultArt" role="img" width="480" height="214" data-i18n-aria="result"></canvas>
        <p id="goal" hidden></p>
        <div class="row"><button id="again" class="primary" data-i18n="again"></button><button id="next" data-i18n="next"></button><button id="endMenu" data-i18n="menu"></button></div>
        <button id="share" data-i18n="share" hidden></button>
      </div>
    </section>
    <section id="calendar" class="screen">
      <div class="panel">
        <h2 data-i18n="dailyStreaks"></h2>
        <div id="calendarHeading"></div>
        <span id="calendarDates"></span>
        <div id="calendarGrid"></div>
        <div class="row"><button id="calendarMenu" data-i18n="menu"></button></div>
      </div>
    </section>
    <section id="sharing" class="screen">
      <div class="panel">
        <canvas id="shareArt" role="img" width="720" height="504" data-i18n-aria="shareCard"></canvas>
        <div id="shareStatus" role="status"><span class="sr-only"></span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path/></svg></div>
        <div class="row"><button id="sendShare" class="primary" data-i18n="saveImage"></button><button id="closeShare" data-i18n="back"></button></div>
      </div>
    </section>
  </div>
</main>
<script type="module" src="./game.js"></script>
<script src="/notes/button.js" defer></script>
</body>
</html>
