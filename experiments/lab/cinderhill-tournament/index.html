<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1c1820">
<title>Border Tournament</title>
<style>
:root{color-scheme:dark;--ink:#f3e6d2;--dim:#f3e6d299;--accent:#ff9a4d;--mine:#d8642f;--theirs:#8f8a84;--panel:#2a2228;--line:#ffffff22}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1c1820;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{font:15px/1.35 ui-rounded,'Trebuchet MS',system-ui,sans-serif;color:var(--ink)}
#c{position:fixed;inset:0;display:block;width:100vw;height:100dvh;touch-action:none}
button{font:inherit;color:inherit;min-width:48px;min-height:48px;border:1px solid var(--line);background:#ffffff0d;border-radius:14px;touch-action:manipulation;cursor:pointer}
button:active{transform:scale(.96)}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}button:disabled{opacity:.35}
button.primary{background:var(--accent);color:#24160f;border:0;font-weight:800;font-size:19px;box-shadow:0 4px 0 #0005}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top)) calc(70px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left));pointer-events:none;display:none}
#hud.on{display:block}
#names{display:flex;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:.5px}#names .them{color:var(--theirs)}#names .me{color:var(--mine)}
#clock{font-variant-numeric:tabular-nums;color:var(--dim)}
#tug{position:relative;height:18px;margin:4px 0 6px;border-radius:9px;background:linear-gradient(90deg,var(--mine) 0 50%,var(--theirs) 50% 100%);opacity:.95;overflow:hidden}
#tug::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:#0008}
#knot{position:absolute;top:-2px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:var(--ink);border:3px solid #1c1820;left:50%;transition:left .12s linear}
.why{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:6px;font-size:11px;color:var(--dim);margin:2px 0}
.bar{position:relative;height:8px;border-radius:4px;background:#ffffff12}.bar i{position:absolute;top:0;bottom:0;border-radius:4px}.bar::after{content:'';position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:#fff5}
#whyLine{font-size:12px;margin:4px 0 0;color:var(--ink);min-height:16px}
#days{font-size:10.5px;color:var(--dim);margin-top:2px;display:flex;justify-content:space-between;gap:8px}
#pause{position:fixed;right:calc(12px + env(safe-area-inset-right));top:calc(8px + env(safe-area-inset-top));width:48px;height:48px;background:#1c1820cc;display:none;font-size:18px;z-index:3}
#controls{position:fixed;left:0;right:0;bottom:0;padding:0 calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));display:none;z-index:2}
#controls.on{display:block}
#counts{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);padding:0 4px 6px;text-shadow:0 1px 2px #000}
#counts b{color:var(--ink);font-weight:700}
#verbs{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:8px;max-width:520px;margin:0 auto}
#verbs button{min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:#231c22e6;font-weight:700;font-size:16px}
#verbs button small{font-weight:400;font-size:11px;opacity:.75}
#verbs #send{background:var(--accent);color:#24160f;border:0;box-shadow:0 4px 0 #0005;font-size:18px}
#verbs button.flash{outline:3px solid var(--ink)}
.screen{display:none;position:fixed;inset:0;place-items:center;padding:16px 16px max(16px,env(safe-area-inset-bottom));background:#120e1299;overflow-y:auto;touch-action:pan-y;z-index:4}
.screen.on{display:grid}
.card{width:min(100%,380px);text-align:center;padding:20px 18px;background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 60px #0006}
#menu{background:linear-gradient(#120e1200 0,#120e12aa 30%,#120e12ee 70%)}
h1{font:normal 36px/1.05 Georgia,serif;margin:4px 0 8px}h2{font:normal 32px/1.1 Georgia,serif;margin:6px 0 10px}p{margin:8px 0}
.eyebrow{font-size:10px;font-weight:bold;letter-spacing:3px;text-transform:uppercase;color:var(--accent)}.sub{font-size:13px;color:var(--dim)}
#foes{display:grid;gap:8px;margin:12px 0}
#foes button{display:grid;grid-template-columns:20px 1fr;gap:2px 10px;text-align:left;padding:8px 12px;align-items:center}
#foes button i{grid-row:span 2;width:18px;height:18px;border-radius:50%}
#foes button b{font-size:16px}#foes button span{font-size:12px;color:var(--dim)}
#foes button[aria-pressed=true]{border-color:var(--accent);background:#ff9a4d1c}
#play,#resume,#again{width:100%;min-height:56px;margin:4px 0 10px}
.row{display:flex;gap:8px;justify-content:center}.row>*{flex:1;font-size:13px}
#endMark{font-size:40px;color:var(--accent)}#endWhy{color:var(--ink)}
@media(max-height:640px){h1{font-size:28px}.lede{display:none}#verbs button{min-height:58px}}
@media(orientation:landscape) and (max-height:500px){#verbs{max-width:none;grid-template-columns:1fr 1.25fr 1fr}#verbs button{min-height:52px}#hud{padding-right:calc(70px + env(safe-area-inset-right))}.lede{display:none}#foes{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){#hud{padding-left:calc(50vw - 360px);padding-right:calc(50vw - 360px)}}
@media(prefers-reduced-motion:reduce){button:active{transform:none}#knot{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="Two colonies of ants face off in a ring of ash." data-i18n-aria="canvas"></canvas>
<div id="hud" aria-live="off">
  <div id="names"><span class="me" id="meName">Cinderhill</span><span id="clock">1:30</span><span class="them" id="themName">Thornbacks</span></div>
  <div id="tug" role="meter" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0"><div id="knot"></div></div>
  <div class="why"><span data-i18n="numbers">Numbers &amp; size</span><div class="bar"><i id="numBar"></i></div></div>
  <div class="why"><span data-i18n="freshness">Freshness</span><div class="bar"><i id="freshBar"></i></div></div>
  <p id="whyLine"></p>
  <div id="days"><span id="myDay"></span><span id="theirDay"></span></div>
</div>
<button id="pause" aria-label="Pause" data-i18n-aria="pause">Ⅱ</button>
<div id="controls">
  <div id="counts"><span id="cHome"></span><span id="cWay"></span><span id="cRing"></span></div>
  <div id="verbs">
    <button id="rotate"><span data-i18n="rotate">Rotate</span><small data-i18n="rotateSub">swap tired</small></button>
    <button id="send"><span data-i18n="send">Send wave</span><small id="sendSub"></small></button>
    <button id="hold"><span data-i18n="hold">Hold</span><small data-i18n="holdSub">call back</small></button>
  </div>
</div>
<div id="menu" class="screen on"><div class="card">
  <div class="eyebrow" data-i18n="eyebrow">Cinderhill · lab toy</div><h1 data-i18n="title">Border Tournament</h1>
  <p class="sub lede" data-i18n="lede"></p>
  <p class="sub" id="yourAnts"></p>
  <div id="foes" role="group" aria-label="Who is at the border?" data-i18n-aria="pick"></div>
  <button id="play" class="primary" data-i18n="play">Go to the border</button>
  <div class="row"><button id="sound1">Sound: on</button><button id="lang1">Türkçe</button></div>
</div></div>
<div id="paused" class="screen"><div class="card">
  <h2 data-i18n="paused">Paused</h2>
  <button id="resume" class="primary" data-i18n="resume">Continue</button>
  <div class="row"><button id="quit" data-i18n="menu">Menu</button><button id="sound">Sound: on</button><button id="lang2">Türkçe</button></div>
</div></div>
<div id="end" class="screen"><div class="card">
  <div id="endMark">✦</div><h2 id="endTitle"></h2>
  <p id="endLine" class="sub"></p><p id="endWhy" class="sub"></p><p id="endTip" class="sub"></p><p id="endStats" class="sub"></p>
  <button id="again" class="primary" data-i18n="again">Again</button>
  <div class="row"><button id="toMenu" data-i18n="menu">Menu</button></div>
</div></div>
<script type="module" src="./main.js"></script><script src="/notes/button.js" defer></script>
</body></html>
