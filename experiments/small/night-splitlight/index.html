<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b121d">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <title>Splitlight</title>
</head>
<body>
  <main class="instrument">
    <div class="bench">
      <header class="readout">
        <div class="names">
          <div id="plate" class="engraving">Plate 01 / 18</div>
          <h1 id="plate-name">First light</h1>
        </div>
        <div class="receivers">
          <output id="captured" aria-labelledby="receiver-label">0 / 1</output>
          <div class="engraving" id="turns">Turns 0 · par 1</div>
          <span id="receiver-label" class="sr" data-i18n="receivers">Receivers</span>
        </div>
        <button id="daily" type="button">Today</button>
        <button id="pause" type="button" aria-label="Pause"><span aria-hidden="true"></span></button>
      </header>
      <div class="window">
        <canvas id="field" width="360" height="400" aria-label="A light beam passes through glass. Turn the glass so each colour reaches its receiver."></canvas>
      </div>
      <div class="dial">
        <label class="engraving" for="angle" id="dial-label">Turn prism</label>
        <div class="row">
          <div id="parts" hidden></div>
          <div class="control">
            <span class="cue" aria-hidden="true"></span>
            <input id="angle" type="range" min="0" max="1000" step="1" value="80">
          </div>
        </div>
      </div>
      <section id="result" aria-labelledby="result-title">
        <h2 id="result-title">Plate exposed</h2>
        <p id="result-line"></p>
        <div id="pips" role="img" hidden></div>
        <p id="teaser"></p>
        <div class="pair">
          <button class="primary" id="next" type="button">Next plate</button>
          <button id="again" type="button" data-i18n="again">Replay plate</button>
          <button id="share" type="button" data-i18n="share" hidden>Share</button>
        </div>
      </section>
    </div>
  </main>

  <section id="paused" class="sheet" role="dialog" aria-modal="true" aria-labelledby="pause-title">
    <div class="card">
      <h2 id="pause-title" data-i18n="paused">Paused</h2>
      <button class="primary" id="resume" type="button" data-i18n="resume">Resume</button>
      <div class="pair">
        <button id="restart" type="button" data-i18n="restart">Restart plate</button>
        <button id="sound" type="button" aria-pressed="true">Sound on</button>
      </div>
      <div class="pair">
        <button id="first" type="button" data-i18n="first">Replay plate 1</button>
        <button id="lang" type="button" data-i18n="otherLang">Türkçe</button>
      </div>
    </div>
  </section>
  <script type="module" src="./main.js"></script>
  <script src="/notes/button.js" defer></script>
</body>
</html>
