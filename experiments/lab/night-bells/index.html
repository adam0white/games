<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111e30">
<title>Night Bells</title>
<style>
:root{color-scheme:dark;--ink:#f9e7be;--accent:#ffcd75;--panel:#192b3e;--line:#ffffff25}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111e30;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}body{font:16px/1.4 ui-rounded,'Trebuchet MS',system-ui,sans-serif;color:var(--ink)}
#c{display:block;width:100vw;height:100dvh;touch-action:none}#probe{position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;min-width:48px;min-height:48px;border:1px solid var(--line);background:#ffffff08;border-radius:14px;touch-action:manipulation;cursor:pointer}button:active{transform:scale(.96)}button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:disabled{opacity:.3}button.primary{background:var(--accent);color:#172235;border:0;font-weight:800;font-size:20px;box-shadow:0 4px 0 #0004}
.screen{display:none;position:fixed;inset:0;place-items:center;padding:20px 18px max(20px,env(safe-area-inset-bottom));background:#08152599;overflow-y:auto;touch-action:pan-y}.screen.on{display:grid}#menu{background:linear-gradient(transparent 28%,#101e3040 45%,#101e30 80%);align-items:end}.card{width:min(100%,350px);text-align:center;padding:24px 20px;background:var(--panel);border:1px solid var(--line);border-radius:26px;box-shadow:0 18px 60px #0004}#menu .card{padding:18px 16px 14px;background:transparent;border:0;box-shadow:none}
h1{font:normal 44px/1 Georgia,serif;letter-spacing:-1px;margin:4px 0 10px}h2{font:normal 36px/1.1 Georgia,serif;margin:8px 0 12px}p{margin:10px 0}.eyebrow{font-size:10px;font-weight:bold;letter-spacing:3px;text-transform:uppercase;color:var(--accent)}.sub{font-size:13px;opacity:.7}.row{display:flex;gap:10px;justify-content:center}.row>*{flex:1}#play{width:100%;min-height:58px}#levels{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:13px 0}#levels button{font-size:15px;min-height:48px}#levels button.done{border-color:var(--accent);color:var(--accent)}#levels button.selected{background:#ffffff16}#looks{display:flex;gap:10px;justify-content:center;margin-top:8px}#looks button{border-radius:50%;width:48px;min-width:48px;background:transparent;padding:12px}#looks i{display:block;width:22px;height:22px;border-radius:50%;border:2px solid #fff8}#looks button[aria-pressed=true]{border-color:var(--accent)}
#pause{position:fixed;right:16px;top:calc(16px + env(safe-area-inset-top));width:48px;height:48px;background:#122339bb;display:none;font-size:20px;z-index:2}.pad{position:fixed;display:none;border:0;border-radius:50%;background:transparent;color:transparent;z-index:1;touch-action:none}.pad:focus-visible{outline-color:var(--accent)}#next,#resume{width:100%;margin:8px 0 12px}#endMark{font-size:40px;color:var(--accent)}#sound1,#endless{font-size:13px}#best{margin:8px 0 0;font-size:11px;opacity:.65}
/* Rhythm-specific gesture is drawn on the canvas; the kit still owns its lifecycle and reduced-motion label. */
.kit-hint:not(.still)>*{visibility:hidden}
@media(max-height:700px){#menu .eyebrow{display:none}#menu .card{padding:8px 16px 0}h1{font-size:35px}#looks{margin-top:2px}#levels{margin:8px 0;gap:4px}.eyebrow{letter-spacing:2px}}
@media(prefers-reduced-motion:reduce){button:active{transform:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="Bells swinging above a village. Tap a bell or its circle when its ring glows."></canvas><div id="probe"></div>
<button id="pad0" class="pad" aria-label="Ring bell 1"></button><button id="pad1" class="pad" aria-label="Ring bell 2"></button><button id="pad2" class="pad" aria-label="Ring bell 3"></button>
<button id="pause" aria-label="Pause">Ⅱ</button>
<div id="menu" class="screen on"><div class="card">
<div class="eyebrow">A village after dark</div><h1>Night Bells</h1>
<button id="play" class="primary" aria-label="Play">▶</button>
<div id="levels" aria-label="Choose level"></div>
<div class="row"><button id="endless">Endless ∞</button><button id="sound1">Sound on</button></div>
<p id="best">Best on this device · 0</p>
<div id="looks" aria-label="Choose palette"><button data-look="amber" aria-label="Amber palette"><i style="background:#ffcd75"></i></button><button data-look="moon" aria-label="Moon palette"><i style="background:#a6dfef"></i></button><button data-look="rose" aria-label="Rose palette"><i style="background:#f0abc1"></i></button></div>
</div></div>
<div id="paused" class="screen"><div class="card"><div class="eyebrow">The village can wait</div><h2>Paused</h2><button id="resume" class="primary">Continue</button><div class="row"><button id="quit">Menu</button><button id="sound2">Sound on</button></div></div></div>
<div id="end" class="screen"><div class="card"><div id="endMark">✦</div><div class="eyebrow" id="endLabel">Village alight</div><h2 id="endTitle">A little brighter.</h2><p id="endLine" class="sub"></p><button id="next" class="primary">Next →</button><div class="row"><button id="retry">Again</button><button id="toMenu">Menu</button></div></div></div>
<script type="module" src="./main.js"></script><script src="/notes/button.js" defer></script>
</body></html>
