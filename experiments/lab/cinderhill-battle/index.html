<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171b1b">
<title>Cinderhill battle toy</title>
<style>
:root{color-scheme:dark;--ink:#fff1d9;--muted:#c2b7a4;--ash:#171b1b;--panel:#252929;--edge:#454543;--ember:#ffc180;--rival:#9fe1da}
*{box-sizing:border-box}
body{margin:0;background:var(--ash);color:var(--ink);font:15px/1.3 system-ui,sans-serif}
button,a{color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;min-height:48px;border:1px solid var(--edge);border-radius:10px;background:#252929;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
button[aria-pressed=true]{border-color:var(--ember);background:#4b3929}
.primary{background:var(--ember);color:#271b14;border:none;font-weight:750}
#battle{position:fixed;inset:0;margin:auto;width:min(100%,720px);display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));gap:8px}
#hud{display:grid;gap:7px}
#names{display:grid;grid-template-columns:1fr auto 1fr auto;align-items:center;gap:10px;font-size:13px;font-weight:680}
#me{color:var(--ember)}#foe{color:var(--rival);text-align:right}#clock{font-size:20px;font-variant-numeric:tabular-nums}
#pause{width:44px;min-height:44px}
#phase{font-size:11px;color:var(--muted);text-align:center;margin:0}
#areas{padding-right:36px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;font-size:11px;text-align:center;color:var(--muted)}
.meter{margin-top:3px;display:flex;justify-content:center;align-items:center;height:7px;border-radius:4px;background:#343837;overflow:hidden}
.meter>span{width:50%;display:flex;height:100%}.meter>span:first-child{justify-content:flex-end}
.meter::after{content:'';position:absolute;height:7px;width:1px;background:var(--ink)}
.meter i{display:block;background:var(--rival)}.meter>span:first-child i{background:var(--ember)}
#board{width:100%;height:auto;align-self:stretch;min-height:0;contain:size;display:block;touch-action:none;user-select:none}
#orders{display:grid;gap:5px}
#status{font-size:12px;text-align:center;color:var(--muted);min-height:1.3em;margin:0}
#verbs,.row{display:flex;gap:8px}
#verbs>* , .row>*{flex:1;min-width:0}
#verbs button{font-size:14px;font-weight:650}
.screen{display:none;position:fixed;inset:0;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:#101313bc;overflow:auto;z-index:2}
.screen.on{display:flex}
.card{margin:auto;width:min(100%,390px);padding:20px;background:var(--panel);border:1px solid var(--edge);border-radius:18px;box-shadow:0 20px 60px #0007}
h1,h2{font:400 clamp(28px,7vw,39px)/1.03 Georgia,serif;margin:0 0 8px}
p{margin:8px 0}.sub{font-size:13px;color:var(--muted)}
#foes{display:grid;gap:6px;margin:12px 0}
#foes button{text-align:left;padding:6px 11px}
#foes button strong,#foes button small{display:block}
#foes small{color:var(--muted)}
#play,#resume,#again{width:100%;min-height:54px;margin:6px 0 8px}
#variants{display:flex;gap:5px;margin:10px 0 6px}
#variants a{display:grid;place-items:center;flex:1;min-height:44px;text-align:center;text-decoration:none;border:1px solid var(--edge);border-radius:8px;font-size:12px}
#variants a[aria-current=true]{border-color:var(--ember);color:var(--ember)}
@media (min-width:620px) and (max-height:550px){
  #battle{grid-template-columns:minmax(0,1fr) 245px;grid-template-rows:1fr 1fr}
  #board{grid-column:1;grid-row:1/3}#hud{grid-column:2;grid-row:1;align-self:end}#orders{grid-column:2;grid-row:2;align-self:start}
}
</style>
</head>
<body>
<main id="battle">
  <header id="hud">
    <div id="names"><span id="me" data-i18n="you">Cinderhill</span><span id="clock">3:00</span><span id="foe"></span><button id="pause" data-i18n-aria="pause">Ⅱ</button></div>
    <div id="areas"></div><p id="phase"></p>
  </header>
  <canvas id="board" data-i18n-aria="board"></canvas>
  <div id="orders">
    <p id="status"></p>
    <div id="verbs">
      <button id="trail" aria-pressed="true" data-i18n="trail">Trail</button>
      <button id="alarm" aria-pressed="false"></button>
      <button id="recall" data-i18n="recall">Recall</button>
    </div>
  </div>
</main>
<div id="menu" class="screen on"><section class="card">
  <h1 data-i18n="title">Cinderhill battle toy</h1>
  <p class="sub" data-i18n="brief"></p>
  <div id="foes" role="group" data-i18n-aria="choose"></div>
  <div id="variants" role="group" data-i18n-aria="controls"></div>
  <button id="play" class="primary" data-i18n="play">Start battle</button>
  <div class="row"><button id="sound1"></button><button id="lang1"></button></div>
</section></div>
<div id="paused" class="screen"><section class="card">
  <h2 data-i18n="paused">Paused</h2>
  <button id="resume" class="primary" data-i18n="resume">Continue</button>
  <div class="row"><button id="quit" data-i18n="menu">Menu</button><button id="sound"></button><button id="lang2"></button></div>
</section></div>
<div id="end" class="screen"><section class="card">
  <h2 id="result"></h2><p id="reason" class="sub"></p><p id="losses" class="sub"></p>
  <button id="again" class="primary" data-i18n="again">Battle again</button>
  <div class="row"><button id="toMenu" data-i18n="menu">Menu</button></div>
</section></div>
<script type="module" src="./main.js"></script>
<script src="/notes/button.js" defer></script>
</body>
</html>
