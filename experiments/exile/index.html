<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Exile</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e1418; color: #e8e4d8; font: 16px/1.4 system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; outline: none; background: #0e1418; }
  #card { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; padding: 24px; }
  #card h1 { margin: 0 0 6px; font-size: 40px; letter-spacing: 0.04em; }
  #card p { margin: 6px 0; max-width: 34em; opacity: 0.85; }
  #bar { width: 260px; height: 8px; margin: 18px auto 0; background: #26323a; border-radius: 4px; overflow: hidden; }
  #fill { width: 0; height: 100%; background: #d9b24a; }
  #turn { display: none; position: fixed; inset: 0; z-index: 5; background: #0e1418; place-content: center; text-align: center; padding: 24px; font-size: 20px; }
  #rec { position: fixed; left: 10px; bottom: 8px; z-index: 4; max-width: 30em; padding: 6px 10px; border-radius: 8px; background: rgba(14, 20, 24, 0.72); text-align: left; font-size: 12px; -webkit-user-select: none; user-select: none; }
  #rec .lab-notice { margin: 0; }
  @media (pointer: coarse) and (orientation: portrait) { #turn { display: grid; } }
</style>
</head>
<body>
<canvas id="game" tabindex="-1"></canvas>
<div id="card">
  <h1>Exile</h1>
  <p>Framed for your father's death. Found your own kingdom in the forest, then go back for your brother.</p>
  <p id="status">Loading</p>
  <div id="bar"><div id="fill"></div></div>
</div>
<div id="rec"></div>
<div id="turn"><div>Turn your phone sideways to play.</div></div>
<script src="Build/webgl.loader.js"></script>
<script>
  // A Unity WebGL build (source outside this repo; see NOTES.md). The files are gzip with Unity's own
  // unpacking, so they need no content-encoding header from the server.
  const canvas = document.getElementById('game'), card = document.getElementById('card'), status = document.getElementById('status');
  const startUnity = () => createUnityInstance(canvas, {
    dataUrl: 'Build/webgl.data.unityweb',
    frameworkUrl: 'Build/webgl.framework.js.unityweb',
    codeUrl: 'Build/webgl.wasm.unityweb',
    companyName: 'Lab', productName: 'Exile', productVersion: '0.1',
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
    showBanner: (msg, type) => { if (type === 'error') { card.style.display = 'grid'; status.textContent = msg; } }
  }, p => { document.getElementById('fill').style.width = Math.round(p * 100) + '%'; })
    .then(() => { card.style.display = 'none'; canvas.focus(); window.exileEvent?.('loaded', JSON.stringify({ s: Math.round(performance.now() / 1000) })); })
    .catch(err => { status.textContent = 'Could not start: ' + err; window.exileEvent?.('loadFailed', JSON.stringify({ msg: String(err).slice(0, 200) })); });
  if (new URLSearchParams(location.search).get('hf') === '1') {
    import('./hf/exile-hf.js').then(startUnity).catch(err => {
      status.textContent = 'Could not load HF: ' + String(err);
    });
  } else startUnity();
  addEventListener('pointerdown', () => canvas.focus());
  // A phone must not zoom or scroll the page under the game's own touch controls.
  for (const type of ['gesturestart', 'gesturechange', 'dblclick']) addEventListener(type, e => e.preventDefault(), { passive: false });
  addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  canvas.addEventListener('contextmenu', e => e.preventDefault());
</script>
<script type="module">
  // Play records for the game lab (kit/lab.js). The game calls window.exileEvent(name, json) for a start, an end,
  // a snapshot every 20 s and each choice; this page decides whether anything is kept. The notice and its switch
  // sit in the corner while the game loads, on the title screen and after an ending; nothing is recorded before
  // the notice is on the page. A bot run (autoplay=1) records nothing unless it says it is an agent's run.
  import { lab } from '../kit/lab.js';
  const q = new URLSearchParams(location.search), box = document.getElementById('rec');
  if (q.get('autoplay') === '1' && q.get('labRunSource') !== 'agent') box.remove();
  else {
    const rec = lab('exile', { version: '0.6' });
    rec.notice(box); rec.toggle(box);
    let errors = 0;
    window.exileEvent = (name, json) => {
      let data = null; try { data = JSON.parse(json); } catch { data = { bad: String(json).slice(0, 200) }; }
      if (name === 'start') { rec.start(data); box.style.display = 'none'; }
      else if (name === 'end') { rec.end(data.outcome, data); box.style.display = ''; }
      else rec.event(name, data);
    };
    addEventListener('error', e => { if (errors++ < 3) rec.event('pageError', { msg: String(e.message).slice(0, 200) }); });
  }
</script>
</body>
</html>
