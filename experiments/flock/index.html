<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2e9d6">
  <link rel="icon" href="data:,">
  <title>Night Flock</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="folio">
    <header>
      <div class="heading">
        <div id="chapter" class="smallcaps"></div>
        <h1 data-i18n="title"></h1>
      </div>
      <button id="pause" class="round" data-i18n-aria="pause"><span class="bars" aria-hidden="true"></span></button>
    </header>
    <div class="fieldline"><span id="farm"></span><span id="weather"></span></div>
    <div class="plate">
      <canvas id="field" width="360" height="520" data-i18n-aria="field"></canvas>
      <span id="hint-drag"></span><span id="hint-hold"></span><span id="hint-outrun"></span>
    </div>
    <footer>
      <div class="measure">
        <span class="smallcaps" data-i18n="fold"></span>
        <span class="tally"><b id="home">0</b><span class="divider"> / </span><span id="total">12</span></span>
      </div>
      <div class="composure">
        <div class="dusk-label"><label for="calm" class="smallcaps" data-i18n="calm"></label><span id="calm-value">100%</span></div>
        <meter id="calm" min="0" max="100" low="50" high="78" optimum="100" value="100">100%</meter>
      </div>
      <div class="daylight">
        <div class="dusk-label"><span class="smallcaps" data-i18n="dark"></span><span id="time">–</span></div>
        <div class="dusk-track"><span id="light"></span></div>
      </div>
    </footer>
    <div class="ledger"><div class="field-status"><span id="score"></span><span id="remark" role="status"></span></div><button id="field-map" class="map-link" data-i18n="mapLink"></button></div>
  </main>

  <section id="start" class="sheet" aria-labelledby="start-title"><div class="card">
    <button class="language" id="lang-start"></button>
    <div class="smallcaps" id="start-chapter"></div>
    <h2 id="start-title" data-i18n="title"></h2>
    <button class="primary" id="play"></button>
  </div></section>
  <section id="paused" class="sheet" aria-labelledby="pause-title"><div class="card">
    <button class="language" id="lang-pause"></button>
    <div class="smallcaps" id="pause-chapter"></div>
    <h2 id="pause-title" data-i18n="paused"></h2>
    <div id="pause-stars" class="goals"></div>
    <button class="primary" id="resume" data-i18n="resume"></button>
    <div class="pair"><button id="evenings" data-i18n="map"></button><button id="sound"></button></div>
  </div></section>
  <section id="evenings-screen" class="sheet" aria-labelledby="fields-title"><div class="card atlas">
    <div class="atlas-title"><div><div class="smallcaps" data-i18n="farms"></div><h2 id="fields-title" data-i18n="valley"></h2></div><span id="total-stars"></span></div>
    <div class="map"><canvas id="valley" data-i18n-aria="valleyMap"></canvas><div id="levels" data-i18n-aria="choose"></div></div>
    <div class="pair atlas-actions"><button id="daily" data-i18n="daily"></button><button id="endless" data-i18n="endless"></button></div>
    <p id="record"></p>
    <button id="back" data-i18n="back"></button>
  </div></section>
  <section id="end" class="sheet" aria-labelledby="end-title"><div class="card">
    <div id="end-caption" class="smallcaps"></div>
    <h2 id="end-title"></h2>
    <p id="end-line"></p>
    <div id="stars" data-i18n-aria="starsLabel"></div>
    <p id="end-score"></p>
    <button class="primary" id="next"></button>
    <div class="pair"><button id="retry"></button><button id="end-evenings" data-i18n="map"></button></div>
  </div></section>
  <template id="language-icon">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
      <circle cx="10" cy="10" r="8"/><ellipse cx="10" cy="10" rx="3.5" ry="8"/><path d="M2 10h16"/>
    </svg>
    <span></span>
  </template>
  <script type="module" src="./main.js"></script>
  <script src="/notes/button.js" defer></script>
</body>
</html>
