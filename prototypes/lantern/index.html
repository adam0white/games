<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05080f">
<title>Lantern</title>
<style>
  html, body { margin: 0; height: 100%; background: #05080f; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { display: block; width: 100vw; height: 100dvh; }
  #card { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; font: 16px/1.5 Georgia, 'Times New Roman', serif; color: #f3e6cf; text-align: center; transition: opacity .5s; }
  #card div { max-width: 19em; padding: 1.5em; }
  h1 { font-weight: normal; font-size: 2.6em; letter-spacing: .12em; margin: 0 0 .3em; color: #ffd9a0; text-shadow: 0 0 28px #ff9a3c88; }
  p { margin: .4em 0; opacity: .85; }
  small { display: block; margin-top: 1.4em; opacity: .55; letter-spacing: .08em; }
  #pause { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right)); width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: #ffffff14; display: none; place-items: center; touch-action: none; }
  #pause::before { content: ''; width: 4px; height: 16px; border: solid #ffd9a0aa; border-width: 0 5px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="pause" aria-label="Pause"></button>
<div id="card"><div><h1 id="title">Lantern</h1><p id="line">Carry the light down the river to dawn.</p><p id="sub">Slide your thumb anywhere to steer. Embers feed the flame.</p><small id="go">touch to begin</small></div></div>
<script type="module">
import { create, step, centre, half, reach, DT, GOAL } from './sim.js';

const query = new URLSearchParams(location.search);
const gain = Number(query.get('gain')) || 1.3; // boat travel per finger travel; ?gain= to compare
const store = { get: k => { try { return Number(localStorage.getItem(k) || 0); } catch { return 0; } }, set: (k, v) => { try { localStorage.setItem(k, String(v)); } catch {} } };
// A night is one river. Reaching dawn opens the next night; a failed night is retried.
let stage = Math.max(1, Math.floor(Number(query.get('night')) || store.get('lantern-night') || 1));
const ahead = n => n === 2 ? 'Ice drifts on the water.' : n === 3 ? 'The rocks are restless.' : 'The current runs faster.';

const canvas = document.getElementById('c'), g = canvas.getContext('2d');
const card = document.getElementById('card'), $ = id => document.getElementById(id);
let W = 0, H = 0, unit = 1, left = 0, dpr = 1;
function resize() {
  dpr = Math.min(2, devicePixelRatio || 1);
  W = canvas.width = Math.round(innerWidth * dpr); H = canvas.height = Math.round(innerHeight * dpr);
  unit = Math.min(W, H * 0.62); left = (W - unit) / 2; // the river is one unit wide
}
addEventListener('resize', resize); resize();

let s = create(1, stage), playing = false, paused = false, target = 0.5, acc = 0, last = 0, shake = 0, glow = 0, sparks = [], ended = -1e9;
const sx = x => left + x * unit, sy = y => H * 0.74 - (y - s.y) * unit;
if (stage > 1) $('go').textContent = `touch to begin night ${stage}`;
window.lanternState = () => ({ x: s.x, t: s.t, over: s.over, target, playing, paused, stage, unit: unit / dpr }); // read by the touch checks

// Sound: all synthesized, started by the first touch.
let ac, water, drone, droneGain, streak = 0;
function audio() {
  if (ac) return; ac = new (window.AudioContext || window.webkitAudioContext)();
  const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const n = ac.createBufferSource(); n.buffer = buf; n.loop = true;
  water = ac.createBiquadFilter(); water.type = 'bandpass'; water.frequency.value = 500; water.Q.value = 0.6;
  const wg = ac.createGain(); wg.gain.value = 0.05; n.connect(water).connect(wg).connect(ac.destination); n.start();
  drone = ac.createOscillator(); drone.type = 'sine'; drone.frequency.value = 55;
  droneGain = ac.createGain(); droneGain.gain.value = 0; drone.connect(droneGain).connect(ac.destination); drone.start();
}
function tone(freq, dur, vol, type = 'sine') {
  if (!ac) return; const o = ac.createOscillator(), v = ac.createGain(), t = ac.currentTime;
  o.type = type; o.frequency.setValueAtTime(freq, t); v.gain.setValueAtTime(vol, t); v.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(v).connect(ac.destination); o.start(t); o.stop(t + dur);
}
const scale = [392, 440, 523.25, 587.33, 659.25, 783.99, 880, 1046.5];

function begin() {
  audio(); if (ac.state === 'suspended') ac.resume();
  s = create((Math.random() * 2 ** 31) | 0, stage); target = s.x; playing = true; acc = 0; streak = 0; sparks = []; card.style.opacity = 0;
  pauseButton.style.display = 'grid';
}
function finish() {
  playing = false; ended = performance.now();
  pauseButton.style.display = 'none'; drag = null;
  const pct = Math.min(100, Math.round(s.y / GOAL * 100)), key = `lantern-best-${stage}`, best = Math.max(pct, store.get(key));
  store.set(key, best);
  const won = s.over === 'dawn';
  $('title').textContent = won ? 'Dawn' : s.over === 'dark' ? 'Dark' : `Night ${stage}`;
  $('line').textContent = won ? `You carried it through night ${stage} with ${s.taken} embers.` : s.over === 'dark' ? 'The flame went out.' : s.over === 'bank' ? 'You ran onto the bank.' : s.over === 'ice' ? 'You struck the ice.' : 'You struck a rock.';
  $('sub').textContent = won ? `Night ${stage + 1}: ${ahead(stage + 1)}` : `${pct}% of the way to dawn. Best ${best}%.`;
  $('go').textContent = won ? 'touch to go on' : 'touch to go again';
  if (won) { stage++; store.set('lantern-night', stage); }
  setTimeout(() => { card.style.opacity = 1; }, s.over === 'dawn' ? 2600 : 700);
}

// Steering. A finger steers by how far it has moved since it touched down, never by where it is,
// so a tap anywhere does nothing and the thumb can rest wherever is comfortable. A mouse steers by position.
const pauseButton = $('pause');
let drag = null, startTap = null;
function aim(x) { const c = centre(s, s.y), h = half(s.y) + 0.02; target = Math.max(c - h, Math.min(c + h, x)); }
function anchor(e) { drag = { id: e.pointerId, x0: e.clientX, x: e.clientX, boat0: s.x }; }
canvas.addEventListener('pointerdown', e => {
  if (paused) { resume(); startTap = { id: e.pointerId, x: e.clientX, y: e.clientY }; anchor(e); return; }
  // The tap that starts a run does not steer until that finger or mouse has moved a clear distance.
  if (!playing) { if (performance.now() - ended > 900) { begin(); startTap = { id: e.pointerId, x: e.clientX, y: e.clientY }; anchor(e); } return; }
  startTap = null;
  if (e.pointerType === 'mouse') aim((e.clientX * dpr - left) / unit); else anchor(e);
});
canvas.addEventListener('pointermove', e => {
  if (!playing || paused) return;
  if (e.pointerType === 'pen' && !(e.pressure > 0)) return;
  if (startTap && e.pointerId === startTap.id) { if (Math.hypot(e.clientX - startTap.x, e.clientY - startTap.y) < 12) return; startTap = null; if (drag) anchor(e); }
  if (e.pointerType === 'mouse') { aim((e.clientX * dpr - left) / unit); return; }
  if (!drag || e.pointerId !== drag.id) return;
  drag.x = e.clientX; aim(drag.boat0 + (e.clientX - drag.x0) * dpr / unit * gain);
});
for (const type of ['pointerup', 'pointercancel']) canvas.addEventListener(type, e => { if (e.pointerType !== 'mouse') startTap = null; if (drag && e.pointerId === drag.id) drag = null; });
// iOS Safari may refuse to start audio on touch-down; try again when the finger lifts.
for (const type of ['pointerup', 'touchend', 'click']) addEventListener(type, () => { if (ac && ac.state === 'suspended' && !paused) ac.resume(); });

// Pause: the button, P or Escape, and whenever the page loses the screen (a phone call, another app).
function pause() {
  if (!playing || paused) return; paused = true; drag = null; keys.clear();
  $('title').textContent = 'Paused'; $('line').textContent = `Night ${stage}, ${Math.round(s.y / GOAL * 100)}% of the way to dawn.`; $('sub').textContent = ''; $('go').textContent = 'touch to go on';
  card.style.opacity = 1; pauseButton.style.display = 'none'; if (ac) ac.suspend();
}
function resume() {
  if (!paused) return; paused = false; acc = 0; last = performance.now(); target = s.x;
  card.style.opacity = 0; pauseButton.style.display = 'grid'; if (ac) ac.resume();
}
pauseButton.addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); pause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
addEventListener('blur', pause); addEventListener('pagehide', pause);
const keys = new Set();
addEventListener('keydown', e => {
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { paused ? resume() : pause(); return; }
  if (paused) { if (e.key === ' ' || e.key === 'Enter') resume(); return; }
  keys.add(e.key); if (!playing && (e.key === ' ' || e.key === 'Enter') && performance.now() - ended > 900) begin();
});
addEventListener('keyup', e => keys.delete(e.key));

function tick() {
  if (keys.has('ArrowLeft') || keys.has('a')) target = s.x - 0.1;
  if (keys.has('ArrowRight') || keys.has('d')) target = s.x + 0.1;
  step(s, target);
  for (const e of s.events) {
    if (e === 'ember') { tone(scale[Math.min(streak++, scale.length - 1)], 0.5, 0.12, 'triangle'); glow = 1; for (let i = 0; i < 8; i++) sparks.push({ x: s.x, y: s.y, vx: (Math.random() - 0.5) * 0.4, vy: Math.random() * 0.5, life: 0.6 }); }
    if (e === 'graze') { tone(1320, 0.12, 0.05); glow = Math.max(glow, 0.5); }
    if (e === 'shield') { tone(880, 0.5, 0.1); setTimeout(() => tone(1320, 0.7, 0.08), 110); glow = 1; }
    if (e === 'break') {
      // The shield took the blow. Steering restarts from where the boat now is, so a held finger does not drag it back in.
      tone(240, 0.35, 0.25, 'square'); tone(1760, 0.25, 0.06); shake = 0.6; target = s.x; if (drag) { drag.x0 = drag.x; drag.boat0 = s.x; }
      for (let i = 0; i < 14; i++) sparks.push({ x: s.x, y: s.y, vx: (Math.random() - 0.5) * 0.9, vy: (Math.random() - 0.3) * 0.9, life: 0.7, blue: true });
    }
    if (e === 'hit') { tone(70, 0.5, 0.35, 'sawtooth'); shake = 1; }
    if (e === 'out') tone(110, 1.2, 0.2);
    if (e === 'dawn') [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => setTimeout(() => tone(f, 1.6, 0.1, 'triangle'), i * 180));
  }
  if (s.over) finish();
}

function draw(now) {
  const dawn = Math.max(0, (s.y / GOAL - 0.86) / 0.14), day = s.over === 'dawn' ? Math.min(1, (now - ended) / 2500) : 0;
  const ox = shake * (Math.random() - 0.5) * 14 * dpr, oy = shake * (Math.random() - 0.5) * 14 * dpr;
  g.setTransform(1, 0, 0, 1, ox, oy);
  g.fillStyle = '#1a2a20'; g.fillRect(-20, -20, W + 40, H + 40); // banks
  // water
  g.beginPath();
  const top = s.y + 0.74 * H / unit + 0.1, bot = s.y - 0.3 * H / unit - 0.1;
  for (let y = bot; y <= top; y += 0.05) g.lineTo(sx(centre(s, y) - half(y)), sy(y));
  for (let y = top; y >= bot; y -= 0.05) g.lineTo(sx(centre(s, y) + half(y)), sy(y));
  g.closePath(); g.fillStyle = '#14304a'; g.fill();
  g.strokeStyle = '#6f9a7c'; g.lineWidth = 4 * dpr; g.stroke(); // reeds at the water's edge
  // current streaks
  g.strokeStyle = '#3d6f95'; g.lineWidth = 1.5 * dpr; g.globalAlpha = 0.5;
  for (let i = Math.floor(bot * 3); i < top * 3; i++) {
    const y = i / 3, k = (Math.sin(i * 12.9898) * 43758.5453) % 1, c = centre(s, y), h = half(y);
    const x = c + (Math.abs(k) * 2 - 1) * (h - 0.03);
    g.beginPath(); g.moveTo(sx(x), sy(y)); g.lineTo(sx(x + (centre(s, y + 0.14) - c)), sy(y + 0.14)); g.stroke();
  }
  g.globalAlpha = 1;
  // rocks
  for (const k of s.rocks) {
    g.fillStyle = k.ice ? '#a9c9dc' : '#2b2f36'; g.beginPath(); g.ellipse(sx(k.x), sy(k.y), k.rad * unit, k.rad * unit * 0.86, 0, 0, 7); g.fill();
    g.fillStyle = k.ice ? '#e8f4fa' : '#59606b'; g.beginPath(); g.ellipse(sx(k.x - k.rad * 0.25), sy(k.y + k.rad * 0.3), k.rad * unit * 0.45, k.rad * unit * 0.3, -0.5, 0, 7); g.fill();
    g.strokeStyle = '#9fc6e0'; g.globalAlpha = 0.35; g.lineWidth = 2 * dpr; g.beginPath(); g.arc(sx(k.x), sy(k.y), k.rad * unit * 1.18, 0.2, 2.9); g.stroke(); g.globalAlpha = 1;
  }
  // boat
  const bx = sx(s.x), by = sy(s.y), lean = Math.max(-0.5, Math.min(0.5, (target - s.x) * 4));
  g.save(); g.translate(bx, by); g.rotate(lean * 0.5);
  g.fillStyle = '#6b4a2f'; g.beginPath(); g.moveTo(0, -0.05 * unit); g.quadraticCurveTo(0.028 * unit, -0.005 * unit, 0.016 * unit, 0.035 * unit); g.lineTo(-0.016 * unit, 0.035 * unit); g.quadraticCurveTo(-0.028 * unit, -0.005 * unit, 0, -0.05 * unit); g.fill();
  g.restore();
  // darkness with a hole of light
  const flick = 1 + Math.sin(now / 90) * 0.015 + Math.sin(now / 37) * 0.01, r = (reach(s.light) + glow * 0.09) * unit * flick;
  const dark = Math.max(0, 0.97 - dawn * 0.75 - day);
  const m = g.createRadialGradient(bx, by - 0.05 * unit, r * 0.15, bx, by - 0.05 * unit, r);
  m.addColorStop(0, 'rgba(4,6,12,0)'); m.addColorStop(0.7, `rgba(4,6,12,${dark * 0.55})`); m.addColorStop(1, `rgba(4,6,12,${dark})`);
  g.fillStyle = m; g.fillRect(-20, -20, W + 40, H + 40);
  // warm wash inside the light
  g.globalCompositeOperation = 'lighter';
  const w = g.createRadialGradient(bx, by, 0, bx, by, r * 0.8);
  w.addColorStop(0, `rgba(255,170,80,${0.22 + glow * 0.2})`); w.addColorStop(1, 'rgba(255,140,60,0)');
  g.fillStyle = w; g.fillRect(bx - r, by - r, r * 2, r * 2);
  // embers show through the dark: you can see where light is before you can see what guards it
  for (const e of s.embers) if (!e.got) {
    const ex = sx(e.x), ey = sy(e.y) + Math.sin(now / 300 + e.y * 9) * 2 * dpr, er = 0.05 * unit;
    const eg = g.createRadialGradient(ex, ey, 0, ex, ey, er);
    if (e.blue) { eg.addColorStop(0, 'rgba(210,240,255,.95)'); eg.addColorStop(0.3, 'rgba(90,170,255,.6)'); eg.addColorStop(1, 'rgba(60,120,255,0)'); }
    else { eg.addColorStop(0, 'rgba(255,214,140,.95)'); eg.addColorStop(0.25, 'rgba(255,150,60,.55)'); eg.addColorStop(1, 'rgba(255,120,40,0)'); }
    g.fillStyle = eg; g.fillRect(ex - er, ey - er, er * 2, er * 2);
  }
  for (const p of sparks) { g.fillStyle = p.blue ? `rgba(150,210,255,${p.life})` : `rgba(255,200,120,${p.life})`; g.fillRect(sx(p.x), sy(p.y), 3 * dpr, 3 * dpr); }
  // the shield: a blue ring while it is held, blinking just after it breaks
  if (s.shield || (s.safe > 0 && Math.floor(now / 90) % 2)) {
    g.strokeStyle = `rgba(120,190,255,${s.shield ? 0.8 : 0.5})`; g.lineWidth = 2.5 * dpr;
    g.beginPath(); g.arc(bx, by - 0.005 * unit, 0.06 * unit * (1 + Math.sin(now / 240) * 0.05), 0, 7); g.stroke();
  }
  // the flame itself
  const fg = g.createRadialGradient(bx, by, 0, bx, by, 0.03 * unit);
  fg.addColorStop(0, '#fff6dc'); fg.addColorStop(0.4, 'rgba(255,190,90,.9)'); fg.addColorStop(1, 'rgba(255,150,60,0)');
  g.fillStyle = fg; g.fillRect(bx - 0.03 * unit, by - 0.03 * unit, 0.06 * unit, 0.06 * unit);
  g.globalCompositeOperation = 'source-over';
  // dawn
  if (dawn > 0 || day > 0) {
    const d = g.createLinearGradient(0, 0, 0, H);
    d.addColorStop(0, `rgba(255,196,140,${Math.min(0.85, dawn * 0.45 + day * 0.6)})`); d.addColorStop(1, `rgba(120,150,190,${Math.min(0.5, dawn * 0.15 + day * 0.4)})`);
    g.fillStyle = d; g.fillRect(-20, -20, W + 40, H + 40);
  }
  // progress: a thin line at the top edge, no numbers
  g.fillStyle = 'rgba(255,217,160,.5)'; g.fillRect(0, 0, W * Math.min(1, s.y / GOAL), 3 * dpr);
}

function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000 || 0); last = now;
  if (playing && !paused) { acc += dt; while (acc >= DT && playing) { tick(); acc -= DT; } }
  shake = Math.max(0, shake - dt * 3); glow = Math.max(0, glow - dt * 2);
  for (const p of sparks) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; } sparks = sparks.filter(p => p.life > 0);
  if (ac) { water.frequency.value = 400 + 500 * (s.y / GOAL); droneGain.gain.value = playing ? 0.05 * (1 - s.light) : 0; }
  draw(now); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
