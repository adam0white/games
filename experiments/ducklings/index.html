<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#9ccf7a">
<title data-i18n="title"></title>
<style>
  html, body { margin: 0; height: 100%; background: #9ccf7a; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  body { font: 17px/1.4 ui-rounded, 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif; color: #24464a; }
  canvas#c { display: block; width: 100vw; height: 100dvh; }
  #safe { position: fixed; top: 0; left: 0; width: 0; height: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); visibility: hidden; pointer-events: none; }
  .screen { position: fixed; inset: 0; display: none; place-items: center; text-align: center; background: #e9f6efe0; overflow-y: auto; touch-action: pan-y; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; }
  #menu.screen { background: radial-gradient(ellipse at 50% 13%, #fffae5, #f0f4db 52%, #cee7d1); }
  .screen.on { display: grid; }
  .screen > div { max-width: 22em; width: calc(100% - 32px); padding: 12px 0; box-sizing: border-box; }
  h1 { font-size: 2.7em; line-height: 1.12; margin: .1em 0 .1em; color: #2f6b5e; letter-spacing: .01em; text-shadow: 0 3px 0 #fff; }
  h2 { font-size: 2em; margin: .1em 0 .2em; color: #2f6b5e; }
  p { margin: .45em 0; }
  button { font: inherit; font-weight: bold; color: #2f6b5e; background: #ffffffcc; border: 2px solid #7fbfa8; border-radius: 999px; padding: .5em 1.1em; margin: .25em; min-height: 48px; min-width: 9em; touch-action: manipulation; cursor: pointer; }
  button.main { background: #ffb43a; color: #4a2a06; border-color: #f29a1a; font-size: 1.25em; min-width: 8.5em; box-shadow: 0 4px 0 #d9801a; }
  button.main:active { transform: translateY(3px); box-shadow: 0 1px 0 #d9801a; }
  button:disabled { opacity: .4; }
  #endStars { font-size: 3em; line-height: 1.1; min-height: 1.2em; }
  #endStars span { display: inline-block; color: #c9d8d0; transform: scale(.4); opacity: 0; transition: transform .35s cubic-bezier(.3,1.8,.5,1), opacity .2s; }
  #endStars span.in { transform: scale(1); opacity: 1; }
  #endStars span.got { color: #ffb41f; text-shadow: 0 3px 0 #c97a00; }
  .score { font-size: 1.3em; font-weight: bold; color: #2f6b5e; }
  #pause { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right)); width: 48px; height: 48px; min-width: 0; min-height: 0; margin: 0; padding: 0; border-radius: 50%; display: none; place-items: center; background: #ffffffb3; border: 2px solid #7fbfa8; touch-action: none; }
  #pause::before { content: ''; width: 4px; height: 16px; border: solid #2f6b5e; border-width: 0 5px; }
  #quack { position: fixed; left: calc(14px + env(safe-area-inset-left)); bottom: calc(14px + env(safe-area-inset-bottom)); width: 72px; height: 72px; min-width: 0; min-height: 0; padding: 0; margin: 0; border-radius: 50%; display: none; font-size: 14px; line-height: 1; color: #4a2a06; border: 3px solid #f29a1a;
    background: conic-gradient(#ffb43a calc(var(--ready, 1) * 360deg), #f3e2c2 0); box-shadow: 0 3px 0 #d9801a; touch-action: none; }
  #quack[hidden] { display: none !important; }
  #quack.wait { color: #9a7a50; box-shadow: none; }
  .icon { width: 23px; height: 23px; flex: none; vertical-align: middle; }
  .language { position: absolute; top: 8px; right: 0; margin: 0; min-width: 57px; min-height: 44px;
    padding: 0 5px; display: flex; align-items: center; justify-content: center; gap: 2px; font-size: 12px; }
  .language .icon { width: 20px; height: 20px; }
  #menu > div, #paused > div { position: relative; }
  #paused .language { top: 12px; right: 12px; }
  #paused h2 { margin-inline: 55px; font-size: 1.7em; line-height: 1.1; }
  #quackDemo { position: relative; display: grid; place-items: center; margin: 0 auto; width: 60px; height: 29px; }
  #quackDemo .icon { position: absolute; }
  #quackDemo .icon:nth-child(2) { width: 17px; height: 17px; left: 2px; top: 12px; animation: group-left 2.4s ease-in-out infinite; }
  #quackDemo .icon:nth-child(3) { width: 17px; height: 17px; right: 2px; top: 12px; animation: group-right 2.4s ease-in-out infinite; }
  #quackDemo .icon:first-child { top: 0; }
  @keyframes group-left { 0%, 18%, 100% { transform: translateX(0); } 48%, 76% { transform: translateX(9px); } }
  @keyframes group-right { 0%, 18%, 100% { transform: translateX(0); } 48%, 76% { transform: translateX(-9px); } }
  #quack.wait #quackDemo .icon { animation-play-state: paused; }
  #quackDemo + span { display: grid; place-items: center; height: 20px; font-size: 12px; }
  #quackDemo + span .icon { width: 18px; height: 18px; }
  #flockHud { position: fixed; top: calc(6px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    width: max-content; max-width: calc(100% - 158px); border-radius: 14px; background: #fff9df; color: #234d46;
    padding: 4px 7px; box-sizing: border-box; text-align: center; font-size: 13px; font-weight: 800; line-height: 1.25; pointer-events: none; }
  #flockCount, #runStats, #starTip, #endLine { display: flex; justify-content: center; align-items: center; gap: 5px; }
  #runStats { margin-top: 2px; }
  .stat { display: inline-flex; align-items: center; justify-content: center; gap: 2px; white-space: nowrap; }
  #flockCount .icon { width: 18px; height: 18px; }
  #runStats .icon { width: 16px; height: 16px; }
  .goal { border: 1px dashed #9f7951; border-radius: 7px; padding: 0 4px; }
  .goal.met { border-style: solid; border-color: #72a78a; background: #e1eed6; }
  #peep, #nestDirection, #padDirection { position: fixed; transform: translateX(-50%); display: flex; align-items: center;
    padding: 2px 4px; border-radius: 10px; background: #fff5c8; color: #76501e; border: 1px solid #d99635; pointer-events: none; }
  #nestDirection { top: calc(79px + env(safe-area-inset-top)); }
  #padDirection { top: calc(120px + env(safe-area-inset-top)); }
  [hidden] { display: none !important; }
  #flockHud.low { background: #ffe1ae; color: #70320a; }
  #lightMeter { display: block; overflow: hidden; border-radius: 6px; background: #e6d9b9; margin-top: 4px; height: 6px; }
  #lightFill { display: block; height: 100%; background: #bb7316; border-radius: inherit; }
  #flockHud.low #lightFill { background: #a93e2d; }
  #sunRule { display: flex; align-items: center; justify-content: center; gap: 1px; padding-top: 2px; }
  #sunRule .icon { width: 17px; height: 17px; }
  #padReward { position: absolute; top: calc(100% + 3px); left: 50%; transform: translateX(-50%);
    justify-content: center; align-items: center; gap: 3px; display: flex; padding: 0 4px; white-space: nowrap;
    border-radius: 7px; background: #fff9df; border: 1px solid #b98230; }
  #padReward .icon { width: 16px; height: 16px; }
  #flockHud.low #sunRule { outline: 1px dashed #a93e2d; border-radius: 5px; }
  #heartState { position: fixed; top: calc(17px + env(safe-area-inset-top)); left: calc(12px + env(safe-area-inset-left)); pointer-events: none; }
  #heartState .icon { width: 19px; height: 19px; margin-right: 2px; }
  #album .icon { width: 18px; height: 18px; }
  #starTip:empty { display: none; }
  #starTip { margin: .25em 0; font-weight: 700; flex-wrap: wrap; }
  .condition { background: #fffdf1; border: 1px solid #e3cf9c; border-radius: 9px; padding: 0 5px; }
  .condition .icon { width: 20px; height: 20px; }
  #postcard + h2 { margin-bottom: 5px; }
  .screen-reader { position: absolute; top: 0; left: 0; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #menu .lab-notice { color: #345c52; font-size: 13px !important; opacity: 1 !important; }
  #menu .lab-notice a { display: grid; place-items: center; width: fit-content; min-width: 60px; min-height: 44px; margin: 0 auto; }
  #album { font-size: .95em; color: #4f7a6f; }
  #menuArt { width: 286px; height: 110px; display: block; margin: 0 auto; }
  #menu > div { width: min(340px, calc(100% - 28px)); }
  #menu h1 { margin: -.06em 0 .08em; color: #214e46; letter-spacing: -.06em; }
  #menu h1 + nav { margin-top: 10px; }
  #chapters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
  #chapters button { min-width: 0; margin: 0; padding: 3px 0; border: 1px solid #b7cab3; border-radius: 14px; background: #fffdf5; font-size: 12px; line-height: 1.2; }
  #chapters button[aria-pressed="true"] { background: var(--chapter); color: #fff; border-color: var(--chapter); }
  #chapters canvas { display: block; width: 25px; height: 23px; margin: auto; }
  #map { position: relative; isolation: isolate; margin: 8px 0 0; padding: 10px 12px; background: linear-gradient(145deg, #a6d4ca, #c5e4c8); border: 1px solid #80b5aa; border-radius: 18px; }
  #mapPath { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }
  #nodes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 12px; }
  #nodes button { min-width: 0; width: 100%; min-height: 46px; margin: 0; padding: 3px 0; background: #fffae6; border: 1px solid #719f90; border-radius: 13px; font-size: 16px; line-height: 1.05; }
  #nodes button small { display: block; font-size: 10px; color: #6e786a; height: 12px; letter-spacing: .07em; }
  #nodes button small b { color: #825119; }
  #nodes button[aria-pressed="true"] { background: #ffd47d; border: 2px solid #926133; }
  #nodes button:disabled { opacity: 1; color: #45645b; background: #e9f0dc; border-style: dashed; }
  #nodes button:nth-child(4) { grid-column: 3; }
  #nodes button:nth-child(5) { grid-column: 2; grid-row: 2; }
  #nodes button:nth-child(6) { grid-column: 1; grid-row: 2; }
  #nodes button:nth-child(n+7) { grid-row: 3; }
  #nodes:has(> :nth-child(4):last-child) { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  #nodes > :nth-child(4):last-child { grid-column: auto; }
  #menu #play { display: block; width: 100%; margin: 8px 0 6px; border-radius: 16px; font-size: 18px; }
  #menu .extras { display: grid; grid-template-columns: 1.5fr 1fr; gap: 6px; }
  #menu .extras button { margin: 0; min-width: 0; min-height: 44px; font-size: 13px; padding: 4px; border-width: 1px; }
  #album { font-size: 12px; margin: .25em 0; }
  #end.screen, #paused.screen { background: #173d3d9c; }
  #end > div, #paused > div { background: #fff9df; padding: 20px 14px; border: 2px solid #fffef0; border-radius: 27px; box-shadow: 0 9px 0 #265f5888; }
  #end #postcard { display: block; width: 100%; height: 106px; }
  #end h2 { margin: 0; letter-spacing: -.03em; line-height: 1.05; }
  #endLine { font-weight: 700; }
  #endActions { display: flex; justify-content: center; flex-wrap: wrap; gap: 5px; }
  #endActions button { min-width: 80px; margin: 0; font-size: 15px; }
  #endActions button.main { min-width: 130px; }
  #end #postcard { filter: drop-shadow(0 2px 0 #6eac9566); }
  #end #next { margin-inline: 0; width: 100%; border-radius: 16px; }
  #endStars { font-size: 2.65em; letter-spacing: .06em; }
  @media (max-height: 690px) {
    #menuArt { height: 92px; width: 240px; }
    #menu > div { padding: 7px 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    #endStars span { transition: none; }
    #quackDemo .icon:nth-child(2) { animation: none; transform: translateX(6px); }
    #quackDemo .icon:nth-child(3) { animation: none; transform: translateX(-6px); }
  }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div id="safe"></div>
<div id="peep" role="img" hidden></div>
<div id="nestDirection" role="img" data-i18n-aria="nestAhead" hidden></div>
<div id="padDirection" role="img" data-i18n-aria="padsRefill" hidden></div>
<div id="heartState" role="img" hidden></div>
<div id="flockHud" hidden>
  <div id="flockCount"></div>
  <div id="runStats"></div>
  <div id="lightMeter" aria-hidden="true" hidden><div id="lightFill"></div></div>
  <div id="sunRule" role="img" hidden></div>
  <div id="padReward" hidden></div>
</div>
<div id="guideLabel" class="screen-reader" hidden></div>
<button id="pause" data-i18n-aria="pause"></button>
<button id="quack"><span id="quackDemo" aria-hidden="true"></span><span id="quackLabel" aria-hidden="true"></span></button>

<div id="menu" class="screen on"><div>
  <button id="menuLanguage" class="language"></button>
  <canvas id="menuArt" width="600" height="230" role="img" data-i18n-aria="menuArt"></canvas>
  <h1 data-i18n="title"></h1>
  <nav id="chapters" data-i18n-aria="chapters"></nav>
  <section id="map" data-i18n-aria="levelMap"><canvas id="mapPath" aria-hidden="true"></canvas><div id="nodes"></div></section>
  <button id="play" class="main"></button>
  <div class="extras"><button id="endless"></button><button id="sound"></button></div>
  <p id="album" role="img" hidden></p>
</div></div>

<div id="paused" class="screen"><div>
  <button id="pauseLanguage" class="language"></button>
  <h2 data-i18n="paused"></h2>
  <p id="pausedLine"></p>
  <p><button id="resume" class="main" data-i18n="resume"></button></p>
  <p><button id="pauseMenu" data-i18n="leave"></button></p>
  <p><button id="sound2"></button></p>
  <div id="labSwitch"></div>
</div></div>

<div id="end" class="screen"><div>
  <canvas id="postcard" width="640" height="210" aria-hidden="true"></canvas>
  <h2 id="endTitle"></h2>
  <div id="endStars" role="img"><span aria-hidden="true">★</span><span aria-hidden="true">★</span><span aria-hidden="true">★</span></div>
  <div id="endLine"></div>
  <div id="starTip"></div>
  <p class="score" id="endScore"></p>
  <p><button id="next" class="main"></button></p>
  <div id="endActions"><button id="again" data-i18n="retry"></button><button id="endMenu" data-i18n="map"></button></div>
</div></div>

<script type="module">
import { create, step, stars, timeLeft, pathAt, view, DT, SPEED, R_MOM, hits, LAST_STAGE, ENDLESS_AFTER, ENDLESS_TIME, TRAITS, QUACK_COOL, HEARTS, duskRate } from './sim.js?v=3';
import { starFeedback, warningOnScreen } from './feedback.js';
import { CHAPTERS, LEVELS, chapterOf } from './levels.js';
import * as art from './art.js?v=4';
import { icon } from './icons.js';
import { t, lang, setLang, apply, langs, number } from './words.js';
import * as save from '../kit/save.js';
import { sound } from '../kit/audio.js';
import { onLeave, isPauseKey } from '../kit/pause.js';
import { screens } from '../kit/screens.js';
import { lab } from '../kit/lab.js';
import { hint } from '../kit/hint.js';

const $ = id => document.getElementById(id);
const query = new URLSearchParams(location.search);
const SEED = query.has('seed') ? Number(query.get('seed')) >>> 0 : undefined;
const FAST = Math.max(1, Math.min(8, Number(query.get('fast')) || 1)); // ticks per tick, for checks only
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------------------------------------------------------------- save: one JSON blob
const KEY = 'ducklings-save';
const data = { v: 1, sound: true, opened: 1, stars: {}, best: {}, endless: 0, home: 0, album: {}, taught: false, ...save.readJson(KEY, {}) };
const store = () => save.writeJson(KEY, data);
const preview = Math.min(LAST_STAGE, Math.max(0, Math.trunc(Number(query.get('level'))) || 0));
let stage = preview || Math.max(1, Math.min(LAST_STAGE, Number(data.opened) || 1));
let tab = chapterOf(stage);
const open = n => n <= data.opened || n === preview;

// ---------------------------------------------------------------- sound, all made here
let water = null;
const snd = sound({ on: () => data.sound, setup: ac => {
  // a soft lapping of water under everything
  const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  let v = 0; for (let i = 0; i < len; i++) { v = v * 0.97 + (Math.random() * 2 - 1) * 0.03; d[i] = v; }
  const n = ac.createBufferSource(); n.buffer = buf; n.loop = true;
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 700;
  water = ac.createGain(); water.gain.value = 0; n.connect(f).connect(water).connect(ac.destination); n.start();
} });
const tone = (...a) => { if (snd.ctx) snd.tone(...a); };
const noise = (...a) => { if (snd.ctx) snd.noise(...a); };
const later = (ms, fn) => setTimeout(fn, ms);
const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
const note = i => 880 * 2 ** (PENTA[Math.min(i, PENTA.length - 1)] / 12);
const peep = (f = 2200, v = 0.05) => tone(f, 0.09, v, 'sine', f * 0.35);
const sfx = {
  join(n) { for (let i = 0; i < n; i++) later(i * 55, () => peep(note(i) * 2, 0.045)); later(n * 55, () => tone(note(n) , 0.35, 0.07, 'triangle')); },
  scatter() { [2600, 2300, 2000, 2400].forEach((f, i) => later(i * 70, () => tone(f, 0.08, 0.06, 'sine', -600))); noise(0.15, 0.08, 2600); },
  gone() { tone(700, 0.5, 0.06, 'triangle', -300); later(200, () => tone(520, 0.6, 0.05, 'triangle', -200)); },
  hit() { tone(110, 0.35, 0.22, 'square', -50); noise(0.2, 0.2, 500); },
  quack() { tone(330, 0.16, 0.12, 'sawtooth', -120); later(130, () => tone(300, 0.2, 0.11, 'sawtooth', -110)); },
  bell() { tone(2637, 0.25, 0.06, 'triangle'); later(160, () => tone(2637, 0.35, 0.06, 'triangle')); },
  bubbles() { for (let i = 0; i < 4; i++) later(i * 90, () => tone(500 + i * 140, 0.06, 0.04, 'sine', 300)); },
  heron() { tone(180, 0.3, 0.08, 'sawtooth', -60); later(240, () => tone(160, 0.35, 0.07, 'sawtooth', -50)); },
  gust() { noise(0.9, 0.09, 900); },
  arrive(k) { tone(523.25 * 2 ** (PENTA[Math.min(k - 1, 10)] / 12), 0.45, 0.09, 'triangle'); peep(2400, 0.04); },
  home() { [523.25, 659.25, 783.99].forEach((f, i) => later(i * 110, () => tone(f, 0.6, 0.08, 'triangle'))); },
  win() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => later(i * 140, () => tone(f, 0.9, 0.08, 'triangle'))); },
  fail() { [392, 349.23, 293.66].forEach((f, i) => later(i * 200, () => tone(f, 0.7, 0.08, 'triangle'))); },
  touch() { tone(660, 0.05, 0.03, 'sine', 200); },
  star(i) { tone(1046.5 * 2 ** (i * 4 / 12), 0.4, 0.08, 'triangle'); },
  check() { [784, 988, 1175].forEach((f, i) => later(i * 80, () => tone(f, 0.3, 0.06, 'triangle'))); },
};

// ---------------------------------------------------------------- canvas and camera
const canvas = $('c'), g = canvas.getContext('2d');
let W = 0, H = 0, dpr = 1, u = 1, left = 0, anchor = 0, inset = { top: 0, bottom: 0 };
function resize() {
  dpr = Math.min(2, devicePixelRatio || 1);
  W = canvas.width = Math.round(innerWidth * dpr); H = canvas.height = Math.round(innerHeight * dpr);
  u = Math.min(W, H * 0.62); left = (W - u) / 2; anchor = H * 0.4;
  const cs = getComputedStyle($('safe')); inset = { top: parseFloat(cs.paddingTop) || 0, bottom: parseFloat(cs.paddingBottom) || 0 };
}
addEventListener('resize', resize); resize();
const sx = x => left + x * u;
const sy = y => anchor - (y - cam) * u;
const wx = px => (px - left) / u;
const wy = py => cam + (anchor - py) / u;

// ---------------------------------------------------------------- game state
let s = create({ stage, seed: SEED }), mode = 'stage', playing = false, paused = false, screen = 'menu';
let cam = s.mom.y, camShown = cam, acc = 0, last = performance.now(), shake = 0, flash = 0;
let prevMom = { x: s.mom.x, y: s.mom.y }, momA = 0, quackShow = 0, hurtT = 0, homeGlow = 0;
let finger = null, destination = null, keys = new Set(), wantQuack = false, waitTouch = false, trailT = 0, trailShows = 0, turnLog = [];
let parts = [], ripples = [], disp = new Map(), heads = new Map(), hops = new Map(), runners = [], nestDucks = [], recCount = 0, peepT = 0;
let padGain = null;
let sawCar = false;
let caller = null, peepUntil = 0;
const rec = lab('ducklings');
const cards = screens(['menu', 'paused', 'end']);

function show(name) {
  screen = name; cards(name);
  const play = name === 'play';
  $('flockHud').hidden = $('heartState').hidden = !play;
  for (const id of ['nestDirection', 'peep', 'padDirection', 'guideLabel']) $(id).hidden = true;
  $('pause').style.display = play ? 'grid' : 'none'; $('quack').style.display = play ? 'block' : 'none';
  if (name === 'menu') menu();
}
const starText = n => '<b>★</b>'.repeat(n) + '☆'.repeat(3 - n);
const chapterName = i => t(CHAPTERS[i].name.toLowerCase());
const levelName = n => t('level' + n);
const countText = (key, n) => t(key, { n: number(n) });
const starCount = n => countText(n === 1 ? 'oneStar' : 'stars', n);

function setPlayLabel() {
  const chapter = chapterOf(stage);
  $('play').textContent = chapter === tab
    ? t('play', { n: number(stage), level: levelName(stage) })
    : t('playChapter', { n: number(stage), chapter: chapterName(chapter) });
}

function graphic(label, content, classes = 'stat') {
  const el = document.createElement('span');
  el.className = classes;
  el.setAttribute('role', 'img');
  el.setAttribute('aria-label', label);
  el.innerHTML = content;
  return el;
}

function menu() {
  setPlayLabel();
  $('endless').disabled = data.opened <= ENDLESS_AFTER;
  $('endless').textContent = data.opened <= ENDLESS_AFTER ? countText('endlessLocked', ENDLESS_AFTER)

      runners.push({ id: e.id, x0: e.x, y0: e.y, x1: e.tx, y1: e.ty, t0: performance.now(), dur: 800 });
      disp.delete(e.id);

    if (e.type === 'gone') {

      runners.push({ id: e.id, x0: e.x, y0: e.y, x1: e.x < 0.5 ? -0.05 : 1.05, y1: e.y - 0.1, t0: performance.now(), dur: 1400, gone: true });

  for (let y = top + 0.1; y >= bottom - 0.1; y -= 0.05) g.lineTo(sx(x1 + 0.008 * Math.sin(y * 7 + 2)), sy(y));
  g.closePath();
  const gr = g.createLinearGradient(sx(x0), 0, sx(x1), 0);
  const waters = [
    ['#6bb7b3', '#a1d6c9'], ['#78a9ac', '#acd4c7'],
    ['#80a9ad', '#a7ccbf'], ['#5eafbf', '#9ed4cf'],
  ];

  gr.addColorStop(0, edge); gr.addColorStop(.48, mid); gr.addColorStop(1, edge);
  g.fillStyle = gr; g.fill();
  g.strokeStyle = art.COL.bankEdge; g.lineWidth = Math.max(2, 0.008 * u); g.stroke();
  g.save(); g.clip();

    g.fillStyle = art.COL.bank; g.beginPath(); g.moveTo(0, H + 10);
    for (let x = -0.6; x <= 1.6; x += 0.04) g.lineTo(sx(x), sy(0.06 + 0.012 * Math.sin(x * 23)));
    g.lineTo(W, H + 10); g.closePath(); g.fill(); g.strokeStyle = art.COL.bankEdge; g.stroke();
    for (let i = 0; i < 9; i++) art.reeds(g, sx(0.08 + i * 0.105 + (i % 2) * 0.02), sy(0.02 - (i % 3) * 0.02), 0.045 * u, t, i);

    for (const offset of [-3, 3]) { g.moveTo(x + offset * dpr, y - 5 * dpr); g.lineTo(x + offset * dpr, y + 5 * dpr); }
    g.stroke();
    if (v.warn || v.visible) {
      const carX = Math.max(28 * dpr, Math.min(W - 28 * dpr, sx(v.x)));
      art.chevron(g, carX, sy(road.y) - .11 * u, 8 * dpr, road.dir * Math.PI / 2);
    }
  }
}

function tailCanCross(road, delay) {
  // Include the bird delayed at the end of the line and room to react to the cue.
  const clearIn = (road.y1 + .025 - s.mom.y) / SPEED + delay + .25;
  for (let dt = .08; dt <= clearIn + .08; dt += .08) {
    if (hits(road, s.t + dt, s.mom.x, road.y, R_MOM)) return false;
  }
  return true;
}

let hudKey = '';
function drawHud(now) {
  const top = (inset.top + 12) * dpr, hudBottom = top + 72 * dpr;
  // Repeat a covered hazard warning below the HUD, at the same x.
  for (const w of warningsAt(s.t)) { const y = sy(w.y); if (y < hudBottom && y > hudBottom - 0.9 * u) { art.alert(g, sx(w.x), hudBottom + 0.07 * u + 16 * dpr, u * 0.8, now / 1000 + w.x, '#d94f3d'); hudPeeks++; } }

  const following = s.line.length, waiting = s.lost.length, home = s.arrived.length;
  const leftTime = timeLeft(s), timed = Number.isFinite(leftTime), remaining = Math.ceil(leftTime);
  const low = s.endless && leftTime <= 10;
  const faster = s.endless && duskRate(s.t) > 1;
  const reward = s.endless && padGain && now - padGain.t0 < 1400 ? padGain : null;
  const key = [lang(), s.stage, s.total, following, waiting, home, s.home, s.hearts, remaining, low, faster,
    s.score, reward?.add, reward?.scares].join('|');
  if (key !== hudKey) {
    hudKey = key;
    $('heartState').setAttribute('aria-label', countText('hearts', s.hearts));
    $('heartState').innerHTML = icon('life').repeat(s.hearts) + icon('spent').repeat(HEARTS - s.hearts);
    const flock = $('flockCount');
    flock.replaceChildren(graphic(countText('following', following), icon('duck') + number(following)));
    if (waiting && !s.endless) flock.append(graphic(countText('waiting', waiting), icon('waiting') + number(waiting)));
    if (s.home) flock.append(graphic(countText('homeCount', home), icon('nest') + number(home)));
    if (!s.endless) {
      const need = LEVELS[s.stage].need, met = home >= need;
      const label = t('goal', { n: number(need), total: number(s.total) });
      flock.append(graphic(label, icon('goal') + '≥' + number(need) +
        (met ? icon('check') : ''), `stat goal${met ? ' met' : ''}`));
    }

    const stats = $('runStats');
    if (s.endless) {
      stats.replaceChildren(graphic(countText('points', s.score), number(s.score)),
        graphic(countText('sunlight', remaining), icon('sun') + number(remaining)),
        ...(faster ? [graphic(t('lightDropsFaster'), icon('down'))] : []));
    } else if (timed) {
      stats.replaceChildren(graphic(countText('seconds', remaining), icon('clock') + number(remaining)));
    } else {
      stats.textContent = countText('stage', s.stage);
    }
    $('flockHud').classList.toggle('low', low);
    $('sunRule').hidden = !s.endless;
    $('sunRule').setAttribute('aria-label', t(low ? 'lowLight' : 'padsRefill'));
    $('lightMeter').hidden = !timed;
    $('padReward').hidden = !reward;
    if (reward) $('padReward').replaceChildren(
      graphic(t('sunlightAdded', { n: number(reward.add) }), icon('sun') + countText('padGain', reward.add)),
      ...(reward.scares ? [graphic(t('padPenalty'), icon('scatter') + icon('down'))] : []));
  }
  if (timed) $('lightFill').style.width = `${Math.min(100, Math.max(0, leftTime / (s.endless ? ENDLESS_TIME : s.time) * 100))}%`;

  const roadGuideActive = s.stage === 5 && pathAt(s, s.line.at(-1)?.delay ?? 0).y <= s.hazards[0].y1;
  const nestAhead = !s.endless && !s.home && !roadGuideActive && following >= LEVELS[s.stage].need &&
    sy(s.nest.y) < (inset.top + 79) * dpr;
  const marker = $('nestDirection');
  marker.hidden = !nestAhead;
  if (nestAhead) marker.style.left = `${Math.max(36, Math.min(W / dpr - 36, sx(s.nest.x) / dpr))}px`;
}

function drawCheckpoint(pad, now) {
  const y = sy(pad.y), x = sx(.5);
  g.strokeStyle = pad.got ? '#ffffff55' : '#fff3b6b8'; g.lineWidth = 2 * dpr; g.setLineDash([5 * dpr, 7 * dpr]);
  g.beginPath(); g.moveTo(sx(.09), y); g.lineTo(sx(.91), y); g.stroke(); g.setLineDash([]);
  art.lilyPad(g, x, y, 22 * dpr, now / 4000, !pad.got);
  if (!pad.got) art.sun(g, x, y, 9 * dpr);
}

// Where warnings are showing at time t: the side a log or bike comes from, or the hazard itself.
function warningsAt(t) {
  const out = [];
  for (const h of s.hazards) {
    if (h.y0 > s.mom.y + 3 || h.y1 < s.mom.y) continue;
    const v = view(h, t);
    if (h.kind === 'log') { if (v.logs.some(l => l.warn)) out.push({ x: h.dir > 0 ? 0.06 : 0.94, y: h.y }); }
    else if (h.kind === 'car' && v.warn) out.push({ x: h.dir > 0 ? 0.08 : 0.92, y: h.y });
    else if (h.kind === 'bike') { for (const b of v.bikes) if (b.warn) out.push({ x: b.dir > 0 ? 0.06 : 0.94, y: h.y }); }
    else if (v.phase === 'warn') out.push({ x: h.kind === 'heron' ? h.px + h.side * 0.06 : h.kind === 'gust' ? 0.5 : h.x, y: h.kind === 'heron' ? h.py : h.kind === 'gust' ? (h.y0 + h.y1) / 2 : h.y });
  }
  return out;
}
function drawParts(dt) {
  for (const p of parts) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; p.life -= dt; p.r += dt * 6;
    const a = Math.max(0, Math.min(1, p.life));
    if (p.kind === 'feather') { g.fillStyle = `rgba(255,236,150,${a})`; g.beginPath(); g.ellipse(sx(p.x), sy(p.y), 0.012 * u, 0.005 * u, p.r, 0, 7); g.fill(); }
    else if (p.kind === 'drop') { g.fillStyle = `rgba(255,255,255,${a})`; g.beginPath(); g.arc(sx(p.x), sy(p.y), 0.006 * u, 0, 7); g.fill(); }
    else { g.fillStyle = `rgba(255,230,120,${a})`; g.beginPath(); g.arc(sx(p.x), sy(p.y), 0.008 * u * a, 0, 7); g.fill(); }
  }
  parts = parts.filter(p => p.life > 0);
  if (ripples.length > 120) ripples.splice(0, ripples.length - 120);
}

function updateCamera(dt) {
  // keep her between 30% and 60% down the screen; pull back to show a long tail, but never lose her off the top
  const hu = H / u, m = s.mom;
  let want = Math.min(Math.max(cam, m.y - 0.04 * hu), m.y + 0.22 * hu);
  if (s.line.length) { const tail = pathAt(s, s.line[s.line.length - 1].delay); want = Math.max(m.y - 0.15 * hu, Math.min(want, tail.y + 0.53 * hu)); }
  if (s.nest) want = Math.min(want, s.nest.y - 0.14 * hu);
  camShown += (want - camShown) * Math.min(1, dt * 6);
  cam = camShown;
}

function frame(now) {
  // A frame timestamp can precede an input callback from the same frame.
  const dt = Math.max(0, Math.min(.1, (now - last) / 1000));
  last = Math.max(last, now);
  let alpha = 1;
  if (screen !== 'play') {
    if (water) water.gain.value = 0;
    requestAnimationFrame(frame);
    return;
  }
  if (playing && !paused) {
    if (!waitTouch) { acc += dt * FAST; while (acc >= DT && playing) { tick(); acc -= DT; } alpha = Math.min(1, acc / DT); }
    trailT = Math.max(0, trailT - dt); quackShow = Math.max(0, quackShow - dt); hurtT = Math.max(0, hurtT - dt); homeGlow = Math.max(0, homeGlow - dt * 0.3);
    peepT -= dt;
    if (peepT <= 0) {
      peepT = 2.2 + Math.random() * 1.5;
      caller = s.lost.find(duck => Math.abs(duck.y - s.mom.y) < 1);
      if (caller) {
        peepUntil = now + 900;
        peep(2600 + Math.random() * 500, 0.025);
      }
    }
    const caption = $('peep');
    caption.hidden = !(caller && now < peepUntil && s.lost.includes(caller));
    if (!caption.hidden) {
      const y = sy(caller.y) / dpr, top = inset.top + 110, bottom = H / dpr - inset.bottom - 78;
      const above = y < top, below = y > H / dpr - inset.bottom;
      const key = above ? 'callingAbove' : below ? 'callingBelow' : 'calling';
      if (caption.dataset.cue !== key || caption.lang !== lang()) {
        caption.dataset.cue = key; caption.lang = lang();
        caption.setAttribute('aria-label', t(key));
        caption.innerHTML = icon('call') + (above ? icon('up') : below ? icon('down') : '');
      }
      caption.style.left = `${Math.max(32, Math.min(W / dpr - 32, sx(caller.x) / dpr))}px`;
      const pos = y - 46 < top && !above ? y + 34 : y - 46;
      caption.style.top = `${Math.max(top, Math.min(below ? H / dpr - 37 : bottom, pos))}px`;
    }
    const q = $('quack'), ready = 1 - s.quackCool / QUACK_COOL, cool = Math.ceil(s.quackCool);
    q.style.setProperty('--ready', ready.toFixed(3)); q.classList.toggle('wait', cool > 0);
    const quackKey = lang() + cool;
    if (q.dataset.cue !== quackKey) {
      q.dataset.cue = quackKey;
      q.setAttribute('aria-label', cool ? t('quackWait', { n: countText('seconds', cool) }) : t('quack'));
      $('quackLabel').innerHTML = cool ? countText('seconds', cool) : icon('close');
    }
    if (water) water.gain.value = 0.18;
  } else if (water) water.gain.value = 0;
  if (!waitTouch) updateCamera(dt);
  shake = Math.max(0, shake - dt * 2.5); flash = Math.max(0, flash - dt * 2);
  const k = still ? 0 : shake * 10 * dpr;
  g.setTransform(1, 0, 0, 1, (Math.random() - 0.5) * k, (Math.random() - 0.5) * k);
  drawPond(now); drawHazards(now); drawNest(now); drawLost(now); drawLine(now, alpha); drawMother(now, alpha); drawParts(paused ? 0 : dt);
  g.setTransform(1, 0, 0, 1, 0, 0);
  if (flash > 0) { g.fillStyle = `rgba(255,90,80,${flash * 0.4})`; g.fillRect(0, 0, W, H); }
  if (screen === 'play') { drawGuide(now); drawHud(now); }
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- the menu picture: a mother and her line in a curve
function drawMenuArt() {
  const c = $('menuArt'), q = c.getContext('2d'), now = performance.now() / 1000;
  q.clearRect(0, 0, c.width, c.height);
  q.save();
  q.translate(62, 8);
  q.scale(1.10, 1.04);
  const paint = q.createLinearGradient(40, 20, 390, 200);
  paint.addColorStop(0, '#aedcc6'); paint.addColorStop(1, '#6dafb1');
  q.fillStyle = '#a3c98b'; q.beginPath(); q.ellipse(220, 115, 218, 96, -.02, 0, 7); q.fill();
  q.fillStyle = paint; q.beginPath(); q.ellipse(220, 111, 206, 90, -.02, 0, 7); q.fill();
  for (let i = 0; i < 15; i++) {
    const x = 33 + 365 * hash2(i, 3), y = 52 + 116 * hash2(i, 6);
    q.fillStyle = '#fffefa28'; q.beginPath(); q.ellipse(x, y, 11 + 10 * hash2(i, 2), 2.3, -.10, 0, 7); q.fill();
  }
  q.strokeStyle = '#fff6d6a3'; q.lineWidth = 4; q.lineCap = 'round'; q.setLineDash([5, 9]);
  q.beginPath(); q.moveTo(348, 84); q.bezierCurveTo(233, 23, 127, 64, 103, 150); q.stroke(); q.setLineDash([]);
  const pts = [[348, 84], [297, 66], [247, 62], [198, 71], [155, 87], [124, 113], [103, 150]];
  const looks = Object.keys(TRAITS);
  for (let i = pts.length - 1; i >= 1; i--) {
    const [x, y] = pts[i], [px, py] = pts[i - 1];
    art.duckling(q, x, y, Math.atan2(px - x, y - py), 690, now, i, { trait: looks[i - 1] });
  }
  art.mother(q, ...pts[0], 1.88, 770, now, .4, false, false);
  art.lilyPad(q, 73, 68, 25, .5, true); art.lilyPad(q, 376, 147, 21, 3, false);
  art.reeds(q, 174, 185, 20, now, 4);
  q.restore();
}

function drawPostcard(won) {
  const c = $('postcard'), q = c.getContext('2d');
  const w = c.width, h = c.height;
  q.clearRect(0, 0, w, h);
  const water = q.createLinearGradient(0, 0, w, h);
  water.addColorStop(0, '#d5ead1'); water.addColorStop(1, '#94cbc3');
  q.fillStyle = water; q.beginPath(); q.roundRect(12, 12, w - 24, h - 24, 70); q.fill();
  art.lilyPad(q, 57, 120, 24, .28, true);
  art.lilyPad(q, w - 49, 70, 30, 1.2, true);
  const group = s.endless ? s.line : s.arrived;
  if (won) art.nest(q, w / 2, h * .54, 390, 0, 1);
  art.mother(q, w / 2, h * .42, -.22, 610, 0, 0, false, !won && s.why === 'hearts');
  group.forEach((f, i) => {
    const dx = (i + .5 - group.length / 2) * Math.min(61, 475 / group.length);
    art.duckling(q, w / 2 + dx, h * .75 + Math.cos(dx / 130) * 8, dx / 400, 590, 1, i, { trait: f.trait, open: won });
  });
}

// ---------------------------------------------------------------- hooks for checks
window.ducklingsState = () => ({
  screen, mode, chapter: tab + 1, stage: s.stage, need: s.endless ? null : LEVELS[s.stage].need, playing, paused, waiting: waitTouch, t: s.t, over: s.over, why: s.why, score: s.score, hearts: s.hearts,
  line: s.line.length, lost: s.lost.length, arrived: s.arrived.length, total: s.total, stars: stars(s), home: s.home, quackCool: s.quackCool,
  mom: { x: s.mom.x, y: s.mom.y, sx: sx(s.mom.x) / dpr, sy: sy(s.mom.y) / dpr },
  nest: s.nest ? { sx: sx(s.nest.x) / dpr, sy: sy(s.nest.y) / dpr } : null,
  lesson: !s.endless ? LEVELS[s.stage].lesson ?? null : null,
  waitingDucks: s.lost.map(l => ({ sx: sx(l.x) / dpr, sy: sy(l.y) / dpr, y: l.y })),
  opened: data.opened, sound: data.sound, taught: data.taught, hudPeeks, rollCalls,
});

// A first-time player who does not touch for 3 s in play sees a finger hold and move (experiments/kit/hint.js).
// It stands in for the stage 1 ghost finger while it shows, and sits above the Quack button.
const help = hint(canvas, {
  kind: 'hold-and-move',
  key: 'ducklings:hint',
  label: t('hint'),
  bottom: 130,
  when: () => playing && !paused && screen === 'play',
  played: save.readJson(KEY) !== null,
});

refreshLanguage();
show('menu');
requestAnimationFrame(frame);
</script>
