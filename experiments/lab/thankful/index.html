<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071528"><title>Thankful Garden</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#071528;color:#f9eed6;font:16px/1.5 system-ui,sans-serif}canvas{display:block;width:100%;height:100dvh;touch-action:none}button,input{font:inherit}button{cursor:pointer;min-height:44px;color:inherit;background:#ffffff12;border:1px solid #e8dcc04d;border-radius:24px;padding:9px 16px}button:focus-visible,input:focus-visible{outline:3px solid #e4cf91;outline-offset:3px}header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:16px 20px;pointer-events:none}header>*{pointer-events:auto}h1{font-size:14px;font-weight:500;letter-spacing:.12em;margin:0}#looks{display:flex;gap:5px}#looks button{font-size:12px;letter-spacing:.08em;min-height:36px;padding:4px 14px}#ritual{pointer-events:none;position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:12px;right:12px;text-align:center}#ritual button,#ritual a{pointer-events:auto}#line{font-size:20px;font-weight:300;letter-spacing:.02em;margin:0 0 18px}#tray{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;max-width:620px;margin:auto;transition:opacity 1s,transform 1s}#tray button{padding:7px 2px;border-color:transparent;background:#ffffff08;min-width:0;border-radius:15px;font-size:10px;line-height:1.2}#tray svg{display:block;width:28px;height:28px;margin:0 auto 5px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.done #tray{opacity:0;transform:translateY(14px);pointer-events:none;position:absolute;left:0;right:0}#picture{font-size:12px;opacity:.65;padding:6px 14px}#picture[hidden]{display:none}#demo{pointer-events:none}#older{font-size:12px;opacity:.5;margin-top:18px}#label{position:fixed;left:50%;top:30%;transform:translateX(-50%);max-width:85vw;min-width:160px;background:#14232feb;border:1px solid #e8dcc044;border-radius:20px;padding:18px;text-align:center;pointer-events:none}#label[hidden]{display:none}#label svg{width:38px;height:38px;fill:none;stroke:#f1dbab;stroke-width:1.7}#label p{margin:5px 0}.screen{position:fixed;inset:0;display:none;place-items:center;background:#06131cd9;padding:20px}.screen.on{display:grid}.card{width:min(100%,340px);padding:26px;border-radius:24px;background:#162c3b;text-align:center}.card h2{font-size:21px;font-weight:400;margin:0 0 15px}.card button{margin:6px}.card input{width:100%;background:#071528;color:#fff;border:1px solid #bec6c766;border-radius:12px;padding:12px;margin-bottom:12px}#demo{position:fixed;bottom:calc(4px + env(safe-area-inset-bottom));left:14px;font-size:12px;opacity:.65}#status{font-size:12px;min-height:18px}a{color:#f1dbab} @media(max-width:430px){#tray{grid-template-columns:repeat(6,1fr)}#tray button{font-size:10px}#tray svg{width:28px;height:28px}header{padding:12px 14px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><canvas id="c" aria-label="Your thanks. Drag to visit older days."></canvas><header><h1 id="name">THANKFUL GARDEN</h1><div id="looks" aria-label="Choose a look"></div><button id="settings" aria-label="Settings">⋯</button></header><div id="demo" hidden>Demo · saved only in memory</div><div id="label" role="status" hidden></div><section id="ritual"><p id="line">Three thanks for today.</p><button id="picture" hidden>Keep a picture</button><div id="tray" aria-label="Choose a thank you"></div><p id="older">Drag to visit older days</p><p id="status" role="status"></p></section><div class="screen" id="settingsCard"><div class="card"><h2>Your thanks</h2><button id="sound">Sound: on</button><p>Your thanks stay on this device.</p><button id="reset">Start over</button><p><button class="close">Back</button></p><a href="/lab/">Back to the lab</a></div></div><div class="screen" id="confirm"><div class="card"><h2>Clear everything?</h2><p>This removes every saved thank you on this device.</p><button id="clear">Clear it all</button><button class="close">Keep it</button></div></div><div class="screen" id="words"><form class="card" id="wordForm"><h2>Something else</h2><input id="word" maxlength="24" aria-label="A few words, optional" placeholder="A few words, optional" autocomplete="off"><button type="submit">Give thanks</button><button type="button" class="close">Back</button></form></div><script src="/notes/button.js" defer></script><script type="module" src="./main.js"></script></body></html>
