name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Every game, every night: the after-merge run on main is cancelled when the next merge arrives.
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
concurrency:
  # The nightly and by-hand runs get their own group, so a merge does not cancel them and they do not cancel a push run.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'every-game' || 'change' }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: npm test
  workers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile --filter games-wai-daily
      - run: pnpm --filter games-wai-daily run check
      - run: node --test workers/crumbwar/test/
  changes:
    runs-on: ubuntu-latest
    outputs:
      games: ${{ steps.affected.outputs.games }}
      count: ${{ steps.affected.outputs.count }}
      total: ${{ steps.affected.outputs.total }}
      phone: ${{ steps.affected.outputs.phone }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - id: affected
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then BASE=$(git hash-object -t tree /dev/null); fi
          node scripts/affected.mjs "$BASE"
  games:
    timeout-minutes: ${{ matrix.game == 'neighbours' && 45 || 360 }}
    needs: changes
    if: needs.changes.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.changes.outputs.games) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: matrix.game == 'neighbours'
        with:
          python-version: '3.12.13'
      - run: python -m pip install -r games/neighbours/neighbours/native-gm-requirements.txt
        if: matrix.game == 'neighbours'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/prepare-game.mjs "$GAME"
        env:
          GAME: ${{ matrix.game }}
      - run: node scripts/check-game.mjs "$GAME"
        env:
          GAME: ${{ matrix.game }}
          NEIGHBOURS_PROOF_DIR: ${{ runner.temp }}/neighbours-proof
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && matrix.game == 'neighbours'
        with:
          name: neighbours-public-six-native
          path: ${{ runner.temp }}/neighbours-proof/
          retention-days: 7
  neighbours-browser:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.games), 'neighbours')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      NEIGHBOURS_NO_SCREENSHOTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.13'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/prepare-game.mjs neighbours
      - run: pnpm --filter alder-quay-neighbours exec playwright test --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: neighbours-browser-failure-${{ matrix.shard }}
          path: |
            games/neighbours/neighbours/playwright-report/
            games/neighbours/neighbours/test-results/
          retention-days: 7
  build:
    needs: changes
    if: needs.changes.outputs.total != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build.mjs
      - name: Bundle the Worker and validate the exact upload without credentials
        env:
          CF_SEND_TELEMETRY: 'false'
        run: pnpm run deploy:check
  lefthand-browser:
    needs: changes
    if: contains(needs.changes.outputs.games, '"lefthand"')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            browser: chromium
            projects: --project=chromium-phone --project=chromium-desktop
          - os: macos-latest
            browser: webkit
            projects: --project=webkit-phone --project=webkit-desktop
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./games/lefthand build
      - run: pnpm --filter ./games/lefthand exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm --filter ./games/lefthand exec playwright test ${{ matrix.projects }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: lefthand-browser-failure-${{ matrix.os }}-${{ matrix.browser }}
          path: games/lefthand/test-results/
          retention-days: 3
  # The experiments' phone check (experiments/kit/check/phone.mjs) on Chromium and WebKit. It needs only `changes`,
  # so an experiment-only PR does not wait on game suites. Playwright is not a repository dependency: it is installed
  # at the exact version the check passes with locally into a temp directory that PLAYWRIGHT points at. The check
  # answers the lab endpoint itself and never sends to it.
  phone:
    needs: changes
    if: needs.changes.outputs.phone == 'true'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAYWRIGHT_VERSION: 1.64.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-${{ matrix.browser }}
      - run: npm install --prefix "$PLAYWRIGHT" --no-save --no-package-lock --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
        env:
          PLAYWRIGHT: ${{ runner.temp }}/playwright
      # WebKit on Linux has not yet been seen green here (the check runs on macOS locally), so its WebKit steps are
      # advisory: a failure shows in the log but the job, and the required ci gate, still pass. This sits on the steps,
      # not the job, because a step's continue-on-error is documented to conclude success. Tighten both to false once
      # a WebKit run passes on Linux.
      - run: '"$PLAYWRIGHT/node_modules/.bin/playwright" install --with-deps "$BROWSER"'
        continue-on-error: ${{ matrix.browser == 'webkit' }}
        env:
          PLAYWRIGHT: ${{ runner.temp }}/playwright
          BROWSER: ${{ matrix.browser }}
      - run: node experiments/kit/check/phone.mjs all "$BROWSER"
        continue-on-error: ${{ matrix.browser == 'webkit' }}
        env:
          PLAYWRIGHT: ${{ runner.temp }}/playwright
          BROWSER: ${{ matrix.browser }}
  ci:
    if: always()
    needs: [tools, changes, workers, games, build, neighbours-browser, lefthand-browser, phone]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: |
          node scripts/aggregate.mjs
          node -e "if (process.env.NEIGHBOURS_BROWSER !== (process.env.NEIGHBOURS_AFFECTED === 'true' ? 'success' : 'skipped')) throw Error('Neighbours browser gate did not pass')"
        env:
          TOOLS: ${{ needs.tools.result }}
          CHANGES: ${{ needs.changes.result }}
          WORKERS: ${{ needs.workers.result }}
          GAMES: ${{ needs.games.result }}
          BUILD: ${{ needs.build.result }}
          COUNT: ${{ needs.changes.outputs.count }}
          TOTAL: ${{ needs.changes.outputs.total }}
          NEIGHBOURS_AFFECTED: ${{ contains(fromJSON(needs.changes.outputs.games), 'neighbours') }}
          NEIGHBOURS_BROWSER: ${{ needs.neighbours-browser.result }}
          LEFTHAND_REQUIRED: ${{ contains(needs.changes.outputs.games, '"lefthand"') }}
          LEFTHAND_BROWSER: ${{ needs.lefthand-browser.result }}
          PHONE_REQUIRED: ${{ needs.changes.outputs.phone == 'true' }}
          PHONE_CHECK: ${{ needs.phone.result }}
