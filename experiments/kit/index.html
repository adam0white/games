<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Experiment kit self-test</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 1.2em; background: #10141c; color: #e8e2d6; }
  li.ok { color: #7fd48a; } li.bad { color: #ff7a7a; }
  button { font: inherit; padding: .6em 1.2em; min-height: 46px; }
  .card { display: none; } .card.on { display: block; }
</style>
</head>
<body>
<h1>Experiment kit</h1>
<p>Shared code for the games under <code>/</code>. This page runs each module in your browser.</p>
<ul id="out"></ul>
<p><button id="beep">Play a sound</button> <span id="heard"></span></p>
<div id="a" class="card">card a</div><div id="b" class="card">card b</div>
<div id="labbox"></div>
<div id="pad" style="width:300px;height:60px"></div>
<div id="hintpad" style="width:300px;height:60px"></div>
<script type="module">
import { read, write, readNumber, readJson, writeJson } from './save.js';
import { sound } from './audio.js';
import { onLeave, isPauseKey } from './pause.js';
import { screens } from './screens.js';
import { lab } from './lab.js';
import { stick } from './stick.js';
import { drag } from './drag.js';
import { hint } from './hint.js';

const results = [], out = document.getElementById('out');
function check(name, fn) {
  let ok = false, why = '';
  try { ok = fn() === true; } catch (e) { why = ` (${e.message})`; }
  results.push({ name, ok });
  const li = document.createElement('li'); li.className = ok ? 'ok' : 'bad'; li.textContent = `${ok ? 'ok' : 'FAIL'}: ${name}${why}`; out.append(li);
}
const K = 'kit-selftest';
check('save: write then read text', () => write(K, 'a') && read(K) === 'a');
check('save: a missing key gives the fallback', () => read(K + '-none', 'x') === 'x' && readNumber(K + '-none') === 0 && readJson(K + '-none', 7) === 7);
check('save: numbers', () => write(K, 12) && readNumber(K) === 12);
check('save: text that is not a number gives the fallback', () => write(K, 'abc') && readNumber(K, 5) === 5);
check('save: JSON round trip', () => writeJson(K, { a: [1, 2] }) && readJson(K).a[1] === 2);
check('save: broken JSON gives the fallback', () => write(K, '{oops') && readJson(K, 'd') === 'd');
try { localStorage.removeItem(K); } catch {}

let left = 0; onLeave(() => left++);
dispatchEvent(new Event('blur')); dispatchEvent(new Event('pagehide'));
check('pause: blur and pagehide call the game', () => left === 2);
check('pause: P and Escape are pause keys, A is not', () => isPauseKey({ key: 'p' }) && isPauseKey({ key: 'Escape' }) && !isPauseKey({ key: 'a' }));

let seen = ''; const show = screens(['a', 'b'], name => { seen = name; });
show('b');
check('screens: one card shows', () => !document.getElementById('a').classList.contains('on') && document.getElementById('b').classList.contains('on') && seen === 'b');
show('play');
check('screens: an unknown name hides every card', () => !document.querySelector('.card.on') && seen === 'play');

let built = 0, enabled = false; const snd = sound({ on: () => enabled, setup: () => built++ });
snd.tone(440); snd.noise();
check('audio: stays silent and builds nothing while switched off', () => snd.ctx === null && built === 0);
enabled = true;
check('audio: unlock makes one context and runs setup once', () => { const a = snd.unlock(), b = snd.unlock(); snd.tone(440, 0.01, 0.0001); snd.noise(0.01, 0.0001); return !!a && a === b && built === 1; });
check('audio: hold and release do not throw', () => { snd.hold(); snd.release(); return true; });
document.getElementById('beep').addEventListener('click', () => { snd.unlock(); snd.tone(523.25, 0.4, 0.15, 'triangle'); snd.noise(0.15, 0.1); document.getElementById('heard').textContent = `Context is ${snd.ctx?.state}. You should have heard a note and a crunch.`; });

// stick.js and drag.js, with pointer events made here.
const pad = document.getElementById('pad');
const touch = (type, x, y = 0, id = 1, kind = 'touch') => pad.dispatchEvent(new PointerEvent(type, { pointerId: id, pointerType: kind, isPrimary: true, clientX: x, clientY: y, pressure: type === 'pointerup' ? 0 : 0.5, bubbles: true }));
const near = (a, b) => Math.abs(a - b) < 1e-9;
let live = false; const st = stick(pad, { when: () => live, reach: 50, leash: 80, dead: 0.2 });
touch('pointerdown', 100); touch('pointermove', 140);
check('stick: ignores a finger while the game says no', () => st.touch === null && st.vector().x === 0);
live = true; touch('pointerdown', 100); touch('pointermove', 109);
check('stick: inside the dead zone the vector is zero', () => st.vector().x === 0 && st.vector().y === 0);
touch('pointermove', 125);
check('stick: travel over reach on each axis', () => near(st.vector().x, 0.5) && st.vector().y === 0 && st.touch.ox === 100);
touch('pointermove', 200);
check('stick: past the leash the centre is dragged along', () => near(st.touch.ox, 120) && near(st.vector().x, 1.6));
touch('pointermove', 150, 0, 2);
check('stick: another finger does not move it', () => st.touch.x === 200);
touch('pointercancel', 150); check('stick: a cancelled finger stops it', () => st.touch === null && st.vector().x === 0);
touch('pointerdown', 100); st.drop(); check('stick: drop forgets the finger', () => st.touch === null);
touch('pointerup', 100);

let on = true, still = false, resumed = 0, aimed = null, moused = null, at = 0.5;
const steer = drag(pad, { playing: () => on, paused: () => still, resume: () => { still = false; resumed++; }, from: () => at, travel: dx => dx / 100 * 2, aim: x => { aimed = x; }, mouse: e => { moused = e.clientX; }, settle: 10 });
touch('pointerdown', 100); touch('pointerup', 100);
check('drag: a tap does not steer', () => aimed === null);
touch('pointerdown', 100); touch('pointermove', 125);
check('drag: steers by finger travel times the gain, from where play was at touch-down', () => near(aimed, 1));
at = 0.8; steer.rebase(); touch('pointermove', 130);
check('drag: rebase steers on from where play is now', () => near(aimed, 0.9));
steer.drop(); aimed = null; touch('pointermove', 160);
check('drag: drop lets go of the finger', () => aimed === null);
touch('pointerup', 160);
still = true; at = 0.5; touch('pointerdown', 100);
check('drag: a touch while paused resumes', () => resumed === 1 && !still && aimed === null);
touch('pointermove', 109); check('drag: the resuming finger does not steer inside settle', () => aimed === null);
touch('pointermove', 111); check('drag: past settle it re-anchors there and does not jump', () => near(aimed, 0.5));
touch('pointermove', 121); check('drag: then steers from the re-anchor', () => near(aimed, 0.7));
touch('pointerup', 121); aimed = null;
touch('pointerdown', 40, 0, 3, 'mouse'); touch('pointermove', 60, 0, 3, 'mouse');
check('drag: a mouse goes to the game', () => moused === 60 && aimed === null);
touch('pointerup', 60, 0, 3, 'mouse');
on = false; touch('pointerdown', 100); touch('pointermove', 150);
check('drag: nothing steers while not playing', () => aimed === null);
touch('pointerup', 150); steer.reset();

// lab.js, with a stand-in for the network: this page never sends anything to the lab.
// It restores the shared player id afterwards, so opening this page changes nothing for a player.
const gunzip = async body => new Response(new Blob([body]).stream().pipeThrough(new DecompressionStream('gzip'))).json();
const flushed = () => new Promise(done => setTimeout(done, 200));
async function labChecks() {
  const keepPlayer = localStorage.getItem('hf-lab-player'), sent = [];
  const fake = async (url, init) => { sent.push({ url, body: await gunzip(init.body) }); return { status: 200 }; };
  const rec = lab('kit-selftest', { fetch: fake, version: 'kit-1' });
  rec.start({ n: 1 }); rec.event('buy', { x: 1 }); rec.end('won', { s: 1 }); await flushed();
  check('lab: nothing is recorded or sent before the notice is on the page', () => sent.length === 0 && localStorage.getItem('hf-lab-player') === keepPlayer);
  check('lab: the notice says what the lab records and links to the privacy page', () => { const p = rec.notice(document.getElementById('labbox')); return /keeps it for 180 days/.test(p.textContent) && p.querySelector('a').href.endsWith('/lab/privacy/'); });
  if (!rec.on) { check('lab: recording is switched off in this browser, so the send checks are skipped', () => true); return; }
  rec.event('before', 1); await flushed(); const between = sent.splice(0);
  rec.start({ night: 3 }); rec.event('buy', { pack: 'boat' }); rec.end('dawn', { embers: 7 }); await flushed();
  const run = sent.find(r => r.body.kind === 'run')?.body, events = sent.find(r => r.body.kind === 'events')?.body;
  check('lab: a run end sends one run record and one events record', () => sent.length === 2 && !!run && !!events && sent.every(r => r.url === 'https://human.adamwhite.work/lab/api/linked'));
  check('lab: the run record carries the outcome, the summary and the choices', () => run.v === 2 && run.game === 'kit-selftest' && run.data.outcome === 'dawn' && run.data.summary.embers === 7 && run.data.start.night === 3 && run.data.events.map(e => e.type).join() === 'buy' && run.build.a === 'kit-1');
  check('lab: a choice between runs is sent at once as its own record', () => between.length === 1 && between[0].body.data.outcome === 'between-runs' && between[0].body.data.events[0].type === 'before');
  check('lab: ids are 32 hex characters and both records share the run', () => ['id', 'player', 'session', 'runId'].every(k => /^[a-f0-9]{32}$/.test(run[k])) && events.runId === run.runId && events.player === run.player);
  check('lab: the events record uses only labels the lab accepts', () => JSON.stringify(events.data.e.map(e => e[2] ?? null)) === '[null,"run started","ending reached",null]');
  check('lab: an ended run is not sent twice', () => { rec.end('again'); return true; });
  const broken = lab('kit-selftest', { fetch: () => Promise.reject(new Error('offline')) });
  broken.notice(document.getElementById('labbox'));
  check('lab: a failing network never throws into the game', () => { broken.start(); broken.event('x'); broken.end('lost'); return true; });
  check('lab: a bad game name gives a recorder that does nothing', () => { const r = lab('Bad Name!'); r.start(); r.end('x'); return r.on === false; });
  await flushed();
  check('lab: an ended run was sent once', () => sent.length === 2);
  if (keepPlayer === null) localStorage.removeItem('hf-lab-player'); else localStorage.setItem('hf-lab-player', keepPlayer);
  sessionStorage.removeItem('hf-lab-session:kit-selftest');
  for (const el of document.querySelectorAll('#labbox > *')) el.remove();
}
// hint.js, with a short delay and its own key, removed afterwards.
async function hintChecks() {
  const HK = 'kit-selftest-hint', el = document.getElementById('hintpad'), wait = ms => new Promise(done => setTimeout(done, ms));
  const shown = () => !!document.querySelector('.kit-hint.on'), down = () => el.dispatchEvent(new PointerEvent('pointerdown', { pointerId: 5, pointerType: 'touch', bubbles: true }));
  localStorage.removeItem(HK);
  let playing = false; const help = hint(el, { kind: 'stick', key: HK, when: () => playing, delay: 150 });
  await wait(300); check('hint: not shown while the game is not in play', () => !shown() && !help.shown);
  playing = true; await wait(40); check('hint: not before the delay', () => !shown());
  await wait(300); check('hint: shown after the delay of play', () => shown() && help.shown);
  check('hint: never takes input', () => [...document.querySelectorAll('.kit-hint, .kit-hint *')].every(e => getComputedStyle(e).pointerEvents === 'none'));
  playing = false; await wait(80); check('hint: hidden while a card covers the game', () => !shown());
  down(); check('hint: input while not in play does not end it', () => localStorage.getItem(HK) === null);
  playing = true; await wait(80); check('hint: back when play goes on', () => shown());
  down(); check('hint: the first input ends it and remembers the player', () => !document.querySelector('.kit-hint') && !help.shown && localStorage.getItem(HK) === '1');
  await wait(300); check('hint: it does not come back', () => !document.querySelector('.kit-hint'));
  const again = hint(el, { kind: 'drag', key: HK, when: () => true, delay: 0 });
  localStorage.removeItem(HK); const old = hint(el, { kind: 'drag', key: HK, when: () => true, delay: 0, played: true });
  const odd = hint(el, { kind: 'no such kind', key: HK, when: () => true, delay: 0 });
  await wait(100); check('hint: never shown to a returning player, or for a kind it does not know', () => !document.querySelector('.kit-hint') && !again.shown && !old.shown && !odd.shown);
  localStorage.removeItem(HK);
}
try { await hintChecks(); } catch (e) { check(`hint: checks ran to the end (${e.message})`, () => false); }
try { await labChecks(); } catch (e) { check(`lab: checks ran to the end (${e.message})`, () => false); }

window.kitResults = results; // read by check/phone.mjs
</script>
</body>
</html>
