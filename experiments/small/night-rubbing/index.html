<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#183731"><link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css"><title>Carbon Cabinet</title></head>
<body>
<main id="cabinet">
  <header><div class="heading"><div class="eyebrow"><span class="mark" aria-hidden="true">≋</span> <span data-i18n="eyebrow">Fossil rubbings</span></div><h1>Carbon <i>Cabinet</i></h1></div>
    <div class="header-buttons"><button id="daily" aria-current="false"><span></span></button>
    <button id="pause" data-i18n-aria="pauseLabel" aria-label="Pause rubbing"><span aria-hidden="true">Ⅱ</span></button></div></header>
  <div class="sheet-space"><div class="paper" id="paper">
    <div class="plate-label"><span id="figure"></span><span id="kind" aria-hidden="true"></span><span id="taxon"></span></div>
    <canvas id="field" width="240" height="280" tabindex="0" data-i18n-aria="fieldLabel" aria-label="Rub the paper back and forth to reveal the fossil. Arrow keys also rub the paper."></canvas>
    <div class="tool" id="tool" aria-hidden="true"><span>6B</span></div>
    <div class="paper-foot"><div class="rule" id="rule" aria-hidden="true"></div><div id="lead" class="lead" role="img" hidden><i></i></div><i id="medium"></i></div>
  </div></div>
  <div class="status-row"><div id="status" role="status">Rub across the fossil</div>
    <span id="percent"></span><div id="result" class="result"><button id="share" data-i18n-aria="share" aria-label="Share this print" hidden><span aria-hidden="true">⇪</span></button><button id="next">Next plate <b aria-hidden="true">→</b></button></div></div>
  <div class="meters"><div class="meter" aria-hidden="true"><div id="fill"></div></div>
  <div id="smudge" class="smudge" role="img" hidden><i></i></div></div>
  <nav id="collection" data-i18n-aria="drawer" aria-label="Specimen drawer"></nav>
</main>
<section id="paused" class="veil" role="dialog" aria-modal="true" aria-labelledby="pause-title"><div class="card">
  <div class="eyebrow">Carbon Cabinet</div><h2 id="pause-title" data-i18n="pausedTitle">Rubbing paused</h2>
  <p data-i18n="pausedText">Sweep back and forth over the pale ridges, including the tips.</p>
  <div id="tip" class="tip" hidden></div>
  <button class="primary" id="resume" data-i18n="resume">Resume rubbing</button>
  <div class="pair"><button id="sound"></button><button id="ink"></button></div>
  <button id="restart" data-i18n="restart">Start this plate again</button>
</div></section>
<script type="module" src="./main.js"></script><script src="/notes/button.js" defer></script>
</body></html>
