name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm test
  changes:
    runs-on: ubuntu-latest
    outputs:
      games: ${{ steps.affected.outputs.games }}
      count: ${{ steps.affected.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - id: affected
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then BASE=$(git hash-object -t tree /dev/null); fi
          node scripts/affected.mjs "$BASE"
  games:
    needs: changes
    if: needs.changes.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.changes.outputs.games) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-game.mjs "$GAME"
        env:
          GAME: ${{ matrix.game }}
  ci:
    if: always()
    needs: [tools, changes, games]
    runs-on: ubuntu-latest
    steps:
      - name: Require all applicable jobs
        env:
          TOOLS: ${{ needs.tools.result }}
          CHANGES: ${{ needs.changes.result }}
          GAMES: ${{ needs.games.result }}
          COUNT: ${{ needs.changes.outputs.count }}
        run: |
          test "$TOOLS" = success
          test "$CHANGES" = success
          if [ "$COUNT" = 0 ]; then test "$GAMES" = skipped; else test "$GAMES" = success; fi
