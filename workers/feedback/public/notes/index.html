<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#16201b">
<title>Notes</title>
<link rel="stylesheet" href="/notes/app.css">
</head>
<body>
<header><h1 id="title"></h1><p id="lead"></p></header>
<main id="thread" aria-live="polite"></main>
<p id="notice" hidden></p>
<footer id="composer" hidden>
  <p id="answering" hidden><span id="answering-text"></span><button id="answering-clear" type="button" aria-label="×">×</button></p>
  <label id="game-label" for="game"></label>
  <select id="game"></select>
  <textarea id="text" rows="3" maxlength="6000"></textarea>
  <div id="actions">
    <button id="mic" type="button"></button>
    <button id="send" type="button" class="main"></button>
  </div>
  <div id="recording" hidden>
    <span id="timer" role="timer">0:00</span>
    <button id="cancel" type="button"></button>
    <button id="stop" type="button" class="main"></button>
  </div>
</footer>
<script src="/notes/app.js" defer></script>
</body>
</html>
