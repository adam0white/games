<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f2b37a">
<title>Fix-It Stall</title>
<style>
  html, body { margin: 0; height: 100%; background: #6a3a1f; overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { font: 17px/1.4 ui-rounded, 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif; color: #3a2216; }
  canvas#c { display: block; touch-action: none; width: 100vw; height: 100dvh; }
  #probe { position: fixed; top: 0; left: 0; width: 0; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); visibility: hidden; pointer-events: none; }
  .screen { position: fixed; inset: 0; display: none; place-items: center; text-align: center; background: #3a221688; overflow-y: auto; touch-action: pan-y; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; }
  .screen.on { display: grid; }
  .card { max-width: 22em; width: calc(100% - 32px); box-sizing: border-box; padding: 18px 18px 14px; margin: 12px 0; background: #fff1d6; border: 3px solid #3a2216; border-radius: 22px; box-shadow: 0 8px 0 #3a221655; }
  h1 { font-size: 2.3em; line-height: 1.05; margin: 0 0 .15em; color: #c8743a; text-shadow: 0 3px 0 #3a2216; -webkit-text-stroke: 1.5px #3a2216; letter-spacing: .01em; }
  h2 { font-size: 1.7em; margin: 0 0 .2em; color: #c8743a; text-shadow: 0 2px 0 #3a2216; -webkit-text-stroke: 1px #3a2216; }
  p { margin: .35em 0; }
  .sub { font-size: .95em; opacity: .85; }
  .big { font-size: 2.4em; font-weight: bold; color: #9c7420; line-height: 1.1; }
  .stats { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin: .5em 0; font-size: .95em; }
  .stats b { color: #1d5e5b; }
  button { font: inherit; font-weight: bold; color: #3a2216; background: #fbe6c2; border: 2.5px solid #3a2216; border-radius: 14px; padding: .45em 1em; margin: .25em; min-height: 48px; min-width: 8em; touch-action: manipulation; cursor: pointer; box-shadow: 0 4px 0 #3a2216; }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #3a2216; }
  button.main { background: #2f8f8a; color: #fff6e4; font-size: 1.3em; min-width: 9em; }
  button:disabled { opacity: .45; }
  button.small { min-width: 0; font-size: .9em; }
  #pause { position: fixed; top: calc(6px + env(safe-area-inset-top)); right: calc(8px + env(safe-area-inset-right)); width: 46px; height: 46px; min-width: 0; min-height: 0; margin: 0; padding: 0; border-radius: 50%; display: none; place-items: center; box-shadow: 0 3px 0 #3a2216; background: #fff1d6; }
  #pause::before { content: ''; width: 4px; height: 16px; border: solid #3a2216; border-width: 0 5px; }
  #shop .card { display: flex; flex-direction: column; max-height: calc(100dvh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); }
  #shop .items { min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  .items { text-align: left; margin: .4em 0; }
  .item { display: flex; align-items: center; gap: 10px; border-top: 2px dashed #3a221633; padding: 6px 0; }
  .item canvas { width: 48px; height: 48px; flex: none; border-radius: 12px; background: #f6d9a8; border: 2px solid #3a2216; }
  .item div { flex: 1; line-height: 1.2; }
  .item small { display: block; opacity: .75; font-size: .8em; }
  .item button { min-width: 5.6em; min-height: 44px; font-size: .9em; margin: 0; }
  .item button.on { background: #2f8f8a; color: #fff6e4; }
  .coin { display: inline-block; width: .85em; height: .85em; border-radius: 50%; background: radial-gradient(#f6d77e 55%, #d9a93e 60%); border: 2px solid #9c7420; vertical-align: -.1em; margin-right: .25em; box-sizing: border-box; }
  .lab-notice, .lab-toggle { font-size: 12px !important; }
  #menu .lab-notice { display: flex; align-items: center; gap: 6px; text-align: left; }
  #menu .lab-notice a { display: grid; place-items: center; flex: none; min-width: 48px; min-height: 44px; }
  #newjob { color: #1d5e5b; font-weight: bold; }
  .desk { display: none; font-size: .85em; }
  .st { color: #d9a93e; -webkit-text-stroke: .6px #3a2216; }
  .map { margin: .3em 0 .4em; text-align: left; }
  .chap { font-size: .8em; font-weight: bold; color: #8a4a22; margin: .5em 2px .25em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
  .lv { min-width: 0; min-height: 48px; margin: 0; padding: 2px 0 0; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; font-size: 1.05em; box-shadow: 0 3px 0 #3a2216; background: #fbe6c2; }
  .grid.late .lv:not(:disabled, .done, .next) { background: #f6cfb0; }
  .grid.night .lv:not(:disabled, .done, .next) { background: #e8dcfc; }
  .grid.night .lv:disabled { background: #ddd1df; }
  #map { padding: 3px 1px 6px; }
  #chapterTabs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; padding-top: 6px; }
  #chapterTabs button { min-width: 0; min-height: 44px; margin: 0 0 5px; padding: 3px 2px; font-size: .72em; border-radius: 9px; box-shadow: 0 2px 0 #3a2216; }
  #chapterTabs button[aria-pressed="true"] { background: #bde2ca; color: #234636; }
  #chapterTabs button:last-child[aria-pressed="true"] { background: #ded2ef; color: #412e55; }
  #growth { font-size: .8em; color: #28605c; font-weight: 700; }
  .tickets { position: fixed; z-index: 1; left: 50%; transform: translateX(-50%); width: min(calc(100% - 30px), 420px); display: flex; gap: 6px; justify-content: center; }
  [hidden] { display: none !important; }
  .ticket, .lane { position: relative; display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 66px; height: 48px; margin: 0; padding: 0 7px; border-radius: 11px; background: #fff1d6; overflow: hidden; }
  .lane { width: 42%; justify-content: center; }
  .ticket canvas, .lane canvas { width: 36px; height: 36px; flex: none; pointer-events: none; }
  .ticket b { font-size: 15px; color: #50331f; }
  .tickets .current { opacity: 1; background: #c2e9d7; box-shadow: 0 3px 0 #3a2216, 0 0 0 2px #3a9d85; }
  .tickets span.ticket { box-sizing: border-box; border: 2.5px solid #3a2216; }
  .tickets button:disabled:not(.done) { cursor: default; }
  .tickets button.done { background: #d6e7c0; opacity: .68; }
  .lane i { position: absolute; left: 0; bottom: 0; width: 100%; height: 4px; background: #247963; transform-origin: left; }
  #assist, #menuAssist { min-width: 80px; color: #203828; background: #d8edbc; }
  #shareStatus:empty { display: none; }
  .help-icon svg { margin-right: 5px; width: 26px; height: 24px; vertical-align: middle; }
  .tickets.prompt .ticket[data-next] { outline: 3px solid #78c7ab; outline-offset: 1px; }
  #dailyShare { display: block; width: min(100%, 272px); height: auto; margin: 8px auto 4px; border: 2px solid #3a2216; border-radius: 12px; }
  #dailyResult button { min-height: 44px; min-width: 0; padding-inline: .68em; font-size: .85em; }
  #end .card:has(#dailyResult:not([hidden])) { padding-top: 16px; }
  .lv .ss { font-size: .62em; letter-spacing: -.5px; color: #c99a2e; margin-top: 3px; min-height: 1em; }
  .lv.done { background: #e9f3dc; }
  .lv.next { background: #2f8f8a; color: #fff6e4; animation: nudge 1.6s ease-in-out infinite; }
  .lv.next .ss { color: #ffe08a; }
  .lv:disabled { opacity: 1; background: #e3cfae; color: #3a221666; box-shadow: 0 2px 0 #3a221666; border-color: #3a221688; }
  @keyframes nudge { 50% { box-shadow: 0 3px 0 #3a2216, 0 0 0 5px #62c6b8; } }
  @media (prefers-reduced-motion: reduce) { .lv.next { animation: none; } }
  .stars { font-size: 2.6em; line-height: 1; margin: .1em 0 0; color: #f0b830; -webkit-text-stroke: 1.5px #3a2216; letter-spacing: .05em; }
  .stars.none { color: #e3cfae; }
  @media (max-height: 700px) { h1 { font-size: 1.8em; } .card { padding: 12px 14px 10px; } }
  @media (pointer: fine) { .desk { display: block; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="probe"></div>
<button id="pause" aria-label="Pause"></button>
<div id="tickets" class="tickets" hidden></div>

<div id="menu" class="screen on"><div class="card">
  <h1>Fix-It Stall</h1>
  <div class="stats"><span><span class="coin"></span><b id="bank">0</b></span><span><span class="st">★</span> <b id="starsAll">0</b>/<span id="starsMax">132</span></span><span>Jobs unlocked <b id="jobs">3</b>/<span id="jobsAll">18</span></span></div>
  <p><button id="play" class="main">Play</button><button id="menuAssist" class="help-icon" hidden></button></p>
  <p id="playLine" class="sub"></p>
  <p id="migrated" class="sub"></p>
  <div id="chapterTabs" aria-label="Chapters"></div>
  <div id="map" class="map"></div>
  <p id="growth"></p>
  <p><button id="open">Open stall</button><button id="daily">Daily stall</button></p>
  <p id="openLine" class="sub"></p>
  <p id="dailyLine" class="sub"></p>
  <p class="desk sub">On a computer: drag with the mouse, or hold Space.</p>
  <p><button id="toShop">Stall shop</button><button id="sound1" class="small">Sound: on</button></p>
</div></div>

<div id="shop" class="screen"><div class="card">
  <h2>Stall shop</h2>
  <p class="stats"><span><span class="coin"></span><b id="bank2">0</b></span></p>
  <div id="items" class="items"></div>
  <p><button class="back">Back</button></p>
</div></div>

<div id="paused" class="screen"><div class="card">
  <h2>Paused</h2>
  <p><button id="resume" class="main">Keep going</button></p>
  <p><button id="quit">Menu</button><button id="sound2" class="small">Sound: on</button></p>
</div></div>

<div id="end" class="screen"><div class="card">
  <h2 id="endTitle">Closed!</h2>
  <p id="endStars" class="stars"></p>
  <p class="big" id="earnedLine"><span class="coin"></span><span id="earned">0</span></p>
  <div id="endStats" class="stats"></div>
  <p id="endLine" class="sub"></p>
  <p id="newjob"></p>
  <div id="helpRow" hidden>
    <button id="assist" class="help-icon" aria-label="Retry with slower clocks, up to two stars" title="Slower clocks"></button>
    <template id="helpIcon">
      <svg viewBox="0 0 42 32" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 24h29c5 0 7-4 6-7l-1-5m-5 6 1-7M7 23a12 12 0 1 1 24 0M15 18a4 4 0 1 1 4 4"/>
        <circle cx="33" cy="10" r="1.5" fill="currentColor"/><circle cx="37" cy="10" r="1.5" fill="currentColor"/>
      </svg>
      <span>Slower clocks · 2★ max</span>
    </template>
  </div>
  <div id="dailyResult" hidden>
    <canvas id="dailyShare" width="600" height="340" role="img" aria-label="Daily stall result"></canvas>
    <p id="shareStatus" role="status" class="sub"></p>
    <div><button id="shareDaily">Share card</button><button id="downloadDaily">Save image</button></div>
  </div>
  <p><button id="next" class="main">Next level</button></p>
  <p><button id="again" class="main">Play again</button><button id="toMenu">Menu</button></p>
</div></div>

<script type="module" src="./main.js"></script>
<script src="/notes/button.js" defer></script>
</body>
</html>
