# Match the shared lab runtime; never download a runtime per repository.
engineStrict: true
strictPeerDependencies: true
hoist: false
resolutionMode: highest
verifyDepsBeforeRun: error
dedupePeerDependents: true
minimumReleaseAge: 1440
# Owned releases can be consumed on publication day.
minimumReleaseAgeExclude:
  - "@adam0white/*"
packageImportMethod: hardlink
allowBuilds:
  esbuild@0.28.2: true
  workerd@1.20261019.1: true
  fsevents: false
overrides:
  # The game and shelf must admit the same exact native engine.
  "@adam0white/lab-client>@adam0white/human-framework": 4.15.1
  sharp: 0.35.5
  miniflare>undici: 7.30.1
  # Preserve the existing npm lock version for the optional WASM target.
  "@napi-rs/wasm-runtime": 1.2.6
