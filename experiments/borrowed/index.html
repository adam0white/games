<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#160f2c">
<title></title>
<style>
  html, body { margin: 0; height: 100%; background: #160f2c; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { font: 17px/1.4 ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #fff3dc; }
  canvas#c { display: block; width: 100vw; height: 100dvh; touch-action: none; }
  .screen { position: fixed; inset: 0; display: none; place-items: center; text-align: center; pointer-events: none; }
  .screen.on { display: grid; }
  .screen > div { box-sizing: border-box; max-width: 22em; width: calc(100% - 24px); max-height: 100dvh; overflow-y: auto; touch-action: pan-y;
    padding: calc(12px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom)); pointer-events: auto; }
  .veil { background: #120a26cc; }
  #menu.veil { background: radial-gradient(ellipse at 50% 45%, #120a26c0, #120a2640 75%); }
  h1 { font-size: 2.6em; line-height: 1; margin: .1em 0 .15em; color: #ffd98a; letter-spacing: .01em; text-shadow: 0 3px 0 #7a3b5e, 0 0 26px #ff9a3a99; }
  h2 { font-size: 1.9em; line-height: 1.1; margin: 0 0 .25em; color: #ffd98a; text-shadow: 0 3px 0 #7a3b5e; }
  p { margin: .35em 0; }
  button { font: inherit; font-weight: 600; color: #fff3dc; background: #ffffff14; border: 2px solid #ffd98a88; border-radius: 999px; padding: .45em 1.2em; margin: .25em; min-width: 8em; min-height: 46px; touch-action: manipulation; cursor: pointer; }
  button.main { background: #ffb347; color: #3a1a10; border-color: #ffb347; font-size: 1.25em; min-width: 9em; box-shadow: 0 4px 0 #b8642a; }
  #continueRun { font-size: 1.05em; }
  button.main:active { transform: translateY(2px); box-shadow: 0 2px 0 #b8642a; }
  .quiet { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .language { min-width: 64px; min-height: 44px; margin: 0; padding: 0 9px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; font-size: 14px; }
  .globe { display: inline-grid; width: 17px; height: 17px; border: 1.5px solid; border-radius: 50%; place-items: center; box-sizing: border-box; }
  .globe::before, .globe::after { content: ''; grid-area: 1 / 1; box-sizing: border-box; }
  .globe::before { height: 100%; width: 8px; border: solid; border-width: 0 1px; border-radius: 50%; }
  .globe::after { width: 100%; border-top: 1px solid; }
  .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; align-items: center; }
  .controls button { margin: 0; }
  .controls .language { min-width: 64px; }
  .controls button:not(.language) { min-width: 0; padding-inline: 12px; }
  #shareImage { display: block; width: 100%; height: auto; border-radius: 14px; }
  #saveCard { display: inline-grid; min-height: 44px; padding: 0 16px; border-radius: 99px; place-items: center; color: #391d10; background: #ffb347; text-decoration: none; font-weight: 700; touch-action: manipulation; }
  #done .album-actions button { padding-left: .75em; padding-right: .75em; }
  #hero { display: block; width: 100%; height: 104px; margin: 0 auto -.2em; }
  #gallery { display: block; width: 100%; max-width: 330px; height: 92px; margin: .4em auto .1em; }
  .small { font-size: .85em; opacity: .85; }
  #doneArt, #albumArt { display: block; width: 100%; height: 204px; margin: .65em auto; }
  #albumArt { height: clamp(200px, 40dvh, 300px); }
  .album-actions { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; }
  .album-actions button { min-width: 48px; margin: 0; }
  .album-actions button:disabled { opacity: .36; cursor: default; }
  #albumCount { min-width: 5em; color: #ffe9a8; }
  #menuAlbum[hidden] { display: none; }
  #done > div, #album > div { background: #1c1429e8; border: 1px solid #8b6c5877; border-radius: 18px; }
  #doneWho { font-weight: 700; color: #ffe9a8; }
  #doneScore { font-size: 1.3em; font-weight: 800; }
  #doneBest.new-role { color: #ffd98a; font-weight: 700; }
  #doneBest.new-role::before { content: ''; display: inline-block; width: .9em; height: .9em; margin-inline-end: .4em; background: currentColor;
    clip-path: polygon(50% 0, 62% 34%, 100% 38%, 71% 62%, 81% 100%, 50% 79%, 19% 100%, 29% 62%, 0 38%, 38% 34%); }
  #doneChose { white-space: pre-line; }
  #pause { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: max(calc(8px + env(safe-area-inset-right)), calc((100vw - 460px) / 2 + 8px)); width: 46px; height: 46px; min-width: 0; min-height: 0; margin: 0; padding: 0;
    border: 2px solid #ffd98a66; border-radius: 50%; background: #120a26e6; display: none; place-items: center; touch-action: none; }
  #pause::before { content: ''; width: 4px; height: 16px; border: solid #ffd98a; border-width: 0 5px; }
  .lab-notice a { display: inline-grid; min-width: 52px; min-height: 44px; place-items: center; touch-action: manipulation; }
  .kit-hint[data-kind="tap"] { left: var(--memory-hint-x, 50%); }
  .kit-hint[data-kind="tap"] .label { left: calc(50vw - var(--memory-hint-x, 50vw)); transform: translateX(-50%); width: min(18em, 90vw); }
  @media (max-height: 720px) { #menu:has(#continueRun:not([hidden])) #hero { height: 52px; } }
  .lab-notice { max-width: 26em; margin-left: auto !important; margin-right: auto !important; }
  @media (max-height: 660px) { #hero { height: 72px; } #gallery { height: 80px; } h1 { font-size: 2.1em; } button { min-height: 44px; } #doneArt { height: 181px; } #done h2 { font-size: 1.7em; } #done p { margin: .25em 0; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<output id="powerTip" class="quiet" aria-live="polite"></output>
<button id="pause" data-i18n-aria="pause"></button>
<div id="menu" class="screen veil on"><div>
  <canvas id="hero" aria-hidden="true"></canvas>
  <h1 data-i18n="title"></h1>
  <button id="continueRun" class="main" hidden></button>
  <p><button id="play" class="main"></button></p>
  <p><button id="daily" data-i18n="daily"></button></p>
  <canvas id="gallery" data-i18n-aria="gallery"></canvas>
  <p class="small" id="bestLine"></p>
  <p class="controls"><button id="menuAlbum" hidden data-i18n="album"></button><button id="sound"></button><button type="button" class="language" data-i18n-aria="language"><span class="globe" aria-hidden="true"></span><span data-i18n="languageCode" aria-hidden="true"></span></button></p>
</div></div>
<div id="paused" class="screen veil"><div>
  <h2 data-i18n="paused"></h2>
  <p id="scoring" class="small"></p>
  <p><button id="resume" class="main" data-i18n="resume"></button></p>
  <p><button id="toMenu" data-i18n="menu"></button></p>
  <p class="controls"><button id="sound2"></button><button type="button" class="language" data-i18n-aria="language"><span class="globe" aria-hidden="true"></span><span data-i18n="languageCode" aria-hidden="true"></span></button></p>
</div></div>
<div id="done" class="screen veil"><div>
  <h2 id="doneTitle"></h2>
  <canvas id="doneArt" data-i18n-aria="albumArt"></canvas>
  <p id="doneWho"></p>
  <p class="small" id="doneChose"></p>
  <p id="doneScore"></p>
  <p class="small" id="doneBest"></p>
  <span id="newRole" class="quiet" data-i18n="newRole" hidden></span>
  <p><button id="again" class="main" data-i18n="again"></button></p>
  <p class="album-actions"><button id="doneAlbum" data-i18n="album"></button><button id="shareCard" data-i18n="share"></button><button id="doneMenu" data-i18n="menu"></button></p>
</div></div>
<div id="share" class="screen veil"><div>
  <h2 data-i18n="share"></h2>
  <img id="shareImage" alt="">
  <p class="album-actions"><a id="saveCard" download data-i18n="saveImage"></a><button id="shareBack" data-i18n="back"></button></p>
</div></div>
<div id="album" class="screen veil"><div>
  <h2 data-i18n="keepsakeAlbum"></h2>
  <p id="albumCaption" class="small"></p>
  <canvas id="albumArt" data-i18n-aria="albumArt"></canvas>
  <p class="album-actions">
    <button id="albumPrev" data-i18n-aria="earlier">←</button>
    <output id="albumCount" aria-live="polite"></output>
    <button id="albumNext" data-i18n-aria="laterLife">→</button>
  </p>
  <p><button id="albumBack" data-i18n="back"></button></p>
</div></div>
<script type="module">
import {
  newRun, step, walkTo, use, ready, guess, nextChapter, consistent, tileOf, dailySeed, roleId,
  ABILITIES, COST, LIFE, LEAP_TICKS, DT, FACES, wrongCost, CHAPTERS, SELF_POINTS, PICK, SHOW, pickLie, showMe, later, keepsake,
} from './sim.js';
import { place, person, pet, portrait, value, kindIcon, abilityIcon, hand, candle, flame, star, hat, tool, roundRect, INK, CREAM, GOLD, ABILITY_COLOUR } from './art.js';
import { readJson, writeJson } from '../kit/save.js';
import { sound } from '../kit/audio.js';
import { onLeave, isPauseKey } from '../kit/pause.js';
import { screens } from '../kit/screens.js';
import { lab } from '../kit/lab.js';
import { hint } from '../kit/hint.js';
import { t, lang, apply, setLang, num, dateLabel } from './words.js';
import { noZoom } from '../kit/zoom.js'; noZoom(); // no double-tap or pinch zoom (note #74)

const $ = id => document.getElementById(id);
const query = new URLSearchParams(location.search);
const ageLabel = index => t(CHAPTERS[index].id);
const minus = n => '−' + num(n);
const count = (n, total) => num(n) + ' / ' + num(total);
// A rainy night (tester t1, note #115: "more dark and gloomy ... a night raining with dead flowers around"). ?gloom=0 shows the old
// look, so the two can be compared; remove GLOOM and its branches to go back for good.
const GLOOM = query.get('gloom') !== '0';
// Memories that lie (tester t1, notes #137 and #140): each memory is won by finding which of its pictures lies.
// ?lies=0 plays the old way (a memory is yours when you reach it), on the same islands and faces.
const LIES = query.get('lies') !== '0';
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU = Math.PI * 2;
const ease = p => p < 0.5 ? 2 * p * p : 1 - (-2 * p + 2) ** 2 / 2;
const back = p => 1 + 2.7 * (p - 1) ** 3 + 1.7 * (p - 1) ** 2; // ease out with a small overshoot

// ---------------------------------------------------------------- save (one JSON blob)
// Keep the original teaching bits, including the island finger. Practice has its own saved mask.
const KEY = 'borrowed-save';
const PRACTICED = { lie: 1, torn: 2, signed: 4 };
const ALBUM_LIMIT = 12;
const save = { v: 1, sound: true, best: 0, runs: 0, gallery: {}, daily: {}, taught: 0, practice: 0, album: [], ...readJson(KEY, {}) };
const store = () => writeJson(KEY, save);
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const urlSeed = query.has('seed') ? Number(query.get('seed')) >>> 0 : null;

// ---------------------------------------------------------------- sound
const snd = sound({ on: () => save.sound });
const tone = (f, d, v, type = 'triangle', slide = 0) => { if (snd.ctx) snd.tone(f, d, v, type, slide); };
const noise = (d, v, hz) => { if (snd.ctx) snd.noise(d, v, hz); };
const SCALE = [392, 440, 523.25, 587.33, 659.25, 783.99, 880, 1046.5];
const voice = {
  glow() { tone(523, 0.5, 0.06, 'sine', 500); setTimeout(() => tone(784, 0.6, 0.05, 'sine', 600), 70); },
  push() { noise(0.3, 0.35, 260); tone(110, 0.35, 0.12, 'sawtooth', -50); },
  leap() { tone(260, 0.4, 0.08, 'triangle', 520); noise(0.25, 0.08, 1800); },
  rewind() { for (let k = 0; k < 4; k++) setTimeout(() => tone(1400 - k * 220, 0.18, 0.05, 'sine', -500), k * 70); },
  burn(cost) { tone(220, 0.35, 0.07, 'triangle', -90); noise(0.25, 0.06 + cost / 400, 3200); },
};

// ---------------------------------------------------------------- lab recording
const rec = lab('borrowed');
const recordingNotice = rec.notice($('menu').firstElementChild);
const recordingToggle = rec.toggle($('paused').firstElementChild);
recordingNotice?.querySelector('a').setAttribute('data-i18n', 'privacy');

function localizeNotes() {
  const link = $('notes-button');
  if (!link) return false;
  link.setAttribute('aria-label', t('feedback'));
  return true;
}
// The deferred feedback script only adds a button for a linked tester.
if (!localizeNotes()) {
  const observer = new MutationObserver(() => { if (localizeNotes()) observer.disconnect(); });
  observer.observe(document.body, { childList: true });
}

// ---------------------------------------------------------------- canvas and layout
const canvas = $('c'), g = canvas.getContext('2d');
let W = 0, H = 0, dpr = 1, safe = { t: 0, b: 0, l: 0, r: 0 };
const probe = document.createElement('div');
probe.style.cssText = 'position:fixed;top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);left:env(safe-area-inset-left);right:env(safe-area-inset-right);pointer-events:none;visibility:hidden';
document.body.append(probe);
// T: tile size. The island is 7 tiles wide; mapX is its left edge. viewTop and viewBottom bound the playfield
// between the top strip (candle, memories) and the ability bar.
let T = 50, hudL = 0, mapX = 0, viewTop = 90, viewBottom = 500, cam = 0, bar = [], barRect = null, slots = [];
function resize() {
  dpr = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  const cs = getComputedStyle(probe);
  safe = { t: parseFloat(cs.top) || 0, b: parseFloat(cs.bottom) || 0, l: parseFloat(cs.left) || 0, r: parseFloat(cs.right) || 0 };
  const usable = Math.min(W - safe.l - safe.r, 460);
  T = Math.min(66, Math.floor((usable - 12) / 7));
  mapX = Math.round((W - 7 * T) / 2);
  viewTop = safe.t + 74;
  const barH = 84;
  const barW = Math.min(usable - 12, 440), bx = (W - barW) / 2, by = H - safe.b - barH - 6;
  barRect = { x: bx, y: by, w: barW, h: barH };
  viewBottom = by - 4;
  const ids = [...ABILITIES.map(a => a.id), 'who'], gap = 6, bw = (barW - gap * (ids.length - 1)) / ids.length;
  bar = ids.map((id, i) => ({ id, x: bx + i * (bw + gap), y: by, w: bw, h: barH }));
  // the memory slots in the top strip, right of the candle
  hudL = Math.max(safe.l, (W - Math.min(W, 460)) / 2);
  const left = hudL + 92, right = W - Math.max(safe.r, (W - Math.min(W, 460)) / 2) - 62, n = 4, step = Math.min(54, (right - left) / n);
  const sx = left + ((right - left) - step * n) / 2 + step / 2;
  slots = [0, 1, 2, 3].map(d => ({ x: sx + d * step, y: safe.t + 38, r: Math.min(22, step * 0.42) }));
  if (s) cam = camGoal();
}
addEventListener('resize', resize);
const sx = x => mapX + x * T; // tile units to screen
const sy = y => viewTop + y * T - cam;
function camGoal() {
  const view = viewBottom - viewTop, full = s.h * T;
  if (full <= view) return -(view - full) / 2;
  const want = s.py * T - view * 0.55;
  return Math.max(-T * 0.3, Math.min(full - view + T * 0.3, want));
}

// ---------------------------------------------------------------- game state
let s = null, screen = 'menu', paused = false, clock = 0, acc = 0, last = performance.now();
let mode = 'free', dayKey = null, seed = 0;
let shownLife = LIFE, walkPhase = 0, petAt = null, squash = 0, touched = false;
let wfx = [], sfx = [], rings = [], shake = 0, litT = null, mendT = 0, bridgeT = 0, breakT = {};
let pz = null;
let vignette = null, selected = -1, reveal = null, flash = null, nope = null, heartT = 0, newRoles = 0, chapterCard = { t: 0 }, nextBtn = null, chapterMenuBtn = null;
const hints = { ability: {} };

// Session storage is scoped to the tab. The permanent gallery save keeps its original format.
function checkpointAddress(address) {
  const url = new URL(address);
  url.searchParams.delete('lang');
  return url.href;
}
function readCheckpoint() {
  try {
    const record = JSON.parse(sessionStorage.getItem(KEY));
    if (performance.getEntriesByType('navigation')[0]?.type === 'reload' &&
        record?.version === 1 && checkpointAddress(record.url) === checkpointAddress(location.href)) return record;
    sessionStorage.removeItem(KEY);
  } catch { /* Storage can be unavailable. */ }
  return null;
}
let interrupted = readCheckpoint();
function checkpoint() {
  if (!s || runOver()) return;
  try {
    sessionStorage.setItem(KEY, JSON.stringify({
      version: 1, url: location.href, screen, mode, dayKey, touched, selected, vignette, newRoles,
      s: { ...s, dark: [...s.dark], lit: [...s.lit], open: s.open?.lock ?? null },
      pz: pz ? { ...pz, spot: pz.spot.lock } : null,
    }));
  } catch { /* A full or unavailable store must not interrupt play. */ }
}
addEventListener('pagehide', checkpoint);
document.addEventListener('visibilitychange', () => { if (document.hidden) checkpoint(); });
function clearCheckpoint() {
  interrupted = null;
  try { sessionStorage.removeItem(KEY); } catch { /* Storage can be unavailable. */ }
}
function continueRun() {
  if (!interrupted) return;
  const life = interrupted;
  s = life.s; seed = s.seed; mode = life.mode; dayKey = life.dayKey;
  s.dark = Uint8Array.from(s.dark); s.lit = Uint8Array.from(s.lit);
  s.open = s.spots.find(spot => spot.lock === s.open) ?? null;
  touched = life.touched; newRoles = life.newRoles; shownLife = s.life;
  snd.unlock(); snd.release(); paused = false;
  enterChapter();
  selected = life.selected; vignette = life.vignette; pz = life.pz;
  if (pz) {
    pz.spot = s.spots.find(spot => spot.lock === pz.spot);
    pz.repeat = null; // transient feedback, including the old boolean form
  }
  if (s.status === 'named') { chapterCard = { t: 1 }; show('chapter'); }
  else if (life.screen === 'puzzle') { show('puzzle'); layoutPuzzle(); }
  else if (life.screen === 'lineup') { show('lineup'); layoutLineup(); }
  if (screen === 'lineup' || screen === 'puzzle') $('pause').style.display = 'grid';
  rec.start({ seed, daily: mode === 'daily', islands: s.order.map(i => i + 1).join(''), continued: true });
  interrupted = null;
}
$('continueRun').addEventListener('click', continueRun);
function begin(daily = false) {
  clearCheckpoint();
  snd.unlock();
  mode = daily ? 'daily' : 'free';
  const d = new Date();
  dayKey = today();
  seed = urlSeed ?? (daily ? dailySeed(d.getFullYear(), d.getMonth() + 1, d.getDate()) : (Date.now() ^ (Math.random() * 4294967296)) >>> 0);
  s = newRun(seed, { lies: LIES });
  shownLife = LIFE; touched = false; newRoles = 0;
  hints.ability = {};
  paused = false; snd.release();
  enterChapter();
  rec.start({ seed, daily: mode === 'daily', islands: s.order.map(i => i + 1).join('') });
}
// Fresh island: clear what belongs to the last one.
function enterChapter() {
  walkPhase = 0; petAt = null; squash = 0;
  wfx = []; sfx = []; rings = []; shake = 0; litT = new Float32Array(s.w * s.h); mendT = 0; bridgeT = 0; breakT = {};
  vignette = null; selected = -1; reveal = null; flash = null; nope = null; heartT = 0; pz = null;
  cam = camGoal();
  show('play');
}
// From the chapter card to the next island.
function goNext() {
  if (screen !== 'chapter' || !s || s.status !== 'named' || chapterCard.t < 0.5) return;
  nextChapter(s); s.events.length = 0;
  tone(392, 0.25, 0.05, 'sine', 200);
  enterChapter();
}

// ---------------------------------------------------------------- input: tap or hold to walk; buttons on the bar
let finger = null;
const inRect = (r, x, y) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
canvas.addEventListener('pointerdown', e => {
  if (paused) return;
  e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch {}
  const x = e.clientX, y = e.clientY;
  rings.push({ x, y, t: 0, screen: true });
  if (screen === 'lineup') { lineupTap(x, y); return; }
  if (screen === 'puzzle') { puzzleTap(x, y); return; }
  if (screen === 'chapter') { if (nextBtn && inRect(nextBtn, x, y)) goNext(); else if (chapterMenuBtn && chapterCard.t >= 0.5 && inRect(chapterMenuBtn, x, y)) leaveRun(); return; }
  if (screen !== 'play') return;
  if (vignette) { vignette.k = Math.max(vignette.k, VIG_SHOW); tone(660, 0.05, 0.03, 'sine'); return; }
  touched = true;
  const b = bar.find(b => inRect(b, x, y));
  if (b) { press(b.id); return; }
  if (y > barRect.y - 4) return;
  finger = { id: e.pointerId, tx: -1, ty: -1 };
  aim(x, y, true);
});
canvas.addEventListener('pointermove', e => {
  if (!finger || e.pointerId !== finger.id || paused || screen !== 'play') return;
  aim(e.clientX, e.clientY, false);
});
const lift = e => { if (finger && e.pointerId === finger.id) finger = null; };
canvas.addEventListener('pointerup', lift);
canvas.addEventListener('pointercancel', lift);
// Walk toward the tile under the finger. A new tile under a held finger changes the target.
function aim(x, y, first) {
  const tx = Math.floor((x - mapX) / T), ty = Math.floor((y - viewTop + cam) / T);
  if (tx === finger.tx && ty === finger.ty) return;
  finger.tx = tx; finger.ty = ty;
  walkTo(s, tx, ty);
  if (first) tone(520 + Math.random() * 40, 0.05, 0.03, 'sine');
}
function powerAdvice(id) {
  const spot = s.spots.find(p => p.lock === (id === 'glow' ? 'dark' : id));
  if (!spot) return { key: 'noMirror', mark: 'absent' };
  if (id === 'leap') {
    const distance = point => Math.hypot(s.px - point.x - .5, s.py - point.y - .5);
    const at = distance(s.pad) <= distance(s.landing) ? s.pad : s.landing;
    return s.bridge ? { key: 'useBridge', at, icon: 'bridge' } : { key: 'findStone', at, icon: 'stone' };
  }
  if (id === 'push') {
    const rock = s.grid.indexOf('B');
    return rock < 0 ? { key: 'rockOpen', mark: 'done' }
      : { key: 'findRock', at: { x: rock % s.w, y: Math.floor(rock / s.w) }, icon: 'rock' };
  }
  if (spot.open) return spot.taken ? { key: 'memoryTaken', mark: 'done' } : { key: 'findOpen', at: spot, icon: 'memory' };
  return { key: id === 'glow' ? 'findDark' : 'findMirror', at: spot, icon: id === 'glow' ? 'dark' : 'mirror' };

  chapter: s ? s.chapter : null, right: s ? s.right : 0, chapters: s ? s.chapters.map(c => ({ id: c.id, right: c.right, uses: c.uses, years: c.yearsSpent })) : [],
  next: screen === 'chapter' && nextBtn ? centre(nextBtn) : null,
  nextReady: screen === 'chapter' && chapterCard.t >= 0.5,
  chapterMenu: screen === 'chapter' && chapterMenuBtn ? centre(chapterMenuBtn) : null,
  chapterControls: screen === 'chapter' ? [nextBtn, chapterMenuBtn].filter(Boolean) : [],
  candidates: s ? consistent(s.faces, s.known) : [],
  lies: s ? s.lies : LIES, taught: save.taught, practice: save.practice, album: save.album.length,
  // the open puzzle, without which picture lies (shown is set only once it is solved or bought)
  puzzle: screen === 'puzzle' && pz ? {
    form: pz.spot.puzzle.form, lock: pz.spot.lock, n: pz.spot.puzzle.frags.length, cards: puzzleCards.map(centre),
    tried: pz.spot.puzzle.form === 'torn' ? [...pz.spot.puzzle.tried].reverse() : [...pz.spot.puzzle.tried],
    later: puzzleButtons.later ? centre(puzzleButtons.later) : null,
    show: puzzleButtons.show ? centre(puzzleButtons.show) : null, practice: !!pz.practice,
    practiceResult: !!pz.practice?.result,
    solving: !!pz.fx, how: pz.fx ? pz.fx.how : null, wrong: pz.wrong.length,
  } : null,
  waiting: s ? s.spots.filter(p => p.puzzle && p.puzzle.seen && !p.taken).map(p => p.lock) : [],
  liesWon: s?.puzzles ? { ...s.puzzles } : null,
  tile: T, viewTop, viewBottom, mapX, cam, touched,
});
window.borrowedSim = () => s; // checks may shorten a candle to reach the fading end quickly

// Keep the shared walking hint on the same memory as the first-touch cue.
function firstMemoryBottom() {
  const memory = s.spots.find(p => p.lock === 'free' && !p.taken);
  const x = memory ? sx(memory.x + 0.5) : W / 2;
  const y = memory ? sy(memory.y + 0.5) : (viewTop + viewBottom) / 2;
  document.documentElement.style.setProperty('--memory-hint-x', x + 'px');
  return Math.round(H - safe.b - y);
}
const help = hint(canvas, {
  kind: 'tap',
  key: 'borrowed:hint',
  label: t('tapMemory'),
  bottom: firstMemoryBottom,
  when: () => screen === 'play' && !paused && !vignette && s?.status === 'play',
  played: readJson(KEY) !== null,
});

resize();
localize();
requestAnimationFrame(frame);
</script>
