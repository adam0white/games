<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2622">
<title>Cinderhill: trail painter</title>
<style>
  html, body { margin: 0; height: 100%; background: #2b2622; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { font: 16px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; color: #efe6da; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100dvh; display: block; }
  canvas#gl { pointer-events: none; }
  canvas#c { touch-action: none; }
  button { font: inherit; font-weight: 600; color: #2b1d12; background: #efe3cc; border: 2px solid #2b1d12; border-radius: 14px; min-height: 44px; min-width: 44px; padding: 0 .8em; cursor: pointer; box-shadow: 0 2px 0 #2b1d1288; }
  button:active { transform: translateY(1px); box-shadow: none; }
  #top { position: fixed; top: calc(8px + env(safe-area-inset-top)); right: calc(8px + env(safe-area-inset-right)); display: none; gap: 6px; }
  #hud { position: fixed; top: calc(60px + env(safe-area-inset-top)); left: calc(8px + env(safe-area-inset-left)); right: calc(8px + env(safe-area-inset-right)); display: none; flex-direction: column; align-items: flex-start; pointer-events: none; color: #2b1d12; font-size: 13px; line-height: 1.3; }
  #hud > div { background: #f4ecdcdd; border: 1.5px solid #2b1d12; border-radius: 10px; padding: 4px 8px; margin-bottom: 4px; max-width: 100%; box-sizing: border-box; }
  #crew:empty { display: none; }
  #hud > #goal { background: #2b1d12e6; color: #f4ecdc; font-weight: 600; }
  #hud > #goal[hidden] { display: none; }
  #dayResult.won { color: #2e6b2a; font-weight: 700; } #dayResult.lost { color: #8a2a1a; font-weight: 700; }
  #crew small { opacity: .75; }
  #tools { position: fixed; left: 0; right: 0; bottom: calc(8px + env(safe-area-inset-bottom)); display: none; justify-content: center; gap: 6px; padding: 0 8px; flex-wrap: wrap; }
  #tools button[aria-pressed="true"] { background: #2b1d12; color: #f4ecdc; }
  #tools .sep { width: 6px; }
  #recall[aria-pressed="true"] { background: #b8432f; color: #fff; border-color: #5a1a10; }
  #hold[aria-pressed="true"] { background: #2f5b8a; color: #fff; border-color: #16304d; }
  .playing #top, .playing #tools, .playing #hud { display: flex; }
  #antCard { position: fixed; left: calc(8px + env(safe-area-inset-left)); bottom: calc(70px + env(safe-area-inset-bottom)); max-width: 17em; background: #f4ecdcf0; color: #2b1d12; border: 2px solid #2b1d12; border-radius: 12px; padding: 6px 34px 6px 10px; font-size: 14px; display: none; }
  #antCard.on { display: block; }
  #antCard b { display: block; }
  #antClose { position: absolute; top: 2px; right: 2px; min-width: 32px; min-height: 32px; padding: 0; border: none; background: none; box-shadow: none; font-size: 20px; }
  #toast { position: fixed; left: 50%; top: 30%; transform: translateX(-50%); background: #2b1d12e6; color: #f4ecdc; padding: 8px 14px; border-radius: 12px; pointer-events: none; opacity: 0; transition: opacity .3s; text-align: center; max-width: 80vw; }
  #toast.on { opacity: 1; }
  .screen { position: fixed; inset: 0; display: none; place-items: center; background: #1c1713cc; overflow-y: auto; touch-action: pan-y; }
  .screen.on { display: grid; }
  .card { max-width: 24em; width: calc(100% - 32px); box-sizing: border-box; padding: 18px; margin: 16px 0; background: #efe6d6; color: #2b1d12; border: 2px solid #2b1d12; border-radius: 18px; text-align: center; box-shadow: 0 6px 0 #0006; }
  .card h1 { font-size: 2.1em; margin: 0; letter-spacing: .02em; }
  .card h2 { margin: 0 0 .4em; }
  .card .sub { margin: 0 0 .6em; font-style: italic; opacity: .8; }
  .card p { margin: .5em 0; }
  .card button { margin: .3em; }
  .card button.main { font-size: 1.2em; min-width: 8em; min-height: 52px; background: #e2913a; }
  .counts { display: flex; gap: 6px; justify-content: center; align-items: center; flex-wrap: wrap; }
  .counts button[aria-pressed="true"] { background: #2b1d12; color: #f4ecdc; }
  .card a { color: #8a3d12; }
  .card .small { font-size: .85em; opacity: .85; }
  .card .new { border-left: 3px solid #e2913a; padding-left: .6em; text-align: left; }
  /* The frame sampler (?fps=1) sits in the HUD's flow under the stats and crew lines, so it never covers them. */
  #hud > #fps { background: #000a; color: #9fd67a; border: none; font: 12px/1.3 ui-monospace, monospace; padding: 4px 6px; border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; display: none; }
  #hud > #fps.on { display: block; }
  #nogl { position: fixed; left: 16px; right: 16px; top: 40%; text-align: center; color: #efe6da; display: none; pointer-events: none; }
  #nogl.on { display: block; }
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<canvas id="c" aria-label="The hill"></canvas>
<div id="nogl" data-i18n="noGl"></div>
<div id="hud"><div id="goal" hidden></div><div id="stats"></div><div id="crew"></div><div id="fps"></div></div>
<div id="top">
  <button id="layer"></button>
  <button id="zout" data-i18n-aria="zoomOut">−</button>
  <button id="zin" data-i18n-aria="zoomIn">+</button>
  <button id="pause" data-i18n-aria="pause">II</button>
</div>
<div id="antCard" role="status"><button id="antClose" aria-label="Close">×</button><div id="antText"></div></div>
<div id="toast" aria-live="polite"></div>
<div id="tools">
  <button data-tool="camera" data-i18n="camera"></button>
  <button data-tool="trail" data-i18n="trail"></button>
  <button data-tool="dig" data-i18n="dig"></button>
  <button data-tool="alarm" data-i18n="alarm"></button>
  <span class="sep"></span>
  <button id="recall"></button>
  <button id="hold"></button>
</div>
<section id="menu" class="screen on"><div class="card" id="menuCard">
  <h1 data-i18n="title"></h1>
  <p class="sub" data-i18n="subtitle"></p>
  <p data-i18n="intro"></p>
  <p class="small" data-i18n="how"></p>
  <p class="small new" id="whatsNew" data-i18n="whatsNew"></p>
  <div class="counts"><span data-i18n="antsLabel"></span><button data-count="500">500</button><button data-count="2000">2,000</button><button data-count="5000">5,000</button></div>
  <p><button id="play" class="main" data-i18n="play"></button></p>
  <p><button id="langMenu" data-i18n="lang"></button></p>
  <p class="small"><a id="modeLink" href="?colony=1" data-i18n="toColony"></a> · <a href="check.html" data-i18n="check"></a></p>
</div></section>
<section id="day" class="screen"><div class="card" id="dayCard">
  <h2 id="dayHead"></h2>
  <p id="dayResult"></p>
  <p id="dayGoal"></p>
  <p class="small" id="dayTip"></p>
  <p class="small" id="dayNote"></p>
  <p><button id="dayGo" class="main"></button></p>
  <p><button id="dayRestart"></button></p>
</div></section>
<section id="paused" class="screen"><div class="card" id="pauseCard">
  <h2 data-i18n="paused"></h2>
  <p><button id="resume" class="main" data-i18n="resume"></button></p>
  <div class="counts"><span data-i18n="antsLabel"></span><button data-count="500">500</button><button data-count="2000">2,000</button><button data-count="5000">5,000</button></div>
  <div class="counts" id="looks"><span data-i18n="lookLabel"></span><button data-look="ink" data-i18n="look_ink"></button><button data-look="ember" data-i18n="look_ember"></button><button data-look="field" data-i18n="look_field"></button></div>
  <p><button id="tapTrail"></button></p>
  <p><button id="sound"></button> <button id="langPause" data-i18n="lang"></button></p>
  <p><button id="toMenu" data-i18n="menu"></button></p>
</div></section>
<script type="module" src="painter.js"></script>
</body>
</html>
