<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#493b50"><title>Lamp Keeper</title>
<style>
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#493b50;color:#553d3a;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;-webkit-tap-highlight-color:transparent} canvas{display:block;width:100vw;height:100dvh;touch-action:none} button{font:700 15px ui-rounded,"Trebuchet MS",system-ui,sans-serif;cursor:pointer;touch-action:manipulation;color:#614039;background:#f9e8cf;border:1px solid #d8b796;border-radius:16px;min-height:48px;padding:10px 20px;box-shadow:0 3px 0 #b88f7d} button:active{transform:translateY(2px);box-shadow:0 1px 0 #b88f7d} button:disabled{opacity:.35;box-shadow:none} button.primary{background:#a35445;color:#fff8e8;border-color:#8b473e;min-width:180px;font-size:17px} .screen{position:fixed;inset:0;display:none;place-items:center;background:#30243c77;padding:calc(12px + env(safe-area-inset-top)) 16px calc(12px + env(safe-area-inset-bottom));overflow-y:auto;touch-action:pan-y}.screen.on{display:grid}.card{width:min(100%,370px);padding:24px 24px 20px;text-align:center;border-radius:28px;background:#fff4df;box-shadow:0 14px 45px #22172e66, inset 0 0 0 1px #fff9ee;border:1px solid #e9c8a5}.eyebrow{text-transform:uppercase;letter-spacing:.2em;font-size:10px;font-weight:800;color:#ae7766} h1,h2{font-family:Georgia,serif;font-weight:400;color:#673f3b;line-height:1;margin:8px 0 10px} h1{font-size:39px}h2{font-size:32px}p{margin:8px 0;color:#8c6b5d;font-size:14px;line-height:1.45}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin-top:15px}.ornament{font-size:21px;color:#d3a15f;letter-spacing:.4em}.small{font-size:12px;color:#a07868}#levels{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:12px 0}#levels button{width:44px;min-width:44px;min-height:44px;padding:0;border-radius:13px}#levels button.current{background:#e8b580;color:#693d38}#daily{width:100%}#pause{position:fixed;top:calc(12px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));width:46px;min-height:46px;padding:0;border-radius:50%;display:none;background:#fff1dcdd;font-size:18px;box-shadow:0 2px 0 #80685c88}#hud{position:fixed;top:calc(14px + env(safe-area-inset-top));left:18px;color:#fff5df;text-shadow:0 1px 4px #3a2939;pointer-events:none;display:none}.hud-title{font:16px Georgia,serif}.hud-sub{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin-top:4px}#probe{position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
body>.kit-hint:not(.still),body>.kit-hint>:not(.label){visibility:hidden}
#hudWind{margin-top:4px;font-size:13px}
@media (max-height:500px) and (min-width:600px){
 #menu .card{width:min(100%,560px);padding:16px 20px}
 #menu .ornament,#menu .eyebrow{display:none}
 #menu .actions{margin-top:9px}
 #levels{margin:9px 0}
}
</style></head><body>
<canvas id="c" aria-label="Draw a route along the lamps"></canvas><div id="probe"></div><div id="hud"><div class="hud-title" id="hudTitle"></div><div class="hud-sub" id="hudSub"></div><div id="hudWind" role="status"></div></div><button id="pause" aria-label="Pause">Ⅱ</button>
<div id="menu" class="screen on"><div class="card"><div class="ornament">✦ ☼ ✦</div><div class="eyebrow">A little evening journey</div><h1>Lamp Keeper</h1><p>Light the way home before night falls.</p><div class="actions"><button class="primary" id="play">Begin evening</button></div><div id="levels" aria-label="Evenings"></div><button id="daily">Daily evening</button><p class="small" id="dailyBest"></p><div class="actions"><button id="sound1">Sound: on</button></div></div></div>
<div id="paused" class="screen"><div class="card"><div class="ornament">✦</div><h2>Paused</h2><p>The hillside can wait.</p><div class="actions"><button class="primary" id="resume">Continue</button></div><div class="actions"><button id="quit">Evenings</button><button id="sound2">Sound: on</button></div></div></div>
<div id="end" class="screen"><div class="card"><div class="ornament">✦ ✧ ✦</div><h2 id="endTitle"></h2><p id="endLine"></p><div class="actions"><button class="primary" id="next">Next evening</button></div><div class="actions"><button id="retry">Try again</button><button id="toMenu">Evenings</button></div></div></div>
<script type="module" src="./main.js"></script><script src="/notes/button.js" defer></script></body></html>
