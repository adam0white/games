<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2e9d6">
  <link rel="icon" href="data:,">
  <title>Night Flock II · The valley</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="folio">
    <header>
      <div class="heading">
        <div id="chapter" class="smallcaps">Evening 01 / 20</div>
        <h1>Night <i>Flock</i> <sup>II</sup></h1>
      </div>
      <button id="pause" class="round" aria-label="Pause"><span class="bars" aria-hidden="true"></span></button>
    </header>
    <div class="fieldline"><span id="farm"></span><span id="weather"></span></div>
    <div class="plate">
      <canvas id="field" width="360" height="520" aria-label="Move the sheepdog behind the flock and drive the sheep uphill through the gate"></canvas>
      <span id="hint-drag"></span><span id="hint-hold"></span><span id="hint-outrun"></span>
    </div>
    <footer>
      <div class="measure">
        <span class="smallcaps">In the fold</span>
        <span class="tally"><b id="home">0</b><span class="divider"> / </span><span id="total">12</span></span>
      </div>
      <div class="composure">
        <div class="dusk-label"><label for="calm" class="smallcaps">Calm</label><span id="calm-value">100%</span></div>
        <meter id="calm" min="0" max="100" low="50" high="78" optimum="100" value="100">100%</meter>
      </div>
      <div class="daylight">
        <div class="dusk-label"><span class="smallcaps">Until dark</span><span id="time">–</span></div>
        <div class="dusk-track"><span id="light"></span></div>
      </div>
    </footer>
    <div class="ledger"><div><span id="instruction"></span><div class="field-status"><span id="score">0 points</span><span id="remark" role="status"></span></div></div><button id="field-map" class="map-link">Valley map ↗</button></div>
  </main>

  <section id="paused" class="sheet" aria-labelledby="pause-title"><div class="card">
    <div class="smallcaps" id="pause-chapter">Evening 01</div>
    <h2 id="pause-title">Paused</h2>
    <p id="pause-goal"></p>
    <button class="primary" id="resume">Back to the flock</button>
    <div class="pair"><button id="evenings">Valley map</button><button id="sound">Sound on</button></div>
  </div></section>
  <section id="evenings-screen" class="sheet" aria-labelledby="fields-title"><div class="card atlas">
    <div class="atlas-title"><div><div class="smallcaps">The three farms</div><h2 id="fields-title">The valley</h2></div><span id="total-stars"></span></div>
    <div class="map"><canvas id="valley" aria-label="Low Beck, Fellside and High Tarn farms, linked by a bridleway"></canvas><div id="levels" aria-label="Choose an evening"></div></div>
    <div class="pair atlas-actions"><button id="daily">Daily evening</button><button id="endless">Count them home ∞</button></div>
    <p id="record"></p>
    <button id="back">Back</button>
  </div></section>
  <section id="end" class="sheet" aria-labelledby="end-title"><div class="card">
    <div id="end-caption" class="smallcaps"></div>
    <h2 id="end-title"></h2>
    <p id="end-line"></p>
    <div id="stars" aria-label="Evening stars"></div>
    <p id="end-score"></p>
    <button class="primary" id="next"></button>
    <div class="pair"><button id="retry">Try again</button><button id="end-evenings">Valley map</button></div>
  </div></section>
  <script type="module" src="./main.js"></script>
  <script src="/notes/button.js" defer></script>
</body>
</html>
