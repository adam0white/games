<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#160f2c">
<title>Borrowed Time</title>
<style>
  html, body { margin: 0; height: 100%; background: #160f2c; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { font: 17px/1.4 ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #fff3dc; }
  canvas#c { display: block; width: 100vw; height: 100dvh; touch-action: none; }
  .screen { position: fixed; inset: 0; display: none; place-items: center; text-align: center; pointer-events: none; }
  .screen.on { display: grid; }
  .screen > div { box-sizing: border-box; max-width: 22em; width: calc(100% - 24px); max-height: 100dvh; overflow-y: auto; touch-action: pan-y;
    padding: calc(12px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom)); pointer-events: auto; }
  .veil { background: #120a26cc; }
  #menu.veil { background: radial-gradient(ellipse at 50% 45%, #120a26c0, #120a2640 75%); }
  h1 { font-size: 2.6em; line-height: 1; margin: .1em 0 .15em; color: #ffd98a; letter-spacing: .01em; text-shadow: 0 3px 0 #7a3b5e, 0 0 26px #ff9a3a99; }
  h2 { font-size: 1.9em; line-height: 1.1; margin: 0 0 .25em; color: #ffd98a; text-shadow: 0 3px 0 #7a3b5e; }
  p { margin: .35em 0; }
  .sub { opacity: .9; margin-bottom: .6em; }
  button { font: inherit; font-weight: 600; color: #fff3dc; background: #ffffff14; border: 2px solid #ffd98a88; border-radius: 999px; padding: .45em 1.2em; margin: .25em; min-width: 8em; min-height: 46px; touch-action: manipulation; cursor: pointer; }
  button.main { background: #ffb347; color: #3a1a10; border-color: #ffb347; font-size: 1.25em; min-width: 9em; box-shadow: 0 4px 0 #b8642a; }
  button.main:active { transform: translateY(2px); box-shadow: 0 2px 0 #b8642a; }
  button small { font-weight: 500; opacity: .85; }
  #hero { display: block; width: 100%; height: 104px; margin: 0 auto -.2em; }
  #gallery { display: block; width: 100%; max-width: 330px; height: 92px; margin: .4em auto .1em; }
  .small { font-size: .85em; opacity: .85; }
  #doneArt { display: block; width: 100%; max-width: 340px; height: 178px; margin: .3em auto; }
  #doneWho { font-weight: 700; color: #ffe9a8; }
  #doneScore { font-size: 1.3em; font-weight: 800; }
  #doneChose { white-space: pre-line; }
  #pause { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: max(calc(8px + env(safe-area-inset-right)), calc((100vw - 460px) / 2 + 8px)); width: 46px; height: 46px; min-width: 0; min-height: 0; margin: 0; padding: 0;
    border: 2px solid #ffd98a66; border-radius: 50%; background: #120a26e6; display: none; place-items: center; touch-action: none; }
  #pause::before { content: ''; width: 4px; height: 16px; border: solid #ffd98a; border-width: 0 5px; }
  .lab-notice { max-width: 26em; margin-left: auto !important; margin-right: auto !important; }
  @media (max-height: 660px) { #hero { height: 72px; } #gallery { height: 80px; } h1 { font-size: 2.1em; } .sub { margin-bottom: .3em; } button { min-height: 44px; } #doneArt { height: 118px; } #done h2 { font-size: 1.7em; } #done p { margin: .25em 0; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="pause" aria-label="Pause"></button>
<div id="menu" class="screen veil on"><div>
  <canvas id="hero" aria-hidden="true"></canvas>
  <h1>Borrowed Time</h1>
  <p class="sub">You forgot who you were: as a child, grown up and old. One candle to find all three.</p>
  <p><button id="play" class="main">Play</button></p>
  <p><button id="daily">Daily <small></small></button></p>
  <canvas id="gallery" aria-label="Who you have been"></canvas>
  <p class="small" id="bestLine"></p>
  <p><button id="sound">Sound: on</button></p>
</div></div>
<div id="paused" class="screen veil"><div>
  <h2>Paused</h2>
  <p class="small">Time stands still.</p>
  <p class="small">Each right name: 100 + years left × 10 ÷ 3.</p>
  <p><button id="resume" class="main">Resume</button></p>
  <p><button id="toMenu">Menu</button></p>
  <p><button id="sound2">Sound: on</button></p>
</div></div>
<div id="done" class="screen veil"><div>
  <h2 id="doneTitle">You remember!</h2>
  <canvas id="doneArt"></canvas>
  <p id="doneWho"></p>
  <p class="small" id="doneChose"></p>
  <p id="doneScore"></p>
  <p class="small" id="doneBest"></p>
  <p><button id="again" class="main">Play again</button></p>
  <p><button id="doneMenu">Menu</button></p>
</div></div>
<script type="module">
import {
  newRun, step, walkTo, use, ready, guess, nextChapter, consistent, tileOf, dailySeed, roleId, roleName, ROLES,
  ABILITIES, COST, LIFE, LEAP_TICKS, DT, FACES, WRONG, CHAPTERS, SELF_POINTS, PICK, SHOW, pickLie, showMe, later, fits,
} from './sim.js';
import { place, person, pet, portrait, value, kindIcon, abilityIcon, hand, candle, flame, star, hat, tool, roundRect, INK, CREAM, GOLD, ABILITY_COLOUR } from './art.js';
import { readJson, writeJson } from '../kit/save.js';
import { sound } from '../kit/audio.js';
import { onLeave, isPauseKey } from '../kit/pause.js';
import { screens } from '../kit/screens.js';
import { lab } from '../kit/lab.js';
import { hint } from '../kit/hint.js';
import { noZoom } from '../kit/zoom.js'; noZoom(); // no double-tap or pinch zoom (note #74)

const $ = id => document.getElementById(id);
const query = new URLSearchParams(location.search);
// A rainy night (tester t1, note #115: "more dark and gloomy ... a night raining with dead flowers around"). ?gloom=0 shows the old
// look, so the two can be compared; remove GLOOM and its branches to go back for good.
const GLOOM = query.get('gloom') !== '0';
// Memories that lie (tester t1, notes #137 and #140): each memory is won by finding which of its pictures lies.
// ?lies=0 plays the old way (a memory is yours when you reach it), on the same islands and faces.
const LIES = query.get('lies') !== '0';
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU = Math.PI * 2;
const ease = p => p < 0.5 ? 2 * p * p : 1 - (-2 * p + 2) ** 2 / 2;
const back = p => 1 + 2.7 * (p - 1) ** 3 + 1.7 * (p - 1) ** 2; // ease out with a small overshoot

// ---------------------------------------------------------------- save (one JSON blob)
// taught is a set of bits in the same number (old saves hold 0 or 1): 1 the first memory was found (the hand on the
// island stops), then one bit for each kind of puzzle taught by the ghost finger (TEACH).
const KEY = 'borrowed-save';
const TEACH = { nobody: 2, clue: 4, pair: 8, three: 16 };
const save = { v: 1, sound: true, best: 0, runs: 0, gallery: {}, daily: {}, taught: 0, ...readJson(KEY, {}) };
const store = () => writeJson(KEY, save);
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const urlSeed = query.has('seed') ? Number(query.get('seed')) >>> 0 : null;

// ---------------------------------------------------------------- sound
const snd = sound({ on: () => save.sound });
const tone = (f, d, v, type = 'triangle', slide = 0) => { if (snd.ctx) snd.tone(f, d, v, type, slide); };
const noise = (d, v, hz) => { if (snd.ctx) snd.noise(d, v, hz); };
const SCALE = [392, 440, 523.25, 587.33, 659.25, 783.99, 880, 1046.5];
const voice = {
  glow() { tone(523, 0.5, 0.06, 'sine', 500); setTimeout(() => tone(784, 0.6, 0.05, 'sine', 600), 70); },
  push() { noise(0.3, 0.35, 260); tone(110, 0.35, 0.12, 'sawtooth', -50); },
  leap() { tone(260, 0.4, 0.08, 'triangle', 520); noise(0.25, 0.08, 1800); },
  rewind() { for (let k = 0; k < 4; k++) setTimeout(() => tone(1400 - k * 220, 0.18, 0.05, 'sine', -500), k * 70); },
  burn(cost) { tone(220, 0.35, 0.07, 'triangle', -90); noise(0.25, 0.06 + cost / 400, 3200); },
};

// ---------------------------------------------------------------- lab recording
const rec = lab('borrowed');
rec.notice($('menu').firstElementChild);
rec.toggle($('paused').firstElementChild);

// ---------------------------------------------------------------- canvas and layout
const canvas = $('c'), g = canvas.getContext('2d');
let W = 0, H = 0, dpr = 1, safe = { t: 0, b: 0, l: 0, r: 0 };
const probe = document.createElement('div');
probe.style.cssText = 'position:fixed;top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);left:env(safe-area-inset-left);right:env(safe-area-inset-right);pointer-events:none;visibility:hidden';
document.body.append(probe);
// T: tile size. The island is 7 tiles wide; mapX is its left edge. viewTop and viewBottom bound the playfield
// between the top strip (candle, memories) and the ability bar.
let T = 50, hudL = 0, mapX = 0, viewTop = 90, viewBottom = 500, cam = 0, bar = [], barRect = null, slots = [];
function resize() {
  dpr = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  const cs = getComputedStyle(probe);
  safe = { t: parseFloat(cs.top) || 0, b: parseFloat(cs.bottom) || 0, l: parseFloat(cs.left) || 0, r: parseFloat(cs.right) || 0 };
  const usable = Math.min(W - safe.l - safe.r, 460);
  T = Math.min(66, Math.floor((usable - 12) / 7));
  mapX = Math.round((W - 7 * T) / 2);
  viewTop = safe.t + 74;
  const barH = 84;
  const barW = Math.min(usable - 12, 440), bx = (W - barW) / 2, by = H - safe.b - barH - 6;
  barRect = { x: bx, y: by, w: barW, h: barH };
  viewBottom = by - 4;
  const ids = [...ABILITIES.map(a => a.id), 'who'], gap = 6, bw = (barW - gap * (ids.length - 1)) / ids.length;
  bar = ids.map((id, i) => ({ id, x: bx + i * (bw + gap), y: by, w: bw, h: barH }));
  // the memory slots in the top strip, right of the candle
  hudL = Math.max(safe.l, (W - Math.min(W, 460)) / 2);
  const left = hudL + 92, right = W - Math.max(safe.r, (W - Math.min(W, 460)) / 2) - 62, n = 4, step = Math.min(54, (right - left) / n);
  const sx = left + ((right - left) - step * n) / 2 + step / 2;
  slots = [0, 1, 2, 3].map(d => ({ x: sx + d * step, y: safe.t + 38, r: Math.min(22, step * 0.42) }));
  if (s) cam = camGoal();
}
addEventListener('resize', resize);
const sx = x => mapX + x * T; // tile units to screen
const sy = y => viewTop + y * T - cam;
function camGoal() {
  const view = viewBottom - viewTop, full = s.h * T;
  if (full <= view) return -(view - full) / 2;
  const want = s.py * T - view * 0.55;
  return Math.max(-T * 0.3, Math.min(full - view + T * 0.3, want));
}

// ---------------------------------------------------------------- game state
let s = null, screen = 'menu', paused = false, clock = 0, acc = 0, last = performance.now();
let mode = 'free', dayKey = null, seed = 0;
let shownLife = LIFE, walkPhase = 0, petAt = null, squash = 0, touched = false;
let wfx = [], sfx = [], rings = [], shake = 0, litT = null, mendT = 0, bridgeT = 0, breakT = {};
let pz = null; // the open puzzle: { spot, t, teach, wrong: [{ i, t }], fx: { how, t } after it is solved, then: vignette waiting }
let vignette = null, selected = -1, reveal = null, flash = null, nope = null, heartT = 0, newRoles = 0, chapterCard = { t: 0 }, nextBtn = null, chapterMenuBtn = null;
const hints = { ability: {} };

function begin(daily = false) {
  snd.unlock();
  mode = daily ? 'daily' : 'free';
  const d = new Date();
  dayKey = today();
  seed = urlSeed ?? (daily ? dailySeed(d.getFullYear(), d.getMonth() + 1, d.getDate()) : (Date.now() ^ (Math.random() * 4294967296)) >>> 0);
  s = newRun(seed, { lies: LIES });
  shownLife = LIFE; touched = false; newRoles = 0;
  hints.ability = {};
  paused = false; snd.release();
  enterChapter();
  rec.start({ seed, daily: mode === 'daily', islands: s.order.map(i => i + 1).join('') });
}
// Fresh island: clear what belongs to the last one.
function enterChapter() {
  walkPhase = 0; petAt = null; squash = 0;
  wfx = []; sfx = []; rings = []; shake = 0; litT = new Float32Array(s.w * s.h); mendT = 0; bridgeT = 0; breakT = {};
  vignette = null; selected = -1; reveal = null; flash = null; nope = null; heartT = 0; pz = null;
  cam = camGoal();
  show('play');
}
// From the chapter card to the next island.
function goNext() {
  if (screen !== 'chapter' || !s || s.status !== 'named' || chapterCard.t < 0.5) return;
  nextChapter(s); s.events.length = 0;
  tone(392, 0.25, 0.05, 'sine', 200);
  enterChapter();
}

// ---------------------------------------------------------------- input: tap or hold to walk; buttons on the bar
let finger = null;
const inRect = (r, x, y) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
canvas.addEventListener('pointerdown', e => {
  if (paused) return;
  e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch {}
  const x = e.clientX, y = e.clientY;
  rings.push({ x, y, t: 0, screen: true });
  if (screen === 'lineup') { lineupTap(x, y); return; }
  if (screen === 'puzzle') { puzzleTap(x, y); return; }
  if (screen === 'chapter') { if (nextBtn && inRect(nextBtn, x, y)) goNext(); else if (chapterMenuBtn && chapterCard.t >= 0.5 && inRect(chapterMenuBtn, x, y)) leaveRun(); return; }
  if (screen !== 'play') return;
  if (vignette) { vignette.k = Math.max(vignette.k, VIG_SHOW); tone(660, 0.05, 0.03, 'sine'); return; }
  touched = true;
  const b = bar.find(b => inRect(b, x, y));
  if (b) { press(b.id); return; }
  if (y > barRect.y - 4) return;
  finger = { id: e.pointerId, tx: -1, ty: -1 };
  aim(x, y, true);
});
canvas.addEventListener('pointermove', e => {
  if (!finger || e.pointerId !== finger.id || paused || screen !== 'play') return;
  aim(e.clientX, e.clientY, false);
});
const lift = e => { if (finger && e.pointerId === finger.id) finger = null; };
canvas.addEventListener('pointerup', lift);
canvas.addEventListener('pointercancel', lift);
// Walk toward the tile under the finger. A new tile under a held finger changes the target.
function aim(x, y, first) {
  const tx = Math.floor((x - mapX) / T), ty = Math.floor((y - viewTop + cam) / T);
  if (tx === finger.tx && ty === finger.ty) return;
  finger.tx = tx; finger.ty = ty;
  walkTo(s, tx, ty);
  if (first) tone(520 + Math.random() * 40, 0.05, 0.03, 'sine');
}
function press(id) {
  if (id === 'who') { openLineup(); return; }
  const ok = use(s, id);
  if (!ok) {
    nope = { id, t: 0 };
    tone(150, 0.14, 0.06, 'square', -30);
  }
}

// ---------------------------------------------------------------- the puzzle: which picture lies?
// A memory shows two or three photographs of your life; one of them lies. Tap it. The clues you have (the top bar) and
// the six faces (the strip below the photographs; faces already ruled out are crossed) are enough to tell. A wrong tap
// costs PICK years and marks that photograph true; "Show me" pays SHOW years to see the lie; "Later" leaves the memory
// on the island. The first puzzle of each kind is taught by a ghost finger, without words.
let puzzleCards = [], puzzleButtons = { later: { x: 0, y: 0, w: 0, h: 0 }, show: { x: 0, y: 0, w: 0, h: 0 } }, puzzleFaces = null, puzzleTop = 0;
const FX_TEAR = 1.0, FX_POINT = 0.55; // seconds the lie takes to tear; with Show me, the finger points first
function openPuzzle(e) {
  const spot = s.open;
  if (!spot) return;
  const form = spot.puzzle.form;
  pz = { spot, t: -0.25, teach: !(save.taught & TEACH[form]), wrong: [], fx: null, then: null };
  screen = 'puzzle'; finger = null; selected = -1;
  tone(440, 0.25, 0.05, 'sine', 120); setTimeout(() => tone(330, 0.3, 0.04, 'sine', -60), 120);
  rec.event('puzzle', { lock: spot.lock, form, life: Math.round(s.life) });
}
function closePuzzle() { screen = 'play'; pz = null; tone(330, 0.12, 0.05, 'sine', -100); }
function puzzleAct(fn) {
  if (screen !== 'puzzle' || !pz || pz.fx || pz.t < 0 || !s.open) return;
  fn();
  drain();
  if (screen === 'puzzle' && pz && !pz.fx && !s.open) closePuzzle(); // Later
}
function puzzleTick() {
  pz.t += 1 / 60;
  for (const w of pz.wrong) w.t += 1 / 60;
  if (pz.fx) {
    pz.fx.t += 1 / 60;
    if (pz.fx.t >= FX_TEAR + (pz.fx.how === 'shown' ? FX_POINT : 0)) { screen = 'play'; vignette = pz.then; pz = null; }
  }
}
function puzzleTap(x, y) {
  if (!pz) return;
  if (inRect(puzzleButtons.later, x, y)) { puzzleAct(() => later(s)); return; }
  if (inRect(puzzleButtons.show, x, y)) { puzzleAct(() => showMe(s)); return; }
  const i = puzzleCards.findIndex(c => inRect(c, x, y));
  if (i < 0) return;
  if (pz.spot.puzzle.tried[i]) { tone(150, 0.1, 0.05, 'square'); return; } // already shown true
  puzzleAct(() => pickLie(s, i));
}
function layoutPuzzle() {
  const n = pz.spot.puzzle.frags.length, cw0 = Math.min(W, 460);
  const top = viewTop + 2, bottom = H - safe.b - 8;
  puzzleTop = top;
  const bh = 52, by = bottom - bh, bw = Math.min(176, (cw0 - 36) / 2);
  puzzleButtons = { later: { x: W / 2 - bw - 6, y: by, w: bw, h: bh }, show: { x: W / 2 + 6, y: by, w: bw, h: bh } };
  // the photographs and the faces below them sit together, centred in the room between the question and the buttons
  // the faces: one row on a short screen, else two rows of three, big enough to read every feature
  const gap = 8, fgap = 22, a0 = top + 58, a1 = by - 12, cg = 12;
  const pw1 = Math.min(54, (cw0 - 40 - gap * 5) / FACES), cw2 = Math.min((cw0 - 32 - cg) / 2, 210);
  // two rows take what height the photographs leave, up to a face as wide as a third of the screen less its margins
  const cardsH = n === 2 ? cw2 : 2 * cw2 * 0.85 + cg;
  const pw3 = Math.min(100, (cw0 - 60 - gap * 2) / 3, (a1 - a0 - fgap - cardsH - gap - 24) / 2);
  const cols = pw3 >= 64 ? 3 : FACES;
  const pw = cols === 3 ? pw3 : pw1, fh = cols === 3 ? 2 * pw + gap : pw, room = a1 - a0 - fh - fgap;
  let cw = cw2, ch, block;
  if (n === 2) { ch = Math.min(room, cw * 1.08); cw = Math.min(cw, ch / 0.9); block = ch; }
  else { ch = Math.min(cw * 0.95, (room - cg) / 2); cw = Math.min(cw, ch / 0.85); block = 2 * ch + cg; }
  const y = a0 + Math.max(0, (room - block) / 2) * 0.6;
  puzzleCards = n === 2
    ? [0, 1].map(i => ({ x: W / 2 + (i ? cg / 2 : -cg / 2 - cw), y, w: cw, h: ch }))
    : [{ x: W / 2 - cg / 2 - cw, y, w: cw, h: ch }, { x: W / 2 + cg / 2, y, w: cw, h: ch }, { x: W / 2 - cw / 2, y: y + ch + cg, w: cw, h: ch }];
  puzzleFaces = { x0: (W - (pw * cols + gap * (cols - 1))) / 2, y: y + block + fgap, pw, gap, cols, w: pw * cols + gap * (cols - 1), h: fh };
}
// One thing of a person, drawn big: a hat on a head, a held thing, a pet.
function thing(d, v, x, y, R, time) {
  if (d === 0) {
    g.beginPath(); g.arc(x, y + R * 0.5, R * 0.55, 0, TAU); g.fillStyle = '#f6c9a0'; g.fill(); g.strokeStyle = INK; g.lineWidth = Math.max(1.5, R * 0.06); g.stroke();
    g.fillStyle = INK; for (const k of [-1, 1]) { g.beginPath(); g.arc(x + k * R * 0.18, y + R * 0.55, R * 0.06, 0, TAU); g.fill(); }
    hat(g, v, x, y + R * 0.45, R * 0.62);
  } else if (d === 1) tool(g, v, x, y + R * 0.15, R * 0.62, time);
  else pet(g, v, x, y + R * 0.1, R * 0.55, time);
}
// A photograph of a memory: the place (when it shows one) fills it; the other things stand in it, each on a pale halo
// so they read at a glance. Returns where each thing was drawn, for the teaching marks.
function photo(fr, x, y, w, h, time, frame = '#efe4c8') {
  const pad = Math.max(5, Math.round(w * 0.05)), ix = x + pad, iy = y + pad, iw = w - pad * 2, ih = h - pad * 2.8;
  g.save();
  g.shadowColor = 'rgba(0,0,0,.5)'; g.shadowBlur = 14; g.shadowOffsetY = 5;
  g.beginPath(); roundRect(g, x, y, w, h, 7); g.fillStyle = frame; g.fill();
  g.restore();
  const feats = [];
  g.save(); g.beginPath(); g.rect(ix, iy, iw, ih); g.clip();
  const pi = fr.dims.indexOf(3);
  if (pi >= 0) { place(g, fr.vals[pi], ix, iy, iw, ih, time); feats.push({ d: 3, rect: [ix, iy, iw, ih] }); }
  else { // indoors, by a lamp
    const bg = g.createRadialGradient(ix + iw * 0.5, iy + ih * 0.35, 4, ix + iw * 0.5, iy + ih * 0.5, iw * 0.8);
    bg.addColorStop(0, '#8a76b8'); bg.addColorStop(1, '#2e2452');
    g.fillStyle = bg; g.fillRect(ix, iy, iw, ih);
    g.fillStyle = '#3a2a3e'; g.fillRect(ix, iy + ih * 0.78, iw, ih);
    g.strokeStyle = 'rgba(255,233,168,.18)'; g.lineWidth = 1;
    for (let k = 1; k < 6; k++) { g.beginPath(); g.moveTo(ix + k * iw / 6, iy + ih * 0.78); g.lineTo(ix + k * iw / 6 + (k - 3) * 6, iy + ih); g.stroke(); }
  }
  const objs = fr.dims.map((d, k) => [d, fr.vals[k]]).filter(([d]) => d !== 3);

    form: pz.spot.puzzle.form, lock: pz.spot.lock, n: pz.spot.puzzle.frags.length, cards: puzzleCards.map(centre),
    tried: [...pz.spot.puzzle.tried], later: centre(puzzleButtons.later), show: centre(puzzleButtons.show), teach: pz.teach,
    solving: !!pz.fx, how: pz.fx ? pz.fx.how : null, wrong: pz.wrong.length,
  } : null,
  waiting: s ? s.spots.filter(p => p.puzzle && p.puzzle.seen && !p.taken).map(p => p.lock) : [],
  liesWon: s?.puzzles ? { ...s.puzzles } : null,
  tile: T, viewTop, viewBottom, mapX, cam, touched,
});
window.borrowedSim = () => s; // checks may shorten a candle to reach the fading end quickly

// The hint is drawn over the island's middle column (the island is 7 tiles wide and centred). It goes on the
// nearest tile above the player, in that column, with no memory or player on it, on the tile above (the words) or on
// the two tiles below (the hand hangs below the knob). Plain ground is preferred, so the copy taps somewhere the player
// could walk. With no such tile it sits mid-screen.
function clearSpot() {
  const free = (x, y) => {
    if (Math.floor(s.px) === x && Math.floor(s.py) === y) return false;
    return !s.spots.some(p => !p.taken && p.x === x && p.y === y);
  };
  const plain = (x, y) => y >= 0 && y < s.h && s.grid[y * s.w + x] === '.' && free(x, y);
  const me = Math.floor(s.py);
  const rows = [];
  for (let y = me - 2; y >= 0; y--) rows.push(y);
  for (let y = me + 1; y < s.h; y++) rows.push(y);
  const fits = y => {
    const mid = sy(y) + T / 2;
    return mid >= viewTop + T && mid <= viewBottom - T * 1.5 && free(3, y - 1) && free(3, y) && free(3, y + 1) && free(3, y + 2);
  };
  const best = rows.find(y => fits(y) && plain(3, y)) ?? rows.find(fits);
  if (best === undefined) return Math.max(190, Math.round(H * 0.53));
  return Math.round(H - safe.b - (sy(best) + T / 2));
}
// A first-time player who does not touch for 3 s in play sees a finger tap the island (experiments/kit/hint.js).
// While it shows, the game's own pointing hand waits. It sits on a clear tile above the player (clearSpot).
const help = hint(canvas, {
  kind: 'tap',
  key: 'borrowed:hint',
  label: 'Tap the island to walk there',
  bottom: clearSpot,
  when: () => screen === 'play' && !paused && !vignette && s?.status === 'play',
  played: readJson(KEY) !== null,
});

resize();
menu();
requestAnimationFrame(frame);
</script>
<script src="/notes/button.js" defer></script>
