<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071528"><title>Thankful Garden</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#071528;color:#f9eed6;font:16px/1.5 system-ui,sans-serif}canvas{display:block;width:100%;height:100dvh;touch-action:none}button,input{font:inherit}button{cursor:pointer;min-height:44px;color:inherit;background:#ffffff12;border:1px solid #e8dcc04d;border-radius:24px;padding:9px 16px}button:focus-visible,input:focus-visible{outline:3px solid #e4cf91;outline-offset:3px}header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:16px 20px;pointer-events:none}header>*{pointer-events:auto}h1{font-size:14px;font-weight:500;letter-spacing:.12em;margin:0;text-transform:uppercase;white-space:nowrap}#looks{display:flex;gap:5px}#looks button{font-size:12px;letter-spacing:.08em;min-height:36px;padding:4px 14px}#ritual{pointer-events:none;position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:12px;right:12px;text-align:center}#ritual button,#ritual a{pointer-events:auto}#line{font-size:20px;font-weight:300;letter-spacing:.02em;margin:0 0 18px}#tray{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;max-width:620px;margin:auto;max-height:240px;overflow:hidden;transition:opacity .6s,max-height 1s,transform 1s}#tray button{padding:5px 2px 7px;border-color:transparent;background:#ffffff0a;min-width:0;border-radius:15px;font-size:10px;line-height:1.2}#tray canvas{display:block;width:32px;height:32px;margin:0 auto 3px}.done #tray{opacity:0;max-height:0;transform:translateY(14px);pointer-events:none}#info{font-size:13px;opacity:.75;margin:-12px 0 12px}#info:empty{display:none}#picture{font-size:14px;padding:8px 20px;background:#f1dbab;color:#1a2a22;border-color:#f1dbab;font-weight:500}button:active{transform:scale(.94)}.pulse{animation:pulse .35s ease-out}@keyframes pulse{40%{transform:scale(.9)}100%{transform:none}}#label.pulse{animation:pop .3s ease-out}@keyframes pop{0%{transform:translateX(-50%) scale(.85);opacity:0}100%{transform:translateX(-50%)}}.screen.on .card{animation:rise .25s ease-out}@keyframes rise{0%{transform:translateY(12px) scale(.97);opacity:0}}#label .flower{font-size:13px;opacity:.7;font-style:italic}#picture[hidden]{display:none}#demo{pointer-events:none}#older{font-size:12px;opacity:.5;margin-top:18px}#label{position:fixed;left:50%;top:30%;transform:translateX(-50%);max-width:85vw;min-width:160px;background:#14232feb;border:1px solid #e8dcc044;border-radius:20px;padding:18px;text-align:center;pointer-events:none}#label[hidden]{display:none}#label canvas{width:44px;height:44px}#label p{margin:5px 0}.screen{position:fixed;inset:0;display:none;place-items:center;background:#06131cd9;padding:20px}.screen.on{display:grid}.card{width:min(100%,340px);padding:26px;border-radius:24px;background:#162c3b;text-align:center}.card h2{font-size:21px;font-weight:400;margin:0 0 15px}.card button{margin:6px}.card input{width:100%;background:#071528;color:#fff;border:1px solid #bec6c766;border-radius:12px;padding:12px;margin-bottom:12px}#demo{position:fixed;bottom:calc(4px + env(safe-area-inset-bottom));left:14px;font-size:12px;opacity:.65}#status{font-size:12px;min-height:18px}a{color:#f1dbab} #tomorrow{margin:-4px 0 14px;font-size:12px}#tomorrow b{display:block;font-weight:400;letter-spacing:.12em;text-transform:uppercase;opacity:.6;font-size:11px;margin-bottom:4px}#tomorrow span{display:flex;justify-content:center;gap:18px}#tomorrow i{display:flex;flex-direction:column;align-items:center;font-style:italic;opacity:.85}#tomorrow canvas{width:34px;height:34px}#tomorrow[hidden]{display:none}#tray.invite button{animation:breathe 2.6s ease-in-out infinite}#tray.invite button:nth-child(6n+2){animation-delay:.15s}#tray.invite button:nth-child(6n+3){animation-delay:.3s}#tray.invite button:nth-child(6n+4){animation-delay:.45s}#tray.invite button:nth-child(6n+5){animation-delay:.6s}#tray.invite button:nth-child(6n){animation-delay:.75s}@keyframes breathe{0%,60%,100%{background:#ffffff0a;box-shadow:none}30%{background:#ffffff1c;box-shadow:0 0 14px #f1dbab33}}@media(max-width:430px){#tray{grid-template-columns:repeat(6,1fr)}#tray button{font-size:10px}#tray svg{width:28px;height:28px}header{padding:12px 14px}}@media(max-width:360px){h1{font-size:12px;letter-spacing:.06em}#looks button{padding:4px 10px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}button:active{transform:none}}
</style></head><body><canvas id="c" data-i18n-aria="canvas" aria-label="Your thanks. Drag to visit older days."></canvas><header><h1 id="name">Thankful Garden</h1><div id="looks" data-i18n-aria="chooseLook" aria-label="Choose a look"></div><button id="settings" data-i18n-aria="settings" aria-label="Settings">⋯</button></header><div id="demo" data-i18n="demo" hidden>Demo · saved only in memory</div><div id="label" role="status" hidden></div><section id="ritual"><p id="line">Three thanks for today.</p><p id="info"></p><p id="tomorrow" hidden><b></b><span></span></p><button id="picture" data-i18n="picture" hidden>Keep a picture</button><div id="tray" data-i18n-aria="tray" aria-label="Choose a thank you"></div><p id="older" data-i18n="older">Drag to visit older days</p><p id="status" role="status"></p></section><div class="screen" id="settingsCard"><div class="card"><h2 data-i18n="yourThanks">Your thanks</h2><button id="sound">Sound: on</button> <button id="lang" data-i18n="language" lang="tr">Türkçe</button><p data-i18n="stay">Your thanks stay on this device.</p><button id="reset" data-i18n="reset">Start over</button><p><button class="close" data-i18n="back">Back</button></p><a href="/small/" data-i18n="toLab">Back to the small games</a></div></div><div class="screen" id="confirm"><div class="card"><h2 data-i18n="clearQ">Clear everything?</h2><p data-i18n="clearText">This removes every saved thank you on this device.</p><button id="clear" data-i18n="clear">Clear it all</button><button class="close" data-i18n="keep">Keep it</button></div></div><div class="screen" id="words"><form class="card" id="wordForm"><h2 data-i18n="something">Something else</h2><input id="word" maxlength="24" data-i18n-aria="fewWords" aria-label="A few words, optional" placeholder="A few words, optional" autocomplete="off"><button type="submit" data-i18n="give">Give thanks</button><button type="button" class="close" data-i18n="back">Back</button></form></div><script src="/notes/button.js" defer></script><script type="module" src="./main.js"></script></body></html>
