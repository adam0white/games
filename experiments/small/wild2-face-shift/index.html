<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#132f36"><title>Face Shift</title>
<style>
*{box-sizing:border-box;touch-action:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#132f36;color:#fff6e4;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}body{font:16px/1.35 ui-rounded,"Trebuchet MS",system-ui,sans-serif}#c{display:block;width:100%;height:100dvh}#probe{position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}.screen{position:fixed;inset:0;display:none;place-items:center;padding:calc(16px + env(safe-area-inset-top)) 20px calc(16px + env(safe-area-inset-bottom));background:#102a32b8;overflow:auto;touch-action:pan-y}.screen.on{display:grid}.card{width:min(100%,370px);padding:30px 24px 26px;text-align:center;border-radius:32px;background:#f8eedb;color:#263b40;box-shadow:0 16px 0 #081d2340,0 28px 80px #061d2355;border:1px solid #fff8}h1{font-size:56px;line-height:.88;letter-spacing:-3px;margin:0;text-transform:uppercase}h1 span{color:#dc6859}h2{font-size:34px;line-height:1.05;margin:4px 0 16px;letter-spacing:-1px}p{margin:12px 0;font-size:16px}.eyebrow{font-size:14px;letter-spacing:3px;font-weight:800;text-transform:uppercase;margin:0 0 16px}button{font:800 18px/1 ui-rounded,"Trebuchet MS",system-ui,sans-serif;min-height:52px;min-width:52px;border:0;border-radius:16px;padding:16px 22px;background:#e8dece;color:#263b40;cursor:pointer;touch-action:manipulation;box-shadow:0 4px 0 #263b4022}button:active{transform:translateY(3px);box-shadow:none}button.primary{width:100%;background:#d9f681;box-shadow:0 5px 0 #a9c563;color:#19343b;font-size:22px}button.secondary{margin-top:14px;width:100%}#hero{width:100%;height:174px;display:block;margin:12px 0 6px}#album{width:100%;height:190px;display:block;margin:10px 0}#pause{display:none;position:fixed;right:max(16px,calc((100vw - 500px)/2));top:calc(12px + env(safe-area-inset-top));background:#ffffff18;color:#fff6e4;border:1px solid #ffffff22;padding:0;font-size:23px;z-index:2}#pause::before{content:'Ⅱ'}#stats{font-size:16px}#end-score{font-size:40px;font-weight:900;margin:10px 0;color:#d35f51}.hintline{opacity:.75}.stars{letter-spacing:1px;color:#a9692c;font-size:18px;white-space:nowrap}.stars.line{white-space:normal;letter-spacing:0;font-size:16px}.row{display:flex;gap:10px;margin-top:14px}.row button{flex:1;margin:0;padding:14px 10px}.sub{font-size:14px;margin:6px 0 0;opacity:.75}button.encore{background:#f68e7f;box-shadow:0 4px 0 #c96a5d;color:#2a1418}button[hidden]{display:none}#daily{margin-top:14px;width:100%;background:#f6d98f;box-shadow:0 4px 0 #d3b264}@media(max-height:690px){.card{padding:20px 22px}h1{font-size:46px}#hero{height:118px;margin:8px 0 2px}.eyebrow{margin-bottom:10px}#album{height:150px}p{margin:8px 0}#end-score{margin:4px 0}.row{margin-top:10px}#daily,button.secondary{margin-top:10px}}
#cold{position:fixed;left:0;right:0;bottom:0;display:none;padding:10px 18px calc(10px + env(safe-area-inset-bottom));text-align:center;color:#fff6e4;background:linear-gradient(#102a3200,#102a32e6 38%);pointer-events:none;touch-action:none}#cold.on{display:block}#cold b{display:block;font-size:15px;letter-spacing:2px;text-transform:uppercase}#cold b span{color:#f68e7f}#cold .how{margin:2px 0 0;font-size:14px;opacity:.9}#coldNote{max-width:420px;margin:0 auto}#coldNote .lab-notice{font-size:11px!important;margin-top:4px!important;opacity:.7!important}#coldNote a{color:#d9f681}
#notes-button{width:48px!important;height:48px!important}.screen .card,.screen p,.screen h1,.screen h2,.screen canvas,.screen span{touch-action:pan-y}
</style>
</head>
<body>
<canvas id="c" data-i18n-aria="canvas" aria-label="Drag the face to copy the portrait."></canvas><div id="probe"></div><button id="pause" aria-label="Pause"></button><div id="cold"><b>Face <span>Shift</span></b><p class="how" data-i18n="coldHow">Grab the face and drag to copy the portrait.</p><div id="coldNote"></div></div>
<section id="menu" class="screen on"><div class="card"><h1>Face<br><span>Shift</span></h1><canvas id="hero" aria-hidden="true"></canvas><p data-i18n="tagline">Make that face.</p><button id="play" class="primary" data-i18n="play">Play</button><button id="daily" data-i18n="daily">Daily face</button><p id="dailyLine" class="sub"></p><button id="encoreMenu" class="secondary encore" hidden>Encore</button><div class="row"><button id="classic" data-i18n="classic">Classic</button><button id="lang">Türkçe</button></div></div></section>
<section id="paused" class="screen"><div class="card"><h2 data-i18n="paused">Hold that face.</h2><button id="resume" class="primary" data-i18n="resume">Resume</button><button id="restart" class="secondary" data-i18n="restart">Restart</button><button id="sound" class="secondary">Sound: on</button><div class="row"><button id="lang2">Türkçe</button><button id="toMenu" data-i18n="menu">Menu</button></div></div></section>
<section id="end" class="screen"><div class="card"><p class="eyebrow" id="end-eyebrow">Your contact sheet</p><h2 id="end-title">Picture perfect.</h2><canvas id="album" aria-hidden="true"></canvas><p id="end-score"></p><p id="stats"></p><p id="stars" class="stars"></p><button id="again" class="primary" data-i18n="again">Play again</button><button id="encore" class="secondary encore" hidden>Encore</button><button id="endMenu" class="secondary" data-i18n="menu">Menu</button></div></section>
<script type="module" src="./main.js"></script><script src="/notes/button.js" defer></script>
</body></html>
