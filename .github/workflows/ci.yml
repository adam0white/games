name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: npm test
  changes:
    runs-on: ubuntu-latest
    outputs:
      games: ${{ steps.affected.outputs.games }}
      count: ${{ steps.affected.outputs.count }}
      total: ${{ steps.affected.outputs.total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - id: affected
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then BASE=$(git hash-object -t tree /dev/null); fi
          node scripts/affected.mjs "$BASE"
  games:
    needs: changes
    if: needs.changes.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.changes.outputs.games) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: node scripts/prepare-game.mjs "$GAME"
        env:
          GAME: ${{ matrix.game }}
      - run: node scripts/check-game.mjs "$GAME"
        env:
          GAME: ${{ matrix.game }}
  build:
    needs: changes
    if: needs.changes.outputs.total != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build.mjs
  lefthand-browser:
    needs: changes
    if: contains(needs.changes.outputs.games, '"lefthand"')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            browser: chromium
            projects: --project=chromium-phone --project=chromium-desktop
          - os: macos-latest
            browser: webkit
            projects: --project=webkit-phone --project=webkit-desktop
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./games/lefthand build
      - run: pnpm --filter ./games/lefthand exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm --filter ./games/lefthand exec playwright test ${{ matrix.projects }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: lefthand-browser-failure-${{ matrix.os }}-${{ matrix.browser }}
          path: games/lefthand/test-results/
          retention-days: 3
  ci:
    if: always()
    needs: [tools, changes, games, build, lefthand-browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: node scripts/aggregate.mjs
        env:
          TOOLS: ${{ needs.tools.result }}
          CHANGES: ${{ needs.changes.result }}
          GAMES: ${{ needs.games.result }}
          BUILD: ${{ needs.build.result }}
          COUNT: ${{ needs.changes.outputs.count }}
          TOTAL: ${{ needs.changes.outputs.total }}
          LEFTHAND_REQUIRED: ${{ contains(needs.changes.outputs.games, '"lefthand"') }}
          LEFTHAND_BROWSER: ${{ needs.lefthand-browser.result }}
