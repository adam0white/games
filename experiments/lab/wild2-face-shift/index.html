<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#132f36"><title>Face Shift</title>
<style>
*{box-sizing:border-box;touch-action:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#132f36;color:#fff6e4;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}body{font:16px/1.35 ui-rounded,"Trebuchet MS",system-ui,sans-serif}#c{display:block;width:100%;height:100dvh}#probe{position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}.screen{position:fixed;inset:0;display:none;place-items:center;padding:calc(16px + env(safe-area-inset-top)) 20px calc(16px + env(safe-area-inset-bottom));background:#102a32b8;overflow:auto;touch-action:pan-y}.screen.on{display:grid}.card{width:min(100%,370px);padding:30px 24px 26px;text-align:center;border-radius:32px;background:#f8eedb;color:#263b40;box-shadow:0 16px 0 #081d2340,0 28px 80px #061d2355;border:1px solid #fff8}h1{font-size:56px;line-height:.88;letter-spacing:-3px;margin:0;text-transform:uppercase}h1 span{color:#dc6859}h2{font-size:34px;line-height:1.05;margin:4px 0 16px;letter-spacing:-1px}p{margin:12px 0;font-size:16px}.eyebrow{font-size:14px;letter-spacing:3px;font-weight:800;text-transform:uppercase;margin:0 0 16px}button{font:800 18px/1 ui-rounded,"Trebuchet MS",system-ui,sans-serif;min-height:52px;min-width:52px;border:0;border-radius:16px;padding:16px 22px;background:#e8dece;color:#263b40;cursor:pointer;touch-action:manipulation;box-shadow:0 4px 0 #263b4022}button:active{transform:translateY(3px);box-shadow:none}button.primary{width:100%;background:#d9f681;box-shadow:0 5px 0 #a9c563;color:#19343b;font-size:22px}button.secondary{margin-top:14px;width:100%}#hero{width:100%;height:174px;display:block;margin:12px 0 6px}#album{width:100%;height:150px;display:block;margin:10px 0}#pause{display:none;position:fixed;right:max(16px,calc((100vw - 500px)/2));top:calc(12px + env(safe-area-inset-top));background:#ffffff18;color:#fff6e4;border:1px solid #ffffff22;padding:0;font-size:23px;z-index:2}#pause::before{content:'Ⅱ'}#stats{font-size:16px}#end-score{font-size:40px;font-weight:900;margin:10px 0;color:#d35f51}.hintline{opacity:.75}.stars{letter-spacing:1px;color:#a9692c;font-size:18px;white-space:nowrap}@media(max-height:690px){.card{padding:22px}h1{font-size:48px}#hero{height:142px}.eyebrow{margin-bottom:12px}#album{height:120px}}
#notes-button{width:48px!important;height:48px!important}.screen .card,.screen p,.screen h1,.screen h2,.screen canvas,.screen span{touch-action:pan-y}
</style>
</head>
<body>
<canvas id="c" aria-label="Drag to stretch the face. Match the portrait. Arrow keys also stretch; hold Space for the camera."></canvas><div id="probe"></div><button id="pause" aria-label="Pause"></button>
<section id="menu" class="screen on"><div class="card"><h1>Face<br><span>Shift</span></h1><canvas id="hero" aria-hidden="true"></canvas><p>Make that face.</p><button id="play" class="primary">Play</button></div></section>
<section id="paused" class="screen"><div class="card"><h2>Hold that face.</h2><button id="resume" class="primary">Resume</button><button id="restart" class="secondary">Restart</button><button id="sound" class="secondary">Sound: on</button><button id="toMenu" class="secondary">Menu</button></div></section>
<section id="end" class="screen"><div class="card"><p class="eyebrow">Your contact sheet</p><h2 id="end-title">Picture perfect.</h2><canvas id="album" aria-hidden="true"></canvas><p id="end-score"></p><p id="stats"></p><p id="stars" class="stars"></p><button id="again" class="primary">Play again</button><button id="endMenu" class="secondary">Menu</button></div></section>
<script type="module" src="./main.js"></script><script src="/notes/button.js" defer></script>
</body></html>
