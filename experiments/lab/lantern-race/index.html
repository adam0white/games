<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"><meta name="theme-color" content="#0b2025"><title>Lantern: Race</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0b2025;color:#f6ead3;touch-action:none}body{font:16px/1.4 system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}#c{display:block;width:100vw;height:100dvh;touch-action:none}.screen{display:none;position:fixed;inset:0;place-items:center;padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));background:#05131868;overflow:auto;touch-action:pan-y}.screen.on{display:grid}.card{width:min(100%,362px);padding:26px 22px;border:1px solid #9cb8ab44;border-radius:26px;background:linear-gradient(160deg,#17353deF,#0c2029f5);box-shadow:0 22px 80px #0007;text-align:center;animation:arrive .24s ease-out}.eyebrow{font-size:14px;letter-spacing:.24em;color:#b4c9b9;text-transform:uppercase}h1{font:normal 48px/1.05 Georgia,serif;color:#ffe1a7;margin:12px 0 8px}h1 span{display:block;font:500 17px/1.4 system-ui;letter-spacing:.34em;text-transform:uppercase;margin-top:12px}h2{font:normal 32px Georgia,serif;color:#ffe1a7;margin:0 0 14px}p{margin:10px 0}.quiet{font-size:14px;color:#bdccc9}.line{height:1px;background:linear-gradient(90deg,transparent,#d8bb7844,transparent);margin:20px 0}label{display:block;text-align:left;font-size:14px;color:#c6d6d0;margin:16px 0 5px}input{width:100%;height:50px;border-radius:12px;border:1px solid #b6c6b34d;color:#fff0d2;background:#061a22;font:17px system-ui;padding:0 14px;touch-action:manipulation}input:focus{outline:2px solid #efbf6c}button{font:600 16px system-ui;min-height:50px;min-width:48px;border:1px solid #b6c6b344;color:#e7e9d9;border-radius:14px;background:#25444b;padding:10px 17px;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.96)}button:disabled{opacity:.55}.primary{width:100%;margin-top:14px;background:linear-gradient(#f2ce89,#dba760);border-color:#ffde9a;color:#293126;font-size:18px;box-shadow:0 5px 20px #b8792730}.secondary{width:100%;margin-top:12px;background:transparent}.row{display:flex;gap:8px;margin-top:12px}.row>*{flex:1;min-width:0}.row input{text-transform:uppercase;width:100%}.row button{flex:0 0 auto}.back{margin-top:14px;width:100%;background:transparent;border:0}.screen .tag{display:inline-block;padding:7px 12px;border-radius:20px;background:#a3b6a617;margin:4px;font-size:14px}.screen .tag.me{color:#ffe1a7;border:1px solid #e5b86d55}#strip{position:fixed;top:calc(12px + env(safe-area-inset-top));left:16px;right:76px;pointer-events:none;display:none}#roomLine{font-size:14px;letter-spacing:.1em;color:#c9d7ce}#raceLabel{font:normal 24px Georgia;color:#ffe1a7}#pause{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;width:50px;padding:0;background:#112d35cc;display:none;font-size:20px}#connection{position:fixed;left:16px;bottom:calc(14px + env(safe-area-inset-bottom));font-size:14px;color:#b6c9c0;pointer-events:none}#count{position:fixed;inset:0;display:none;place-items:center;pointer-events:none;font:normal 100px Georgia;color:#ffe0a2;text-shadow:0 0 70px #ffc46d}#count.on{display:grid}#racebar{position:fixed;right:16px;top:calc(100px + env(safe-area-inset-top));bottom:calc(100px + env(safe-area-inset-bottom));width:24px;pointer-events:none;display:none}#racebar:before{content:'';position:absolute;left:11px;top:0;bottom:0;width:2px;background:#c7d8d52b}#racebar .dot{position:absolute;left:5px;width:14px;height:14px;border-radius:50%;border:2px solid #10272e;transition:bottom .2s linear;background:var(--color)}#racebar .dot.me{box-shadow:0 0 12px #ffc96c;border-color:#ffe8b6}#rankList{margin:18px 0;text-align:left}#rankList .rank{display:grid;grid-template-columns:26px 1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid #d4dccc14;font-size:14px}#rankList .rank.me{color:#ffdc94}#bestLine{min-height:20px}#shareStatus{font-size:14px;color:#ffe1a7;overflow-wrap:anywhere}#mark{height:66px;font-size:54px;color:#ffcf83;line-height:1}#paused .quiet{max-width:25em}@keyframes arrive{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}@media(max-height:700px){.card{padding:18px}h1{font-size:40px}.line{margin:12px 0}label{margin-top:12px}#mark{height:45px;font-size:40px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#count .countCard{text-align:center;width:min(85vw,440px);padding:12px 18px 18px;border-radius:22px;background:#09222ad9}#countNumber{line-height:1}#countRoster{font:500 16px/1.4 system-ui;color:#f6ead3;text-shadow:none;overflow-wrap:anywhere}#countRoster:empty{display:none}
</style></head><body>
<canvas id="c" aria-label="Drag left and right to steer your lantern boat"></canvas>
<div id="strip"><div id="roomLine"></div><div id="raceLabel"></div></div><button id="pause" aria-label="Pause">Ⅱ</button><div id="racebar"></div><div id="count"><div class="countCard"><div id="countNumber"></div><div id="countRoster"></div></div></div><div id="connection" aria-live="polite"></div>
<div id="menu" class="screen on"><div class="card"><div id="mark" aria-hidden="true"><svg width="54" height="66" viewBox="0 0 54 66"><path d="M18 16V11a9 9 0 0 1 18 0v5" fill="none" stroke="#eac18a" stroke-width="2"/><path d="M14 20h26l-3 31H17z" fill="#f1bc6433" stroke="#eac18a" stroke-width="2"/><path d="M11 19h32M15 54h24" stroke="#eac18a" stroke-width="3" stroke-linecap="round"/><path d="M28 28c-3 7-8 9-5 15 2 4 9 3 9-2 0-4-4-5-4-13" fill="#ffda8c"/></svg></div><h1>Lantern<span>Race</span></h1><p class="quiet">One river. First light wins.</p><div class="line"></div><label for="name">Your boat name</label><input id="name" maxlength="16" autocomplete="off" placeholder="Lantern"><button id="quick" class="primary">Quick race</button><button id="friends" class="secondary">Race friends</button><p id="bestLine" class="quiet"></p><p class="quiet"><a href="/lantern/" style="color:#ffe1a7">Back to Lantern</a></p></div></div>
<div id="friendsCard" class="screen"><div class="card"><div class="eyebrow">Same river</div><h2>Race friends</h2><button id="create" class="primary">Make a room</button><label for="code">Room code</label><div class="row"><input id="code" maxlength="4" placeholder="ABCD" autocapitalize="characters" autocomplete="off"><button id="join">Join</button></div><p id="codeError" class="quiet" role="status"></p><button class="back toMenu">Back</button></div></div>
<div id="lobby" class="screen"><div class="card"><div class="eyebrow">The river is waiting</div><h2 id="roomTitle">Quick race</h2><div id="peers"></div><p id="lobbyLine" class="quiet">Same water. Separate boats.</p><button id="ready" class="primary">Ready</button><button id="share" class="secondary">Share room</button><p id="shareStatus" role="status"></p><button class="back toMenu">Menu</button></div></div>
<div id="paused" class="screen"><div class="card"><h2>Paused</h2><p id="pauseLine" class="quiet"></p><button id="resume" class="primary">Keep going</button><button id="sound" class="secondary">Sound: on</button><button class="back toMenu">Menu</button></div></div>
<div id="end" class="screen"><div class="card"><div class="eyebrow" id="endTop">Round results</div><h2 id="endTitle">First light</h2><p id="endLine" class="quiet"></p><div id="rankList"></div><p id="endBest" class="quiet"></p><button id="rematch" class="primary">Rematch</button><button class="back toMenu">Menu</button></div></div>
<script type="module" src="./main.js"></script><script src="/notes/button.js" defer></script></body></html>
