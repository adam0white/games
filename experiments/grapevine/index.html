<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#241a46" id="theme">
<title data-i18n="title"></title>
<style>
  html, body { margin: 0; height: 100%; background: #241a46; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { font: 17px/1.4 ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #fff4dc; }
  canvas#c { display: block; width: 100vw; height: 100dvh; touch-action: none; }
  .screen { position: fixed; inset: 0; display: none; place-items: center; text-align: center; pointer-events: none; }
  .screen.on { display: grid; }
  .screen > div { box-sizing: border-box; max-width: 22em; width: calc(100% - 24px); max-height: 100dvh; overflow-y: auto; touch-action: pan-y;
    padding: calc(12px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom)); pointer-events: auto; }
  .veil { background: #1a1233cc; }
  #menu.veil { background: linear-gradient(#1a1233ee, #1a123388 45%, #1a1233ee); }
  h1 { font-size: 2.7em; line-height: 1; margin: .1em 0 .1em; color: #ffd98a; letter-spacing: .02em; text-shadow: 0 3px 0 #7a3b5e, 0 0 24px #ff9a5a88; }
  h2 { font-size: 2em; line-height: 1.1; margin: 0 0 .25em; color: #ffd98a; text-shadow: 0 3px 0 #7a3b5e; }
  p { margin: .35em 0; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  button { font: inherit; font-weight: 600; color: #fff4dc; background: #ffffff14; border: 2px solid #ffd98a88; border-radius: 999px; padding: .45em 1.2em; margin: .25em; min-width: 8em; min-height: 46px; touch-action: manipulation; cursor: pointer; }
  button.main { background: #ffb347; color: #3a1a10; border-color: #ffb347; font-size: 1.25em; min-width: 9em; box-shadow: 0 4px 0 #b8642a; }
  button.main:active { transform: translateY(2px); box-shadow: 0 2px 0 #b8642a; }
  button:disabled { opacity: .4; }
  #grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: .5em 0; }
  #grid button { min-width: 0; min-height: 0; height: 46px; margin: 0; padding: 0; border-radius: 12px; font-size: 15px; line-height: 1; display: grid; place-items: center; border-width: 2px; }
  #grid button small { display: block; font-size: 9px; letter-spacing: -1px; color: #ffd24a; margin-top: 2px; height: 10px; }
  #grid button.locked { border-style: dashed; color: #fff4dc66; background: transparent; }
  #grid button.next { border-color: #ffb347; background: #ffb34733; box-shadow: 0 0 10px #ffb34788; }
  #daily small { color: #ffd24a; }
  .stars { font-size: 46px; line-height: 1; letter-spacing: 4px; margin: .1em 0 .2em; }
  .stars span { display: inline-block; color: #ffffff22; transform: scale(.4); transition: transform .35s cubic-bezier(.3,1.8,.5,1), color .2s; }
  .stars span.on { color: #ffd24a; text-shadow: 0 0 14px #ffb347; transform: scale(1); }
  .stars span.off { transform: scale(.85); }
  #strip { display: block; width: 100%; height: 104px; margin: .3em 0; }
  #pause { position: fixed; top: calc(8px + env(safe-area-inset-top)); right: calc(8px + env(safe-area-inset-right)); width: 46px; height: 46px; min-width: 0; min-height: 0; margin: 0; padding: 0;
    border: 2px solid #ffd98a66; border-radius: 50%; background: #1a1233e6; display: none; place-items: center; touch-action: none; }
  #boardCue, #unlockStatus { top: 0; left: 0; margin: 0; }
  #pause::before { content: ''; width: 4px; height: 16px; border: solid #ffd98a; border-width: 0 5px; }
  #hint { position: fixed; left: calc(60px + env(safe-area-inset-left)); top: calc(9px + env(safe-area-inset-top)); display: none; width: 46px; height: 46px; min-width: 0; min-height: 0; margin: 0; padding: 0;
    font-size: 24px; line-height: 1; background: #ffd24a; border: 2px solid #2b1830; border-radius: 50%; box-shadow: 0 3px 0 #b8862a; animation: nudge 1.2s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: scale(1.08); } }
  .lab-notice { max-width: 26em; margin-left: auto !important; margin-right: auto !important; }
  @media (prefers-reduced-motion: reduce) { #hint { animation: none; } }
  #tabs { display: flex; gap: 6px; margin: .4em 0 0; }
  #tabs button { flex: 1; min-width: 0; min-height: 46px; margin: 0; padding: .2em .3em; border-radius: 14px; font-size: 15px; line-height: 1.15; }
  #tabs button small { display: block; font-size: 11px; font-weight: 600; color: #ffd24a; }
  #tabs button.on { background: #ffb34733; border-color: #ffb347; }
  #tabs button.locked { border-style: dashed; color: #fff4dc66; }
  #grid.five { grid-template-columns: repeat(5, 1fr); }
  #done > div { padding-block: calc(8px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-bottom)); }
  /* The result card fills the screen: the story scrolls in the middle and the buttons stay at the bottom, so Next is
     at the same place whatever the strip, the chapter line or the week above it need. */
  #done > div { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  #done .result-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; touch-action: pan-y; }
  #done .result-body > div { margin: auto 0; }
  #done .result-actions { flex: none; }
  #done .result-actions p { margin: .1em 0; }
  #week { display: flex; justify-content: center; gap: 3px; margin: .3em 0; }
  #week[hidden] { display: none; }
  #week button { flex: 1 1 0; max-width: 46px; min-width: 0; min-height: 50px; margin: 0; padding: 2px 0; border-radius: 12px; font-size: 13px; line-height: 1.1;
    display: grid; place-items: center; border-width: 2px; }
  #week button small { display: block; font-size: 10px; letter-spacing: -1px; color: #ffd24a; min-height: 11px; }
  #week button small.late { color: #c9c3e0; }
  #week button.today { border-color: #ffb347; background: #ffb34733; }
  #week button.playing { box-shadow: 0 0 0 2px #fff4dc; }
  #done p { margin: .18em 0; }
  #doneLine, #payoff { color: #ffd98a; }
  #doneLine { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; }
  #doneLine > span { background: #211733; border-radius: 99px; padding: 2px 8px; font-size: 15px; white-space: nowrap; }
  .result-check { display: grid; place-items: center; width: 32px; height: 32px; margin: 0 auto; border: 2px solid #7fe07a;
    border-radius: 50%; color: #a4ec9d; background: #213523; font-size: 22px; line-height: 1; }
  #share { min-width: 9em; }
  #postcardDialog { box-sizing: border-box; width: min(95vw, 480px); max-height: 92dvh; overflow-y: auto; touch-action: pan-y; padding: 14px; text-align: center; color: #fff4dc; background: #281e3d; border: 2px solid #ffd98a; border-radius: 18px; }
  #postcardDialog::backdrop { background: #130d24dc; }
  #cardPreview canvas { display: block; width: 100%; height: auto; border-radius: 10px; }
  #postcardDialog:has(#manualShare:not([hidden])) #cardPreview canvas {
    width: auto; max-width: 100%; max-height: min(242px, 37.5dvh); margin-inline: auto;
  }
  #shareStatus:empty { display: none; }
  #manualShare { box-sizing: border-box; width: 100%; font: inherit; color: inherit; background: #21172f; -webkit-user-select: text; user-select: text; touch-action: auto; }

  .start-actions { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 8px 0; }
  .start-actions button { min-width: 0; margin: 0; padding-inline: .7em; }
  .start-actions #play { flex: 1 0 auto; font-size: clamp(16px, 5vw, 21px); white-space: nowrap; }
  .start-actions #daily { flex: 0 1 auto; }
  .start-actions #play.chase { font-size: clamp(15px, 4.4vw, 17px); white-space: nowrap; }
  .settings { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 6px 0; }
  .settings button { margin: 0; }
  button.language { display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    min-width: 44px; min-height: 46px; padding-inline: 9px; font-size: 14px; }
  .language > span:first-child { font-size: 17px; }
  #unlockCue { min-height: 0; margin: 2px 0; color: #ffd98a; font-size: 15px; font-weight: 800; }
  #unlockCue:empty { display: none; }
  #grid button.prerequisite { border-color: #ffd98a; box-shadow: inset 0 0 0 2px #ffd98a; }
  #grid button.locked small { font-size: 11px; letter-spacing: 0; }
  #menu h1 { font-size: clamp(32px, 9.5vw, 43px); }
  #menu .lab-notice a { display: inline-grid; place-items: center; min-height: 44px; min-width: 52px; }
  @media (max-height: 720px) {
    #menu > div { padding-block: calc(4px + env(safe-area-inset-top)) calc(4px + env(safe-area-inset-bottom)); }
    #grid { gap: 4px; margin: 6px 0; }
    #grid button { height: 44px; }
  }
  @media (max-height: 600px) { h1 { font-size: 2.1em; } }
</style>

<body>
<canvas id="c" role="img" data-i18n-aria="board"></canvas>
<p id="boardCue" class="sr-only" role="status"></p>
<button id="pause" data-i18n-aria="pause"></button>
<button id="hint" data-i18n-aria="hint"><span aria-hidden="true">💡</span></button>
<div id="menu" class="screen veil on"><div>
  <h1 data-i18n="title"></h1>
  <div class="start-actions"><button id="play" class="main"></button><button id="daily"><span aria-hidden="true">☀</span> <span data-i18n="daily"></span> <small aria-hidden="true"></small></button></div>
  <div id="tabs"></div>
  <div id="grid"></div>
  <p id="unlockCue" aria-hidden="true"></p>
  <p id="unlockStatus" class="sr-only" role="status"></p>
  <div class="settings">
    <button id="sound"></button>
    <button id="language-menu" class="language" data-i18n-aria="switchLanguage"><span aria-hidden="true">🌐</span><span class="language-code" data-i18n="languageCode"></span></button>
  </div>
</div></div>
<div id="paused" class="screen veil"><div>
  <h2 data-i18n="paused"></h2>
  <p><button id="resume" class="main" data-i18n="resume"></button></p>
  <p><button id="restart" data-i18n="restart"></button><button id="toMenu" data-i18n="menu"></button></p>
  <div class="settings">
    <button id="sound2"></button>
    <button id="language-pause" class="language" data-i18n-aria="switchLanguage"><span aria-hidden="true">🌐</span><span class="language-code" data-i18n="languageCode"></span></button>
  </div>
</div></div>
<div id="done" class="screen veil"><div>
  <div class="result-body"><div>
    <h2 id="doneTitle" class="sr-only"></h2>
    <div class="result-check" aria-hidden="true">✓</div>
    <div class="stars" id="stars" role="img"><span aria-hidden="true">★</span><span aria-hidden="true">★</span><span aria-hidden="true">★</span></div>
    <p id="doneLine"></p>
    <p id="payoff" hidden></p>
    <canvas id="strip" role="img" data-i18n-aria="strip"></canvas>
    <div id="week" role="group" data-i18n-aria="week" hidden></div>
    <p><button id="share" data-i18n="viewCard"></button></p>
  </div></div>
  <div class="result-actions">
    <p><button id="next" class="main"></button></p>
    <p><button id="again" data-i18n="again"></button><button id="doneMenu" data-i18n="menu"></button></p>
  </div>
</div></div>
<dialog id="postcardDialog" aria-labelledby="postcardHeading">
  <h2 id="postcardHeading" data-i18n="postcard"></h2>
  <div id="cardPreview"></div>
  <p id="shareStatus" role="status"></p>
  <textarea id="manualShare" readonly hidden rows="4" data-i18n-aria="resultToCopy"></textarea>
  <button id="sendCard" data-i18n="shareCard"></button><button id="backToResult" data-i18n="back"></button>
</dialog>
<script type="module">
import { LEVELS, CHAPTERS } from './levels.js';
import { MAX_HOPS, walk, refuse, hint as hintRoute, stars as starsFor, same, daily, dailySeed, ONEWAY, isGate, gateOpen, lane, tierFor, fromKey, SHAPES, COLOURS } from './sim.js';
import { token, villager, badge, bubble, backdrop, lanterns, barrier, look, emblem, sun, change, shape, tapHand, WIDE, BOARD_HALF, COLOUR, INK, CREAM, roundRect } from './art.js';
import { readJson, writeJson } from '../kit/save.js';
import { sound } from '../kit/audio.js';
import { onLeave, isPauseKey } from '../kit/pause.js';
import { screens } from '../kit/screens.js';
import { lab } from '../kit/lab.js';
import { hint as firstHint } from '../kit/hint.js';
import { i18n } from './words.js';

const $ = id => document.getElementById(id);
const query = new URLSearchParams(location.search);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const { t: word, lang, apply: applyWords, setLang } = i18n;
let numbers, dates;
function formats() {
  numbers = new Intl.NumberFormat(lang());
  dates = new Intl.DateTimeFormat(lang(), { dateStyle: 'medium' });
}
formats();
const number = n => numbers.format(n);
const date = key => dates.format(new Date(`${key}T12:00:00`));

// ---------------------------------------------------------------- save (one JSON blob)
const KEY = 'grapevine-save';
// Fields added later (dailyHops: fewest hops per date, dailyTier: which daily village a date showed, bestStreak,
// dailyLate: best stars for a date's village solved on a later day) default here, so an old save loads as it was.
// `daily` keeps only villages solved on their own day, so the streak counts days played on the day.
const save = { v: 1, sound: true, best: {}, opened: 1, daily: {}, dailyHops: {}, dailyTier: {}, bestStreak: 0, dailyLate: {}, ...readJson(KEY, {}) };
const store = () => writeJson(KEY, save);
const dateKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = () => dateKey(new Date());
const daysAgo = k => { const d = new Date(); d.setDate(d.getDate() - k); return dateKey(d); };
const WEEK = 7; // the daily villages a player can still open: today and the six days before
const inWeek = key => typeof key === 'string' && key >= daysAgo(WEEK - 1) && key <= today();
const dayStars = key => Math.max(save.daily[key] || 0, save.dailyLate[key] || 0);
// Days in a row with a solved daily village, ending today (or yesterday, while today is still open).
function streak() {
  const d = new Date(); let n = 0;
  if (!save.daily[dateKey(d)]) d.setDate(d.getDate() - 1);
  while (save.daily[dateKey(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
const urlLevel = Math.floor(Number(query.get('level')));
const urlSeed = query.has('seed') ? Number(query.get('seed')) >>> 0 : null;
const urlTier = query.has('tier') ? Math.max(0, Math.min(3, Math.floor(Number(query.get('tier'))) || 0)) : null;

// ---------------------------------------------------------------- chapters
// Each chapter is a time of year in the same village (art.js LOOKS). The daily village wears the look of the newest
// villager it uses.
const CHAPTER_NAMES = ['evening', 'winter', 'autumn'];
const chapterOf = i => Math.max(1, CHAPTERS.findIndex(([a, b]) => i + 1 >= a && i + 1 <= b) + 1); // of a 0-based level
const DAILY_LOOK = [1, 2, 2, 3]; // by daily tier
// What a chapter's first levels bring in: drawn with a pulsing ring until the player touches the board.
const INTRO = { 31: 'lane', 36: 'bell', 46: 'keeper' };

// ---------------------------------------------------------------- sound
const snd = sound({ on: () => save.sound });
const tone = (f, d, v, type = 'triangle', slide = 0) => { if (snd.ctx) snd.tone(f, d, v, type, slide); };
const SCALE = [392, 440, 523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5, 1567.98, 1760, 2093, 2349.3, 2637];
const voice = kind => { // each kind of villager says something as they pass it on
  if (!snd.ctx) return;
  if (kind === 'more') tone(330, 0.22, 0.05, 'square', 330);
  else if (kind === 'less') tone(140, 0.25, 0.06, 'sawtooth', -50);
  else if (kind === 'parrot') { tone(1400, 0.07, 0.05, 'square', 500); setTimeout(() => tone(1500, 0.07, 0.05, 'square', 500), 80); }
  else if (kind === 'paint') snd.noise(0.12, 0.12, 2500);
  else if (kind === 'swap') tone(500, 0.2, 0.05, 'sine', -250);
  else if (kind === 'carve') snd.noise(0.05, 0.2, 4000);
  else if (kind === 'flip') tone(600, 0.15, 0.05, 'square', -300);
  else if (kind === 'bell') { tone(1318.5, 0.6, 0.05, 'sine'); setTimeout(() => tone(1046.5, 0.7, 0.05, 'sine'), 180); }
  else if (kind === 'keeper') { tone(260, 0.12, 0.05, 'triangle', 120); setTimeout(() => tone(390, 0.14, 0.05, 'triangle', -120), 110); }
};

// ---------------------------------------------------------------- lab recording
const rec = lab('grapevine');
const notice = rec.notice($('menu').firstElementChild);
const recording = rec.toggle($('paused').firstElementChild);
const noticeText = document.createElement('span');
if (notice) {
  const link = notice.querySelector('a');
  link.dataset.i18n = 'privacy';
  notice.replaceChildren(noticeText, ' ', link);
}
if (recording) {
  const text = document.createElement('span');
  text.dataset.i18n = 'recordPlay';
  recording.lastChild.replaceWith(text);
}

// ---------------------------------------------------------------- canvas and layout
const canvas = $('c'), g = canvas.getContext('2d');
let W = 0, H = 0, dpr = 1, safe = { t: 0, b: 0, l: 0, r: 0 };
const probe = document.createElement('div');
probe.style.cssText = 'position:fixed;top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);left:env(safe-area-inset-left);right:env(safe-area-inset-right);pointer-events:none;visibility:hidden';
document.body.append(probe);
let back = null, chapter = 1; // the village backdrop, drawn once per size and chapter
function resize() {
  dpr = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  const cs = getComputedStyle(probe);
  safe = { t: parseFloat(cs.top) || 0, b: parseFloat(cs.bottom) || 0, l: parseFloat(cs.left) || 0, r: parseFloat(cs.right) || 0 };
  paintBack();
  layout();
}
function paintBack() {
  if (!W) return;
  back = document.createElement('canvas'); back.width = canvas.width; back.height = canvas.height;
  const bg = back.getContext('2d'); bg.scale(dpr, dpr); backdrop(bg, W, H, safe.t + 60, chapter);
  const theme = look(chapter).theme;
  $('theme').content = theme; document.documentElement.style.background = document.body.style.background = theme;
}
function setChapter(c) { if (c !== chapter) { chapter = c; paintBack(); } }
addEventListener('resize', resize);

// The board: villagers' screen positions from the level's 0..1 coordinates.
let level = null, pos = [], R = 24;
function layout() {
  if (!level) return;
  let left = safe.l + 18, right = W - safe.r - 18;
  if (W >= WIDE) { left = Math.max(left, W / 2 - BOARD_HALF); right = Math.min(right, W / 2 + BOARD_HALF); } // phone-wide board, street on the sides
  const top = safe.t + 174, bottom = H - safe.b - 58;
  const rows = new Set(level.nodes.map(n => Math.round(n.y * 8))).size;
  const rowGap = (bottom - top) / Math.max(1, rows - 1), colGap = (right - left) / 3;
  R = Math.max(15, Math.min(30, colGap * 0.22, rowGap * 0.25));
  pos = level.nodes.map(n => ({ x: left + n.x * (right - left), y: top + n.y * (bottom - top) }));
  ghostAt = pos.map((p, v) => ghostSpot(v));
}
// Where a villager's "after me" token sits: of four spots beside the head, the one furthest from paths,
// other villagers, their badges and the screen edge. Ties keep the first spot (up and to the right).
let ghostAt = [];
function ghostSpot(v) {
  const p = pos[v];
  const spots = [[1.3, -1.15], [-1.3, -1.15], [1.55, 0.15], [-1.55, 0.15]].map(([a, b]) => ({ x: p.x + a * R, y: p.y + b * R }));
  const segDist = (q, A, B) => {
    const dx = B.x - A.x, dy = B.y - A.y, k = Math.max(0, Math.min(1, ((q.x - A.x) * dx + (q.y - A.y) * dy) / (dx * dx + dy * dy || 1)));
    return Math.hypot(q.x - A.x - k * dx, q.y - A.y - k * dy);
  };
  let best = spots[0], bestScore = -Infinity;
  spots.forEach((q, i) => {
    let d = Math.min(q.x - safe.l, W - safe.r - q.x, q.y - safe.t - 90) + R * 0.5;
    d = Math.min(d, Math.hypot(q.x - p.x, q.y - p.y) - R); // clear of the villager's own head
    for (const [a, b] of level.edges) d = Math.min(d, segDist(q, pos[a], pos[b]));
    pos.forEach((o, u) => {
      if (u === v) return;
      d = Math.min(d, Math.hypot(q.x - o.x, q.y - o.y) - R, Math.hypot(q.x - o.x, q.y - o.y - R * 1.42) - R * 0.9);
    });
    const score = d - i * R * 0.05;
    if (score > bestScore) { bestScore = score; best = q; }
  });
  return { x: best.x - p.x, y: best.y - p.y };
}

// ---------------------------------------------------------------- game state
const DT = 1 / 60, HOP = 18; // ticks per hop of the message
let screen = 'menu', paused = false, t = 0, acc = 0, last = performance.now();
let mode = 'level', index = 0, dailyKey = null; // index: 0-based level
let route = [], trail = null, sends = 0, fails = 0, hints = 0, hintAt = 0, touched = false, startT = 0;
let sending = null, result = null, wrong = null, lastStars = 0;
let react = [], refuseT = [], happyT = 0, puzzledT = 0, particles = [], shake = 0, ripples = [], grow = 0, gone = [];
let endTimer = -1, stripT = 0, sentRoute = null;
let keepers = [], gateT = [], laneFlash = null, introT = 0, bannerT = 0, payoff = 0, tier = 0;
// The last refused touch: why, the villager or path that said no, and how much of the feedback is left (1 to 0).
// It lasts REFUSE_TICKS so a player whose thumb covered the spot still sees it after lifting. `lesson` is the picture
// plate a refusal teaches (the bow and red news, a sleepy villager who went home); it stays until the route changes.
const REFUSE_TICKS = 84;
let refusal = null, lesson = null, late = false;
const next = () => Math.min(LEVELS.length, Math.max(1, save.opened));
// After the last village: the first village still short of three stars (0 before then, or when every village has them).
const chase = () => save.opened > LEVELS.length ? LEVELS.findIndex((_, i) => (save.best[i + 1] || 0) < 3) + 1 : 0;
// The bell parity and the keepers' news right now: after the villager the message is leaving, while it travels.

function hintBottom() {
  const fallback = Math.round((innerHeight + 24) / 4);
  if (!level || !pos.length) return fallback;
  const boxes = pos.map(p => [p.x - R * 1.2, p.y - R * 1.7, p.x + R * 1.2, p.y + R * 1.9]); // hat to badge
  const tp = pos[level.from], o = ghostAt[level.from] ?? { x: R * 1.3, y: -R * 1.15 };
  boxes.push([tp.x + o.x - R * 0.9, tp.y + o.y - R * 0.9, tp.x + o.x + R * 0.9, tp.y + o.y + R * 0.9]);
  const lp = pos[level.to], toRight = lp.x < W / 2, bw = R * 2.5, bx = toRight ? lp.x + R * 1.3 + bw / 2 : lp.x - R * 1.3 - bw / 2;
  boxes.push([bx - bw / 2, lp.y - R * 2.4, bx + bw / 2, lp.y - R * 0.1]);
  boxes.push([0, 0, W, safe.t + 84]);
  // The copy, centred at (W / 2, y): dots and hand (the finger lifts 26 px; the hand hangs 52 px below it), and the label
  // above for reduced motion.
  const copy = y => reduced ? [[W / 2 - 84, y - 52, W / 2 + 84, y + 70], [W / 2 - 128, y - 66, W / 2 + 128, y - 34]] : [[W / 2 - 82, y - 50, W / 2 + 84, y + 68]];
  // Overlap area, in px squared, with a villager counted four times as much as with the rest: on a crowded board there
  // may be no spot that is clear of everything, and covering a villager is the worst miss.
  const area = (A, B) => Math.max(0, Math.min(A[2], B[2]) - Math.max(A[0], B[0])) * Math.max(0, Math.min(A[3], B[3]) - Math.max(A[1], B[1]));
  const base = H - safe.b - fallback;
  let best = base, bestScore = -Infinity;
  for (let y = H - safe.b - 70; y >= safe.t + 130; y -= 4) {
    let cover = 0;
    for (const c of copy(y)) boxes.forEach((b, k) => { cover += area(c, b) * (k < pos.length ? 4 : 1); });
    const score = -cover - Math.abs(y - base) * 0.5;
    if (score > bestScore) { bestScore = score; best = y; }
  }
  hintClear = Math.round(bestScore);
  return Math.round(H - safe.b - best);
}
let hintClear = null;
const help = firstHint(canvas, {
  kind: 'path',
  key: 'grapevine:hint',
  label: word('drag'),
  reach: 40,
  bottom: hintBottom,
  when: () => screen === 'play' && !paused && !sending && result !== 'won',
  played: readJson(KEY) !== null,
});
const hintLabel = document.querySelector('.kit-hint .label');
if (hintLabel) hintLabel.dataset.i18n = 'drag';

function notesLabel() {
  $('notes-button')?.setAttribute('aria-label', word('notes'));
}
function staticWords() {
  applyWords();
  noticeText.textContent = word('privacyNotice', { days: number(180) });
  notesLabel();
}
function localize() {
  staticWords();
  soundLabel();
  if (screen === 'menu') { dailyLabel(); levelGrid(); }
  updateBoardCue();
}
function switchLanguage() {
  setLang(lang() === 'en' ? 'tr' : 'en');
  // Keep an explicit override in sync with the choice so a reload cannot undo it.
  const url = new URL(location.href);
  if (url.searchParams.has('lang')) {
    url.searchParams.set('lang', lang());
    history.replaceState(history.state, '', url);
  }
  formats();
  localize();
}
$('language-menu').addEventListener('click', switchLanguage);
$('language-pause').addEventListener('click', switchLanguage);
$('notes-script').addEventListener('load', notesLabel);

// Keep an unfinished route with this tab's history entry. A fresh visit still opens the menu.
function checkpoint() {
  const editing = level && (screen === 'play' || paused) && result !== 'won';
  // A delivery in flight can be sent again after reload. Never award it twice.
  const unfinished = editing && route.at(-1) === level.to ? route.slice(0, -1) : route;
  const draft = editing ? { mode, index, date: dailyKey, route: unfinished } : null;
  try { history.replaceState({ ...history.state, grapevineRoute: draft }, ''); } catch {}
}

function resumeReload() {
  const draft = history.state?.grapevineRoute;
  if (!draft || !Array.isArray(draft.route) || draft.route.length > MAX_HOPS + 1) return;
  if (draft.mode === 'daily' ? !inWeek(draft.date) : draft.mode !== 'level' || !LEVELS[draft.index] || !openTo(draft.index)) return;
  begin(draft.index, draft.mode, draft.date);
  if (draft.route.every(v => Number.isInteger(v) && level.nodes[v]) && walk(level, draft.route).valid) {
    setRoute(draft.route);
    touched = route.length > 1;
  }
  pause();
}

resize();
staticWords();
menu();
resumeReload();
requestAnimationFrame(frame);
</script>
<script id="notes-script" src="/notes/button.js" defer></script>
